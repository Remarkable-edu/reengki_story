<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>쿼카 링키의 모험 — 전체 동화책</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
:root{
  --paper:#FBF3E4; --deep:#4A3421; --soft:#8A6F52; --card:#FFFDF8;
  --pink:#F191A6; --pink-deep:#D96A84; --gold:#E8B84B; --line:#EADFC8;
}
*{box-sizing:border-box}
body{margin:0; background:var(--paper); color:var(--deep);
  font-family:'Gowun Dodum','Apple SD Gothic Neo',sans-serif;
  background-image:radial-gradient(circle at 15% 10%, rgba(232,184,75,.12), transparent 40%),
                   radial-gradient(circle at 85% 90%, rgba(241,145,166,.10), transparent 40%);}
.wrap{max-width:780px; margin:0 auto; padding:26px 16px 70px}
h1{font-family:'Jua'; font-weight:400; text-align:center; font-size:clamp(24px,5vw,32px); margin:0 0 4px}
.sub{text-align:center; color:var(--soft); font-size:14px; margin:0 0 20px}
select{font-family:'Jua'; font-size:15px; color:var(--deep); background:var(--card);
  border:1.5px solid var(--line); border-radius:12px; padding:9px 14px; box-shadow:0 2px 0 var(--line)}
.selrow{display:flex; gap:10px; justify-content:center; margin-bottom:18px; flex-wrap:wrap}
.page{display:none; background:var(--card); border:1.5px solid var(--line); border-radius:24px;
  overflow:hidden; position:relative; box-shadow:0 3px 0 var(--line),0 16px 40px rgba(74,52,33,.10)}
.page.on{display:block; animation:turn .4s ease}
@keyframes turn{from{opacity:0; transform:translateX(12px)}to{opacity:1; transform:none}}
@media (prefers-reduced-motion:reduce){.page.on{animation:none}}
.page img{width:100%; display:block; background:#F3E9D5; min-height:200px}
.page .txt{padding:24px 28px 28px; text-align:center; font-size:clamp(16px,2.6vw,19px);
  line-height:1.85; word-break:keep-all}
.page .txt .q{color:var(--pink-deep)}
.pageno{position:absolute; top:12px; right:14px; font-family:'Jua'; font-size:13px; color:#fff;
  background:rgba(74,52,33,.45); border-radius:100px; padding:3px 11px}
.eptitle{font-family:'Jua'; text-align:center; font-size:18px; margin:0 0 12px; color:var(--pink-deep)}
.nav{display:flex; align-items:center; justify-content:center; gap:14px; margin-top:18px}
.nav button{font-family:'Jua'; font-size:16px; color:var(--deep); background:var(--card);
  border:1.5px solid var(--line); border-radius:100px; padding:10px 22px; cursor:pointer;
  box-shadow:0 3px 0 var(--line)}
.nav button:disabled{opacity:.35; cursor:default}
.dots{display:flex; gap:5px; flex-wrap:wrap; justify-content:center; max-width:260px}
.dots i{width:8px; height:8px; border-radius:50%; background:var(--line)}
.dots i.on{background:var(--pink); transform:scale(1.3)}
.missing{text-align:center; color:var(--soft); padding:60px 20px; background:var(--card);
  border:1.5px dashed var(--line); border-radius:24px; font-size:15px; line-height:1.8}
:focus-visible{outline:2.5px solid var(--pink); outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <h1>📖 쿼카 링키의 모험</h1>
  <p class="sub">프롤로그 + 15챕터 × 10에피소드 — 서버 업로드 전 검수용</p>
  <div class="selrow">
    <select id="selCh" onchange="onChapter()"></select>
    <select id="selEp" onchange="onEpisode()"></select>
  </div>
  <p class="eptitle" id="epTitle"></p>
  <div id="book"></div>
  <div class="nav">
    <button id="prev" onclick="move(-1)">◀ 이전</button>
    <div class="dots" id="dots"></div>
    <button id="next" onclick="move(1)">다음 ▶</button>
  </div>
</div>
<script>
const IMG_VER = '260910r3'; // 배포 시 갱신 — 이미지 캐시 무효화용
const DATA = {"0": {"chapter": 0, "animal": "쿼카", "animal_en": "quokka", "letter": "", "village": "쿼카네 집", "title": "K-POP 스타를 꿈꾸는 쿼카", "pages": [{"text": "따뜻한 햇살이 비치는 창가에\n작은 쿼카 한 마리가 앉아 있었어요.\n노래하면 꼬리가 흔들리는 링키였죠.", "prompt": "Cozy cottage interior, Reengki the quokka (wearing his pink felt hat) sitting on a sunny window seat, humming with eyes closed happily, his little tail wiggling, musical notes floating, morning sunshine streaming in, potted plants and a small bookshelf around. Medium shot."}, {"text": "링키의 마음엔 늘 꿈이 하나 있었어요.\n“나도 케이팝 가수처럼 전 세계 친구들과\n무대에서 노래하고 싶어!”", "prompt": "Reengki the quokka (pink felt hat) daydreaming in his cozy room, a big fluffy thought bubble above his head showing a sparkling concert stage with colorful lights, a microphone and cheering animal friends silhouettes, dreamy warm atmosphere. Medium shot."}, {"text": "부엌에서 차를 끓이던 엄마가 말했어요.\n“노래하고 싶은 친구들이 모이는\n전설의 섬, 로트네스트 섬이 있단다.”", "prompt": "Warm cottage kitchen, a plump mother quokka wearing a pink apron with a mint pocket, holding a teapot and smiling gently while talking, little Reengki (pink felt hat) looking up at her with sparkling curious eyes, steam rising from teacups, herbs hanging by the window. Cozy golden light."}, {"text": "“그 섬에선 전 세계 친구들이 모여\n영어로 이야기하며 공연을 한단다.”\n링키의 귀가 쫑긋 섰어요.", "prompt": "Imagination scene: a glowing legendary island seen across sparkling sea at dusk, a grand outdoor stage with string lights and fireworks, many different tiny animal friends gathered (hamster, rabbit, penguin, panda, giraffe silhouettes), magical dreamy mood. Wide shot."}, {"text": "“하지만 그 섬에 가려면 동물 친구들과\n진짜 친구가 되어야 해.\n구슬 15개를 모으면 갈 수 있단다.”", "prompt": "Mother quokka in pink apron kneeling beside Reengki (pink felt hat), showing him an old illustrated map scroll with a winding path through fifteen small villages toward an island, tiny glowing heart-shaped orbs drawn along the path, fireplace light, intimate cozy moment. Medium close-up."}, {"text": "구슬 속엔 알파벳이 하나씩 숨어 있어요.\n다 모으면 ‘아이 러브 유 링키’라는\n빛나는 문장이 완성된대요!", "prompt": "Fifteen glowing heart-shaped orbs floating in a gentle arc against a soft twilight sky, faint letters shimmering inside each orb, sparkles and tiny stars around, magical and hopeful mood, Reengki (pink felt hat) gazing up at them from below in awe. Wide shot."}, {"text": "창밖엔 보슬비가 내리고 있었지만\n링키의 마음은 이미 불타올랐어요.\n“엄마, 저 꼭 로트네스트 섬에 갈래요!”", "prompt": "Evening cottage interior, gentle rain drizzling outside the window, Reengki the quokka (pink felt hat) standing with both paws clenched in determination, eyes sparkling with resolve, warm lamp light glowing, mother quokka watching fondly from behind. Medium shot."}, {"text": "엄마는 링키의 머리를 쓰다듬었어요.\n“쉽지 않을 거야. 하지만\n네 목소리가 가장 큰 힘이 될 거란다.”", "prompt": "Tender moment: mother quokka in pink apron gently patting little Reengki's head (he holds his pink felt hat in his paws), both smiling warmly, cozy living room with soft cushions and a round rug, golden lamp light. Close-up, heartwarming."}, {"text": "그날 밤, 링키는 일기장에 적었어요.\n“무슨 일이 있어도 구슬을 모아\n로트네스트 섬에 갈 거야! 아자!”", "prompt": "Night bedroom scene, Reengki the quokka writing in a little diary at a tiny wooden desk by warm lamp light, his pink felt hat hanging on the chair, crescent moon and stars outside the window, determined cute expression, cozy blanket on the bed behind. Medium shot."}, {"text": "가방엔 지도와 물통, 용기 한 스푼!\n첫 번째 마을은 햄스터 빌리지래요.\n링키의 모험이 지금 시작됩니다!", "prompt": "Early morning doorway of the cottage, Reengki the quokka (pink felt hat) standing proudly with a tiny packed backpack and a rolled map, sunrise lighting a winding path into a green forest ahead, mother quokka waving from the door behind, hopeful adventurous mood. Wide shot."}]}, "1": {"chapter": 1, "animal": "햄스터", "animal_en": "hamster", "letter": "I", "village": "햄스터 빌리지", "episodes": [{"ep": 1, "title": "봄 축제의 무대", "pages": [{"text": "햇살이 포근한 봄날 아침이었어요.\n링키는 창가에 기대어 노래를 흥얼거렸죠.\n“라라라~♪ 나도 언젠가 무대에 설 수 있을까?”", "prompt": "Reengki the quokka leaning on a sunny cottage window sill in the morning, humming happily with musical notes floating in the air, spring sunshine, cozy bedroom interior behind."}, {"text": "그때, 마을 게시판의 알록달록한 포스터가 눈에 띄었어요.\n“봄맞이 축제! 댄스 경연대회 참가팀 모집!”\n“햄스터 빌리지면… 바로 옆 마을이잖아?”", "prompt": "Reengki standing in front of a village notice board outdoors, looking excited at one colorful festival poster decorated with spring flowers and a tiny dancing hamster silhouette; the poster reads 'SPRING FESTIVAL DANCE CONTEST' in cute letters."}, {"text": "그날 오후, 링키는 자전거를 타고 달렸어요.\n슝— 바람이 얼굴을 스치자 마음이 두근두근.\n“나 그냥 구경만 할 거야. 진짜 구경만!”", "prompt": "Reengki joyfully riding a small red bicycle along a countryside path between green meadows, wind lines and petals flying, adventurous happy mood."}, {"text": "길 끝에 분홍 풍선이 잔뜩 매달린 간판이 보였어요.\n‘웰컴 투 햄스터 빌리지!’\n거리엔 종이꽃과 빵 냄새, 음악 소리가 가득했죠.", "prompt": "Village entrance archway sign covered with many pink balloons reading 'HAMSTER VILLAGE', paper flowers strung across a cute tiny village street, Reengki arriving on his bicycle, festive mood."}, {"text": "마을 광장 한가운데엔 무대가 세워져 있었어요.\n링키는 구경꾼들 틈에서 조용히 지켜봤죠.\n“우와… 진짜 무대 같아…”", "prompt": "A small wooden stage in the village square decorated with bunting flags and string lights; groups of tiny hamsters practicing dance moves; Reengki watching quietly from among a small crowd of hamsters, eyes sparkling."}, {"text": "쾅, 쾅— 리듬이 울리고,\n네 마리 햄스터가 한 몸처럼 움직였어요.\n“와아—! 나도 저렇게 추고 싶다…”", "prompt": "Four hamsters dancing on the stage in perfect sync, one leaping, arms raised to the sky in a finishing pose, sparkles and music notes around; audience hamsters cheering; Reengki amazed with open mouth."}, {"text": "그런데 하이라이트 점프에서 그만—\n리더 햄스터가 바닥의 리본을 밟고 말았어요.\n“으악!” 음악이 뚝 멈췄죠.", "prompt": "Dramatic moment on stage: the leader hamster slipping on a pink ribbon on the floor mid-jump, off balance, shocked expressions, motion lines, other hamsters reaching out worried; music stopped."}, {"text": "해미의 발목이 퉁퉁 부어올랐어요.\n“병원 가야 돼!” 친구들이 해미를 부축했죠.\n링키의 마음도 쿵 내려앉았어요.", "prompt": "The leader hamster sitting on the stage floor holding a swollen ankle with teary eyes, three hamster friends supporting her shoulders and bringing water, worried faces; Reengki watching sadly from the crowd; soft cloudy light."}, {"text": "다음 날, 무대 옆 그늘엔\n깁스를 한 해미와 친구들이 앉아 있었어요.\n“대회까지 일주일뿐인데… 포기해야 하나…”", "prompt": "Next day under the shade beside the empty stage: three sad hamsters sitting together, the leader hamster with a tiny cast on her ankle, drooping posture, a lonely pink ribbon on the ground."}, {"text": "나무 뒤에서 링키의 심장이 크게 뛰었어요.\n자전거 핸들을 꼭 쥐고, 조용히 속삭였죠.\n“나… 해볼까?”", "prompt": "Reengki hiding behind a big tree trunk, gripping his bicycle handle, peeking at the sad hamsters in the distance, heart symbol pounding above his head, determined sparkling eyes, warm late-afternoon light."}]}, {"ep": 2, "title": "링키의 결심", "pages": [{"text": "공터에 햄스터즈 세 친구가 앉아 있었어요.\n해미가 깁스한 발을 들며 말했죠.\n“한 명이 빠지면 완전 다른 춤이 돼…”", "prompt": "Wide shot of three sad hamsters sitting in a grassy clearing beside an empty wooden stage. The leader hamster with a small cast on her ankle lifts her foot slightly while talking, drooping ears and worried faces around her. A forgotten pink ribbon lies on the grass, soft spring morning light."}, {"text": "그때 나무 뒤에서 바스락— 소리가 났어요.\n링키가 살짝 얼굴을 내밀었죠.\n“저기… 어제 너희 춤 봤어. 난 링키야!”", "prompt": "Reengki the quokka (wearing his pink felt hat) peeking shyly from behind a large tree trunk, one paw resting on the bark. The three hamsters turn their heads toward him in surprise. Medium shot, warm sunlight filtering through leaves, gentle curious mood."}, {"text": "링키는 조심스럽게 말했어요.\n“혹시 내가 도와줄 수 있을까 해서…\n나도 춤을 좀 출 수 있거든!”", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat) standing before the hamsters, paws clasped together nervously, hopeful sparkling eyes and pink blush cheeks. The leader hamster with the ankle cast looks up at him thoughtfully. Soft grassy clearing background, warm gentle light."}, {"text": "그때 뒤에서 낄낄 웃음소리가 들렸어요.\n반짝이 조끼를 입은 썬라잇 크루였죠.\n“햄스터도 아닌데 춤을 춘다고~?”", "prompt": "Three big hamsters, a rabbit, and a small mouse wearing shiny sparkly vests strutting into the clearing, laughing mockingly with smug expressions. Wide shot with Reengki the quokka (wearing his pink felt hat) and the hamster team in the foreground looking startled. A slightly cool shadow falls over the sunny scene."}, {"text": "링키의 얼굴이 빨개졌어요.\n주먹을 꼭 쥐었지만 아무 말도 못 했죠.\n‘그냥 구경 왔는데… 왜 놀리는 거야…’", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat) with reddened cheeks and hurt teary eyes, small fists clenched at his sides. Behind him the sparkly-vested crew members point and giggle, slightly blurred. Sad tense mood, soft muted light."}, {"text": "그때 해미가 벌떡 일어났어요.\n깁스한 다리로도 눈빛은 단단했죠.\n“그만해! 링키는 그런 애 아니야!”", "prompt": "The leader hamster with an ankle cast standing up bravely on the grass, pointing firmly at the mocking crew with determined shining eyes. Reengki the quokka (wearing his pink felt hat) watches her with wide surprised eyes. Medium shot, dramatic warm backlight, courageous mood."}, {"text": "해미가 단호하게 말했어요.\n“링키는 우리 팀 새 멤버야!”\n친구들은 놀랐고, 해미는 윙크했죠.", "prompt": "The leader hamster proudly placing her paw on the arm of Reengki the quokka (wearing his pink felt hat) while giving a playful wink to her two astonished hamster friends. Reengki looks amazed and touched. Medium shot, warm sunny clearing, cheerful hopeful atmosphere."}, {"text": "썬라잇 크루는 코웃음을 치며 돌아섰어요.\n“쿼카랑 춤춘다고? 웃기겠다~”\n공터는 다시 조용해졌죠.", "prompt": "Wide shot of the sparkly-vested crew of big hamsters, a rabbit and a mouse walking away with dismissive shrugs, seen from behind. Reengki the quokka (wearing his pink felt hat) and the hamster team stand together in the quiet grassy clearing, grass swaying in a soft breeze. Calm light returning after the tension."}, {"text": "링키는 놀란 눈으로 물었어요.\n“나… 진짜 해도 돼?”\n“응, 어제 네 눈이 정말 반짝였거든.”", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat) and the leader hamster with the ankle cast facing each other, she smiles warmly at him. Reengki's round black eyes sparkle with hope, tiny star glints floating around. Soft golden afternoon light, heartwarming mood."}, {"text": "해미가 링키의 손을 꼭 잡았어요.\n“내일부터 바로 연습 시작이다!”\n꽃잎이 두 친구 위로 살포시 내려앉았죠.", "prompt": "Reengki the quokka (wearing his pink felt hat) and the leader hamster holding paws firmly, both smiling brightly at each other. Pink petals drift down and land softly on their heads, warm sunshine filling the clearing. Wide heartwarming shot with the wooden stage in the background."}]}, {"ep": 3, "title": "첫 연습, 첫 실수", "pages": [{"text": "다음 날 아침, 링키는 일찍 공터에 왔어요.\n잔디 냄새가 가득했죠.\n“드디어 진짜 연습이다!” 가슴이 콩닥콩닥.", "prompt": "Reengki the quokka (wearing his pink felt hat) standing alone in a dewy grassy clearing in the early morning, looking up at the small wooden stage with excited sparkling eyes. Wide shot, fresh morning sunlight, dew glittering on the grass, hopeful mood."}, {"text": "햄스터즈 친구들이 하나둘 나타났어요.\n“나는 토리야.” “난 리나!” “난 미뇽!”\n해미는 목에 작은 호루라기를 걸었죠.", "prompt": "Three cheerful hamsters introducing themselves to Reengki the quokka (wearing his pink felt hat), waving their little paws happily. The leader hamster with an ankle cast wears a tiny whistle on a string around her neck. Medium group shot, bright morning light, friendly warm mood."}, {"text": "“하나, 둘, 셋, 넷! 돌아!”\n해미의 호루라기 소리에 맞춰\n모두가 신나게 움직이기 시작했어요.", "prompt": "The leader hamster with the ankle cast blowing her tiny whistle and clapping the beat from the side, while three hamsters and Reengki the quokka (wearing his pink felt hat) practice dance steps in a row. Wide action shot, musical notes floating in the air, energetic sunny clearing."}, {"text": "햄스터들은 통통 가볍게 튀었지만\n링키는 몸이 커서 반 박자 늦었어요.\n“앗!” 꼬리가 미뇽의 팔에 걸렸죠.", "prompt": "Mid-dance mishap: Reengki the quokka (wearing his pink felt hat) turning half a beat late, his tail accidentally bumping a small hamster's arm. The startled hamster wobbles with motion lines around them, while the other hamsters bounce lightly in sync nearby. Medium shot, comic but gentle mood."}, {"text": "이번엔 돌면서 점프하는 동작이었어요.\n링키는 그만 중심을 잃고—\n쿵—! 엉덩방아를 찧고 말았죠.", "prompt": "Reengki the quokka (wearing his pink felt hat) falling on his bottom on the grass mid-spin, a dizzy swirl and little stars above his head, feet up in the air. The hamsters pause their dance and turn around with concerned faces. Wide shot, soft dust puff, gently humorous tone."}, {"text": "토리가 달려왔어요. “괜찮아?”\n“응… 내가 좀 덩치가 커서…”\n링키는 억지로 웃어 보였어요.", "prompt": "Close-up of a small hamster reaching out a paw to help Reengki the quokka (wearing his pink felt hat), who sits on the grass with a forced awkward smile and dirt on his paws. The other hamsters gather around with kind worried expressions. Warm midday light."}, {"text": "쉬는 시간, 링키는 나무 아래 앉았어요.\n‘다들 나 때문에 느려졌잖아…\n괜히 팀에 들어온 건 아닐까…’", "prompt": "Reengki the quokka (wearing his pink felt hat) sitting alone under a big shady tree, hugging his knees with drooping ears, looking down sadly at his dusty paws. Medium shot from a slight distance, dappled shade on the grass, quiet melancholic spring atmosphere."}, {"text": "그때 해미가 조심조심 다가와 앉았어요.\n“우리 팀은 실수해도 괜찮은 팀이야.\n마음이 맞는 게 더 중요하거든.”", "prompt": "The leader hamster with the ankle cast sitting close beside Reengki the quokka (wearing his pink felt hat) under the tree, smiling gently up at him while he wipes his eyes. Close-up two-shot, soft warm light filtering through the leaves, comforting tender mood."}, {"text": "링키는 해미를 바라봤어요.\n다쳐도 웃음을 잃지 않는 해미가\n오늘따라 더 멋져 보였죠.", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat) gazing at the smiling leader hamster with admiration, his eyes shining. Her tiny ankle cast is visible but she beams cheerfully with her paws on her hips. Golden afternoon light, little sparkles of respect and friendship around them."}, {"text": "연습이 끝나고 조용해진 공터,\n링키는 무대를 바라보며 다짐했어요.\n‘해미처럼 나도 절대 포기 안 해!’", "prompt": "Wide evening shot of Reengki the quokka (wearing his pink felt hat) standing alone in the empty clearing, small fists clenched with determination, gazing at the wooden stage. A gentle spring breeze stirs the grass, warm orange sunset glow, resolute hopeful mood."}]}, {"ep": 4, "title": "연습의 벽", "pages": [{"text": "며칠이 지났지만 링키는\n자꾸만 리듬을 놓쳤어요.\n또 꼬리가 리나의 팔에 걸렸죠.", "prompt": "Dance practice in the clearing: Reengki the quokka (wearing his pink felt hat) off-beat again, his tail tangling with a small hamster's arm as both stumble. The hamster sighs softly with a tired expression while the others keep dancing nearby. Medium shot, warm but slightly tense afternoon mood."}, {"text": "링키는 고개를 숙였어요.\n“괜찮아, 우리 아직 시간 있어.”\n해미의 말에도 마음은 무거웠죠.", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat) with his head lowered sadly, while the leader hamster with the ankle cast pats his paw reassuringly and smiles up at him. Late afternoon light casts long soft shadows across the clearing, bittersweet mood."}, {"text": "그날 밤, 링키는 잠이 오지 않았어요.\n그때 방문이 살짝 열렸죠.\n“아직 안 자니?” 아빠였어요.", "prompt": "Cozy night bedroom scene: Reengki the quokka (wearing his pink felt hat) lying awake in his little bed with open eyes, moonlight coming through the window. A bigger adult quokka father gently peeks through the slightly open door with a kind smile. Warm dim lamp light, tender quiet mood."}, {"text": "“같이 나가볼까? 밤 공터엔\n운동하는 친구들이 많단다.”\n“약속!” 링키가 손을 번쩍 들었어요.", "prompt": "Reengki the quokka (wearing his pink felt hat) excitedly raising one paw high in his bedroom while his father, a bigger adult quokka, smiles beside the doorway holding a small lantern. Medium shot inside the cozy cottage at night, warm yellow glow, cheerful anticipation."}, {"text": "밤의 공터엔 가로등이 반짝였어요.\n조깅하는 햄스터, 줄넘기하는 토끼—\n모두 저마다의 리듬으로 움직였죠.", "prompt": "Wide night scene of a park clearing lit by glowing street lamps: a hamster jogging on a track, a rabbit skipping rope, a cat stretching to music. Reengki the quokka (wearing his pink felt hat) and his father arrive at the edge of the field. Deep blue starry sky, lively cozy night mood."}, {"text": "링키는 혼자 박자를 세며 연습했어요.\n쿵—! 넘어져도 다시 일어났죠.\n‘안 돼. 절대 포기 안 해!’", "prompt": "Reengki the quokka (wearing his pink felt hat) practicing spins alone under a street lamp at night, sweat drops flying, pushing himself up from a fall with determined eyes. A small speaker on the grass plays music with floating notes. Medium shot, warm lamplight circle on the grass, gritty but warm mood."}, {"text": "그때 낄낄 웃음소리가 들렸어요.\n썬라잇 크루였죠.\n“밤에 연습한다고 달라지겠냐~?”", "prompt": "The sparkly-vested crew of big hamsters, a rabbit and a mouse emerging from the night shadows, smirking and pointing at Reengki the quokka (wearing his pink felt hat) who stands his ground under the lamp. Wide shot, cool night tones contrasting with warm lamplight, tense mood."}, {"text": "링키가 한 발 앞으로 나섰어요.\n“우리 팀은 열심히 하고 있어. 놀리지 마!”\n아빠가 다가오자 크루는 슬금슬금 달아났죠.", "prompt": "Reengki the quokka (wearing his pink felt hat) stepping forward bravely with clenched fists to face the mocking crew, while his big father quokka approaches from behind him. The vested crew members turn to sneak away awkwardly. Wide night shot, protective courageous mood."}, {"text": "아빠는 링키의 머리를 쓰다듬었어요.\n“실수해도 괜찮아.\n포기만 안 하면 되는 거야.”", "prompt": "Heartwarming close-up of the father quokka gently patting the head of Reengki the quokka (wearing his pink felt hat) under the soft glow of a street lamp. Reengki looks up with grateful, slightly teary eyes. Fireflies drift in the dark background, tender loving night mood."}, {"text": "둘은 나란히 자전거를 타고 돌아갔어요.\n달빛 아래 링키는 다짐했죠.\n‘내일은 꼭 더 잘할 거야!’", "prompt": "Wide shot of Reengki the quokka (wearing his pink felt hat) and his father riding bicycles side by side down a lamplit country path, their long shadows stretching behind them. A big bright moon and twinkling stars above. Peaceful determined mood closing the night."}]}, {"ep": 5, "title": "진짜 리듬, 진짜 팀", "pages": [{"text": "아침 햇살이 공터에 부드럽게 내렸어요.\n“오늘은 더 어려운 동작이야!”\n해미가 힘차게 호루라기를 불었죠.", "prompt": "Fresh morning clearing with sparkling dew on the grass, the leader hamster with the ankle cast blowing her whistle energetically with sound lines. Reengki the quokka (wearing his pink felt hat) and three hamsters stand in ready poses. Wide shot, bright cheerful spring light."}, {"text": "링키는 한 번도 넘어지지 않았어요!\n“어? 링키, 오늘 완전 잘 맞는데?”\n리나가 눈을 동그랗게 떴죠.", "prompt": "Reengki the quokka (wearing his pink felt hat) dancing confidently in perfect rhythm with the hamsters, tail swishing neatly, caught mid-spin with a big smile. A hamster girl stares at him with wide astonished eyes. Dynamic medium shot, dust sparkles and music notes in the air."}, {"text": "“어제 뭐 했어?” 해미가 물었어요.\n“밤에 아빠랑 공터에서 연습했어!”\n링키가 쑥스럽게 웃었죠.", "prompt": "The hamsters gathered around Reengki the quokka (wearing his pink felt hat) during a water break as he scratches his cheek bashfully. The leader hamster looks at him with sparkling impressed eyes. Close group shot, soft morning light, warm friendly mood."}, {"text": "“밤에도 연습하다니 정말 대단해.\n그게 진짜 무대의 마음이야.”\n링키의 귀가 살짝 붉어졌어요.", "prompt": "Close-up of the leader hamster with the ankle cast speaking warmly with a paw on her chest to Reengki the quokka (wearing his pink felt hat), whose ears blush pink as he smiles shyly. Gentle sunbeams and floating dandelion fluff, touching quiet moment."}, {"text": "“좋아, 이번엔 다 같이 맞춰보자!”\n음악이 흐르자 모두 하나처럼 움직였어요.\n꼬리도 발도 리듬에 딱딱 맞았죠.", "prompt": "Wide dynamic shot of Reengki the quokka (wearing his pink felt hat) and three hamsters dancing in perfect unison on the grass, striking identical poses with arms raised, tiny dust clouds at their feet. Music notes and sparkles fill the air, joyful golden sunlight."}, {"text": "해미가 깜짝 놀라 호루라기를 떨어뜨렸어요.\n“이게 바로 우리가 찾던 리듬이야!”\n모두가 소리쳤죠. “우와아—!”", "prompt": "The leader hamster dropping her tiny whistle in amazement, eyes shining wide, while Reengki the quokka (wearing his pink felt hat) and the hamsters hold a triumphant finishing pose together. Medium shot, radiant sunlight bursting behind them, celebratory mood."}, {"text": "리나가 링키의 어깨를 톡 쳤어요.\n“이제 진짜 우리 팀이네!”\n“응! 완전 하나처럼 움직였어!”", "prompt": "A cheerful hamster girl playfully tapping the shoulder of Reengki the quokka (wearing his pink felt hat), both laughing brightly while the other hamsters high-five around them. Close warm group shot, petals drifting in the breeze like confetti, joyful friendship mood."}, {"text": "“링키, 넌 진짜 멋진 친구야.”\n“해미도!”\n둘은 마주 보며 동시에 웃었어요.", "prompt": "Close-up two-shot of Reengki the quokka (wearing his pink felt hat) and the leader hamster with the ankle cast facing each other, laughing warmly at the same moment with happy crescent eyes. Soft glowing backlight and floating petals, pure friendship warmth."}, {"text": "바람에 리본이 하늘로 날아올랐어요.\n“햄스터즈 파이팅!” “링키 파이팅!”\n모두가 웃으며 손을 흔들었죠.", "prompt": "Wide shot of the whole team cheering with paws raised high in the clearing while a pink ribbon flutters up into the blue sky. Reengki the quokka (wearing his pink felt hat) jumps joyfully in the middle of the hamsters. Bright spring sky, festive uplifting energy."}, {"text": "잔디 위엔 네 그림자가 하나로 겹쳤어요.\n마음이 진짜 하나가 된 날—\n하지만 축제 전날, 뜻밖의 일이 기다리고 있었죠.", "prompt": "Warm sunset wide shot from behind: Reengki the quokka (wearing his pink felt hat) and the hamsters standing in a row, their long shadows on the grass overlapping into one shape. Golden light floods the clearing while a few small clouds drift on the horizon, serene yet expectant mood."}]}, {"ep": 6, "title": "사라진 의상", "pages": [{"text": "축제 전날, 공터는 분주했어요.\n조명이 달리고 스피커가 툭툭— 울렸죠.\n솜사탕 냄새에 공기마저 설렜어요.", "prompt": "Bustling festival preparation scene: hamster workers hanging string lights and bunting on the wooden stage, a speaker being tested, cotton candy stalls nearby. Reengki the quokka (wearing his pink felt hat) and his team rehearse on the grass beside the stage. Wide lively shot, festive afternoon light."}, {"text": "“좋아, 한 번만 더! 하나, 둘, 셋, 넷!”\n동작이 착착 맞았어요.\n“이제 진짜 무대만 남았어!”", "prompt": "The team rehearsing their final moves in perfect sync beside the stage, Reengki the quokka (wearing his pink felt hat) spinning big in the center while the hamsters leap around him. The leader hamster with the cast keeps the beat with her whistle. Medium action shot, confident happy energy."}, {"text": "리나가 팀 가방을 열었어요.\n그런데 안이 텅 비어 있었죠!\n“의상도 없고, 리본도 없어!”", "prompt": "Shock moment: a hamster girl holding open a big empty team bag with wide panicked eyes, only tiny sparkle dust falling out. The other hamsters and Reengki the quokka (wearing his pink felt hat) lean in with gasping faces. Close-up on the empty bag, dramatic but soft lighting."}, {"text": "그때 썬라잇 크루가 히죽거리며 지나갔어요.\n“의상? 없어도 되지 않냐~?”\n해미가 낮게 말했죠. “증거 없이 말하지 말자.”", "prompt": "The sparkly-vested crew strolling past with smug grins and exaggerated shrugs while the hamster team watches them with suspicion. The leader hamster holds out a calm firm paw to stop her angry friends. Wide shot near the stage, tense late-afternoon shadows."}, {"text": "“흩어져서 찾아보자!”\n링키는 무대 아래까지 기어들어 갔어요.\n하지만 어디에도 없었죠.", "prompt": "Reengki the quokka (wearing his pink felt hat) crawling under the wooden stage between support beams, dust on his fur, searching with squinting eyes. In the background hamsters search behind a dressing tent and under chairs. Dim light under the stage, urgent searching mood."}, {"text": "모두 빈손으로 돌아왔어요.\n그때 링키가 결심한 듯 말했죠.\n“우리 엄마한테 가보자! 옷 만들기를 좋아하셔!”", "prompt": "The tired team gathered in a circle at dusk shaking their heads sadly, then Reengki the quokka (wearing his pink felt hat) raises a paw with a bright determined idea, a glowing sparkle above his head. Orange sunset sky behind the quiet stage, hope rekindling."}, {"text": "링키네 부엌에 불이 켜졌어요.\n엄마는 환하게 웃으며 말했죠.\n“걱정하지 마. 엄마가 도와줄게!”", "prompt": "Warm cottage kitchen at night: a kind mother quokka in an apron opening her arms welcomingly to Reengki the quokka (wearing his pink felt hat) and the four hamsters at the doorway. Soup steaming on the stove, golden lamp light, comforting cozy mood."}, {"text": "재봉틀이 칙칙칙— 경쾌하게 울렸어요.\n링키와 친구들은 반짝이를 붙였죠.\n“이건 별!” “이건 달!”", "prompt": "Busy nighttime sewing scene at the kitchen table: the mother quokka working a sewing machine with fabric flowing, while Reengki the quokka (wearing his pink felt hat) and the hamsters stick sparkly star and moon patches onto ribbons. Threads, scissors and buttons scattered around, warm bustling teamwork."}, {"text": "아이들이 잠든 사이에도 재봉틀은 돌았어요.\n새벽빛이 밝아올 무렵—\n“완성!” 반짝이는 옷 네 벌이 놓였죠.", "prompt": "Early dawn kitchen: four matching sparkly stage costumes laid neatly on the table, the mother quokka smiling tiredly beside the sewing machine. Reengki the quokka (wearing his pink felt hat) and the hamsters wake up amazed under a shared blanket. Pale blue dawn light meeting warm lamp glow."}, {"text": "“엄마, 고마워! 엄마 최고!”\n“옷, 리본, 음악— 전부 준비 끝!”\n드디어 축제의 날이 밝아오고 있었어요.", "prompt": "Reengki the quokka (wearing his pink felt hat) hugging his mother quokka tightly while the hamsters cheer, holding their new sparkly costumes up high. Morning birds outside the bright window, sunrise light streaming into the kitchen. Joyful triumphant end of the long night."}]}, {"ep": 7, "title": "바뀐 음악", "pages": [{"text": "드디어 축제 날이에요!\n공터엔 음악과 발소리가 가득했죠.\n팀들이 무대 뒤에서 리허설을 준비했어요.", "prompt": "Wide festive scene of the village square packed with hamster festival-goers, colorful banners fluttering above the decorated stage. Backstage, dance teams warm up while Reengki the quokka (wearing his pink felt hat) stretches with his team in matching sparkly costumes. Bright celebratory morning."}, {"text": "“다음은 햄스터즈팀 리허설입니다!”\n아이들은 줄을 맞춰 무대에 올랐어요.\n긴장된 공기가 살짝 감돌았죠.", "prompt": "The team walking up the stage steps in a neat line wearing matching sparkly costumes, Reengki the quokka (wearing his pink felt hat) taking a deep breath. A judges' table with elder hamsters and a murmuring audience below. Medium shot, warm daylight tinged with anticipation."}, {"text": "딸깍— 음악이 시작됐어요. 그런데—\n둥! 짜짜잔! 시끄러운 다른 노래가 나왔죠!\n“이거… 우리 노래 아니야!”", "prompt": "Chaos on stage: harsh jagged music notes bursting from the speakers, Reengki the quokka (wearing his pink felt hat) and the hamsters frozen mid-pose with shocked faces, one hamster dropping her ribbon. Wide shot, jarring energy lines radiating from the speakers."}, {"text": "무대 뒤에서 웃음소리가 들렸어요.\n“무슨 문제라도 있어? 하하!”\n썬라잇 크루가 시치미를 뗐죠.", "prompt": "The sparkly-vested crew lounging backstage with exaggerated innocent shrugs and sneaky grins, the rabbit member whistling casually. In the foreground the hamster team glares at them with frustrated faces. Backstage shadows, tense confrontational mood, medium shot."}, {"text": "해미가 USB를 꼭 쥐고 말했어요.\n“누군가 바꿔치기한 것 같아…”\n리허설은 그대로 중단되고 말았죠.", "prompt": "Close-up of the leader hamster with the ankle cast staring down at a small USB stick in her paws with a grave expression, teammates gathered around her anxiously. Reengki the quokka (wearing his pink felt hat) bites his lip beside her. Dimmed stage-side lighting, worried mood."}, {"text": "무대 담당 토끼가 다가와 말했어요.\n“오후 본무대까지 음악을 준비해줘.”\n남은 시간이 많지 않았죠.", "prompt": "A staff rabbit with a clipboard leaning down to talk to the worried team below the stage, pointing toward a big festival clock. Reengki the quokka (wearing his pink felt hat) and the hamsters listen with nervous faces. Medium shot, bright midday light, ticking urgency."}, {"text": "그때 해미가 눈을 크게 떴어요.\n“맞다! 백업이 하나 더 있어!\n링키네 집 노트북에 꽂혀 있을 거야!”", "prompt": "The leader hamster gasping with a bright realization, one paw raised high and a sparkle of hope above her head. The hamsters and Reengki the quokka (wearing his pink felt hat) lean in with widening hopeful eyes. Close group shot, a warm ray of light breaking over them."}, {"text": "“자전거로 다녀오면 40분은 걸려…”\n“지금 공연까지 몇 분 남았지?”\n“30분.” 모두의 얼굴이 하얘졌죠.", "prompt": "The team huddled around a tiny wristwatch on the leader hamster's arm, every face going pale with dread, sweat drops flying. Reengki the quokka (wearing his pink felt hat) clutches his cheeks in panic. Close-up on the watch and shocked expressions, dramatic tension."}, {"text": "링키는 발을 동동 굴렀어요.\n‘집은 너무 멀어… 어떡하지…’\n심장이 쿵쿵 내려앉았죠.", "prompt": "Reengki the quokka (wearing his pink felt hat) pacing anxiously backstage, wringing his paws with a dark scribbled worry cloud above his head. Behind him the hamsters fidget nervously beside the silent speakers. Medium shot, cool anxious shadows despite the festival lights."}, {"text": "“30분 안에 가져올 수 있을까…”\n리나가 작게 중얼거렸어요.\n과연 누가 햄스터즈를 도와줄까요?", "prompt": "Wide shot of the small team standing close together backstage, looking up at the big stage clock, tiny and uncertain against the bustling festival. High above on a wooden post, the silhouette of a young eagle watches them with keen golden eyes. Late-morning light, cliffhanger mood."}]}, {"ep": 8, "title": "진짜 무대", "pages": [{"text": "링키는 관중석의 아빠에게 달려갔어요.\n“아빠! 우리 USB가 바뀌었어!\n집에 백업이 있는데… 너무 멀어!”", "prompt": "Reengki the quokka (wearing his pink felt hat) running breathlessly to his father quokka near the audience seats, arms waving in panic. The father bends down toward him with a startled worried face. A festival crowd of hamsters blurred behind them, urgent midday light."}, {"text": "“음악이 없으면 무대에 못 올라가…”\n아빠도 눈을 크게 떴어요.\n시간은 자꾸만 흘러갔죠.", "prompt": "Close-up of the father quokka and Reengki the quokka (wearing his pink felt hat) looking at each other with grave faces, a big festival clock looming in the background. Swirling anxious lines around them, the stage visible far behind. Tense race-against-time mood."}, {"text": "그때 나무 기둥 위에서 듣고 있던\n회색빛 어린 독수리가 내려왔어요.\n“무슨 일이니? 내가 도와줄까?”", "prompt": "A young grey eagle with golden eyes and slightly scruffy feather tips gliding down from a tall wooden post, landing before the surprised Reengki the quokka (wearing his pink felt hat) and his father. Wings half-folded, friendly confident smile. Medium shot, a small dust swirl at his landing."}, {"text": "“언덕 위 파란 창문집이지? 내가 다녀올게!”\n독수리가 날개를 활짝 펼쳤어요.\n후욱— 하늘로 슝 솟구쳤죠!", "prompt": "Dynamic upward shot of the young grey eagle launching into the sky with powerful wingbeats, wind gusts bending the grass and feathers glinting in the sun. Reengki the quokka (wearing his pink felt hat) and amazed hamster onlookers shield their eyes and stare up. Bright blue sky, exhilarating motion."}, {"text": "공연까지 10분!\n“햄스터즈, 대기해주세요!”\n아이들은 서로의 손을 꼭 잡았어요.", "prompt": "The team in sparkly costumes huddled backstage holding paws tightly in a circle, eyes squeezed shut with hope, while Reengki the quokka (wearing his pink felt hat) glances anxiously at the sky. A staff rabbit gestures toward the stage. Close tense shot, festival bustle around them."}, {"text": "“저기! 하늘 좀 봐!”\n반짝이는 점이 점점 커지더니—\n독수리가 USB를 물고 급강하했어요!", "prompt": "Thrilling wide shot of the young grey eagle diving steeply from the bright sky toward the festival square, a tiny USB stick shining in his beak, wind trails streaming behind him. Below, Reengki the quokka (wearing his pink felt hat) and the hamsters point up with open mouths."}, {"text": "“하아… 이거 맞지?”\n“진짜 가져왔어! 이름이 뭐야?”\n“나? 이든이야!” 독수리가 씩 웃었죠.", "prompt": "The young grey eagle panting proudly, one wing extended to hand the USB stick to Reengki the quokka (wearing his pink felt hat), both grinning. Hamsters bounce with joy around them and the leader hamster clasps her paws in relief. Warm close shot, dust settling, spark of new friendship."}, {"text": "조명이 켜지고 진짜 음악이 시작됐어요!\n“하나! 둘! 셋! 넷!”\n햄스터즈의 무대가 열렸죠.", "prompt": "The stage lights blazing on: three hamsters in sparkly costumes leaping in the front row while Reengki the quokka (wearing his pink felt hat) spins grandly at center stage, ribbons catching the light. A cheering hamster audience below. Wide performance shot, dazzling festive energy."}, {"text": "링키가 팔을 크게 휘저으며 돌았어요.\n리본이 햇빛에 반짝반짝—\n박수 소리가 점점 커졌죠.", "prompt": "Dynamic close-up of Reengki the quokka (wearing his pink felt hat) mid-spin with arms sweeping wide, a sparkly ribbon trailing arcs of light around him, hamster teammates dancing in sync behind. Audience paws clapping at the edge of the frame, radiant stage light."}, {"text": "마지막 점프, 그리고 포즈—!\n“와아아아!” 관중이 모두 일어났어요.\n“우리, 진짜 해냈어!” 과연 결과는 어떻게 될까요?", "prompt": "The grand finale: Reengki the quokka (wearing his pink felt hat) landing from a high jump into a final pose with the three hamsters, ribbons scattering like sparks of light in the air. The whole hamster audience stands and cheers while the young grey eagle flaps happily on a post. Wide triumphant shot."}]}, {"ep": 9, "title": "결과 발표", "pages": [{"text": "무대가 끝나자 함성이 터졌어요.\n“햄스터즈 최고야!” “진짜 반짝였어!”\n아이들은 서로를 꼭 안았죠.", "prompt": "Just after the performance: Reengki the quokka (wearing his pink felt hat) and the three hamsters hugging tightly on stage, breathing hard and laughing, confetti and petals drifting down. The hamster audience waves and cheers wildly. Warm glowing stage light, euphoric moment."}, {"text": "해가 기울고 발표 시간이 되었어요.\n심사위원 토끼가 마이크를 잡았죠.\n아이들의 심장이 콩닥콩닥 뛰었어요.", "prompt": "Sunset over the festival square, a rabbit judge holding a microphone and papers at the front of the stage, orange light washing over the crowd. The team waits in a nervous row, Reengki the quokka (wearing his pink felt hat) squeezing the leader hamster's paw. Suspenseful warm dusk."}, {"text": "그때 다람쥐 스태프가 급히 달려왔어요.\n“잠깐만요, 심사위원님!”\n귓속말에 광장이 웅성웅성했죠.", "prompt": "A small squirrel staff member hurrying up the stage steps and whispering into the rabbit judge's long ear, the judge's eyes widening in surprise. Below, the murmuring crowd of hamsters exchange puzzled looks. Medium shot, dusky intrigue mood."}, {"text": "“썬라잇 크루가 USB를 바꿔치기한 것이\n확인되어 실격 처리합니다.”\n관중석이 크게 술렁였어요.", "prompt": "The rabbit judge announcing solemnly into the microphone while the sparkly-vested crew stands aside with heads hanging low, the rabbit member biting his lip. A gasping hamster audience with wide eyes fills the square. Wide shot, dramatic sunset shadows across the stage."}, {"text": "“정직한 팀이 진짜 멋져!”\n관중들의 응원과 박수가 커졌어요.\n링키는 마음이 조금 복잡했죠.", "prompt": "The audience clapping warmly with balloon sticks waving, while Reengki the quokka (wearing his pink felt hat) glances quietly at the remorseful crew standing in the corner, his expression gentle and mixed. Soft golden-hour light, compassionate bittersweet mood, medium shot."}, {"text": "“3등은… 야옹즈 팀!”\n회색 줄무늬 옷의 고양이들이\n깡충깡충 뛰며 무대로 올라왔어요.", "prompt": "Four grey-striped cats in matching outfits bouncing joyfully onto the stage, holding paws and spinning together, while cat family members in the audience stand and wave happily. The rabbit judge smiles beside them. Festive wide shot, twinkling stage lights at dusk."}, {"text": "“그리고 2등은… 햄스터즈!”\n“꺄아아! 우리가 2등이야!”\n모두 폴짝폴짝 뛰었어요.", "prompt": "Explosive joy: the hamsters leaping high with arms flung up, Reengki the quokka (wearing his pink felt hat) jumping in the middle with the biggest smile, sparkles bursting around them. The leader hamster covers her mouth with teary shining eyes. Dynamic celebratory medium shot."}, {"text": "해미의 눈에 눈물이 맺혔어요.\n“작년엔 꼴찌였는데… 너무 행복해.”\n네 개의 손이 차곡차곡 포개졌죠.", "prompt": "Close-up of small paws stacking one over another in a team circle, the leader hamster with the ankle cast smiling through happy tears, Reengki the quokka (wearing his pink felt hat) placing his paw gently on top. Warm spotlight glow, deeply moving friendship moment."}, {"text": "“1등은 펭귄 시스터즈! 축하합니다!”\n햄스터즈도 힘껏 박수를 쳤어요.\n은빛 2등 트로피가 반짝였죠.", "prompt": "Penguin sisters hugging and hopping happily at center stage as they receive the top trophy, while the hamster team applauds heartily nearby, the leader hamster holding a shiny silver runner-up trophy. Confetti falling under the evening lights, generous joyful mood, wide shot."}, {"text": "그때 썬라잇 리더가 다가와 고개를 숙였어요.\n“…미안해. 우리가 잘못했어.”\n“다음엔 진짜 실력으로 붙자!” 링키가 웃었죠.", "prompt": "The big crew-leader hamster in a sparkly vest bowing his head apologetically before Reengki the quokka (wearing his pink felt hat), who smiles kindly and offers a paw. The hamster teams watch quietly under twilight festival lanterns. Gentle reconciliation, warm forgiving light."}]}, {"ep": 10, "title": "첫 번째 구슬", "pages": [{"text": "그날 밤, 모두 해미네 집에 모였어요.\n김이 모락모락 나는 스프와 구운 감자!\n“오늘 고생한 햄스터즈, 많이 먹으렴!”", "prompt": "Cozy night dinner at the hamster home: a table set with steaming soup, roasted potatoes and bread, a mother hamster serving warmly. Reengki the quokka (wearing his pink felt hat) and the four hamsters sit around the table with glowing faces. Fireworks afterglow through the window, snug happy mood."}, {"text": "해미가 말했어요. “네가 없었다면\n우린 정말 끝이었을 거야.\n결국 네가 우리 팀을 바꿔놨잖아.”", "prompt": "The leader hamster with the ankle cast smiling gratefully at Reengki the quokka (wearing his pink felt hat) across the dinner table, warm lamp light on their faces. The other hamsters listen with soft happy smiles. Close intimate shot, gentle golden interior glow."}, {"text": "“우정의 건배~!”\n종이컵이 부딪히며 짠—!\n창밖엔 반딧불 하나가 반짝 날아올랐죠.", "prompt": "The whole team raising paper cups in a cheerful toast over the dinner table, laughing together, Reengki the quokka (wearing his pink felt hat) in the middle. Outside the window a single firefly glows against the dark blue night. Warm celebratory framing, joyful friendship."}, {"text": "집으로 가던 링키는 무대 앞에 멈췄어요.\n“오늘 진짜 대단했어…\n나, 해미랑 진짜 친구가 됐어.”", "prompt": "Quiet night scene: Reengki the quokka (wearing his pink felt hat) sitting alone on the steps of the dark empty stage beside his parked bicycle, scattered ribbons around him, gazing up softly. Moonlight and distant festival lanterns, peaceful reflective mood, wide shot."}, {"text": "그때— 무대 한가운데서\n작은 빛이 깜빡였어요.\n“어? 이게… 뭐지?”", "prompt": "A tiny mysterious light glowing and blinking at the center of the dark stage floor among fallen ribbons, while Reengki the quokka (wearing his pink felt hat) rises from the steps with wide wondering eyes. Deep blue night, the small glow casting soft light on his face. Magical hush."}, {"text": "리본 밑에서 손톱만 한 구슬이\n스스로 무지갯빛을 내고 있었어요.\n마치 별빛이 갇힌 것처럼요.", "prompt": "Extreme close-up of a tiny glass marble glowing with slowly swirling rainbow light beneath a pink ribbon on the stage floor, like starlight trapped inside. Reengki the quokka (wearing his pink felt hat) leans in close, his amazed face lit by the glow. Enchanted night sparkle."}, {"text": "구슬은 손바닥 위에서 살짝 따뜻했어요.\n그때 작은 목소리가 들렸죠.\n“Reengki… 진짜 친구를 만났구나.”", "prompt": "Reengki the quokka (wearing his pink felt hat) holding the glowing rainbow marble in his open palm, warm light rays rising from it, his round eyes reflecting the sparkle as he listens in awe. A gentle shimmer like sound waves around the marble. Close-up, tender magical moment."}, {"text": "구슬은 점점 투명해지더니\n별가루처럼 반짝이며 하늘로 올라갔어요.\n밤하늘의 별 하나가 살짝 깜빡였죠.", "prompt": "The marble dissolving into a stream of glittering stardust that spirals up from Reengki's paw into the night sky, connecting to one softly twinkling star. Reengki the quokka (wearing his pink felt hat) gazes upward with parted lips. Wide vertical night shot, dreamy starry magic."}, {"text": "손바닥엔 따뜻한 온기가 남아 있었어요.\n“혹시… 내 마음속에 들어간 걸까?”\n링키의 마음이 이상하게 가벼워졌죠.", "prompt": "Reengki the quokka (wearing his pink felt hat) looking down at his own open palm with a soft wondering smile, a faint warm glow lingering on it, ribbons drifting gently across the moonlit stage. Quiet close-up, warm afterglow against cool night tones."}, {"text": "“그래, 이제 진짜 시작이야!”\n링키는 힘차게 페달을 밟았어요.\n“다음엔… 어디로 갈까?”", "prompt": "Reengki the quokka (wearing his pink felt hat) riding his bicycle away down a moonlit path with a bright determined smile, while the young grey eagle watches warmly from a treetop, feathers silvered by moonlight. Above them one star twinkles in the vast night sky. Wide hopeful ending shot."}]}]}, "2": {"chapter": 2, "animal": "토끼", "animal_en": "rabbit", "letter": "L", "village": "토끼 빌리지", "episodes": [{"ep": 1, "title": "봄꽃 너머의 손님", "pages": [{"text": "봄 축제가 끝나고 이틀이 지났어요.\n링키는 창가에 앉아 손바닥을 가만히 펴 보았어요.\n구슬이 머물던 자리에 따스함이 남아 있었어요.", "prompt": "Reengki the quokka (wearing his pink felt hat) sits by a sunny window, gazing down at his open palm with a soft, thoughtful expression. Warm spring light pools on his small paw. Outside the window, cherry blossom petals drift on a gentle breeze, and one petal rests on the windowsill. Close-up shot with a cozy morning atmosphere."}, {"text": "그때 문밖에서 또각, 또각— 소리가 났어요.\n문을 열자 하얀 털의 쿼카 할머니가 서 계셨어요.\n“링키, 잠깐 들어가도 되겠니?”", "prompt": "An elderly quokka grandmother with snow-white fur and a gently curved back stands at a wooden front door, leaning on a well-worn polished walking cane. Reengki the quokka (wearing his pink felt hat) opens the door and looks up at her with wide, surprised eyes. Cherry blossom petals float in the spring air behind her. Medium shot, warm daylight, gentle storybook mood."}, {"text": "할머니가 거실에 앉으시고,\n엄마 아빠도 나란히 곁에 앉았어요.\n햇살 속에서 먼지가 사르르 반짝였어요.", "prompt": "Inside a cozy quokka family living room, the elderly quokka grandmother sits in a chair while Reengki's quokka mother and father sit side by side near her. Reengki the quokka (wearing his pink felt hat) kneels politely on the wooden floor facing them. Long beams of morning sunlight stretch across the floorboards, with tiny dust motes sparkling in the light. Wide shot, warm and serene atmosphere."}, {"text": "“첫 번째 구슬을 얻었다고 들었단다.\n그 구슬이 언제 찾아왔는지 기억하니?”\n“해미랑… 마음이 통했을 때요.”", "prompt": "Close-up of the elderly quokka grandmother holding a warm cup of tea, white steam rising softly between her and Reengki the quokka (wearing his pink felt hat). Her deep, kind eyes shine through the drifting steam as she speaks. Reengki listens earnestly with his paws on his knees. Soft indoor lighting, intimate and gentle mood."}, {"text": "“구슬은 힘이 센 아이를 고르지 않아.\n친구를 아끼고 용기를 내는\n아이의 마음을 따라 움직인단다.”", "prompt": "The elderly quokka grandmother gently gestures with one paw as she speaks to Reengki the quokka (wearing his pink felt hat), who nods quietly. Between them, a faint dreamy glow suggests the memory of a sparkling glass bead floating above an open palm. Warm living room background softly blurred. Medium close-up, tender storybook lighting."}, {"text": "“세상엔 너를 기다리는\n신비로운 마을이 열다섯 곳 있단다.”\n“열다섯 곳이나요?” 링키 눈이 커졌어요.", "prompt": "Wide dreamy scene imagined above the tea steam: a winding path connecting fifteen tiny glowing villages across rolling hills under a pastel sky. Below, Reengki the quokka (wearing his pink felt hat) looks up with wide amazed eyes while the quokka grandmother points gently upward. Soft magical light, sense of wonder, storybook fantasy composition."}, {"text": "“구슬을 다 모으면 전설의 섬,\n로트네스트로 가는 길이 열린단다.”\n그 이름이 링키 가슴에 콕— 박혔어요.", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat) with sparkling wide eyes, one paw pressed lightly over his chest. Behind him, a soft dreamlike vision of a legendary island glowing on a distant sea horizon under golden light. The quokka grandmother's silhouette is softly visible at the edge of the frame. Magical, hopeful atmosphere."}, {"text": "“그 길은 링키 혼자 걸어가야 한단다.”\n혼자라니… 가슴이 콩닥콩닥 뛰었어요.\n“저는… 자신이 없는걸요.”", "prompt": "Reengki the quokka (wearing his pink felt hat) hugs his knees and looks down anxiously, ears drooping slightly. His quokka mother watches him with a worried expression, paws clasped together. The grandmother looks on calmly and kindly. Soft muted indoor light, medium shot capturing the tense but tender family moment."}, {"text": "“진짜 용기는 무서워도\n한 걸음 내딛는 마음이란다.”\n할머니가 링키를 살며시 안아 주셨어요.", "prompt": "The elderly quokka grandmother gently embraces Reengki the quokka (wearing his pink felt hat) in a warm hug, her white fur soft against him. Reengki's eyes are closed, his expression calming. Morning sunlight wraps around them like a soft blanket in the cozy living room. Close-up, deeply warm and reassuring mood."}, {"text": "링키는 침을 꼴깍 삼키고 말했어요.\n“저, 그 섬에 가 보고 싶어요.”\n창틀 위 벚꽃잎에 햇살이 살며시 얹혔어요.", "prompt": "Reengki the quokka (wearing his pink felt hat) stands bravely with small fists clenched, speaking with a determined yet gentle face to his quokka family. His mother dabs her eyes while his father's large paw trembles slightly with emotion. On the windowsill behind them, a single cherry blossom petal glows in morning sunlight. Medium wide shot, emotional and hopeful storybook scene."}]}, {"ep": 2, "title": "작별 인사, 그리고 구슬 주머니", "pages": [{"text": "동이 트기 전 이른 아침이었어요.\n엄마는 어스름 속에서 도시락을 쌌어요.\n잼빵, 빨간 사과, 고소한 견과류 한 줌.", "prompt": "In a dim cozy kitchen before dawn, Reengki's quokka mother carefully packs a lunchbox with jam bread, a shiny red apple, and a handful of nuts. A small folded paper note rests beside the lunchbox. Through the window, one last morning star glimmers in the pale bluish sky. Medium shot, quiet tender pre-dawn atmosphere."}, {"text": "엄마가 무언가를 살며시 건넸어요.\n작은 별 자수가 콕 박힌\n하늘빛 천 주머니였어요.", "prompt": "Close-up of the quokka mother's paws gently placing a small soft pouch of pale sky-blue cloth, embroidered with a single tiny star, into the open paws of Reengki the quokka (wearing his pink felt hat). The fabric looks lovingly worn and smooth. Soft dawn light glows on the pouch. Intimate, warm storybook moment."}, {"text": "조심조심 끈을 풀자, 그 안에—\n사라졌던 첫 번째 구슬이 있었어요.\n구슬엔 ‘I’ 글자가 반짝이고 있었죠.", "prompt": "Extreme close-up of Reengki the quokka (wearing his pink felt hat) peering into the open sky-blue pouch, eyes round with wonder. Inside glows a small crystal bead with the letter 'I' shimmering at its glowing center. A thin ray of dawn sunlight falls softly onto the bead. Magical sparkle, hushed wonder-filled mood."}, {"text": "“이건 엄마가 여행할 때 쓰던 주머니야.\n네가 진심으로 얻은 구슬은\n어디에 있든 이곳으로 돌아온단다.”", "prompt": "The quokka mother kneels to Reengki the quokka (wearing his pink felt hat), tenderly cupping his paws that hold the star-embroidered pouch. Her expression is loving and a little nostalgic. Warm golden dawn light streams through the kitchen window behind them. Medium close-up, heartfelt mother-and-child moment."}, {"text": "“열다섯 글자가 다 모이면\n가장 소중한 한마디가 완성된단다.”\n“무슨 말인데요?” “아무도 모른단다.”", "prompt": "Reengki the quokka (wearing his pink felt hat) looks up at his mother with curious sparkling eyes, holding the glowing pouch to his chest. Above them floats a soft imaginative vision of fifteen faint glowing beads arranged in an arc, most of them still misty and unrevealed. Dreamy magical lighting, sense of mystery and wonder."}, {"text": "그 비밀을 풀 수 있는 건\n이제 우리 집에서 링키뿐이래요.\n아빠는 자전거를 정성껏 닦았어요.", "prompt": "Reengki's quokka father crouches beside a small bicycle in the front yard at sunrise, polishing it carefully and tying a bag firmly onto the rear rack with triple knots. Reengki the quokka (wearing his pink felt hat) watches while hugging his sky-blue pouch. Dewy grass sparkles around them. Wide shot, devoted and gentle morning scene."}, {"text": "“엄마, 아빠… 다녀올게요!”\n엄마가 링키를 와락 끌어안았어요.\n포근한 엄마 향기가 코끝에 스몄어요.", "prompt": "The quokka mother embraces Reengki the quokka (wearing his pink felt hat) tightly in front of their cottage, her eyes closed with emotion. The father rests a big gentle paw on Reengki's head. The packed bicycle waits beside them in soft morning light. Close-up of the hug, deeply warm and bittersweet farewell mood."}, {"text": "“링키—!” 골목 끝에서 해미가 달려왔어요.\n깁스를 한 채 분홍 리본을 내밀며 말했죠.\n“힘들 땐 하나, 둘, 셋 박자를 기억해.”", "prompt": "Haemi the hamster, one arm in a small cast, runs breathlessly up a dewy morning alley toward Reengki the quokka (wearing his pink felt hat), holding out a pink ribbon with both paws. Her cheeks are flushed and tiny beads of sweat glisten on her forehead. Reengki receives the ribbon with touched, shining eyes. Medium shot, misty morning alley, tender friendship scene."}, {"text": "언덕 위에서 링키가 크게 외쳤어요.\n“꼭 케이팝 스타가 되어 돌아올게요!”\n“우리 링키, 할 수 있어!”", "prompt": "Wide shot from a grassy hilltop: Reengki the quokka (wearing his pink felt hat) stands beside his bicycle, waving both arms high toward his tiny distant cottage where his quokka parents wave back. Haemi the hamster waves her pink-ribboned paw beside them. Golden morning light floods the rolling spring fields. Uplifting, hopeful send-off scene."}, {"text": "그런데 참 신기했어요.\n갈림길에서 한쪽으로 틀면 주머니가 콩—\n심장처럼 따뜻해지며 길을 알려 주었죠.", "prompt": "Reengki the quokka (wearing his pink felt hat) rides his bicycle along a misty country road that splits into two paths ahead. From his shoulder bag, a soft warm golden glow pulses gently, hinting at the magical pouch inside guiding his way. Morning fog drifts over dewy fields. Wide shot, gentle magical adventure atmosphere."}]}, {"ep": 3, "title": "국기 너머의 친구들", "pages": [{"text": "길가에 낡은 이정표가 서 있었어요.\n‘토끼 빌리지…?’ 고개를 갸웃하는 사이\n자전거가 내리막을 쌩— 달려 내려갔어요.", "prompt": "Reengki the quokka (wearing his pink felt hat) zooms down a steep countryside hill on his bicycle, feet off the pedals, gripping the handlebars tightly with a startled but thrilled face. An old wooden signpost stands at the top of the hill behind him. Wind lines streak past, spring fields blur alongside. Dynamic wide shot, playful motion and speed."}, {"text": "파닥, 파닥, 파다닥—\n수십 개의 국기가 봄볕 아래 나부꼈어요.\n“우와…” 셀 수 없이 많았어요.", "prompt": "Reengki the quokka (wearing his pink felt hat) stands beside his bicycle at a village entrance, head tilted far back in awe. Above him, dozens of colorful flags from many countries flutter and ripple in the bright spring sunlight like a rainbow wave. Low-angle wide shot emphasizing the countless flags against a blue sky. Joyful, wondrous mood."}, {"text": "“Hi! 여기 처음 왔어?”\n하얀 토끼가 방긋 웃고 있었어요.\n긴 귀엔 색색의 국기 배지가 짤랑짤랑.", "prompt": "A bright-eyed white rabbit stands on green grass, smiling warmly at a startled Reengki the quokka (wearing his pink felt hat) who steps back in surprise. The rabbit's long ears are decorated with colorful little flag badges that jingle. Spring sunlight makes her white fur glow softly. Medium shot, cheerful first-meeting scene."}, {"text": "“어… Hello! 나, 나는 링키야!”\n“Nice to meet you! 나는 루나야.”\n루나는 폴짝폴짝 앞장서 뛰었어요.", "prompt": "Luna the white rabbit hops energetically ahead along a village path, her flag badges swinging cheerfully, while Reengki the quokka (wearing his pink felt hat) hurries after her pushing his bicycle. His ear tips are blushing pink from his shy mixed-language greeting. Colorful flags line the path above. Wide shot, lively and playful motion."}, {"text": "광장 큰 나무 아래, 하얀 토끼, 잿빛 토끼,\n밤색 토끼, 얼룩 토끼가 옹기종기 모여 있었어요.\n낯선 말들이 사이좋게 뒤섞여 들렸죠.", "prompt": "A bustling village plaza with a tall leafy tree at its center. Rabbits of many colors — white, gray, chestnut brown, and spotted — gather in friendly clusters beneath its shade, chatting animatedly. Reengki the quokka (wearing his pink felt hat) peeks curiously from the edge with Luna the white rabbit beside him. Wide establishing shot, warm multicultural village atmosphere."}, {"text": "나무 기둥엔 알록달록 포스터가 있었어요.\n“‘The Smiling Rabbit’ 이야기 들어봤어?\n재규어를 세 번 속이고 달까지 간 토끼야!”", "prompt": "Luna the white rabbit points excitedly at a colorful festival poster pinned to the great tree trunk, her eyes sparkling like stars. The poster shows a joyful rabbit silhouette leaping toward a big smiling full moon. Reengki the quokka (wearing his pink felt hat) gazes at it with his mouth open in wonder. Medium shot, whimsical storybook detail."}, {"text": "루나가 두 팔을 활짝 펼치고 뱅글 돌았어요.\n“See ya, silly Jaguar! I'm going to the moon!”\n“지금도 보름달엔 웃는 토끼가 보인대!”", "prompt": "Luna the white rabbit spins joyfully on the grass with both arms spread wide as if flying to the sky, her ears and flag badges swirling. Reengki the quokka (wearing his pink felt hat) watches with sparkling amazed eyes, paws at his cheeks. Soft daylight, plaza tree in background. Dynamic medium shot full of playful theatrical energy."}, {"text": "“사흘 뒤 보름달 축제 때 너도 같이 뛰자!\n우승은 없어. 모두가 함께 뛰는 축제야.\n마을 전체가 다 참가자거든!”", "prompt": "Luna the white rabbit extends her paw invitingly to Reengki the quokka (wearing his pink felt hat) beneath the festival poster. Behind them, a dreamy vision shows many rabbits leaping together in perfect unison under a glowing full moon. Reengki looks hesitant but intrigued. Medium shot, magical anticipation in the air."}, {"text": "“난 쿼카인걸. 그렇게 높이 못 뛸지도 몰라.”\n“괜찮아, 링키는 링키답게 뛰면 되지!”\n가슴이 콩닥콩닥, 작은 북처럼 울렸어요.", "prompt": "Luna the white rabbit gently pats the shoulder of Reengki the quokka (wearing his pink felt hat), giving him an encouraging grin. Reengki looks up at the festival poster of the moon-leaping rabbit, one paw over his softly drumming heart. Warm afternoon light filters through the plaza tree leaves. Close-up, tender encouraging moment."}, {"text": "그날 밤, 라벤더 담장 옆 작은 방에서\n링키는 짐을 풀었어요. 창밖 국기들이\n달빛 아래 팔랑팔랑— 종소리가 은은했죠.", "prompt": "Reengki the quokka (wearing his pink felt hat) leans on the windowsill of a small cozy guest room at night, gazing out at distant village flags fluttering under silvery moonlight. A lavender hedge glows faintly purple below the window. His unpacked bag sits on a little bed behind him. Peaceful nighttime wide shot, gentle wonder before sleep."}]}, {"ep": 4, "title": "말이 없어도 통하는 마음", "pages": [{"text": "이튿날 아침, 광장엔 토끼들이 가득했어요.\n오늘은 축제를 준비하는 날.\n그런데 아무도 입을 열지 않았어요.", "prompt": "Morning village plaza full of rabbits of many colors busily preparing festival decorations — hanging cloths and moon ornaments — yet all working in complete silence. Dewdrops sparkle on their flag badges. Reengki the quokka (wearing his pink felt hat) stands with Luna the white rabbit, looking around puzzled. Wide shot, curious quiet morning atmosphere."}, {"text": "쫑긋— 한 토끼가 두 귀를 세우자\n옆 토끼가 리본을 옮겼어요.\n살랑— 귀를 눕히자 장식이 올라갔죠.", "prompt": "Close-up sequence feel: a gray rabbit perks both ears sharply forward while a nearby rabbit nods and moves a ribbon; another rabbit softly folds one ear sideways as its friend hangs a moon ornament higher on a tree. Reengki the quokka (wearing his pink felt hat) watches wide-eyed in the background. Bright morning plaza, charming detail-focused scene."}, {"text": "“루나, 저 친구들은 왜 말을 안 해?”\n“우리에겐 귀 신호가 있으니까!\n말이 달라도 서로 도울 수 있게.”", "prompt": "Luna the white rabbit demonstrates ear signals to Reengki the quokka (wearing his pink felt hat): her ears perked straight forward with a proud smile. Around them, rabbits communicate silently with wiggling, tilting ears like little pinwheels. Sunny plaza background with festival cloths. Medium shot, playful teaching moment."}, {"text": "링키도 귀에 잔뜩 힘을 주었어요.\n하지만 작고 동그란 귀는\n겨우 살짝 들썩일 뿐이었죠.", "prompt": "Comedic close-up of Reengki the quokka (wearing his pink felt hat) straining hard with a scrunched face, trying to perk up his tiny round ears, which barely twitch upward. A faint vein pops on his forehead from effort. Nearby rabbits glance over with amused sideways looks. Bright daylight, gentle humorous mood."}, {"text": "그때 “끼익—!” 소리가 났어요.\n계단에 손수레가 위태롭게 걸려 있고\n작은 생쥐가 발을 동동 구르고 있었어요.", "prompt": "At the corner of the plaza, a small wooden handcart tilts precariously on the edge of stone steps, its bundle spilling colorful cloth strips and moon decorations. Beside it, a tiny round mouse hops anxiously from foot to foot with teary eyes. Reengki the quokka (wearing his pink felt hat) approaches carefully in the background. Medium wide shot, gentle urgency."}, {"text": "“으… 나나나…” 도무지 알아들을 수 없었어요.\n“난 링키야. 넌 이름이 뭐야?” “…치키.”\n귀 신호도 치키에겐 통하지 않았어요.", "prompt": "Reengki the quokka (wearing his pink felt hat) crouches down to eye level with Chiki the tiny mouse, who clutches a bundle to her chest with big teary eyes. Luna the white rabbit signals with her ears nearby, but Chiki only tilts her head in confusion. Soft morning light, close-up on the sweet puzzled exchange."}, {"text": "‘말이 안 통하는데 어떻게 마음을 전하지?’\n그 순간 머릿속에 반짝— 불이 켜졌어요.\n링키는 두 발을 가지런히 모았어요.", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat) with a bright idea expression, eyes lighting up, one paw raised as a tiny imaginative spark glints above his head. Chiki the mouse watches him curiously, still hugging her bundle. Plaza and tilted handcart softly blurred behind. Warm hopeful lighting."}, {"text": "폴짝! 온 힘을 다해 뛰어올랐어요.\n보따리를 가리키고, 나무를 가리키고,\n다시 한번 폴짝! 치키 눈이 커졌어요.", "prompt": "Reengki the quokka (wearing his pink felt hat) leaps high into the air with all his might, then points at the bundle of decorations and at a tall tree, miming his message with his whole body. Chiki the tiny mouse's eyes grow round and bright as she suddenly understands, raising both paws with a huge smile. Dynamic medium shot, joyful breakthrough moment."}, {"text": "함께 수레를 세우고 장식을 옮겼어요.\n세 번이나 뛰어올라 천을 걸자,\n기다란 천이 봄바람에 살랑살랑 춤췄어요.", "prompt": "Reengki the quokka (wearing his pink felt hat) jumps up beside a tall tree to hang a long colorful cloth streamer, while Chiki the mouse passes decorations up from the righted handcart below. The streamer ripples gracefully in the spring breeze. Luna the white rabbit helps nearby. Wide shot, cooperative cheerful energy, festival colors everywhere."}, {"text": "링키, 치키, 루나— 폴짝, 폴짝, 폴짝!\n말은 안 통해도 셋은 환하게 웃었어요.\n세상엔 말보다 먼저 닿는 것도 있었죠.", "prompt": "Reengki the quokka (wearing his pink felt hat), Chiki the tiny mouse, and Luna the white rabbit jump side by side in a joyful row across the plaza grass, each at a different height but all laughing brightly. Watching rabbits around them flutter their ears happily like little fans. Golden afternoon light, wide heartwarming shot full of laughter."}]}, {"ep": 5, "title": "라벤더 언덕의 쿠키와 영어 한 잔", "pages": [{"text": "다음 날 아침, 루나가 링키를 깨웠어요.\n“오늘은 할머니를 뵈러 가는 날이야!\n달까지 뛰는 비밀을 아시는 분이거든!”", "prompt": "Luna the white rabbit cheerfully shakes awake a sleepy Reengki the quokka (wearing his pink felt hat) in the small guest room, morning light streaming through the window. Reengki rubs his eyes, hat slightly askew. Luna's flag badges jingle with excitement. Cozy interior, playful morning-energy medium shot."}, {"text": "언덕 위 하얀 담장 집, 담장 가득\n보랏빛 라벤더가 흐드러지게 피었어요.\n향기가 파도처럼 밀려왔다 잦아들었죠.", "prompt": "A charming white-fenced cottage sits atop a gentle hill, its fence overflowing with blooming purple lavender swaying in the breeze. Bees drift lazily between the flower stalks. Reengki the quokka (wearing his pink felt hat) and Luna the white rabbit climb the path toward it. Wide pastoral shot, dreamy purple and green palette, soft sunlight."}, {"text": "“할머니는 영국에서 오셔서 영어만 쓰셔.”\n‘나, 영어 잘 못하는데….’\n똑, 똑, 똑— “Come in!”", "prompt": "Reengki the quokka (wearing his pink felt hat) stands nervously at the cottage door, paws fidgeting, while Luna the white rabbit knocks gently. A warm voice glows from within, suggested by golden light spilling through the door crack. Lavender blooms frame the doorway. Close-up on Reengki's anxious but curious face."}, {"text": "집 안엔 허브 화분과 세계 지도,\n김이 오르는 차와 갓 구운 쿠키가 있었어요.\n“You must be Reengki!” 흔들의자의 할머니.", "prompt": "Inside a snug cottage, an elderly rabbit grandmother with silvery-white fur sits in a rocking chair, greeting her guests warmly. Herb pots line the sunny window, a large world map covers one wall, and steaming tea with fresh-baked cookies waits on the table. Reengki the quokka (wearing his pink felt hat) bows politely at the door with Luna the white rabbit. Warm honey-toned interior, wide cozy shot."}, {"text": "이야기가 시작되자마자 할머니가 벌떡!\n“There was a big, scary Jaguar!!!”\n링키는 의자에서 미끄러질 뻔했어요.", "prompt": "The elderly rabbit grandmother springs up from her rocking chair mid-story, paws raised like claws and teeth playfully bared, acting out a jaguar's roar. Reengki the quokka (wearing his pink felt hat) nearly slides off his chair in startled surprise while Luna the white rabbit giggles behind her paws. Dynamic medium shot, theatrical lamplit warmth, humorous energy."}, {"text": "토끼가 재규어를 우리로 살살 유인해\n문을 꽝! 닫고 달아나는 흉내—\n“One!” ‘첫 번째 탈출이구나!’", "prompt": "The elderly rabbit grandmother holds up one finger triumphantly, mid-performance, having just mimed slamming a cage door shut and dashing away. Reengki the quokka (wearing his pink felt hat) leans forward with clenched excited fists, completely absorbed in the story. Cozy cottage interior with the world map behind. Medium shot, lively storytelling theater mood."}, {"text": "“The cave is falling!” 동굴 탈출 흉내에\n“Two!” 링키는 그만 웃음이 터졌어요.\n“아하하—!” 루나도 배를 잡고 웃었죠.", "prompt": "The rabbit grandmother dramatically clutches an imaginary collapsing cave ceiling with both paws, face comically panicked, then holds up two fingers. Reengki the quokka (wearing his pink felt hat) claps a paw over his mouth bursting into laughter while Luna the white rabbit doubles over holding her belly. Joyful close-up trio, warm cookie-scented cottage atmosphere."}, {"text": "마지막, 활처럼 휜 나뭇가지 연기.\n“The tree is falling!” 재규어가 손을 놓자\n가지가 슝—! 튕겨 올라갔어요.", "prompt": "The rabbit grandmother mimes gripping a long bent tree branch, then flinging her arms upward as it springs loose, her whole body stretching skyward in performance. Imaginative faint outlines of a jaguar and a small rabbit on a branch shimmer dreamily above her. Reengki the quokka (wearing his pink felt hat) watches with goosebumps of excitement. Dynamic theatrical medium shot."}, {"text": "“Rabbit flew up into the sky!!\nI'm going to the moon!!!”\n할머니가 두 팔을 하늘로 활짝 펼쳤어요.", "prompt": "The elderly rabbit grandmother stands with both arms flung triumphantly toward the ceiling, spinning slowly, silvery fur catching the window light, as if soaring to the moon herself. Reengki the quokka (wearing his pink felt hat) gapes in awe and Luna the white rabbit applauds with shining eyes. Low-angle medium shot, the moment glowing with wonder."}, {"text": "“토끼는 왜 달까지 날 수 있었을까?”\n“…Clever?” 할머니는 살며시 고개를 저었죠.\n그 답은 축제 날 알게 될 거래요.", "prompt": "The rabbit grandmother, seated again and calm, gently shakes her head at Reengki the quokka (wearing his pink felt hat), who taps his temple with one finger, puzzled by his own guess. Steam rises from the teacups between them; afternoon light softens the room. Close-up, thoughtful quiet ending mood with a hint of mystery."}]}, {"ep": 6, "title": "하늘을 향해 부르는 이름, Sky Bound!", "pages": [{"text": "드디어 축제 당일 아침이 밝았어요.\n달 장식은 나무마다 반짝, 색색의 천은\n바람에 살랑살랑 춤을 추었죠.", "prompt": "The village plaza on festival morning: golden moon ornaments sparkle on every tree and long colorful cloth streamers dance in the breeze. Rabbits of many colors gather for the final rehearsal. Reengki the quokka (wearing his pink felt hat) stands among them, eyes bright with anticipation. Wide festive establishing shot, bright spring light."}, {"text": "“First move — Moon Hop!” 폴짝.\n“Second — Star Leap!” 조금 더 높이.\n“Third — Sky Bound!” 하늘에 닿을 듯!", "prompt": "An elderly rabbit host with very long ears and a small bell at his neck leads the rehearsal from beneath the great tree, calling out moves. Rows of rabbits practice three jumps of increasing height, the tallest reaching toward the sky. Reengki the quokka (wearing his pink felt hat) hops along in the line. Dynamic wide shot, rhythmic joyful energy."}, {"text": "“동작 이름은 The Smiling Rabbit의\n세 번의 탈출에서 따온 거야.\nSky Bound는 달로 날아오른 그 도약!”", "prompt": "Luna the white rabbit whispers excitedly to Reengki the quokka (wearing his pink felt hat) at the edge of the rehearsal, her eyes sparkling as she gestures skyward. Above them, a faint dreamy image of the legendary rabbit soaring toward a smiling moon shimmers in the air. Medium shot, magical storytelling overlay, warm daylight."}, {"text": "“Sky Bound!” 링키가 힘껏 솟아오른 순간,\n공중에서 밤색 브라질 토끼와 눈이 딱!\n“Sky Bound!” 둘이 마주 외쳤어요.", "prompt": "Mid-air moment: Reengki the quokka (wearing his pink felt hat) and a chestnut-brown rabbit hang suspended at the top of their jumps, eyes locked, both grinning widely as they shout together. Their shadows stretch on the sunlit grass below. Freeze-frame dynamic shot capturing pure airborne joy, festival streamers in the background."}, {"text": "리허설 뒤엔 자기소개 시간이었어요.\n브라질 토끼는 온몸으로 신나게,\n일본 토끼는 작은 종이학을 살며시.", "prompt": "Rabbits from many countries sit in a friendly circle on the plaza grass. The chestnut-brown rabbit stands with arms flung wide in animated introduction, while a quiet cream-colored rabbit gently places a tiny folded paper crane before her. Chiki the mouse bounces happily. Reengki the quokka (wearing his pink felt hat) watches from the circle. Warm wide shot, multicultural charm."}, {"text": "“이제 네 차례야.” 심장이 쿵쾅쿵쾅!\n사실 루나가 제 차례를 살며시\n링키에게 넘긴 거였어요. ‘미안해.’", "prompt": "Luna the white rabbit shrinks shyly with both ears folded back apologetically, nudging Reengki the quokka (wearing his pink felt hat) with her elbow as the circle of rabbits looks toward them. Reengki's face shows a nervous gulp, paw over his pounding chest. Close-up on the two friends, soft afternoon light, tender nervous moment."}, {"text": "링키는 천천히 일어났어요.\n숨을 깊이 들이마시고 입을 열었죠.\n“My name is Reengki. I am a quokka.”", "prompt": "Reengki the quokka (wearing his pink felt hat) stands alone in the center of the seated circle of rabbits, paws clasped, speaking bravely though his voice trembles. Spring sunlight glints on the grass at his feet. Every rabbit's gaze rests warmly on him. Medium shot from slightly low angle, a small hero's courageous moment."}, {"text": "“I want to… sing. For everyone.”\n발음은 어설프고 목소리는 작았지만\n가슴이 뻥 뚫린 듯 후련했어요.", "prompt": "Reengki the quokka (wearing his pink felt hat) finishes his introduction with a shy but glowing smile, one paw over his heart. The chestnut-brown rabbit claps enthusiastically, the cream rabbit nods, Chiki the mouse leaps up, and in the distance the elderly rabbit grandmother slowly folds one ear in approval. Wide warm shot, quiet triumph and acceptance."}, {"text": "“마음이 담기면 말은 어떻게든 통하거든.”\n링키는 제 말을 가만히 되뇌었어요.\n‘I want to sing for everyone.’ 진짜 꿈을요.", "prompt": "Reengki the quokka (wearing his pink felt hat) sits back down beside Luna the white rabbit, gazing softly at the sky with a newfound clarity in his eyes. Luna whispers encouragement close to his ear, smiling. Golden late-afternoon light bathes the plaza circle. Close-up, reflective and heartwarming ending beat."}]}, {"ep": 7, "title": "달빛 아래 흐르는 노래", "pages": [{"text": "파티가 끝나고 광장은 고요해졌어요.\n등불 몇 개만 달빛 아래 가만가만.\n링키와 치키는 돌계단에 앉아 있었죠.", "prompt": "A quiet nighttime plaza after the party: a few unlit-corner lanterns sway gently under pale moonlight. Reengki the quokka (wearing his pink felt hat) and Chiki the tiny mouse sit side by side on stone steps, peaceful and sleepy. Long soft shadows stretch across the empty grass. Wide tranquil night shot, hushed blue-silver palette."}, {"text": "그때 가느다란 노랫소리가 흘러왔어요.\n루나가 나무 아래에서 두 눈을 감고\n달을 향해 노래하고 있었어요.", "prompt": "Luna the white rabbit stands alone beneath the great plaza tree, eyes softly closed, face lifted toward the nearly full moon as she hums a gentle song. Moonlight silvers her white fur. In the foreground, Reengki the quokka (wearing his pink felt hat) and Chiki the mouse listen quietly from the steps. Dreamy medium-wide shot, serene magical night."}, {"text": "“See ya, silly Jaguar, I'm going to the moon!\nSpinning up through starry skies,\nI'll be there very soon…”", "prompt": "Close-up of Luna the white rabbit singing under the tree, her breath visible in the cool night air, moonbeams falling around her like a soft spotlight. Faint sparkling notes seem to drift up toward the starry sky and the glowing moon. Enchanted, lyrical atmosphere, deep blue night with silver highlights."}, {"text": "링키도 가만히 눈을 감았어요.\nmoon, rabbit, sky… 몇 단어만 들렸지만\n치키의 얼굴도 더없이 평온했어요.", "prompt": "Reengki the quokka (wearing his pink felt hat) and Chiki the tiny mouse sit with eyes closed on the stone steps, faces calm and content as the melody washes over them. Moonlight pools gently on their small figures. Close-up two-shot, deeply peaceful listening moment, soft night breeze suggested by drifting leaves."}, {"text": "노래가 끝나고 루나가 다가왔어요.\n“멜로디 정말 예뻤어. 근데 brave가 뭐야?”\n“용감한이라는 뜻이야.” “Brave… 용감한.”", "prompt": "Luna the white rabbit walks over to the steps and crouches beside Reengki the quokka (wearing his pink felt hat), who repeats a new English word thoughtfully with a finger raised. Chiki the mouse dozes lightly beside them. The nearly full moon glows above the plaza tree. Warm intimate night close-up, gentle learning moment between friends."}, {"text": "“그 토끼는 그냥 도망갈 수도 있었는데\n꼭 소리쳐야 했대. ‘달에 갈 거야!’라고.”\n“왜?” “그건 내일 알게 될 거야.”", "prompt": "Luna the white rabbit gazes up at the moon with a knowing soft smile while Reengki the quokka (wearing his pink felt hat) tilts his head with a big curious question in his eyes. The moon peeks between thin silver clouds above them. Medium shot from behind the pair looking moonward, air of gentle mystery."}, {"text": "루나가 아주 작게 말했어요.\n“…사실 나, 사람들 앞에선 목소리가 안 나와.\n혼자 있을 때만 노래가 나오거든.”", "prompt": "Luna the white rabbit lowers her head shyly, ears drooping, confessing her secret in the moonlight, paws fidgeting together. Reengki the quokka (wearing his pink felt hat) turns to her with gentle surprised eyes. The quiet plaza and swaying lanterns blur softly behind them. Emotional close-up, vulnerable tender night moment."}, {"text": "“그래서 자기소개도 너한테 넘긴 거야.\n미안해.” 루나 목소리가 잔잔히 흔들렸어요.\n링키가 살포시 루나의 손을 잡았어요.", "prompt": "Reengki the quokka (wearing his pink felt hat) gently takes Luna the white rabbit's paw in both of his, looking at her with warm understanding eyes. Luna's eyes glisten faintly in the moonlight. Their small figures sit close together on the stone steps. Intimate close-up, comfort and friendship glowing against the deep blue night."}, {"text": "“괜찮아. 나도 처음 무대에선 그랬거든.”\n루나가 햇살처럼 환하게 웃었어요.\n“내일 축제 끝나고 할머니께 또 가자!”", "prompt": "Luna the white rabbit beams a bright sunny smile that seems to light up the night, resting a paw on the shoulder of Reengki the quokka (wearing his pink felt hat), who smiles back warmly. Chiki the mouse stirs sleepily beside them. Moonlight and lantern glow mingle around the trio. Heartwarming medium shot, hopeful night mood."}, {"text": "구름 사이로 달이 빼꼼— 거의 둥글었어요.\n“when you're brave enough to say:\nI'm going to the moon today!” 꼭 제 얘기 같았죠.", "prompt": "Reengki the quokka (wearing his pink felt hat) gazes up alone at the nearly full moon peeking through silver-edged clouds, lips moving silently as he repeats the song's words in his heart. The moon's light falls directly on his upturned face like a gentle promise. Low-angle close-up, quiet resolve and wonder, night sky full of soft stars."}]}, {"ep": 8, "title": "보름달이 부른 외침", "pages": [{"text": "마침내 보름달이 떠올랐어요.\n달 위엔 빙긋 웃는 듯한 그림자가—\n“저거야! The Smiling Rabbit이야.”", "prompt": "A flawless full moon rises huge and radiant over the village, the faint shadow of a smiling curled rabbit visible on its glowing face. Reengki the quokka (wearing his pink felt hat) and Luna the white rabbit point up at it in awe from the plaza. Stars stand back respectfully around the moon. Breathtaking wide night shot, silver and deep blue."}, {"text": "광장에 토끼들이 모두 모였어요.\n등불은 꺼지고, 달빛만이\n은빛 융단처럼 광장에 깔렸어요.", "prompt": "The entire plaza filled with rabbits of every color standing in silent formation, all lanterns extinguished. Pure moonlight spreads across the grass like a silver carpet. The elderly rabbit host walks slowly toward the great tree at the center, moonlight resting on his white back. Solemn wide establishing shot, hushed sacred atmosphere."}, {"text": "그때 할아버지 목소리 끝에서 콜록—\n잔기침이 새어 나왔어요.\n“다음 진행자는 나래. 근데 걱정이야….”", "prompt": "The elderly rabbit host coughs softly into his paw mid-call, his little neck bell trembling, waving reassuringly at worried onlookers. Nearby, Luna the white rabbit watches him with concerned drooping ears while whispering to Reengki the quokka (wearing his pink felt hat). Medium shot, gentle worry beneath the festive brightness."}, {"text": "그런데 그때— “콜록— 콜록콜록—”\n“오늘은… 신호를 못 외칠 것 같구나.\n누가… 대신 외쳐 주려무나….”", "prompt": "The elderly rabbit host doubles slightly with a dry cough, one trembling paw raised apologetically, his little neck bell drooping. Concerned rabbits stir in the moonlit crowd around him. Reengki the quokka (wearing his pink felt hat) watches anxiously from the formation. Medium shot, moonlight suddenly feeling heavy, worried hush."}, {"text": "“제가… 제가 할게요.”\n루나가 떨리는 목소리로 손을 들고\n광장 한가운데로 나아갔어요.", "prompt": "Luna the white rabbit raises her paw high, ears forced bravely upright despite her trembling, and walks alone toward the center of the moonlit plaza. Fragments of moonlight scatter on the grass with each step. Hundreds of rabbit eyes follow her. Wide dramatic shot, small brave figure under the vast full moon."}, {"text": "그런데 목소리가 나오지 않았어요.\n“…Moon…” 첫 음절이 힘없이 끊기고\n박자가 어긋나 형성이 흩어졌어요.", "prompt": "Luna the white rabbit stands frozen at the plaza center, ears quivering, her single broken syllable dissolving into the night air. Around her, rabbits jump at scattered mismatched moments — some too early, some standing still — their confused shadows crisscrossing the silver moonlit grass. Wide shot capturing the scattered rhythm, tense sympathetic mood."}, {"text": "루나의 눈가에 물기가 차올랐어요.\n링키 가슴에 할머니 말씀이 켜졌죠.\n폴짝, 폴짝— “루나, 우리 같이 외치자.”", "prompt": "Reengki the quokka (wearing his pink felt hat) hops determinedly across the moonlit grass to stand beside Luna the white rabbit, whose eyes shimmer with held-back tears. He looks at her with steady gentle courage as moonlight settles on both their shoulders. Close-up two-shot at the plaza center, a turning point glowing quietly."}, {"text": "“Everyone! Listen! Moon Hop—!”\n하지만 영어를 모르는 토끼도,\n신호가 안 보이는 토끼도 있었어요.", "prompt": "Reengki the quokka (wearing his pink felt hat) cups his paws around his mouth shouting toward the crowd, while some rabbits leap and others stand confused — a gray rabbit at the back and a white rabbit facing away remain still. Luna the white rabbit whispers to him worriedly. Wide shot showing the incomplete response across the moonlit formation."}, {"text": "그때 주머니가 따뜻해지고, 손목의\n분홍 리본이 살포시 닿았어요.\n‘하나, 둘, 셋… 나 혼자가 아니었지.’", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat): a soft golden warmth glows from his shoulder bag while Haemi's pink ribbon tied at his wrist catches the moonlight. His eyes light up with realization and quiet strength. Luna the white rabbit and Chiki the mouse stand near him. Intimate magical moment, warm glow against cool silver night."}, {"text": "루나는 귀 신호, 치키는 쿵— 쿵— 발 박자,\n링키는 “One! Two! Three! Sky Bound—!”\n모두가 한 박자에, 한 몸처럼 폴짝—!", "prompt": "The trio in action at the plaza center: Luna the white rabbit sweeps her ears forward in bold signal, Chiki the tiny mouse stomps a booming beat, and Reengki the quokka (wearing his pink felt hat) shouts with paws cupped at his mouth. All around them, every rabbit leaps skyward in perfect unison, moonlight rippling like silver water beneath their feet. Spectacular wide shot, triumphant unity under the full moon."}, {"text": "공중에서 링키가 외쳤어요.\n“I'm going to the moon!!!” 달이 환해지고—\n주머니 속엔 ‘L’ 구슬이 반짝이고 있었어요.", "prompt": "Reengki the quokka (wearing his pink felt hat) floats at the top of his highest leap, arms flung wide toward the enormous full moon whose rabbit shadow seems to smile brighter. Below afterwards, he cradles the open pouch where a new crystal bead glows with the letter 'L' beside the first bead, silver and gold light swirling inside it. Magical climactic shot, radiant and triumphant."}]}, {"ep": 9, "title": "등불 아래 나눈 약속", "pages": [{"text": "축제가 끝난 그날 밤,\n등불이 동그랗게 내걸리고 주황빛이\n잔디 위로 따뜻하게 번졌어요.", "prompt": "The plaza at night after the festival: small round lanterns hang in a warm circle, their orange glow spreading softly over the grass and mingling with rising steam from soup bowls. Rabbits gather cozily on blankets. Reengki the quokka (wearing his pink felt hat) sits among them as the guest of honor. Wide warm night shot, golden lantern palette."}, {"text": "갓 구운 빵과 달콤한 당근 수프.\n오늘은 링키에게 고마움을 전하는 자리—\n내일이면 링키가 떠나는 날이거든요.", "prompt": "Luna the white rabbit hands a steaming bowl of sweet carrot soup to Reengki the quokka (wearing his pink felt hat), fresh bread piled nearby. Around them rabbits share food happily under the lantern light. A gentle bittersweet warmth colors the gathering. Medium shot, cozy feast textures, orange glow on friendly faces."}, {"text": "치키는 링키를 따라 빵을 한 입, 또 한 입.\n브라질 토끼가 주먹을 쑥— “Sky Bound!”\n“Sky Bound!” 마주 대고 까르르 웃었죠.", "prompt": "Chiki t
