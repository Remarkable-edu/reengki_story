ayon-written wobbly letter decorated with hearts. The paws of the three friends frame the box from above. Warm glowing light on the contents, touching reveal mood."}, {"text": "“오르골 소리가 자꾸 느려져서…\n몰래 고쳐 드리려고 했는데,\n뚜껑을 열다 그만 망가뜨렸어…”", "prompt": "Kongi the tiny maltese puppy confesses with drooping ears, drawing circles on the floor with one paw, tears rolling down his fluffy cheeks. A small thought bubble shows him struggling to open the music box alone at night. Reengki the quokka (wearing his pink felt hat) and Bori listen, faces melting with sympathy. Close-up, honest emotional mood."}, {"text": "보리가 콩이를 꼭 안아 줬어요.\n“오해해서 미안해.”\n“나도 말 안 해서 미안해, 형아.”", "prompt": "Bori the maltese puppy embraces his tiny brother Kongi in a warm fluffy hug, both with closed eyes and tear-streaked but relieved faces. Reengki the quokka (wearing his pink felt hat) wraps his arms around them both. Soft hearts glow around the hug. Close-up, heartwarming reconciliation, golden lamplight."}, {"text": "“그럼 이제 셋이서 고쳐 보자!”\n링키가 새 톱니를 들어 올리자\n반짝— 빛이 났어요.", "prompt": "Reengki the quokka (wearing his pink felt hat) holds the tiny brass gear up to the lamplight where it gleams with a bright sparkle, while Bori and Kongi gather around the open music box on the desk with determined smiles. Tools laid out neatly. Medium shot, teamwork energy, warm focused light."}, {"text": "링키의 가느다란 손가락이\n톱니를 살짝, 딸깍!\n“됐다! 들어갔어!”", "prompt": "Extreme close-up of Reengki the quokka's small nimble fingers carefully placing the tiny gear into the music box mechanism, tongue sticking out in concentration, his pink felt hat slightly tilted. Bori and Kongi hold their breath on either side, paws clasped. Suspenseful precise moment, warm desk lamp light."}, {"text": "태엽을 감자 딸랑딸랑—\n포근한 자장가가 다시\n흘러나왔어요! “만세—!”", "prompt": "The music box glows and plays again, golden musical notes swirling up in a spiral. Reengki the quokka (wearing his pink felt hat), Bori and Kongi throw their paws in the air cheering, faces radiant with joy. Wide shot of the bedroom filled with warm magical light, triumphant celebration."}, {"text": "은은한 멜로디가 할머니 방까지\n닿자, 할머니가 살며시 웃었어요.\n이제 노래잔치가 코앞이랍니다!", "prompt": "The grandmother maltese lies in bed with a peaceful smile as faint golden musical notes drift through her doorway and settle around her pillow like fireflies. Moonlight through lace curtains. In the hallway beyond, the three friends peek in happily. Tender quiet night scene, medium shot, hopeful closing mood."}]}, {"ep": 9, "title": "가족 노래잔치", "pages": [{"text": "드디어 가족 노래잔치 날!\n광장은 꽃과 리본으로\n반짝반짝 눈부셨어요.", "prompt": "Festive village plaza decorated with flower garlands, white ribbons and heart-shaped bunting, a small wooden stage at the center. Maltese families stream in carrying picnic baskets. Reengki the quokka (wearing his pink felt hat) and Bori peek at the stage from the crowd. Wide establishing shot, bright celebratory morning light."}, {"text": "기운을 차린 몽실 할머니도\n포근한 목도리를 두르고\n맨 앞줄에 앉았답니다.", "prompt": "The grandmother maltese, recovered and wrapped in a cozy knitted scarf, is helped to a front-row bench by the mother and father maltese, her face glowing with anticipation. Kongi bounces beside her holding the music box. Festival decorations flutter behind. Medium shot, warm loving family mood."}, {"text": "무대 뒤에서 보리는\n다리가 후들후들 떨렸어요.\n“으으, 심장이 콩닥콩닥해…”", "prompt": "Backstage behind a curtain, Bori the maltese puppy trembles with wobbly knees, paws pressed to his chest, a visualized pounding heart above him. Reengki the quokka (wearing his pink felt hat) peeks through the curtain gap at the big crowd. Close-up, nervous jittery but cute mood, stage light seeping through."}, {"text": "링키가 보리의 손을 꼭 잡았어요.\n“할머니 말씀 기억하지?\n사랑받는 마음으로!”", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat) firmly holding Bori's trembling paws, looking into his eyes with a steady encouraging smile. A faint glowing heart floats between them. Backstage shadows around, one beam of warm stage light on their faces. Emotional pep-talk moment."}, {"text": "막이 오르고, 보리의 첫 음은\n바르르 떨렸어요.\n객석이 조용해졌죠.", "prompt": "On the flower-decorated stage, Bori the maltese puppy stands stiffly at the front singing a thin wavering note, visualized as a small shaky musical line. Reengki the quokka (wearing his pink felt hat) stands supportively beside him. The hushed audience of maltese families watches. Wide stage shot, tense quiet moment under warm stage lights."}, {"text": "그때 딸랑딸랑— 콩이가 객석에서\n오르골을 높이 들어 올렸어요.\n할머니가 두 손을 흔들었죠.", "prompt": "In the front row, tiny Kongi stands on the bench holding the glowing music box high above his head, golden notes rising, while the grandmother maltese waves both paws warmly toward the stage. The parents cheer beside them. Medium shot from the stage's viewpoint, heart-melting support mood."}, {"text": "사랑받던 순간들이 몽글몽글\n떠오르자, 보리의 목소리가\n점점 따뜻해졌어요.", "prompt": "Bori the maltese puppy sings with eyes gently closed and a blissful expression as dreamy round memory bubbles float around him showing the grandmother's hug, the family dinner, and singing in the rain. His voice appears as warm golden notes growing bigger. Close-up, magical emotional transformation, soft glowing light."}, {"text": "링키의 화음이 포개지고,\n어느새 온 마을이 함께\n자장가를 불렀답니다.", "prompt": "Wide shot of the whole plaza singing together: Reengki the quokka (wearing his pink felt hat) and Bori harmonize center stage while every maltese in the audience sways and sings, a sea of warm musical notes swirling above the crowd into the sunset sky. Grand heartwarming chorus scene, golden hour light."}, {"text": "노래가 끝나자 할머니의 볼에\n눈물이 또르르. “우리 보리,\n우리 링키, 정말 고맙구나.”", "prompt": "The grandmother maltese dabs happy tears with her scarf, beaming with pride, as the audience erupts in applause with flower petals tossed into the air. On stage, Bori and Reengki the quokka (wearing his pink felt hat) bow while holding hands. Medium shot focused on the grandmother, joyful tearful triumph."}, {"text": "그날 밤, 보리가 링키에게\n속삭였어요. “너에게 줄 게 있어.\n언덕으로 올라올래?”", "prompt": "Under festival lanterns being taken down at night, Bori the maltese puppy whispers to Reengki the quokka (wearing his pink felt hat) and points toward a moonlit hill path, a secretive smile on his face. Stars begin to twinkle above the quiet plaza. Medium shot, intriguing gentle night mood."}]}, {"ep": 10, "title": "사랑의 브이(V)", "pages": [{"text": "언덕 위엔 별이 쏟아질 듯\n반짝이고 있었어요.\n보리네 가족도 모두 모였죠.", "prompt": "Hilltop scene under a sky full of brilliant stars, the white village twinkling below. The whole maltese family stands together in a half circle around Reengki the quokka (wearing his pink felt hat), lanterns glowing softly in their paws. Wide shot, magical starry night atmosphere."}, {"text": "보리가 작은 주머니에서\n무언가를 꺼냈어요.\n하얗게 빛나는 구슬, V!", "prompt": "Close-up of Bori the maltese puppy opening a small velvet pouch, revealing a glowing white alphabet bead marked with the letter V that lights up both their faces. Reengki the quokka (wearing his pink felt hat) gasps with sparkling eyes. Radiant white-gold glow against the night, wonder-filled moment."}, {"text": "“V는 우리 가족 사랑의 브이!\n이제 너는 우리의\n진짜 가족이자 친구야.”", "prompt": "Bori the maltese puppy places the glowing V bead into Reengki the quokka's open hands (Reengki wearing his pink felt hat), both making a playful V sign with their other paws. The family smiles warmly around them, hearts glowing faintly in the air. Medium shot, tender gift-giving moment under starlight."}, {"text": "가방 속 구슬 네 개가 나란히\n반짝였어요. I, L, O, V!\n“사랑에 점점 가까워지고 있어!”", "prompt": "Close-up of Reengki the quokka's open satchel where four glowing beads marked I, L, O and V line up and sparkle together like tiny stars. Reengki (wearing his pink felt hat) beams down at them, his face lit by their glow. Bori peeks in beside him. Magical glowing detail shot, night setting."}, {"text": "엄마 솜이는 폭신한 목도리를,\n콩이는 꼬깃꼬깃 그림 편지를\n링키의 손에 쥐여 주었어요.", "prompt": "The mother maltese wraps a soft hand-knitted scarf around the neck of Reengki the quokka (wearing his pink felt hat) while tiny Kongi shyly hands him a crumpled crayon drawing of the whole family. The father maltese packs snacks into Reengki's satchel. Warm farewell gift scene, lantern light, medium shot."}, {"text": "몽실 할머니가 링키를 안아 주며\n말했어요. “사랑받은 마음을\n어디서든 잊지 말거라.”", "prompt": "The grandmother maltese in her knitted shawl embraces Reengki the quokka (wearing his pink felt hat) gently, whispering her farewell wisdom, both with closed peaceful eyes. Soft hearts and starlight glow around them. The family watches tenderly. Close-up, deeply warm blessing moment."}, {"text": "“흑… 링키 형아, 또 놀러 와…”\n콩이가 훌쩍이자 모두\n한꺼번에 부둥켜안았답니다.", "prompt": "A big family group hug on the starry hilltop: tiny Kongi sniffling with teary eyes in the middle, Bori, the parents and grandmother all wrapping around Reengki the quokka (wearing his pink felt hat and new scarf). Lanterns glow at their feet. Wide shot, bittersweet loving farewell."}, {"text": "다음 날 아침, 링키가 자전거를 타고\n슝— 출발했어요. 뒤에서 모두 외쳤죠.\n“I love you, 링키—!”", "prompt": "Morning departure scene: Reengki the quokka (wearing his pink felt hat and knitted scarf) pedals his bicycle down the hill road waving back, while the maltese family stands at the village gate waving paws high, hearts floating in the air behind him. The white village glows in morning sun. Wide shot, joyful heartfelt send-off."}, {"text": "“다음 구슬은 E!\n남쪽 바다 얼음 마을에\npenguin 친구들이 산대!”", "prompt": "Reengki the quokka (wearing his pink felt hat and scarf) rides along a coastal road, gazing at the far horizon where the sea sparkles and a faint icy blue landmass floats in the distance. A dreamy thought bubble shows silhouettes of penguins on ice. Fresh sea breeze, gulls in the sky, wide adventurous shot."}, {"text": "네 개의 구슬이 반짝이는 가방을 메고\n링키는 힘차게 페달을 밟았어요.\n펭귄 마을에선 어떤 일이 기다릴까요?", "prompt": "Wide shot from behind of Reengki the quokka (wearing his pink felt hat and knitted scarf) pedaling energetically along a winding road toward the bright southern horizon, his satchel glowing softly with four beads. Rolling hills give way to a distant sparkling sea. Big open sky, hopeful adventurous mood, morning light."}]}]}, "5": {"chapter": 5, "animal": "펭귄", "animal_en": "penguin", "letter": "E", "village": "하모니 빙하 마을", "episodes": [{"ep": 1, "title": "미끄럼 인사", "pages": [{"text": "링키의 주머니에서 구슬 네 개가\n반짝반짝 빛났어요.\nI, L, O, V — 벌써 네 개나 모았죠!", "prompt": "Wide shot of Reengki the quokka (wearing his pink felt hat) standing on the deck of a small wooden boat, holding open a tiny pouch. Four glowing alphabet beads shaped like I, L, O and V sparkle inside the pouch. Cool blue sea and floating ice chunks stretch to the horizon under a bright clear sky. Cheerful, hopeful morning mood."}, {"text": "배가 남쪽 바다로 나아가자\n바람이 시원하게 불어왔어요.\n“우와, 얼음이 둥둥 떠 있어!”", "prompt": "Wide shot of the little wooden boat sailing across a sparkling turquoise southern sea dotted with drifting white ice floes. Reengki the quokka (wearing his pink felt hat) leans over the bow with wide excited eyes, his fur ruffled by the cool wind. Sunlight glitters on the waves. Fresh, adventurous atmosphere."}, {"text": "저 멀리 하얀 얼음 마을이 보였어요.\n지붕마다 눈이 소복소복,\n바로 하모니 빙하 마을이에요.", "prompt": "Wide establishing shot of a cozy ice village built on a glacier by the sea, with round igloo houses topped with fluffy snow and little ice lanterns along the paths. The small boat with Reengki the quokka (wearing his pink felt hat) approaches the icy shore in the foreground. Soft blue and white palette with warm golden lantern lights. Magical, inviting mood."}, {"text": "링키가 얼음 위에 폴짝 내리자마자\n주르륵— 미끄러졌어요!\n“으아아, 멈출 수가 없어!”", "prompt": "Dynamic wide shot of Reengki the quokka (wearing his pink felt hat) sliding uncontrollably across smooth blue ice right after hopping off the boat, arms windmilling and mouth open in surprise. Motion lines and tiny ice sparkles trail behind him. The igloo village blurs in the background. Playful, comedic energy."}, {"text": "그때 꼬마 펭귄도 배로 미끄러져\n슝— 마주 달려오고 있었어요.\n둘은 폭신한 눈더미에 퐁당!", "prompt": "Action shot of a small penguin belly-sliding fast toward Reengki the quokka (wearing his pink felt hat) who is sliding from the opposite direction, both about to tumble into a big fluffy snowdrift. Snow puffs burst around them. Wide angle capturing both sliders on the glossy ice path. Funny, lighthearted moment."}, {"text": "눈더미에서 고개를 쏙 내민 펭귄이\n배시시 웃으며 말했어요.\n“안녕! 난 페페야. Hello!”", "prompt": "Close-up of a cute small penguin named Pepe popping his head out of a fluffy snowdrift, snow dusting his head like a little hat, smiling shyly and warmly. Reengki the quokka (wearing his pink felt hat) pops out beside him, both covered in snowflakes. Soft afternoon light, sweet friendly mood."}, {"text": "“Hello! 난 링키야.”\n링키도 눈을 털며 인사했죠.\n둘은 마주 보며 까르르 웃었어요.", "prompt": "Medium shot of Reengki the quokka (wearing his pink felt hat) and Pepe the penguin standing face to face in the snow, shaking off snowflakes and laughing together with eyes closed in joy. Snow sparkles float around them. The icy village glows softly behind. Warm first-friendship atmosphere."}, {"text": "페페는 링키의 손을 잡고\n마을 길을 아장아장 안내했어요.\n얼음 등불이 반짝반짝 빛났죠.", "prompt": "Wide shot of Pepe the penguin waddling ahead while holding the hand of Reengki the quokka (wearing his pink felt hat), leading him along a snowy village path lined with glowing ice lanterns. Igloo houses with round windows emit warm light. Dusk sky in soft lavender and blue. Cozy, welcoming mood."}, {"text": "그런데 마을 어디선가\n아름다운 노랫소리가 들려왔어요.\n라— 라— 파도처럼 부드럽게요.", "prompt": "Medium wide shot of Reengki the quokka (wearing his pink felt hat) and Pepe the penguin pausing on the snowy path, both tilting their heads and listening with curious expressions. Gentle musical notes drift visually through the air from a big ice dome in the distance. Twilight glow, dreamy and curious atmosphere."}, {"text": "“저 노래는 누가 부르는 걸까?”\n링키의 가슴이 콩닥콩닥 뛰었어요.\n노랫소리는 점점 가까워졌답니다.", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat) with sparkling curious eyes and a hand on his chest, listening toward a glowing ice dome ahead. Pepe the penguin tugs his arm excitedly, pointing forward. Musical notes shimmer in the twilight air. Anticipation and wonder fill the scene."}]}, {"ep": 2, "title": "파도 합창단", "pages": [{"text": "노랫소리를 따라가 보니\n커다란 얼음 돔이 나타났어요.\n안은 노래로 가득했답니다.", "prompt": "Wide shot of a grand translucent ice dome concert hall glowing from within, as Reengki the quokka (wearing his pink felt hat) and Pepe the penguin peek through its tall arched entrance. Warm golden light spills onto the snow outside. Musical notes seem to shimmer in the air. Majestic yet cozy mood."}, {"text": "펭귄들이 줄지어 서서\n입을 모아 노래하고 있었어요.\n바로 파도 합창단이에요!", "prompt": "Wide interior shot of the ice dome where a choir of penguins stands in neat rows on ice-block risers, beaks open in unified song. Reengki the quokka (wearing his pink felt hat) watches in awe from the doorway with Pepe the penguin. Soft blue ice walls reflect warm stage light. Harmonious, uplifting atmosphere."}, {"text": "맨 앞에는 하얀 목도리를 두른\n벨라 할머니가 서 있었어요.\n지휘봉이 살랑살랑 춤을 췄죠.", "prompt": "Medium shot of an elderly penguin conductor named Bella wearing a soft white scarf, standing on a small ice podium and gracefully waving a slender icicle baton. Her eyes are kind and focused. Rows of singing penguins blur softly behind her. Elegant, gentle lighting from ice chandeliers."}, {"text": "“어서 오렴, 멀리서 온 친구야.”\n벨라 할머니가 방긋 웃었어요.\n“우리는 얼음빛 축제를 준비한단다.”", "prompt": "Medium shot of Bella the elderly penguin conductor smiling warmly down at Reengki the quokka (wearing his pink felt hat), who looks up with bright curious eyes inside the ice dome. Pepe the penguin stands beside them proudly introducing his friend. Warm welcoming glow, gentle mood."}, {"text": "얼음빛 축제는 일 년에 한 번,\n남쪽 하늘빛이 춤추는 밤에\n다 함께 노래하는 축제래요.", "prompt": "Dreamy imagination scene showing the ice village at night under swirling green and violet aurora lights, with penguins gathered on a glowing ice stage singing toward the sky. Rendered as a soft vision above the heads of Reengki the quokka (wearing his pink felt hat) and Pepe the penguin. Magical, wondrous atmosphere."}, {"text": "“링키도 함께 노래할래?”\n페페가 눈을 반짝이며 물었어요.\n“정말? 나도 노래 진짜 좋아해!”", "prompt": "Close-up of Pepe the penguin looking up at Reengki the quokka (wearing his pink felt hat) with sparkling hopeful eyes, flippers clasped together. Reengki beams with excitement, paws raised happily. The choir watches kindly in the soft-lit background. Joyful, inviting moment."}, {"text": "쌍둥이 펭귄 삐삐와 뽀뽀도\n뒤뚱뒤뚱 달려와 인사했어요.\n“난 삐삐!” “난 뽀뽀!”", "prompt": "Medium shot of twin penguins Pipi and Popo waddling over quickly, each raising one flipper in greeting at the same time in mirror poses. Reengki the quokka (wearing his pink felt hat) laughs while shaking both flippers at once. Inside the bright ice dome. Bouncy, comedic energy."}, {"text": "합창단이 노래를 시작하자\n얼음 벽이 웅— 웅— 울렸어요.\n소리가 파도처럼 퍼져 나갔죠.", "prompt": "Wide shot of the penguin choir singing together inside the ice dome, visible sound waves rippling gently along the translucent blue ice walls like glowing water rings. Reengki the quokka (wearing his pink felt hat) listens with amazed wide eyes. Ethereal blue light, awe-inspiring mood."}, {"text": "“함께 부르면 소리가 커져서\n바다 건너까지 들린단다.”\n벨라 할머니가 말했어요.", "prompt": "Medium shot of Bella the elderly penguin conductor gently explaining to Reengki the quokka (wearing his pink felt hat), one flipper pointing toward the sea visible through the dome's arched window where sound ripples travel over the water. Attentive, gentle teaching moment with soft evening light."}, {"text": "링키는 가슴이 두근두근했어요.\n‘나도 저렇게 부를 수 있을까?’\n내일부터 연습이 시작된답니다!", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat) gazing at the singing choir with hopeful, slightly nervous eyes, paws pressed to his chest. Warm stage light glows on his face inside the blue ice dome. Anticipation and dreamy determination fill the scene."}]}, {"ep": 3, "title": "링키의 큰 목소리", "pages": [{"text": "다음 날 아침, 얼음 돔에서\n첫 연습이 시작됐어요.\n링키는 맨 앞줄에 섰답니다.", "prompt": "Wide morning shot inside the ice dome, penguins lining up on ice risers for rehearsal as sunlight streams through the translucent ceiling. Reengki the quokka (wearing his pink felt hat) stands proudly in the front row between Pepe the penguin and the twins. Fresh, energetic morning mood."}, {"text": "“도— 레— 미—”\n펭귄들이 목을 풀기 시작했어요.\n링키도 따라 했죠. “도— 레— 미—”", "prompt": "Medium shot of the penguin choir doing vocal warm-ups with beaks open in round shapes, and Reengki the quokka (wearing his pink felt hat) imitating them with his mouth wide open, cheeks puffed earnestly. Little musical notes float above each singer. Cute, diligent practice atmosphere."}, {"text": "노래가 시작되자 링키는\n신이 나서 목청껏 불렀어요.\n“라라라라—!!”", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat) singing at full volume with eyes squeezed shut and arms spread wide, oversized musical notes bursting from his mouth. Nearby penguins lean away slightly with startled expressions. Comedic, energetic scene inside the ice dome."}, {"text": "그런데 이런, 링키 목소리만\n혼자 뿅 튀어나왔지 뭐예요.\n화음이 흔들흔들 무너졌어요.", "prompt": "Wide shot of the choir mid-song where visible sound waves from the penguins flow smoothly like gentle ripples, but one big jagged wave bursts from Reengki the quokka (wearing his pink felt hat), breaking the pattern. Penguins wince softly, twins covering their ears. Gently humorous, no one angry."}, {"text": "“앗, 미안해…….”\n링키의 볼이 발그레해졌어요.\n귀가 축 처졌답니다.", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat) blushing with rosy cheeks, ears drooping, looking down shyly at his feet on the ice floor. Pepe the penguin pats his arm comfortingly. Soft sympathetic lighting, tender embarrassed moment."}, {"text": "벨라 할머니가 다가와\n부드럽게 말했어요.\n“노래는 혼자 달리기가 아니란다.”", "prompt": "Medium shot of Bella the elderly penguin conductor kneeling gently in front of Reengki the quokka (wearing his pink felt hat), one flipper on his shoulder, speaking kindly with warm wise eyes. The choir watches with friendly faces in the background. Gentle mentoring atmosphere."}, {"text": "“옆 친구의 소리를 들어 보렴.\n귀를 열면 마음도 열린단다.”\n링키는 고개를 끄덕였어요.", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat) nodding seriously with a hand cupped behind his ear, listening intently. Bella the elderly penguin smiles encouragingly beside him. Soft blue dome light, thoughtful and warm mood."}, {"text": "이번엔 페페의 소리에\n살며시 귀를 기울였어요.\n작지만 고운 소리였죠.", "prompt": "Medium shot of Reengki the quokka (wearing his pink felt hat) leaning slightly toward Pepe the penguin as they sing side by side, eyes gently closed in concentration. A thin delicate golden sound wave flows from Pepe and Reengki's softer wave curves to match it. Tender, focused moment."}, {"text": "링키의 소리가 페페의 소리와\n포개지자, 어라?\n노래가 두 배로 예뻐졌어요!", "prompt": "Medium shot of Reengki the quokka (wearing his pink felt hat) and Pepe the penguin singing together, their two sound waves intertwining into one shimmering braided ribbon of light rising upward. Both look surprised and delighted. Choir members smile around them. Sparkling, joyful harmony scene."}, {"text": "“함께 부르니 정말 신기해!”\n하지만 연습은 이제 시작.\n내일은 어떤 일이 기다릴까요?", "prompt": "Wide shot of the whole choir with Reengki the quokka (wearing his pink felt hat) in the middle, all glowing with happy energy after rehearsal inside the ice dome, late golden light through the icy ceiling. Reengki jumps with joy. Warm accomplished mood with a hint of anticipation."}]}, {"ep": 4, "title": "페페의 작은 목소리", "pages": [{"text": "그날 저녁, 페페가 혼자\n바닷가 바위에 앉아 있었어요.\n어깨가 축 처져 있었죠.", "prompt": "Wide evening shot of Pepe the penguin sitting alone on a smooth ice rock by the calm dark-blue sea, small shoulders drooping, looking down at his reflection in the water. Pale pink and violet sunset sky. Quiet, melancholic but gentle mood. Reengki the quokka (wearing his pink felt hat) approaches from the distance."}, {"text": "“페페야, 무슨 일 있어?”\n링키가 살그머니 옆에 앉았어요.\n파도가 찰랑찰랑 발을 간질였죠.", "prompt": "Medium shot of Reengki the quokka (wearing his pink felt hat) sitting down softly next to Pepe the penguin on the ice rock, leaning in with a caring expression. Gentle waves lap near their feet, catching the sunset light. Intimate, comforting atmosphere."}, {"text": "“내 목소리는 너무 작아서\n축제 때 아무도 못 들을 거야…….”\n페페의 눈에 눈물이 그렁그렁.", "prompt": "Close-up of Pepe the penguin with big glistening teary eyes, flippers fidgeting together, confessing his worry. Reengki the quokka (wearing his pink felt hat) listens closely with soft sympathetic eyes. Warm sunset glow on their faces, tender emotional moment."}, {"text": "링키는 조개껍데기 하나를\n주워서 귀에 대 보았어요.\n쏴아— 바다 소리가 들렸죠.", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat) holding a pretty spiral seashell up to his ear with a lightbulb-moment expression, eyes widening with an idea. Pepe the penguin watches curiously. Sunset beach with soft ice glitter, hopeful shift in mood."}, {"text": "“봐! 작은 조개도 이렇게\n큰 바다 소리를 담잖아.\n네 목소리도 분명 그럴 거야!”", "prompt": "Medium shot of Reengki the quokka (wearing his pink felt hat) holding the seashell to Pepe the penguin's ear, gesturing excitedly toward the wide ocean. Pepe's face begins to brighten with wonder. Visible gentle wave-sound swirls from the shell. Encouraging, uplifting moment at sunset."}, {"text": "둘은 얼음 동굴을 찾아가\n소리 연습을 하기로 했어요.\n동굴은 울림이 좋거든요!", "prompt": "Wide shot of Reengki the quokka (wearing his pink felt hat) and Pepe the penguin walking together toward a beautiful blue ice cave entrance glowing in the twilight, footprints trailing in the snow behind them. Adventurous and cozy companionship mood."}, {"text": "“야호—!” 링키가 외치자\n동굴이 야호— 야호— 대답했어요.\n페페가 까르르 웃었죠.", "prompt": "Wide interior shot of a sparkling blue ice cave where Reengki the quokka (wearing his pink felt hat) shouts with hands cupped around his mouth, visible echo rings bouncing off the crystal walls. Pepe the penguin laughs with delight, flippers on his belly. Playful, magical echo scene."}, {"text": "“이번엔 페페 차례야!”\n페페가 조그맣게 “라—” 하자\n동굴이 라— 라— 크게 울렸어요.", "prompt": "Medium shot of Pepe the penguin singing a small timid note that transforms into large glowing echo rings filling the ice cave, his eyes going wide with amazed joy. Reengki the quokka (wearing his pink felt hat) claps enthusiastically beside him. Sparkling reverberating light, triumphant sweet moment."}, {"text": "“들었지? 네 소리 정말 곱다!”\n페페의 가슴이 뿌듯뿌듯.\n“고마워, 링키. Thank you!”", "prompt": "Close-up of Pepe the penguin beaming with newfound confidence, cheeks rosy, standing tall with flippers on hips inside the glowing ice cave. Reengki the quokka (wearing his pink felt hat) gives him a warm thumbs-up. Proud, heartwarming friendship moment."}, {"text": "매일 밤 동굴에는\n두 친구의 노래가 울렸어요.\n그런데 쌍둥이는 왜 시무룩할까요?", "prompt": "Wide night shot of the ice cave glowing warmly from inside like a lantern, silhouettes of Reengki the quokka (wearing his pink felt hat) and Pepe the penguin singing together, musical notes drifting from the entrance into the starry sky. In the far corner, twin penguins Pipi and Popo peek in with pouting sulky faces. Curious cliffhanger mood."}]}, {"ep": 5, "title": "삐삐와 뽀뽀의 얼음 배", "pages": [{"text": "다음 날, 삐삐와 뽀뽀가\n볼을 잔뜩 부풀리고 있었어요.\n“내 파트가 더 중요해!” “아니야, 내 거야!”", "prompt": "Medium shot of twin penguins Pipi and Popo standing back to back with puffed cheeks and crossed flippers, arguing on the snowy village square. Little steam puffs of frustration rise above their heads. Reengki the quokka (wearing his pink felt hat) and Pepe the penguin watch with concerned faces nearby. Comedic sibling-squabble energy."}, {"text": "둘은 축제의 이중창 파트를\n서로 하겠다고 다퉜던 거예요.\n연습도 뚝 멈춰 버렸죠.", "prompt": "Wide shot of the rehearsal in the ice dome paused awkwardly, twins Pipi and Popo standing at opposite ends of the stage facing away from each other. Bella the elderly penguin conductor sighs gently with lowered baton. Other penguins exchange worried glances. Soft tense but child-friendly mood."}, {"text": "벨라 할머니가 빙긋 웃으며\n두 친구에게 심부름을 시켰어요.\n“건너 섬에서 은빛 방울꽃을 따 오렴.”", "prompt": "Medium shot of Bella the elderly penguin conductor smiling knowingly while pointing her icicle baton toward a small island across the water, giving the pouting twins Pipi and Popo a task. Reengki the quokka (wearing his pink felt hat) raises his hand eagerly to join. Warm scheming-grandma mood."}, {"text": "링키와 페페도 함께\n작은 얼음 배에 올랐어요.\n노는 딱 두 개뿐이었죠.", "prompt": "Wide shot of a small rounded ice boat at the shore with Reengki the quokka (wearing his pink felt hat), Pepe the penguin and the twin penguins climbing aboard. Exactly two oars rest inside the boat. Bright cool daylight over calm turquoise water. Adventure-starting mood."}, {"text": "삐삐가 왼쪽만 저으면 빙글—\n뽀뽀가 오른쪽만 저으면 빙글—\n배가 뱅글뱅글 돌기만 했어요!", "prompt": "Bird's-eye view of the little ice boat spinning in circles on the water, spiral wake trailing behind, as twin penguins Pipi and Popo each paddle only their own side stubbornly. Reengki the quokka (wearing his pink felt hat) and Pepe the penguin hold on dizzily with swirly eyes. Silly, dizzy comedy."}, {"text": "“우리 눈이 핑핑 돌아…….”\n링키가 말했어요.\n“같이 저어야 앞으로 가!”", "prompt": "Medium shot inside the spinning boat, Reengki the quokka (wearing his pink felt hat) holding his dizzy head with swirls in his eyes while gently telling the twins to row together. Pipi and Popo pause, looking at each other sheepishly. Calm water sparkles around. Gentle turning-point moment."}, {"text": "“하나, 둘! One, two!”\n둘이 박자를 맞춰 젓자\n배가 슝— 미끄러져 나갔어요!", "prompt": "Dynamic side shot of the ice boat gliding fast and straight across sparkling water, twin penguins Pipi and Popo rowing in perfect sync with determined smiles, splashes flying rhythmically. Reengki the quokka (wearing his pink felt hat) and Pepe the penguin cheer at the bow. Exhilarating teamwork energy."}, {"text": "섬에는 은빛 방울꽃이\n딸랑딸랑 흔들리고 있었어요.\n네 친구는 사이좋게 꽃을 땄죠.", "prompt": "Wide shot of a small snowy island covered with silvery bellflowers that shimmer and sway, tiny sparkles ringing off them. Reengki the quokka (wearing his pink felt hat), Pepe the penguin and the twins gently pick flowers together, smiling. Bright serene daylight, peaceful cooperative mood."}, {"text": "“둘이 함께하니 배도 빠르고\n꽃도 금방 모았네!”\n삐삐와 뽀뽀가 마주 보고 웃었어요.", "prompt": "Close-up of twin penguins Pipi and Popo facing each other with armfuls of silver bellflowers, breaking into warm reconciled smiles, foreheads almost touching. Reengki the quokka (wearing his pink felt hat) and Pepe the penguin beam in the soft-focus background. Heartwarming reconciliation glow."}, {"text": "돌아오는 뱃길, 노랫소리가\n물결 위로 퍼져 나갔어요.\n그런데 저 하늘, 구름이 심상치 않네요?", "prompt": "Wide shot of the ice boat returning home across golden late-afternoon water, all four friends singing together with musical notes floating over the waves. On the far horizon, thick grey snow clouds gather ominously but softly. Beautiful yet subtly foreboding transition mood."}]}, {"ep": 6, "title": "눈보라가 몰려와요", "pages": [{"text": "축제를 이틀 앞둔 날,\n하늘이 잿빛으로 변했고,\n바람이 씽씽 울기 시작했어요.", "prompt": "Wide shot of the ice village under a heavy grey sky, snowflakes starting to whirl and lanterns swinging in the rising wind. Penguins hurry along the paths carrying supplies. Reengki the quokka (wearing his pink felt hat) holds his hat down against the wind. Dramatic but child-friendly storm-approaching mood."}, {"text": "“눈보라가 온다! 모두 안으로!”\n펭귄들은 서둘러\n무대 위 장식을 덮었어요.", "prompt": "Medium shot of penguins working quickly together to cover the outdoor ice stage decorations with thick woven blankets, wind whipping snow around them. Bella the elderly penguin conductor directs calmly with her flipper raised. Urgent but organized cooperative energy."}, {"text": "휘이잉— 밤새 눈보라가\n마을을 하얗게 뒤덮었어요.\n모두 이글루 안에서 꼭 붙어 있었죠.", "prompt": "Cozy interior shot inside a warm igloo at night, Reengki the quokka (wearing his pink felt hat), Pepe the penguin and the twins huddled together under a blanket near a soft glowing lamp, while swirling snow is visible through the small round window. Safe, snug atmosphere against the storm outside."}, {"text": "아침이 되자 눈보라는 그쳤지만,\n이런! 얼음 무대에\n쩌적— 금이 가 있었어요.", "prompt": "Wide morning-after shot of the outdoor ice stage with a long dramatic crack running across its floor, fresh snow piled around, under a clearing pale-blue sky. Penguins gather around the crack with shocked open beaks. Reengki the quokka (wearing his pink felt hat) gasps with paws on his cheeks. Concerned but hopeful morning light."}, {"text": "게다가 무대 옆 얼음 조각이\n둥실— 바다로 떠내려가는데,\n그 위에 페페가 타고 있었어요!", "prompt": "Dramatic wide shot of a small ice floe drifting away from the broken stage edge onto the calm sea, with little Pepe the penguin standing on it looking back in surprise, flippers stretched out. The gap of dark blue water widens. Penguins on shore reach out. Tense but gentle peril, soft morning light."}, {"text": "“페페야—!” 링키가 외쳤지만\n바람 소리에 묻혀 버렸어요.\n페페는 점점 멀어져 갔죠.", "prompt": "Medium shot from behind Reengki the quokka (wearing his pink felt hat) at the icy shore, cupping his mouth and shouting toward the small drifting ice floe far on the water where tiny Pepe the penguin stands. His voice trails off as thin fading sound waves swallowed by wavy wind lines. Emotional, urgent distance."}, {"text": "링키는 벨라 할머니의 말이\n번쩍 떠올랐어요.\n‘함께 부르면 바다 건너까지 들린다!’", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat) with a bright flash of realization, eyes wide, a small glowing thought bubble showing the penguin choir singing together with long sound waves crossing the sea. Determined expression forming. Turning-point energy."}, {"text": "“모두 모여 줘! 우리 다 같이\n페페를 부르는 거야!”\n펭귄들이 우르르 모여들었어요.", "prompt": "Wide shot of Reengki the quokka (wearing his pink felt hat) standing on a snow mound waving both arms, rallying dozens of penguins who rush in from all directions across the snow, twins Pipi and Popo at the front. Energetic gathering scene under a brightening sky. Hopeful mobilization mood."}, {"text": "벨라 할머니가 지휘봉을 들었어요.\n“모두 숨을 크게, 마음을 하나로!”\n펭귄들이 나란히 줄을 섰죠.", "prompt": "Medium wide shot of Bella the elderly penguin conductor raising her icicle baton at the shoreline, penguins forming neat determined rows facing the sea, chests puffed with deep breaths. Reengki the quokka (wearing his pink felt hat) stands in the center of the front row. Solemn, unified pre-song tension."}, {"text": "저 멀리 작은 점이 된 페페.\n과연 모두의 목소리가\n페페에게 닿을 수 있을까요?", "prompt": "Wide dramatic shot from behind the assembled penguin choir and Reengki the quokka (wearing his pink felt hat) at the shore, facing the vast pale sea where Pepe the penguin is a tiny dot on a distant ice floe. Soft rays of sun break through parting clouds. Suspenseful, hopeful cliffhanger composition."}]}, {"ep": 7, "title": "바다를 건너는 목소리", "pages": [{"text": "“페—페—야—!”\n모두가 한목소리로 외쳤어요.\n소리가 파도 위를 달려갔죠.", "prompt": "Wide shot of the penguin choir and Reengki the quokka (wearing his pink felt hat) shouting-singing together at the shore, one huge unified golden sound wave rolling out across the sea surface like a glowing ribbon. Powerful, uplifting collective-voice moment under breaking sunlight."}, {"text": "멀리서 페페가 고개를 들었어요.\n“저건…… 모두의 목소리야!”\n페페의 눈이 반짝 빛났죠.", "prompt": "Close-up of Pepe the penguin on the drifting ice floe lifting his head as the glowing sound wave reaches him, eyes widening with hope and a small brave smile forming. The sea sparkles around his little floe. Emotional, hopeful connection moment."}, {"text": "페페도 힘껏 노래로 답했어요.\n“라— 라—!”\n동굴에서 연습한 그 고운 소리로요!", "prompt": "Medium shot of Pepe the penguin standing tall on the ice floe, beak lifted high, singing back with all his might as a thin but clear silver sound wave travels back across the water toward shore. Determined, brave expression. His practiced voice visualized as sparkling ripples."}, {"text": "“들린다! 페페 소리가 들려!”\n링키가 폴짝 뛰었어요.\n“소리 나는 쪽으로 배를 저어 가자!”", "prompt": "Medium shot of Reengki the quokka (wearing his pink felt hat) jumping up joyfully at the shore with one ear cupped, pointing out to sea along the direction of the incoming silver sound wave. Penguins cheer and rush to launch the ice boat. Energized rescue-launch excitement."}, {"text": "링키, 삐삐, 뽀뽀가 배에 올랐어요.\n“하나, 둘! One, two!”\n쌍둥이의 노가 척척 맞았죠.", "prompt": "Dynamic shot of the small ice boat cutting through gentle waves, twin penguins Pipi and Popo rowing in perfect rhythm while Reengki the quokka (wearing his pink felt hat) stands at the bow scanning the sea. Spray sparkles in the sunlight. Fast, coordinated teamwork energy."}, {"text": "안개가 스르르 끼었지만\n페페의 노랫소리가 등대처럼\n길을 알려 주었어요.", "prompt": "Atmospheric wide shot of the ice boat moving through soft sea mist, a glowing silver thread of song light weaving through the fog from the distance like a lighthouse beam guiding them. Reengki the quokka (wearing his pink felt hat) follows the light with focused eyes. Mysterious yet reassuring mood."}, {"text": "마을에서도 펭귄들이\n노래를 멈추지 않았어요.\n소리와 소리가 다리가 되었죠.", "prompt": "Wide poetic shot showing both the shore choir and distant Pepe the penguin, their two streams of glowing song light meeting over the misty sea to form a shimmering arched bridge of light, with the little boat sailing beneath it. Magical visual metaphor, breathtaking gentle grandeur."}, {"text": "“페페야! 찾았다!”\n안개 사이로 얼음 조각과\n페페가 보였어요!", "prompt": "Medium shot from the boat's bow as the mist parts to reveal Pepe the penguin waving both flippers wildly on his small ice floe, overjoyed. Reengki the quokka (wearing his pink felt hat) leans forward reaching out with a huge relieved smile. Emotional reunion approach."}, {"text": "링키가 손을 쭉 뻗었어요.\n“폴짝 뛰어! 내가 잡을게!”\n페페가 배 위로 폴짝 뛰었죠.", "prompt": "Action close-up of Pepe the penguin leaping from the ice floe into the outstretched arms of Reengki the quokka (wearing his pink felt hat) on the boat, both tumbling into a warm hug as the twins steady the boat. Splash droplets sparkle around. Joyful, tearful rescue hug."}, {"text": "“무서웠지만 노래가 들려서\n하나도 외롭지 않았어!”\n네 친구는 꼬옥 껴안았답니다.", "prompt": "Heartwarming medium shot of Reengki the quokka (wearing his pink felt hat), Pepe the penguin and twins Pipi and Popo in a tight group hug on the little boat, eyes closed with relieved happy tears, as sunbeams break fully through the clearing mist. Golden warm light, deeply tender mood."}]}, {"ep": 8, "title": "다시 세우는 무대", "pages": [{"text": "페페가 무사히 돌아오자\n마을은 환호로 가득했어요.\n하지만 무대엔 아직 금이 쩍—.", "prompt": "Wide shot of the village shore as the boat lands and penguins cheer, tossing snow confetti for the rescued Pepe the penguin and Reengki the quokka (wearing his pink felt hat). In the background the cracked ice stage stands quiet and broken. Mixed celebratory-and-worried mood, bright daylight."}, {"text": "“축제가 내일인데 어쩌지?”\n펭귄들이 걱정스레 모였어요.\n링키가 번쩍 손을 들었죠.", "prompt": "Medium shot of a circle of worried penguins gathered around the cracked stage, flippers to their beaks, while Reengki the quokka (wearing his pink felt hat) raises his paw high with a bright confident idea-face in the middle. Hopeful spark within a worried crowd."}, {"text": "“다 같이 고치면 돼!\n혼자선 힘든 일도\n함께라면 금방이야!”", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat) speaking passionately with a fist raised, eyes shining with determination, penguins around him lifting their heads with renewed hope. Warm rally-the-team energy, soft daylight on the snow."}, {"text": "펭귄들은 조를 나눴어요.\n얼음 나르기 조, 물 붓기 조,\n반질반질 다듬기 조!", "prompt": "Wide busy scene of penguins organized into teams around the cracked stage: one line passing ice blocks flipper to flipper, another pouring water from buckets, another polishing the surface with cloths. Reengki the quokka (wearing his pink felt hat) directs traffic cheerfully. Lively cooperative worksite, playful detail-rich composition."}, {"text": "삐삐와 뽀뽀는 커다란 얼음을\n“영차! 영차!” 함께 옮겼어요.\n혼자서는 꿈도 못 꿀 크기였죠.", "prompt": "Medium shot of twin penguins Pipi and Popo carrying one huge glistening ice block together, each holding one end, waddling in synchronized steps with strained but proud faces. The block sparkles in the sun. Teamwork humor and effort, endearing mood."}, {"text": "페페는 갈라진 틈에\n바닷물을 조르르 부었어요.\n찬바람이 물을 꽁꽁 얼렸답니다.", "prompt": "Close-up of Pepe the penguin carefully pouring seawater from a small wooden bucket into the crack of the ice stage, the water freezing into clear crystal as cold sparkles swirl over it. Focused careful expression. Satisfying repair detail, cool blue tones."}, {"text": "링키는 노래를 불렀어요.\n“일할 때 노래하면 힘이 나!”\n모두 흥얼흥얼 따라 불렀죠.", "prompt": "Wide cheerful shot of the whole repair crew working in rhythm while Reengki the quokka (wearing his pink felt hat) stands on a small ice block singing a work song, musical notes floating over the busy penguins who hum along smiling. Musical montage energy, bright and warm."}, {"text": "해 질 무렵, 무대가\n새것처럼 반짝반짝 빛났어요.\n“우리가 해냈어! We did it!”", "prompt": "Wide sunset shot of the fully repaired ice stage gleaming pink and gold in the low light, penguins and Reengki the quokka (wearing his pink felt hat) raising their flippers and paws in triumph in front of it. Long warm shadows on the snow. Proud accomplished glow."}, {"text": "벨라 할머니가 말했어요.\n“무대보다 더 단단해진 건\n너희들의 마음이란다.”", "prompt": "Medium shot of Bella the elderly penguin conductor smiling warmly at the gathered young friends, her flipper gesturing to the glowing stage and then to their chests. Reengki the quokka (wearing his pink felt hat), Pepe and the twins listen with touched expressions. Golden-hour tenderness, wise gentle moment."}, {"text": "밤하늘엔 별이 총총.\n드디어 내일은 얼음빛 축제!\n모두 두근두근 잠이 들었어요.", "prompt": "Wide night shot of the quiet ice village under a sky full of twinkling stars, the repaired stage silhouetted peacefully, warm lights glowing from igloo windows. A cozy sense of anticipation on the eve of the festival. Serene, dreamy night-before atmosphere."}]}, {"ep": 9, "title": "얼음빛 축제", "pages": [{"text": "드디어 축제의 밤!\n남쪽 하늘에 초록빛, 보랏빛이\n너울너울 춤추기 시작했어요.", "prompt": "Breathtaking wide shot of the night sky above the ice village filled with swirling green and violet aurora curtains, reflecting on the glossy repaired ice stage below. Penguins gather with glowing ice lanterns. Grand magical festival-opening atmosphere."}, {"text": "펭귄들이 무대에 올랐어요.\n링키도 그 한가운데 섰죠.\n가슴이 콩닥콩닥, 발이 간질간질.", "prompt": "Medium shot of the penguin choir in neat rows on the glowing ice stage, with Reengki the quokka (wearing his pink felt hat) standing at the center, taking a nervous excited breath, paws clasped. Aurora light shimmers over everyone. Pre-performance heartbeat tension, beautiful stage lighting."}, {"text": "벨라 할머니의 지휘봉이\n스윽— 올라갔어요.\n마을이 숨을 죽였답니다.", "prompt": "Dramatic close-up of Bella the elderly penguin conductor raising her icicle baton against the aurora sky, her scarf fluttering gently, the audience of penguins holding their breath in soft focus below the stage. A single suspended silent moment before the music."}, {"text": "첫 소절은 페페의 독창!\n작지만 고운 목소리가\n밤하늘로 또르르 피어올랐어요.", "prompt": "Spotlight shot of little Pepe the penguin stepping forward on the stage, singing his solo with eyes closed and chest lifted, a delicate silver thread of song light rising from him into the aurora sky. The crowd listens enchanted. Tender triumphant solo moment."}, {"text": "이어서 삐삐와 뽀뽀의 이중창!\n두 목소리가 사이좋게\n포개지며 화음이 되었죠.", "prompt": "Medium shot of twin penguins Pipi and Popo singing a duet side by side, holding flippers, their two sound-light ribbons in different colors twisting together into one braided glowing strand above them. Perfect-harmony smiles. Joyful reconciled duet scene under aurora light."}, {"text": "이제 다 함께 부를 차례.\n링키는 친구들의 소리에\n살며시 귀를 기울였어요.", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat) among the choir, one hand gently cupped by his ear, eyes softly closed, listening to his friends before joining in. Warm stage glow on his calm focused face. Quiet moment of learned wisdom."}, {"text": "모두의 목소리가 하나로 모이자\n노래가 커다란 빛기둥이 되어\n하늘 끝까지 솟아올랐어요!", "prompt": "Epic wide shot of the entire choir and Reengki the quokka (wearing his pink felt hat) singing at full harmony as their combined song becomes a huge column of golden light rising from the ice stage into the swirling aurora, snow crystals glittering in the air. Climactic, awe-inspiring spectacle."}, {"text": "노랫소리는 바다를 건너\n먼 섬까지 은은히 퍼졌어요.\n파도도 함께 찰랑찰랑 춤췄죠.", "prompt": "Poetic wide shot of glowing song waves rolling out from the festival village across the moonlit sea toward distant islands, gentle waves seeming to dance in rhythm, aurora reflected on the water. Vast peaceful beauty, the reach of a shared voice made visible."}, {"text": "노래가 끝나자 별똥별 하나가\n슈웅— 하늘을 가로질렀어요.\n“와아—!” 박수가 쏟아졌답니다.", "prompt": "Wide shot of the moment after the song: a bright shooting star streaks across the aurora sky above the stage as the penguin audience erupts in applause, flippers clapping, lanterns waving. Reengki the quokka (wearing his pink felt hat) and the choir bow together beaming. Celebratory magical finale."}, {"text": "링키는 알게 되었어요.\n함께 모은 목소리는\n혼자보다 훨씬 멀리 간다는 걸요.", "prompt": "Quiet close-up of Reengki the quokka (wearing his pink felt hat) gazing up at the aurora with a serene fulfilled smile, friends' silhouettes celebrating softly around him, tiny lights reflected in his eyes. Reflective warm afterglow of the climax, gentle emotional resonance."}]}, {"ep": 10, "title": "반짝이는 구슬 E", "pages": [{"text": "축제 다음 날 아침,\n마을 광장에 모두 모였어요.\n링키가 떠나는 날이거든요.", "prompt": "Wide morning shot of the snowy village square where all the penguins gather in a warm circle around Reengki the quokka (wearing his pink felt hat), soft golden sunrise light on the igloos. A small packed travel bag sits beside him. Bittersweet farewell-morning atmosphere."}, {"text": "벨라 할머니가 앞으로 나와\n반짝이는 무언가를 내밀었어요.\n영롱한 알파벳 구슬 E!", "prompt": "Medium shot of Bella the elderly penguin conductor stepping forward and holding out a luminous crystal bead shaped like the letter E on her open flippers, glowing with soft blue-white light. Reengki the quokka (wearing his pink felt hat) gasps with sparkling eyes. Solemn, magical gift-giving moment."}, {"text": "“네 덕분에 우리는 함께의 힘을\n다시 배웠단다.\n너는 우리의 진짜 친구야.”", "prompt": "Close-up of Bella the elderly penguin conductor speaking warmly, gently placing the glowing letter E bead into the small paws of Reengki the quokka (wearing his pink felt hat), whose eyes glisten with moved tears. Penguins smile tenderly around them. Deep heartfelt friendship moment, warm morning glow."}, {"text": "링키는 구슬 E를 주머니에\n소중히 넣었어요.\nI, L, O, V, E — 다섯 개가 되었죠!", "prompt": "Close-up of the open pouch in the paws of Reengki the quokka (wearing his pink felt hat), now holding five glowing alphabet beads I, L, O, V and E arranged in a sparkling row, each shimmering a slightly different color. His proud happy face reflects in their light. Rewarding milestone moment."}, {"text": "“다섯 글자로 말이 되네?\nLOVE… 아니, I LOVE…!”\n링키의 가슴이 뭉클해졌어요.", "prompt": "Medium shot of Reengki the quokka (wearing his pink felt hat) holding up the pouch and realizing the beads spell out glowing letters, small floating light letters I, L, O, V, E hovering above the pouch. Pepe the penguin and the twins peek at the letters in wonder. Touching discovery moment."}, {"text": "페페가 조개 목걸이를\n링키 목에 걸어 주었어요.\n“이 조개엔 우리 노래가 담겨 있어.”", "prompt": "Tender medium shot of Pepe the penguin reaching up on tiptoes to place a small seashell necklace around the neck of Reengki the quokka (wearing his pink felt hat), who bends down smiling with misty eyes. The spiral shell glints softly. Intimate keepsake-gift moment between best friends."}, {"text": "삐삐와 뽀뽀는 하나의 목도리를\n둘이 함께 짰다고 했어요.\n“반은 내가!” “반은 내가!”", "prompt": "Cute medium shot of twin penguins Pipi and Popo proudly presenting a long cozy knitted scarf that is clearly two different patterns joined in the middle, each pointing at their own half. Reengki the quokka (wearing his pink felt hat) laughs joyfully as they wrap it around him. Humorous heartwarming gift scene."}, {"text": "배에 오른 링키가 외쳤어요.\n“고마워, 하모니 빙하 마을!\nGoodbye! 또 만나!”", "prompt": "Wide shot of Reengki the quokka (wearing his pink felt hat, seashell necklace and two-pattern scarf) standing on the small boat at the shore, waving both arms widely toward the crowd of penguins gathered on the ice. Bright blue morning sea sparkles. Emotional cheerful departure scene."}, {"text": "펭귄들이 다 함께 이별 노래를\n불러 주었어요.\n노래는 배를 오래오래 따라왔죠.", "prompt": "Poetic wide shot of the boat sailing away from the ice village while the penguin choir on the shore sings, a long ribbon of glowing song light stretching over the waves and gently accompanying the boat. Reengki the quokka (wearing his pink felt hat) looks back with a warm smile. Moving farewell imagery, soft luminous morning."}, {"text": "다음 마을은 대나무가 우거진\n판다의 마을이래요.\n여섯 번째 구슬은 어떤 이야기일까요?", "prompt": "Wide hopeful shot of the small boat heading toward the horizon where a distant green land of misty bamboo forests rises beyond the sea, warm sunlight ahead contrasting the icy blue behind. Reengki the quokka (wearing his pink felt hat) stands at the bow gazing forward with adventurous sparkling eyes. New-journey anticipation, storybook transition mood."}]}]}, "6": {"chapter": 6, "animal": "판다", "animal_en": "panda", "letter": "Y", "village": "도란도란 대숲 마을", "episodes": [{"ep": 1, "title": "바람이 쉬어 가는 대숲", "pages": [{"text": "링키의 자전거가 언덕을 넘자\n주머니 속 구슬 다섯 개가\n달그락달그락 노래했어요.", "prompt": "Reengki the quokka (wearing his pink felt hat) rides a small bicycle over a green hill toward a distant bamboo forest. A little pouch on his hip is open just enough to show five glowing alphabet marbles. Morning sunlight washes the winding path in warm gold. Wide shot with the bamboo forest as a soft green wall on the horizon, cheerful adventurous mood."}, {"text": "초록 대나무가 하늘까지 쭉쭉!\n바람이 지나갈 때마다\n사락사락, 잎사귀가 속삭였죠.", "prompt": "Reengki the quokka (wearing his pink felt hat) stands at the entrance of a towering bamboo forest, looking straight up in awe. Tall green bamboo stalks stretch high, their leaves rustling in a gentle breeze with a few leaves drifting down. Soft rays of light slip between the stalks. Low-angle wide shot emphasizing the height of the bamboo, serene and magical atmosphere."}, {"text": "숲길 끝에 작은 문이 있었어요.\n둥근 대나무 문 위 간판에는\n‘PANDA VILLAGE’라고 적혀 있었죠.", "prompt": "Reengki the quokka (wearing his pink felt hat) walks his bicycle toward a round gate woven from bamboo at the end of a forest path. A wooden sign above the gate reads 'PANDA VILLAGE'. Paper lanterns hang quietly on both sides of the gate. Medium wide shot, dappled light, calm welcoming mood."}, {"text": "마을은 아주아주 조용했어요.\n판다들이 느릿느릿 걸으며\n서로에게 방긋 웃어 주었죠.", "prompt": "A peaceful bamboo village scene with several pandas strolling very slowly along a stone path, smiling gently at one another. Small bamboo houses with round windows line the lane, and a panda waters flowers at a snail's pace. Reengki the quokka (wearing his pink felt hat) peeks in from the edge of the frame, surprised by the calm. Wide shot, soft green light, tranquil mood."}, {"text": "“안녕하세요오—!” 링키가 외치자\n대숲이 메아리로 대답했어요.\n판다들은 눈웃음만 지었답니다.", "prompt": "Reengki the quokka (wearing his pink felt hat) cups his paws around his mouth and shouts a big greeting in the village square. His voice seems to ripple through the bamboo, shown by soft motion lines in the leaves. Nearby pandas turn their heads slowly and smile with kind crescent eyes. Medium shot centered on energetic Reengki contrasted with the calm pandas, warm humorous mood."}, {"text": "그때 한 판다가 다가왔어요.\n대나무 하나를 어깨에 메고\n느릿느릿, 아주 느릿느릿.", "prompt": "A gentle young panda carrying a single bamboo pole over his shoulder walks very slowly toward Reengki the quokka (wearing his pink felt hat). Each footstep is calm and deliberate on the stone path. Reengki tilts his head, curious about the unhurried pace. Medium shot with soft afternoon light filtering through bamboo, peaceful mood."}, {"text": "“안녕… 나는… 포포야.”\n“난 링키야! 만나서 반가워!”\n포포의 말은 구름처럼 폭신했어요.", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat) and the young panda facing each other for a friendly first greeting. The panda speaks slowly with a soft dreamy smile, while Reengki beams brightly and waves an eager paw. Bamboo leaves frame the two friends. Warm gentle lighting, heartwarming first-meeting mood."}, {"text": "포포는 댓잎차를 내주었어요.\n김이 모락모락 피어올랐죠.\n링키의 발은 콩콩 들썩였어요.", "prompt": "The panda pours steaming bamboo-leaf tea into a small cup for Reengki the quokka (wearing his pink felt hat) on a low wooden table outside a bamboo house. Gentle steam curls up from the teapot. Reengki sits but his feet bounce restlessly under the table, too excited to be still. Medium shot, cozy golden late-afternoon light, gentle humorous contrast between calm and energy."}, {"text": "“포포, 알파벳 구슬 얘기 알아?”\n포포는 빙그레 웃었어요.\n“천천히… 알게 될 거야.”", "prompt": "Reengki the quokka (wearing his pink felt hat) leans across the tea table with sparkling curious eyes, asking an eager question. The panda smiles knowingly and raises one paw in a slow, calming gesture. The five marbles in Reengki's pouch glimmer faintly on the table edge. Close-up two-shot, soft warm light, mood of gentle mystery."}, {"text": "“내일 아침, 보여 줄 게 있어.”\n포포의 눈이 반짝 빛났어요.\n대체 무엇을 보여 주려는 걸까요?", "prompt": "Evening settles over the bamboo village as the panda points slowly toward the heart of the grove, his eyes twinkling with a secret. Reengki the quokka (wearing his pink felt hat) looks in that direction, full of wonder. Paper lanterns begin to glow between the dark bamboo stalks. Wide shot at dusk, purple-blue sky, mysterious and cozy mood."}]}, {"ep": 2, "title": "하루에 한 문장", "pages": [{"text": "다음 날 아침, 안개가 몽글몽글.\n링키는 눈을 비비며\n포포네 집으로 달려갔어요.", "prompt": "Early morning mist floats between bamboo stalks as Reengki the quokka (wearing his pink felt hat) runs along a dewy path, rubbing one sleepy eye. A small bamboo house with a round window glows warmly ahead. Wide shot, pale silver-blue morning light, fresh quiet mood."}, {"text": "포포는 책상 앞에 앉아\n붓으로 사각사각,\n딱 한 문장을 쓰고 있었어요.", "prompt": "Inside a cozy bamboo house, the panda sits at a low wooden desk holding a brush, carefully writing a single line in an open notebook. His posture is calm and focused, ink pot beside him. Reengki the quokka (wearing his pink felt hat) watches quietly from the doorway. Medium shot over the desk, soft window light, serene studious mood."}, {"text": "“매일 한 문장씩 썼더니\n공책이 백 권이 되었어.”\n링키의 입이 떡 벌어졌어요.", "prompt": "The panda proudly gestures toward a tall shelf completely filled with rows and rows of matching notebooks inside his bamboo house. Reengki the quokka (wearing his pink felt hat) stands with his mouth wide open and paws on his cheeks in astonishment. Wide interior shot showing the impressive wall of notebooks, warm amber light, awe-filled mood."}, {"text": "포포는 대나무 피리를 들었어요.\n뿌우— 하루에 한 소리씩,\n매일매일 연습한대요.", "prompt": "The panda lifts a simple bamboo flute to his lips and plays one long gentle note, eyes closed peacefully. A soft visible breath of sound drifts out the round window like a ribbon. Reengki the quokka (wearing his pink felt hat) listens with his ears perked. Close-up on the panda playing with Reengki beside him, dreamy tranquil mood."}, {"text": "“우와… 그런데 포포,\n왜 그렇게 천천히 해?”\n링키가 고개를 갸웃했어요.", "prompt": "Reengki the quokka (wearing his pink felt hat) tilts his head far to one side with a puzzled expression, questioning the panda. The panda lowers his flute and smiles patiently. Morning light pours through the round window between them. Medium two-shot, gentle warm tones, curious conversational mood."}, {"text": "“느려도 매일 하면\n아주아주 멀리 갈 수 있어.\n대나무도 그렇게 자라거든.”", "prompt": "The panda stands by the open window pointing at the towering bamboo outside, explaining gently. The bamboo stalks rise dramatically into the bright sky, impossibly tall. Reengki the quokka (wearing his pink felt hat) gazes up, beginning to understand. Wide shot through the window with low-angle view of bamboo, inspiring calm mood."}, {"text": "“오늘의 영어 한 문장은—\nHello, my friend!”\n링키가 따라 했어요. “헬로!”", "prompt": "The panda writes on a small leaf-shaped chalkboard while Reengki the quokka (wearing his pink felt hat) repeats the greeting with a big joyful smile and raised paws. The two sit face to face on round floor cushions. Close-up two-shot, cheerful bright light, playful learning mood."}, {"text": "“열 문장 다 배울래!” 링키는\n마구마구 외치다가 그만—\n혀가 배배 꼬여 버렸죠.", "prompt": "Reengki the quokka (wearing his pink felt hat) tries to say too many things at once, cheeks puffed and eyes crossed comically as his words tumble together. Little jumbled speech swirls float around his head. The panda watches with a soft amused smile. Close-up on Reengki's tangled expression, bright funny mood."}, {"text": "포포가 나직이 웃었어요.\n“오늘 하나, 내일 하나.\n그게 제일 빠른 길이야.”", "prompt": "The panda chuckles gently and holds up one paw finger, giving kind advice to Reengki the quokka (wearing his pink felt hat), who scratches his head bashfully. Sunbeams stripe the cozy room floor. Warm medium shot of the two friends, tender mentoring mood."}, {"text": "집으로 가던 길, 게시판에서\n무언가 반짝 눈에 띄었어요.\n알록달록한 종이 한 장이었죠!", "prompt": "On the village lane at golden hour, Reengki the quokka (wearing his pink felt hat) stops his bicycle in front of a bamboo notice board where a single colorful poster flutters in the breeze. His eyes go wide with curiosity as he leans closer. Medium shot from behind Reengki looking at the board, warm sunset light, intriguing cliffhanger mood."}]}, {"ep": 3, "title": "달빛 음악회 포스터", "pages": [{"text": "“보름달 밤, 대숲 달빛 음악회!”\n링키의 심장이 콩닥콩닥,\n크게 뛰기 시작했어요.", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat) staring at a colorful poster on the bamboo notice board, his eyes sparkling and paws clasped with excitement. The poster shows a painted full moon over a bamboo stage with lanterns. Warm evening glow, thrilled anticipatory mood."}, {"text": "“나도 무대에 서고 싶어!\n포포의 피리에 맞춰\n노래를 부르고 싶어!”", "prompt": "Reengki the quokka (wearing his pink felt hat) spins in a happy circle on the village path, arms spread wide as he imagines himself on stage. A dreamy thought bubble above him shows a tiny stage under a full moon. Wide shot with bamboo swaying around him, joyful dreamy mood."}, {"text": "포포의 노래는 ‘댓잎의 노래’.\n소절이 열 개나 되는\n길고 긴 노래였답니다.", "prompt": "The panda unrolls a long scroll of sheet music that tumbles down the steps of his bamboo house and keeps rolling across the floor. Reengki the quokka (wearing his pink felt hat) follows the unrolling paper with wide astonished eyes. Medium wide shot emphasizing the comically long scroll, soft indoor light, humorous daunted mood."}, {"text": "“하루면 다 외울 수 있어!”\n링키는 처음부터 끝까지\n와다다다 불러 보았어요.", "prompt": "Reengki the quokka (wearing his pink felt hat) sings frantically fast with the long scroll flapping in his paws, musical notes scattering chaotically around his head. His cheeks are puffed and eyes squeezed shut with effort. The panda watches calmly in the background. Dynamic medium shot, bright daylight, comic overeager mood."}, {"text": "그런데 가사가 뒤죽박죽!\n피리도 삑— 삐익—\n엉뚱한 소리만 났어요.", "prompt": "Reengki the quokka (wearing his pink felt hat) blows into a bamboo flute with all his might, producing a squeaky wrong note shown as a zigzag squiggle in the air. Jumbled song words float upside down around him. His face is red with effort. Close-up, bright colors, gently comic frustrated mood."}, {"text": "“으아, 하나도 안 돼!”\n링키는 풀밭에 벌러덩\n드러누워 버렸어요.", "prompt": "Reengki the quokka (wearing his pink felt hat) lies flat on his back on soft grass beside the dropped flute and crumpled scroll, limbs spread out in defeat. He puffs his cheeks at the sky. Bamboo tops and clouds fill the sky above him. Top-down or low wide shot, soft afternoon light, sulky but cute mood."}, {"text": "“히힛, 나랑 똑같다!”\n아기 판다 콩콩이가\n데굴— 구르다 폭 넘어졌어요.", "prompt": "A tiny baby panda attempts a somersault on the grass near Reengki the quokka (wearing his pink felt hat) and flops over sideways mid-roll, giggling. Reengki sits up, surprised and amused. Loose bamboo leaves scatter around the tumbling baby panda. Medium shot of the two, bright playful light, warm funny mood."}, {"text": "포포가 느릿느릿 다가와\n둘을 토닥여 주었어요.\n“괜찮아, 괜찮아.”", "prompt": "The panda walks over slowly and gently pats both Reengki the quokka (wearing his pink felt hat) and the baby panda on their heads as they sit on the grass. Both look up at him with round eyes. Soft late-afternoon light through bamboo, comforting tender mood, medium shot."}, {"text": "포포는 달 달력을 펼쳤어요.\n“보름달까지 열흘 남았어.\n소절도 딱 열 개지?”", "prompt": "The panda spreads open a handmade moon calendar showing ten phases of the moon leading to a big painted full moon. Reengki the quokka (wearing his pink felt hat) and the baby panda lean in, counting the moons with their paws. Close-up on the calendar with three heads gathered around it, golden light, dawning-hope mood."}, {"text": "“하루에 한 소절이면 충분해.”\n링키의 눈이 반짝!\n정말 해낼 수 있을까요?", "prompt": "Reengki the quokka (wearing his pink felt hat) jumps to his feet with renewed sparkle in his eyes, one paw raised toward the sky, while the panda nods slowly and the baby panda claps. The evening sky glows orange behind the bamboo. Wide hopeful shot, determined uplifting mood."}]}, {"ep": 4, "title": "콩콩이의 눈물", "pages": [{"text": "다음 날 아침, 링키는\n첫 번째 소절을 불렀어요.\n“댓잎이 사락사락 춤을 춰요♪”", "prompt": "Morning practice scene: Reengki the quokka (wearing his pink felt hat) sings carefully from a small page holding just one line of music, standing straight in a bamboo clearing. The panda keeps gentle rhythm by tapping a bamboo stick. Fresh morning light, focused cheerful mood, medium shot."}, {"text": "옆에서는 콩콩이가\n앞구르기 연습을 했어요.\n데굴— 폭! 데굴— 폭!", "prompt": "The baby panda repeatedly attempts somersaults on a grass mat, flopping over sideways each time with little dust puffs. Reengki the quokka (wearing his pink felt hat) pauses his singing to watch. Sequence-feel composition showing the tumble, bright playful morning light, endearing mood."}, {"text": "“난 왜 이렇게 느려!”\n콩콩이가 댓잎을 뿌리며\n그렁그렁 울먹였어요.", "prompt": "The baby panda sits on the grass throwing a pawful of bamboo leaves into the air in frustration, big teary eyes glistening. Leaves flutter down around his ears. Close-up on the baby panda's trembling pout, soft light, sympathetic gentle-sad mood."}, {"text": "링키가 살며시 다가갔어요.\n“나도 어제 가사가 꼬여서\n벌러덩 누워 버렸는걸.”", "prompt": "Reengki the quokka (wearing his pink felt hat) kneels beside the teary baby panda and gently holds his small paw, sharing his own story with a kind smile. The baby panda looks up, sniffing. Close-up two-shot at eye level of the little ones, warm comforting light, empathetic mood."}, {"text": "포포가 공책 한 권을 가져와\n첫 장을 펼쳐 보였어요.\n글씨가 삐뚤빼뚤 춤을 췄죠!", "prompt": "The panda opens the very first page of an old notebook, showing wobbly crooked brushstrokes, and holds it out for Reengki the quokka (wearing his pink felt hat) and the baby panda to see. Both lean in with surprised expressions. Close-up on the notebook page with wobbly writing, warm indoor light, revealing mood."}, {"text": "이번엔 마지막 장을 펼쳤어요.\n반듯반듯 고운 글씨!\n“우와아—!” 둘이 소리쳤죠.", "prompt": "The panda turns to the last page of the notebook, revealing beautifully neat elegant brushstrokes, while Reengki the quokka (wearing his pink felt hat) and the baby panda gasp with round mouths and shining eyes. Close-up on the contrast of the neat page and two amazed faces, bright warm light, wonder mood."}, {"text": "“비밀은 딱 하나야.\n매일, 조금씩.”\n콩콩이가 훌쩍이며 웃었어요.", "prompt": "The panda taps the notebook softly with one claw, sharing his secret with a calm proud smile. The baby panda wipes his tears with the back of his paw and breaks into a small smile. Reengki the quokka (wearing his pink felt hat) nods eagerly. Warm medium three-shot, tender hopeful mood."}, {"text": "셋은 ‘오늘의 한 걸음’ 판을\n대나무로 뚝딱 만들었어요.\n하루 하나씩 잎 도장 콩!", "prompt": "Reengki the quokka (wearing his pink felt hat), the panda, and the baby panda build a small bamboo progress board together, hammering playfully. The board has ten empty squares and a basket of leaf-shaped stamps beside it. Cheerful crafting scene, bright daylight, collaborative joyful mood, wide shot."}, {"text": "링키는 소절 하나, 콩!\n콩콩이는 구르기 반 바퀴, 콩!\n포포는 새 문장 하나, 콩!", "prompt": "The three friends each press a green leaf stamp onto the first square of the bamboo progress board, one after another. Each stamped square glows with a fresh leaf print. Their faces beam with small proud smiles. Close-up on paws stamping the board, warm golden light, satisfying accomplished mood."}, {"text": "그날 밤, 링키는 또박또박\n영어 한 문장을 썼어요.\n‘I can do it.’ 내일이 기대돼요!", "prompt": "Night scene inside a cozy guest hut: Reengki the quokka (wearing his pink felt hat) writes carefully in a small notebook by lantern light, tongue peeking out in concentration. Through the round window, the crescent moon hangs above dark bamboo. Close-up over his shoulder at the glowing desk, peaceful hopeful nighttime mood."}]}, {"ep": 5, "title": "조금씩, 매일매일", "pages": [{"text": "셋째 날, 링키는 세 소절을\n이어서 부를 수 있었어요.\n잎 도장도 세 개가 되었죠!", "prompt": "Reengki the quokka (wearing his pink felt hat) sings confidently in the bamboo clearing while pointing proudly at the progress board that now has three leaf stamps. The panda claps slowly and warmly. Bright mid-morning light, wide cheerful shot, growing-confidence mood."}, {"text": "포포의 피리 소리도\n점점 고와졌어요.\n뿌우— 소리가 바람 같았죠.", "prompt": "The panda plays his bamboo flute with eyes closed as a smooth ribbon of melody drifts through the bamboo stalks, making leaves sway. Reengki the quokka (wearing his pink felt hat) sways along with closed eyes. Medium shot with flowing musical ribbon motif, dreamy serene mood."}, {"text": "“데굴— 짠!” 콩콩이가\n반 바퀴를 넘게 굴렀어요!\n모두 “와아—!” 손뼉을 쳤죠.", "prompt": "The baby panda completes more than half a somersault and pops up with arms spread in a proud ta-da pose, cheeks pink with joy. Reengki the quokka (wearing his pink felt hat) and the panda cheer and clap. Dynamic medium shot capturing the landing pose, bright joyful light, celebratory mood."}, {"text": "이번엔 링키가 선생님!\n“하나아, 두울, 천천히—”\n판다들에게 춤을 알려 줬어요.", "prompt": "Reengki the quokka (wearing his pink felt hat) stands in front of a small row of pandas in the village square, demonstrating a simple slow dance step with exaggerated counting gestures. The pandas copy him at their own gentle pace, slightly out of sync but happy. Wide shot of the adorable dance class, warm daylight, funny heartwarming mood."}, {"text": "판다들은 링키에게\n느긋한 숨쉬기를 알려 줬어요.\n스으— 후우— 마음이 몽글몽글.", "prompt": "Reengki the quokka (wearing his pink felt hat) sits cross-legged in a circle with several pandas, all breathing slowly with eyes closed and peaceful smiles, paws resting on knees. Soft bamboo leaves drift down around the quiet circle. Gentle even light, wide calm shot, meditative cozy mood."}, {"text": "이 마을엔 다툼이 없대요.\n말도 차례차례,\n찻잔도 차례차례거든요.", "prompt": "A peaceful village vignette: pandas patiently wait in a neat line as an elderly panda pours tea into cups one by one, each panda bowing slightly as they receive theirs. Reengki the quokka (wearing his pink felt hat) watches from the side with an impressed soft smile. Wide warm scene of village harmony, golden afternoon light, serene communal mood."}, {"text": "오늘의 영어 한 문장!\n“Little by little!”\n“리를 바이 리를!” 콩콩이도 콩!", "prompt": "The panda holds up the leaf-shaped chalkboard with a short phrase written on it while Reengki the quokka (wearing his pink felt hat) and the baby panda repeat it enthusiastically, paws raised. The baby panda hops with each syllable. Bright cheerful close-up of the study circle, playful learning mood."}, {"text": "저녁에는 초롱불 아래에서\n다 같이 연습했어요.\n반짝반짝, 대숲이 빛났죠.", "prompt": "Evening practice under glowing paper lanterns strung between bamboo stalks: Reengki the quokka (wearing his pink felt hat) sings, the panda plays flute, and the baby panda practices rolling on a mat. Warm lantern light pools around them in the deep blue dusk. Wide magical evening shot, cozy dedicated mood."}, {"text": "어느새 소절 다섯 개!\n하늘의 달도 딱 반쪽이\n차올라 있었답니다.", "prompt": "Reengki the quokka (wearing his pink felt hat) stamps the fifth leaf onto the progress board and looks up at a bright half moon hanging above the bamboo forest. The board and the moon visually echo each other, half complete. Night wide shot with the half moon prominent, satisfying milestone mood."}, {"text": "그런데 저 멀리 하늘 끝에\n먹구름이 스멀스멀…\n무슨 일이 생기려는 걸까요?", "prompt": "From a hilltop view over the bamboo village at night, dark heavy clouds creep across the far horizon toward the half moon. Reengki the quokka (wearing his pink felt hat) and the panda stand small in the foreground, looking at the distant sky with uneasy expressions. Wide ominous-yet-soft shot, cool blue tones, foreboding cliffhanger mood."}]}, {"ep": 6, "title": "비바람이 몰려와요", "pages": [{"text": "밤사이 바람이 세졌어요.\n우수수, 우수수—\n대나무들이 크게 흔들렸죠.", "prompt": "Nighttime storm rising: tall bamboo stalks bend and sway dramatically in strong wind, leaves swirling through the dark air. Lantern lights flicker along the village lane. Wide dramatic shot of the swaying grove under racing clouds, windy tense but not scary mood."}, {"text": "후두둑! 비가 쏟아졌어요.\n판다들은 서로의 우산 속으로\n포옥포옥 모여들었죠.", "prompt": "Rain pours down as pandas huddle together under big bamboo-leaf umbrellas, gently pulling each other into shelter with caring paws. Reengki the quokka (wearing his pink felt hat) squeezes under an umbrella with the baby panda. Medium shot of cozy huddling in the rain, warm lamplight against blue rain, protective tender mood."}, {"text": "음악회 무대가 삐거덕삐거덕,\n빗속에서 힘겹게\n버티고 있었어요.", "prompt": "The bamboo concert stage in the grove clearing creaks under heavy rain and wind, its frame leaning slightly as decorations whip in the gale. Rain streaks across the dark scene. Wide shot of the straining stage from a distance, dramatic but softened storm mood."}, {"text": "뚝! 밧줄 하나가 끊어지고\n초롱불들이 후두둑\n바닥으로 떨어졌어요.", "prompt": "A rope on the stage snaps and a string of paper lanterns tumbles down into puddles below, their lights going out one by one. Rain splashes around the fallen lanterns. Close-up on the falling lantern string against the stormy night, dramatic sad moment, cool tones."}, {"text": "아침이 되자 비가 그쳤어요.\n무대는 기우뚱 기울고\n초롱불은 흙투성이였죠.", "prompt": "Calm after the storm: morning light reveals the bamboo stage tilted at an angle, with muddy paper lanterns scattered across the wet ground and puddles reflecting the gray-blue sky. A few bamboo poles lie fallen. Wide quiet aftermath shot, muted morning colors, somber mood."}, {"text": "마을 판다들이 모여들었어요.\n“보름달까지 나흘뿐인데…”\n모두 걱정이 가득했죠.", "prompt": "Villager pandas gather in a loose circle around the damaged stage, looking at it with worried drooping shoulders. Reengki the quokka (wearing his pink felt hat) stands among them, biting his lip. Overcast soft light, wide group shot, concerned communal mood."}, {"text": "“으앙, 우리 음악회…”\n콩콩이가 훌쩍이자 링키가\n주먹을 불끈! “다시 세우자!”", "prompt": "The baby panda cries softly into his paws while Reengki the quokka (wearing his pink felt hat) steps forward with both fists raised high and a determined blazing expression. The other pandas look up at Reengki. Dynamic medium shot with Reengki as the rallying point, first ray of sun breaking through clouds, rousing hopeful mood."}, {"text": "“나흘 만에 될까…”\n“기둥이 열 개나 쓰러졌는걸…”\n한숨이 폭폭 새어 나왔어요.", "prompt": "Two doubtful pandas count the fallen bamboo poles scattered on the ground, sighing with little cloud puffs above their heads. The tilted stage looms behind them. Reengki the quokka (wearing his pink felt hat) listens with a worried frown. Medium shot, gray-blue palette with warm accents, uncertain mood."}, {"text": "그때 포포가 말했어요.\n“하루에 기둥 두 개면 돼.\n느려도, 멈추지만 않으면.”", "prompt": "The panda calmly picks up one fallen bamboo pole and holds it upright, speaking steady words to the gathered crowd. His quiet confidence contrasts with the messy scene around him. Sunlight strengthens behind him through parting clouds. Heroic-calm medium shot, warming light, turning-point mood."}, {"text": "판다들이 서로를 바라봤어요.\n눈빛이 반짝, 또 반짝!\n과연 무대를 세울 수 있을까요?", "prompt": "The villager pandas exchange glances as determination sparks in their eyes one by one, paws tightening with resolve. Reengki the quokka (wearing his pink felt hat) grins and rolls up an imaginary sleeve. Circle of faces catching golden light, energized cliffhanger mood, medium group shot."}]}, {"ep": 7, "title": "하나씩 다시 세우기", "pages": [{"text": "“영차아—!” 첫째 날,\n모두 함께 기둥을 밀었어요.\n기둥 하나가 우뚝 섰죠!", "prompt": "Teamwork scene: Reengki the quokka (wearing his pink felt hat) and several pandas push together to raise a tall bamboo pole upright, all straining with cheerful effort. The pole stands proudly against the blue sky. Dynamic low-angle wide shot, bright morning light, triumphant cooperative mood."}, {"text": "링키는 마음이 급해서\n밧줄을 휙휙 감았어요.\n그만 매듭이 배배 꼬였죠!", "prompt": "Reengki the quokka (wearing his pink felt hat) frantically wraps a rope around a bamboo joint at high speed, and the rope becomes a comically hopeless tangle around his own arms. His face shows flustered surprise. Close-up on the tangled mess, bright daylight, gently comic mood."}, {"text": "포포가 다가와 보여 줬어요.\n“한 바퀴… 또 한 바퀴…”\n느릿느릿, 그러나 반듯하게.", "prompt": "The panda demonstrates tying the rope slowly, one deliberate loop at a time, with Reengki the quokka (wearing his pink felt hat) watching intently right beside his paws. Each loop lies neat and even on the bamboo. Extreme close-up on the careful paws and rope, soft focused light, patient teaching mood."}, {"text": "링키는 스으— 숨을 쉬고\n다시 천천히 감았어요.\n와! 매듭이 반듯반듯!", "prompt": "Reengki the quokka (wearing his pink felt hat) takes a slow calming breath and ties the rope again carefully, finishing a perfectly neat knot. He beams down at his work with sparkling proud eyes while the panda nods approval. Close-up on the neat knot and Reengki's proud face, warm light, small-victory mood."}, {"text": "둘째 날엔 바닥을 깔았어요.\n콩콩이는 작은 잎을 날라\n틈새를 콕콕 메웠답니다.", "prompt": "The rebuilding continues: pandas lay bamboo floor planks while the baby panda proudly carries small bundles of leaves to stuff into gaps, working with great seriousness. Reengki the quokka (wearing his pink felt hat) hammers a peg nearby. Busy warm work scene, wide shot, everyone-matters mood."}, {"text": "무루 할아버지가 차를 내오며\n옛이야기를 들려줬어요.\n“대나무는 말이지…”", "prompt": "An elderly panda with a walking stick serves tea to the resting workers and begins telling a story, one paw raised like a storyteller. Reengki the quokka (wearing his pink felt hat), the panda, and the baby panda sit around him sipping tea. Golden break-time scene under a bamboo canopy, cozy storytelling mood, medium group shot."}, {"text": "“몇 해 동안 땅속에서\n뿌리만 조용히 기른단다.\n그리고 어느 날, 쑤욱!”", "prompt": "Imaginative cutaway illustration of the elderly panda's story: underground bamboo roots spreading quietly and patiently in the dark soil, then a young shoot bursting up dramatically into sunlight. Reengki the quokka (wearing his pink felt hat) is shown small at the edge, listening wide-eyed. Split ground-view composition, magical storybook mood."}, {"text": "“뿌리가 먼저였구나!”\n링키의 가슴속에서\n무언가 반짝 켜졌어요.", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat) with a moment of realization, eyes wide and bright, a small glowing spark motif near his chest. The elderly panda smiles knowingly in soft-focus background. Warm enlightening light, epiphany mood."}, {"text": "셋째 날 밤, 초롱불을 걸고\n불을 켜 보았어요.\n반짝! 반짝! 대숲이 빛났죠.", "prompt": "Night test of the repaired stage: pandas hang fresh paper lanterns along the bamboo frame and light them one by one, each glowing warmly against the dark grove. Reengki the quokka (wearing his pink felt hat) claps with delight as the whole stage twinkles. Wide magical night shot, celebration of progress, sparkling cozy mood."}, {"text": "무대가 다시 우뚝 섰어요!\n그런데 저녁 밥상에\n콩콩이가 보이지 않네요…?", "prompt": "The finished stage stands proud and beautiful in the lantern-lit grove, but in the foreground at a long dinner table, one small cushion sits conspicuously empty among the seated pandas. Reengki the quokka (wearing his pink felt hat) looks at the empty seat with a worried tilt of his head. Warm dinner light with a hint of unease, cliffhanger mood, medium shot."}]}, {"ep": 8, "title": "사라진 콩콩이", "pages": [{"text": "“콩콩아—! 어디 있니—?”\n판다들이 여기저기\n콩콩이를 찾아다녔어요.", "prompt": "Worried pandas spread out through the evening village calling and searching, peeking behind houses and bushes with lanterns. Reengki the quokka (wearing his pink felt hat) cups his paws around his mouth calling out. Dusky blue evening with warm lantern spots, wide searching scene, concerned mood."}, {"text": "콩콩이 방에는 그림 한 장.\n무대 옆에서 혼자 우는\n작은 판다가 그려져 있었죠.", "prompt": "Close-up of a child's crayon drawing left on a small bed: a tiny sad panda standing apart from a bright stage, with a wobbly teardrop on its cheek. The panda and Reengki the quokka (wearing his pink felt hat) look at the drawing with soft worried eyes. Warm lamplight on the touching drawing, poignant gentle mood."}, {"text": "“구르기를 망칠까 봐\n숨어 버렸나 봐…”\n링키와 포포는 숲으로 갔어요.", "prompt": "Reengki the quokka (wearing his pink felt hat) and the panda walk into the deep bamboo grove at night carrying a single warm lantern, pushing gently through the stalks. Fireflies drift between the dark bamboo. Atmospheric night shot from behind the two searchers, hopeful determined mood."}, {"text": "“콩콩아— 어디 있니—”\n그때, 큰 바위 뒤에서\n훌쩍훌쩍 소리가 났어요.", "prompt": "The lantern light falls on a large mossy rock among the bamboo, and small round panda ears peek out from behind it. Reengki the quokka (wearing his pink felt hat) and the panda pause mid-step, listening. Close-up on the rock with the tiny ears visible, tender suspenseful night mood."}, {"text": "콩콩이가 무릎을 안고\n웅크리고 있었어요.\n귀가 축 처져 있었죠.", "prompt": "The baby panda sits hugging his knees behind the rock, ears drooping, eyes red from crying, a few bamboo leaves stuck to his fur. The lantern's warm glow just reaches his small figure. Intimate close-up at his eye level, gentle sorrowful mood."}, {"text": "링키가 옆에 앉았어요.\n“나도 다섯 마을에서\n엄청 서툴렀다? 진짜야.”", "prompt": "Reengki the quokka (wearing his pink felt hat) sits down close beside the baby panda against the rock, speaking softly with a warm honest smile, counting on his fingers as he recalls past villages. The baby panda peeks sideways at him. Warm two-shot in lantern light surrounded by dark bamboo, comforting confessional mood."}, {"text": "포포도 나직이 말했어요.\n“느린 건 부끄러운 게 아니야.\n대나무 뿌리처럼 자라는 중인걸.”", "prompt": "The panda kneels and places a gentle paw on the baby panda's head, speaking calm reassuring words. Behind them the tall bamboo stretches into the starry night sky like a symbol of patient growth. Medium shot of the three under the stars, deeply warm consoling mood."}, {"text": "“무대에서 넘어지면 어떡해?”\n“그럼 다 같이 데굴 구르지 뭐!”\n콩콩이가 피식 웃었어요.", "prompt": "Reengki the quokka (wearing his pink felt hat) playfully rolls on the ground mid-somersault to make the baby panda laugh, limbs flailing cheerfully. The baby panda giggles through leftover tears, and the panda chuckles. Playful close-up of the silly roll, lantern-lit warmth, tension-melting joyful mood."}, {"text": "셋은 손을 꼭 잡고\n달빛 숲길을 걸었어요.\n달이 거의 다 차올랐죠.", "prompt": "Reengki the quokka (wearing his pink felt hat), the panda, and the baby panda walk home paw in paw along a moonlit bamboo path, their backs to the camera. A nearly full moon glows above the swaying bamboo tops. Wide serene night shot of three silhouettes with warm lantern glow, bonded peaceful mood."}, {"text": "내일 밤이면 드디어 보름달!\n세 친구의 가슴이\n콩닥콩닥 두근거렸어요.", "prompt": "The three friends pause at the village gate and look up together at the bright nearly-full moon, their faces lit with mixed nervousness and excitement. Tiny heartbeats are suggested by soft glowing marks near their chests. Upward-gazing medium shot, luminous night sky, eve-of-the-big-day anticipation mood."}]}, {"ep": 9, "title": "달빛 아래 첫 무대", "pages": [{"text": "드디어 보름달이 두둥실!\n대숲 위로 커다란 달이\n환하게 떠올랐어요.", "prompt": "A magnificent full moon rises over the bamboo forest, bathing everything in silver light. The rebuilt stage glows below with strings of warm lanterns. Wide establishing night shot of the grove under the huge moon, breathtaking magical mood."}, {"text": "판다들이 방석에 앉아\n도란도란 모여들었어요.\n찻잔에선 김이 모락모락.", "prompt": "Villager pandas settle onto round cushions arranged before the stage, chatting softly and holding steaming teacups. The elderly panda sits at the front with a blanket over his lap. Cozy audience scene under lantern light, wide warm shot, gentle festival mood."}, {"text": "첫 무대는 콩콩이!\n데구르르— 짠!\n한 바퀴를 완벽하게 굴렀어요!", "prompt": "The baby panda performs on stage, completing one perfect full somersault and landing in a proud ta-da pose with arms spread wide under the lanterns. The audience of pandas erupts in applause with raised paws. Dynamic stage shot at the landing moment, spotlight-like lantern glow, triumphant adorable mood."}, {"text": "다음은 포포의 피리 연주.\n뿌우우— 부드러운 소리가\n바람처럼 대숲을 감쌌어요.", "prompt": "The panda stands center stage playing his bamboo flute with eyes closed, a long silken ribbon of melody flowing out and weaving between the bamboo stalks and the moon. The audience listens with peaceful closed-eye smiles. Elegant medium shot with the flowing melody motif, dreamy silver-and-gold night mood."}, {"text": "이제 링키 차례예요.\n심장이 콩닥콩닥!\n링키는 스으— 숨을 쉬었죠.", "prompt": "Reengki the quokka (wearing his pink felt hat) stands at the edge of the stage, gripping the hem of his fur nervously, then closes his eyes and takes one slow deep breath the way the pandas taught him. Lantern light rims his small figure against the dark grove. Close-up on his calming face, tense-to-peaceful transition mood."}, {"text": "“댓잎이 사락사락 춤을 춰요♪”\n하루에 하나씩 배운 소절들이\n차례차례 흘러나왔어요.", "prompt": "Reengki the quokka (wearing his pink felt hat) sings joyfully at center stage while the panda accompanies on flute beside him, musical notes drifting up toward the full moon. His posture is confident and bright. Medium st
