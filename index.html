he tiny mouse, cheeks stuffed round with bread, mimics every bite Reengki the quokka (wearing his pink felt hat) takes, making him laugh. Beside them, the chestnut-brown rabbit bumps fists with Reengki, both grinning ear to ear. Lantern light twinkles on the happy circle. Playful close-up, infectious laughter and warmth."}, {"text": "루나가 살며시 일어났어요.\n“링키, 이제 그 노래… 같이 불러 볼까?”\n링키의 가슴이 두근했어요.", "prompt": "Luna the white rabbit rises gracefully within the lantern circle, extending an inviting paw toward Reengki the quokka (wearing his pink felt hat), whose face lights up with nervous excitement. The full moon still glows above the lantern-lit plaza. Medium shot, anticipation sparkling in the warm night air."}, {"text": "“See ya, silly Jaguar,\nI'm going to the moon!”\n루나가 먼저 나직이 노래를 시작했어요.", "prompt": "Luna the white rabbit sings softly with her eyes half closed, lantern light gilding her white fur, one paw over her heart. Reengki the quokka (wearing his pink felt hat) listens beside her, lips beginning to move along. The circle of rabbits sways gently to the melody. Lyrical medium shot, music visualized as faint golden sparkles."}, {"text": "링키도 가만히 따라 불렀어요.\n몇 마디는 더듬거렸지만,\n마음만은 또렷이 노래를 따라갔죠.", "prompt": "Reengki the quokka (wearing his pink felt hat) sings earnestly beside Luna the white rabbit, his small voice carrying between the lanterns, face glowing with heartfelt effort. Rabbits all around slowly fold their ears sideways in the warm signal meaning 'you're doing well'. Emotional medium-wide shot, lantern glow like scattered stars."}, {"text": "노래가 끝나자 치키가 제일 먼저 짝짝!\n“아직 다 못 외웠는데…” “괜찮아.\n노래는 마음으로 먼저 부르는 거야.”", "prompt": "Chiki the tiny mouse claps enthusiastically, leading applause from the chestnut-brown and cream rabbits as Reengki the quokka (wearing his pink felt hat) rubs the back of his head with a bashful smile. Luna the white rabbit smiles at him with proud gentle eyes. Warm close-up on the applauding circle, joyful lantern-lit celebration."}, {"text": "루나가 새끼손가락을 쏙 내밀었어요.\n“약속. 언제든 돌아와서 이 노래—\n처음부터 끝까지 멋지게 불러 줘.”", "prompt": "Luna the white rabbit holds out her little finger toward Reengki the quokka (wearing his pink felt hat), her expression warm and earnest under the lantern light. Reengki reaches out his own pinky to meet hers. The lantern flames flicker softly behind them. Intimate close-up on the promise being made, tender golden atmosphere."}, {"text": "치키도 작은 손가락을 살짝 보탰어요.\n세 손가락이 등불 아래 가만히 포개지고\n그 온기가 불빛처럼 잔잔히 겹쳤어요.", "prompt": "Extreme close-up of three linked pinky fingers — Reengki the quokka's, Luna the white rabbit's, and Chiki the tiny mouse's — stacked gently together, bathed in soft orange lantern glow. Their three smiling faces are softly blurred behind the joined paws. Deeply warm symbolic shot of friendship and promise."}, {"text": "밤이 깊어 갔어요. 링키는 별이 가득한\n하늘을 올려다보았어요. ‘내일이면 떠나는구나.’\n아쉬운데도, 마음은 이상하게 따뜻했죠.", "prompt": "Reengki the quokka (wearing his pink felt hat) lies back on the plaza grass gazing up at a sky brimming with stars, the fading lantern glow warm at the edge of the frame. Luna the white rabbit and Chiki the mouse doze peacefully nearby. The full moon watches over them. Quiet wide night shot, bittersweet warmth and starlight."}]}, {"ep": 10, "title": "다시 길 위에서", "pages": [{"text": "다음 날 아침, 이슬이 보석처럼 반짝이는\n마을 어귀에 모두가 나와 있었어요.\n루나, 치키, 토끼 친구들, 할아버지까지.", "prompt": "The village entrance at sparkling dewy dawn: Luna the white rabbit, Chiki the tiny mouse, the chestnut-brown rabbit, the cream rabbit, and the elderly rabbit host all gather beneath the fluttering flags to see off Reengki the quokka (wearing his pink felt hat), who stands beside his packed bicycle. Rainbow droplets glitter on the flag badges. Wide farewell shot, fresh morning light."}, {"text": "치키가 두 팔을 활짝 벌리자\n링키가 허리를 굽혀 꼭 안아 주었어요.\n짧은 포옹, 그래도 마음은 단단했죠.", "prompt": "Reengki the quokka (wearing his pink felt hat) bends down to hug Chiki the tiny mouse, who stretches her little arms as wide as she can around him, eyes squeezed shut with feeling. Soft morning mist glows around the embracing pair. Close-up, small but mighty farewell hug, tender emotional warmth."}, {"text": "“Sky Bound!” 브라질 토끼와 주먹 인사,\n일본 토끼와는 서로 고개 숙여 인사.\n말이 달라도 마음은 똑같았어요.", "prompt": "Reengki the quokka (wearing his pink felt hat) bumps fists with the grinning chestnut-brown rabbit, while the cream-colored rabbit bows politely beside them and Reengki bows back in kind. Morning light warms the circle of farewells under the flags. Medium shot, multicultural friendship expressed in gestures, gentle joyful mood."}, {"text": "할머니가 종이 한 장을 건네셨어요.\n노래 가사와 손글씨 한 줄—\n“When you can sing it… come back.”", "prompt": "The elderly rabbit grandmother places a small folded paper into the paws of Reengki the quokka (wearing his pink felt hat), her silvery fur glowing in dawn light, smiling gently. The paper shows neat handwritten song lyrics with a warm note beneath. Reengki's eyes glisten as he holds it like a treasure. Close-up, precious parting gift moment."}, {"text": "“토끼가 높이 뛰는 건 무릎을 깊이\n굽히기 때문이야. 약해지는 게 아니라\n더 높이 뛰려고 힘을 모으는 거지.”", "prompt": "Luna the white rabbit demonstrates a deep knee bend before a jump, speaking earnestly to Reengki the quokka (wearing his pink felt hat), who listens with his whole heart, paws clasped. Morning light outlines the two friends at the village gate. Medium shot, a wise gentle lesson passing between them, hopeful atmosphere."}, {"text": "루나가 귀를 살며시 눕혔어요. ‘잘했어.’\n링키도 어설프게 따라 해 보였죠.\n“한 번 더 뛰면, 새로운 세상이 보일 거야.”", "prompt": "Luna the white rabbit folds one ear softly sideways in the warm signal, and Reengki the quokka (wearing his pink felt hat) comically wiggles his small round ears trying to mimic her, both bursting into fond laughter. Flags flutter above the village gate behind them. Close-up two-shot, laughter and love in the parting."}, {"text": "자전거가 달리기 시작했어요.\n마을과 국기들이 점점 작아지다가\n아침 안개 속으로 살며시 잠겼어요.", "prompt": "Wide shot from behind: Reengki the quokka (wearing his pink felt hat) pedals away down the country road, looking back once at the shrinking village where tiny figures wave and ears flutter beneath fading flags. Morning mist slowly swallows the village into soft white. Poignant departure scene, gentle motion, misty pastel morning."}, {"text": "그런데 어딘가 이상했어요.\n햇살이 잿빛으로 옅어지고, 키 큰 나무들이\n하늘을 가려 버렸어요. 스르륵… 스르륵….", "prompt": "The road grows dim as Reengki the quokka (wearing his pink felt hat) rides into a dense old forest where tall trees arch overhead, their branches knitting together to hide the blue sky. Gray light filters weakly through the canopy; fallen leaves scatter the path. Only his bicycle wheels whisper in the hush. Moody wide shot, mysterious shadowy atmosphere."}, {"text": "“찍… 찍…” 누군가 울고 있었어요.\n덤불 아래, 덩굴에 발이 묶인 아기 생쥐!\n“걱정 마. 금방 풀어 줄게.”", "prompt": "Reengki the quokka (wearing his pink felt hat) kneels beside a bush in the dim forest, gently untangling tough vines wrapped around the feet of a tiny frightened mouse with teary eyes. His bicycle rests against a tree behind him. Faint gray-green forest light, close-up on the careful rescue, tension mixed with kindness."}, {"text": "마지막 덩굴을 당긴 순간— 철컥!\n커다란 그물이 솟아올라 둘은 붕— 매달렸어요.\n“…고양이들의 덫에 잡혔어.” 어둠 속 눈동자들이 반짝—", "prompt": "A huge net snaps up from beneath the fallen leaves, leaving Reengki the quokka (wearing his pink felt hat) and the tiny mouse dangling high from a tree branch, the bicycle toppled in the grass below. Reengki clutches his bag tightly to his chest. In the dark branches all around, pairs of glowing yellow eyes blink open one by one. Dramatic cliffhanger wide shot, suspenseful shadowy forest, moonless gloom."}]}]}, "3": {"chapter": 3, "animal": "고양이", "animal_en": "cat", "letter": "O", "village": "고양이 빌리지", "episodes": [{"ep": 1, "title": "뛰어!", "pages": [{"text": "해가 닿지 않는 숲속은 깊고 어두웠어요.\n그물에 걸린 링키가 고개를 내밀자\n노란 눈동자가 반짝— 빛났다 숨었어요.", "prompt": "Wide shot of a deep, dark forest where sunlight barely reaches. Reengki the quokka (wearing his pink felt hat) peeks his head carefully through the ropes of a large net strung between tall trees. In the shadows behind a branch, two glowing yellow eyes shine and half-hide in the darkness. Mysterious cool blue-green gloom with a single shaft of dim light."}, {"text": "뚝— 밧줄 한 가닥이 끊어졌어요.\n그물이 기우뚱! 링키가 주르륵 미끄러지고\n소매 끝엔 작은 생쥐가 대롱대롱 매달렸어요.", "prompt": "Close-up of a rope snapping with frayed fibers at the top of the frame. Below, the big net tilts sharply to one side and Reengki the quokka (wearing his pink felt hat) slides down the mesh, gripping his bag strap tightly with a startled face. A tiny gray mouse dangles from his sleeve, swinging back and forth. Dark forest background, tense but soft storybook mood."}, {"text": "“가만있어!” 날카로운 목소리와 함께\n그물이 통째로 툭 떨어졌어요.\n링키는 낙엽 더미 위를 데굴데굴 굴렀지요.", "prompt": "Dynamic shot of the whole net dropping onto a thick pile of dry autumn leaves on the forest floor. Reengki the quokka (wearing his pink felt hat) tumbles head over heels, crunchy brown leaves sticking all over his face and ears. Above on a branch, the silhouette of a small cat with bright yellow eyes looks down. Swirling leaves, warm browns against the dark forest."}, {"text": "누군가 링키의 팔을 확 잡았어요.\n“뛰어!” 모래빛 고양이가 앞장서 달렸고\n생쥐가 옷깃 속에서 바들바들 떨었어요.", "prompt": "Action shot of a small sand-colored cat gripping the arm of Reengki the quokka (wearing his pink felt hat) and pulling him into a run through the dark forest. Behind them, other cats carry a rolled-up net on their shoulders. The tiny gray mouse burrows into Reengki's collar, only its trembling face peeking out. Motion lines, flying leaves, urgent but not scary."}, {"text": "“내 자전거! 아빠가 닦아준 건데!”\n링키는 팔을 뿌리치고 왔던 길로\n어둠 속을 마구 달려갔어요.", "prompt": "Reengki the quokka (wearing his pink felt hat) breaks free and runs back alone through the dark forest, arms pumping, a determined worried face. Far behind him in the grass, a small bicycle lies fallen on its side. The sand-colored cat reaches out after him, mouth open in a call. Deep shadows between the trees, wind-blown leaves, medium wide shot."}, {"text": "그때, 발끝이 허공을 디뎠어요!\n“어……?” 몸이 기울어진 순간\n누군가 가방끈을 꽉 붙잡아 주었어요.", "prompt": "Dramatic side view at the edge of a cliff in the dark forest. Reengki the quokka (wearing his pink felt hat) tips forward over the edge, one foot stepping into empty air, eyes wide. Behind him, the small sand-colored cat grips his bag strap with both front paws, leaning back with all her strength. Tree roots stick out of the crumbling edge, deep darkness below."}, {"text": "발밑은 끝없는 절벽이었어요.\n돌멩이 하나가 또르르 굴러떨어져\n한참 뒤에야 저 아래서 톡, 소리를 냈지요.", "prompt": "View over the shoulder of Reengki the quokka (wearing his pink felt hat) as he looks down a bottomless dark cliff, knees buckling. A single small pebble tumbles off the edge into the black depth. The sand-colored cat stands firmly behind him, still holding his bag strap. Exposed roots on the cliff face, faint moonlight, hushed dramatic mood."}, {"text": "낡은 표지판엔 이렇게 적혀 있었어요.\n‘밤에는 이 앞으로 지나가지 마시오.’\n그물은 모두를 지켜 주던 것이었어요.", "prompt": "Close-up of an old broken wooden sign leaning at the cliff edge, half covered in green moss, its lower part snapped off. Reengki the quokka (wearing his pink felt hat) reads it with a flushed, embarrassed face while cats behind him stretch a safety net back between two trees. The tiny mouse peeks quietly from his collar. Soft lantern-like moonlight, gentle apologetic mood."}, {"text": "숲을 나서자 세상이 확 바뀌었어요.\n주황빛 모래 언덕이 바다처럼 출렁였고\n링키는 “우와…” 입을 다물지 못했지요.", "prompt": "Breathtaking wide shot at the forest's edge where dark trees give way to an endless orange desert glowing in evening sunlight. Rolling sand dunes ripple like a great orange sea under a peach-colored sky. Reengki the quokka (wearing his pink felt hat) stands small in the foreground with his bicycle, mouth open in wonder. The sand-colored cat stands beside him. Warm golden light."}, {"text": "“나는 링키야!” “……시라.”\n시라의 발자국을 따라 사각사각 걷다 보니\n저 멀리 초록빛 마을이 나타났어요.", "prompt": "Warm dusk scene of Reengki the quokka (wearing his pink felt hat) pushing his bicycle across the sand, carefully stepping into the paw prints left by the sand-colored cat Shira walking ahead. In the distance, a green oasis ringed by layered clay houses glows in the last light. A trail of matched footprints stretches behind them. Cozy adventurous mood, wide shot."}]}, {"ep": 2, "title": "대추 세 알", "pages": [{"text": "흙벽에 걸린 팻말이 반겨 주었어요.\n해가 지자 마을은 그제야 눈을 떴고\n창문마다 노란 불빛이 하나씩 피어났지요.", "prompt": "Evening view of the entrance of a desert clay-walled village, a wooden sign hanging on the earthen wall that reads 'THE CAT VILLAGE'. Windows light up one by one with warm yellow glow as cats shake out blankets on flat rooftops. Reengki the quokka (wearing his pink felt hat) walks in with his bicycle beside the sand-colored cat Shira. Deep blue twilight sky, cozy lantern light."}, {"text": "갓 구운 빵 냄새가 솔솔 흘러왔어요.\n흙담은 낮의 햇볕을 품어 포근했고\n아기 고양이들이 대추 씨를 굴리며 놀았어요.", "prompt": "Charming narrow alley in the clay village at night. Two tiny kittens giggle while rolling a dried jujube seed like a ball on the ground. Reengki the quokka (wearing his pink felt hat) squeezes past with his bicycle, the handlebar bumping the warm earthen wall. Steam and bread smell drift from a bakery window. Golden lamplight, warm homey atmosphere."}, {"text": "넓은 골목 끝에서 찰박찰박 물소리.\n그런데 입구 한가운데 평상이 놓였고\n덩치 큰 고양이 셋이 앉아 있었어요.", "prompt": "A wide straight alley leading toward the sound of water, blocked at its entrance by a wooden platform bench. Three big burly cats lounge on it; the middle one has a thick neck and a torn ear, the other two swing their legs lazily. Reengki the quokka (wearing his pink felt hat) and the sand-colored cat Shira stop before them. Torchlight shadows on clay walls, slightly tense mood."}, {"text": "시라는 말없이 대추 세 알을 올려놓았어요.\n“지나가.” 그런데 링키 앞은 커다란\n앞발이 턱 막았지요. “Pay first.”", "prompt": "Close scene at the wooden platform. The sand-colored cat Shira places three dried jujubes on the bench with her head lowered, while the torn-eared cat sweeps them toward himself. A big paw blocks the chest of a bewildered Reengki the quokka (wearing his pink felt hat). Night alley, lantern glow, the water alley glimmering beyond."}, {"text": "“여기 그냥 길 아니에요?”\n“싫으면 돌아가.” 링키는 결국\n좁은 골목을 여섯 번이나 돌아갔어요.", "prompt": "Reengki the quokka (wearing his pink felt hat) trudges through a maze of narrow winding alleys with his bicycle, climbing worn clay stairs, looking tired and hungry. Cooking smells drift from lit windows above. A small map-like view showing the long detour route around the blocked alley. Cool night blues mixed with warm window lights."}, {"text": "“너 왜 그냥 냈어?” “……원래 그래.”\n어른 고양이도 말했어요.\n“옛날부터 그랬으니까 내버려 둬.”", "prompt": "Night plaza with a stone well at its center, water sounds sparkling. The sand-colored cat Shira adjusts a full water bucket on her shoulder, eyes turned away, while Reengki the quokka (wearing his pink felt hat) questions her with a frustrated face. An elder cat with a water jug shrugs indifferently as he passes. Moonlight on clay walls, thoughtful quiet mood."}, {"text": "“……그거, 아까부터 움직이는데?”\n옷깃 속에서 딸꾹! 소리가 새어 나오고\n작은 생쥐가 빼꼼 얼굴을 내밀었어요.", "prompt": "Close-up of the sand-colored cat Shira staring intently at the collar of Reengki the quokka (wearing his pink felt hat), her big ears pricked forward. Reengki carefully opens his collar and a tiny gray mouse peeks out, covering its face with two little paws. Quiet corner of the plaza at night, soft lantern light, gentle suspenseful mood."}, {"text": "“얘는 내 친구야. 아무것도 안 훔쳤어.”\n시라는 낮게 말했지요.\n“……나는 아무한테도 말하지 않을게.”", "prompt": "Reengki the quokka (wearing his pink felt hat) cups the tiny gray mouse protectively in both hands, holding it close to his chest with an earnest expression. The sand-colored cat Shira looks at them, her expression softening as she keeps the secret. The quiet plaza and well behind them, warm and cool light mixing, tender trusting mood."}, {"text": "“난 두리야. 두리번거려서 두리!”\n숙소 할머니는 값도 받지 않으셨어요.\n“손님에게는 원래 그런단다.”", "prompt": "Cozy interior of a travelers' inn with a blue roof. A kind old grandmother cat offers a folded blanket and a plate of dried jujubes to Reengki the quokka (wearing his pink felt hat). On his palm, the tiny gray mouse Duri stands proudly introducing itself, whiskers twitching. Warm candlelight, earthen walls, homely welcoming mood."}, {"text": "잠들려는데 창밖으로 스윽—\n아주 큰 무언가가 소리 없이 지나갔어요.\n“……방금 뭐였지?”", "prompt": "Night bedroom scene inside the inn. Reengki the quokka (wearing his pink felt hat) sits bolt upright under his blanket, face pressed toward the window. Outside in the empty moonlit alley, a single lantern sways in the wind, and the faint blur of a very large striped shadow slips past the corner. The mouse Duri sleeps in his collar. Mysterious hushed blue night."}]}, {"ep": 3, "title": "발톱 자국", "pages": [{"text": "다음 날 새벽, 비명이 골목을 찢었어요.\n집집마다 문이 벌컥벌컥 열리고\n고양이들이 한쪽으로 우르르 달려갔지요.", "prompt": "Dawn scene in the clay village, pale morning light. Doors fly open along the alley as startled cats rush in one direction. Reengki the quokka (wearing his pink felt hat) runs among them, blanket half thrown off, alarmed. Cool gray-blue dawn tones with hurried motion, wide shot down the alley."}, {"text": "마을 곳간의 나무문이 통째로 뜯겨\n흙바닥에 나뒹굴고 있었어요.\n말린 고기와 대추가 어지럽게 흩어졌지요.", "prompt": "The village granary at dawn, its thick wooden door torn clean off and lying on the sandy ground. Inside, burst sacks slump over with dried meat and jujubes scattered out to the doorway. A crowd of shocked cats gathers around. Reengki the quokka (wearing his pink felt hat) stares from the front row. Muted morning light, dismayed mood."}, {"text": "곳간지기 아주머니의 손이 떨렸어요.\n링키는 곁에 쭈그려 앉아\n차가운 대추를 한 알씩 함께 주웠어요.", "prompt": "Tender close scene in front of the granary. A weary granary keeper cat sits on the threshold, her trembling paws dropping jujubes into her apron. Reengki the quokka (wearing his pink felt hat) crouches beside her, gently picking up cold jujubes one by one and placing them in her opened apron. Soft dawn light, quiet compassionate mood."}, {"text": "“여기 좀 봐!” 모래 위에\n믿을 수 없이 커다란 발자국!\n발톱 자국 네 줄이 선명했어요.", "prompt": "Dramatic top-down close-up of a huge paw print pressed into the sand in front of the granary, wider than two quokka hands side by side, with four deep claw marks at the front. Reengki the quokka (wearing his pink felt hat) kneels beside it, his tail stiff with fright, comparing it with his small hands. Cats point and gasp around the edge of the frame."}, {"text": "“이건…… 호랑이 발자국이야!”\n소문은 마른 풀에 불붙듯 번졌고\n대낮인데도 문 잠그는 소리가 들렸어요.", "prompt": "Busy village montage-style scene: worried cats whisper in clusters, a parent cat pulls kittens indoors, and shutters and doors close along the sunny alley even in daylight. Reengki the quokka (wearing his pink felt hat) stands in the middle, uneasy. The word spreads visually through leaning heads and wide eyes. Bright daylight contrasting with anxious mood."}, {"text": "“너, 어젯밤에 이상한 거 못 봤어?”\n“창밖으로 큰 게 지나갔어. 그런데\n다시 보니 아무것도 없었어.”", "prompt": "Medium shot of the sand-colored cat Shira, a water bucket on her shoulder, leaning toward Reengki the quokka (wearing his pink felt hat) in a quiet corner near the granary. Reengki gestures toward a window as he explains, the mouse Duri listening from his collar. Shira's big ear twitches. Morning light, conspiratorial curious mood."}, {"text": "해가 지자 광장에서 회의가 열렸어요.\n“절반밖에 남지 않았어요.”\n웅성거림이 파도처럼 번졌지요.", "prompt": "Evening village meeting in the torch-lit plaza around the well. The granary keeper cat counts remaining sacks with a worried face while a crowd of cats murmurs, their shadows flickering on clay walls. Reengki the quokka (wearing his pink felt hat) watches from the edge of the crowd beside Shira. Orange torchlight against deep blue dusk, tense communal mood."}, {"text": "우물지기 할머니가 지팡이를 쿵쿵!\n“오늘부터 밤에는 아무도 나가지 마라.\n특히 아이들은 절대로.”", "prompt": "The elderly well keeper cat stands at the center of the plaza meeting, striking the ground twice with her wooden cane, her face stern but caring. Cats young and old fall silent around her. The granary keeper clutches an empty sack in the background. Reengki the quokka (wearing his pink felt hat) listens solemnly. Torchlight, commanding hushed atmosphere."}, {"text": "모두 돌아간 뒤에도 링키는 남았어요.\n흔들리는 등불 아래에서\n커다란 발자국을 다시 들여다보았지요.", "prompt": "Lonely night scene in front of the granary. Reengki the quokka (wearing his pink felt hat) crouches alone under a single swaying lantern, peering closely at the giant paw print in the sand. His long shadow stretches across the ground. The mended granary door leans nearby. Deep blue night with one pool of warm lantern light, thoughtful detective mood."}, {"text": "발톱 자국 끝이 이상하게 뭉툭했어요.\n긁은 게 아니라 꾹 눌러 찍은 모양?\n‘뭔가…… 이상해.’", "prompt": "Extreme close-up of the claw marks in the sand under lantern light, their tips oddly blunt and rounded like stamped shapes rather than sharp scratches. The small finger of Reengki the quokka (wearing his pink felt hat) hovers over one mark, tracing its edge. His puzzled face is reflected in the corner of the frame. Warm lantern glow, mysterious curious mood."}]}, {"ep": 4, "title": "호랑이 발이 여섯 개?", "pages": [{"text": "이튿날, 마을 전체가 탐정이 되었어요.\n하지만 수사는 어느새\n서로를 탓하는 싸움이 되어 버렸지요.", "prompt": "Chaotic morning scene in the village plaza. Cats argue in pairs and clusters, pointing paws at each other — a police cat protests with crossed arms while another cat gestures at a broken section of the west wall. Reengki the quokka (wearing his pink felt hat) stands unnoticed in the middle. Bright harsh daylight, squabbling energetic but non-violent mood."}, {"text": "목소리는 점점 높아졌어요.\n어제까지 물을 나눠 쓰던 이웃들이\n서로 등을 돌리고 말았어요.", "prompt": "Two adult cats stand back to back with arms crossed and ears flattened, refusing to look at each other, while kittens press their worried faces to a door crack watching the grown-ups. In the background more cats bicker across the plaza. Reengki the quokka (wearing his pink felt hat) watches sadly from a wall's shadow. Warm daylight but a chilly emotional distance."}, {"text": "“저, 제가 어젯밤에…….”\n용기 내어 말을 붙여 보았지만\n아무도 링키를 봐 주지 않았어요.", "prompt": "Reengki the quokka (wearing his pink felt hat) raises a timid hand and opens his mouth to speak, but a busy adult cat brushes past without a glance, paw raised in a 'wait' gesture. Around him the crowd flows by as if he were invisible, slightly transparent-feeling composition with Reengki small at center. Muted colors, lonely overlooked mood."}, {"text": "링키는 담벼락에 기대어 앉았어요.\n분홍 리본을 만지작거리자\n엄마 아빠 생각이 뭉게뭉게 났지요.", "prompt": "Quiet close-up of Reengki the quokka (wearing his pink felt hat) sitting slumped against a warm clay wall, gently touching a pink ribbon tied around his wrist. Above his head, a soft dreamy thought-cloud shows a bright hamster village festival stage with dancing hamsters. His eyes are wistful. Golden afternoon light, homesick tender mood."}, {"text": "“링키, 저거 좀 이상해.”\n어깨 위의 두리가 속삭였어요.\n“발자국…… 갯수가!”", "prompt": "Close-up of the tiny gray mouse Duri standing upright on the shoulder of Reengki the quokka (wearing his pink felt hat), one small paw pointing toward the granary, whiskers alert. Reengki turns his head, eyes widening with new focus. The blurred trail of giant paw prints leads away in the background. Bright discovery mood, warm light."}, {"text": "둘은 발자국을 하나씩 짚었어요.\n“하나, 둘, 셋, 넷…….”\n그런데 손가락이 다음 자국에서 멈췄어요.", "prompt": "Reengki the quokka (wearing his pink felt hat) crawls along the sandy ground beside the granary, touching each giant paw print in a line as he counts, with the mouse Duri hopping ahead from print to print. The trail of prints leads toward the south wall. Focused close-to-ground camera angle, warm sand tones, playful investigation mood."}, {"text": "“다섯…… 여섯!”\n어떤 자국은 깊고 어떤 자국은 얕았어요.\n같은 몸에서 났다기엔 너무 달랐지요.", "prompt": "Top-down view of six giant paw prints in the sand, clearly varying — some pressed deep with dark shadows, others barely denting the surface. Reengki the quokka (wearing his pink felt hat) holds up six fingers with an astonished face while Duri stands on the sixth print with tiny arms spread. Clear midday light making the depth differences visible."}, {"text": "“두리야, 호랑이는 발이 몇 개야?”\n“……당연히 네 개지.”\n둘은 한동안 아무 말도 못 했어요.", "prompt": "Face-to-face close-up of Reengki the quokka (wearing his pink felt hat) and the tiny mouse Duri staring at each other with wide round eyes, Duri counting on its own little front paws. Between them in the background, the mysterious six-print trail. A light breeze scatters a few grains of sand. Suspenseful comedic beat, warm tones."}, {"text": "“여행자를 함부로 들이지 말자니까!”\n광장 쪽에서 성난 목소리가 날아왔고\n시선들이 링키에게 콕콕 꽂혔어요.", "prompt": "The angry water seller cat gestures sharply in the plaza, and many cat heads turn at once toward Reengki the quokka (wearing his pink felt hat), who freezes mid-step near the granary. Multiple pairs of yellow cat eyes focus on him from different directions. He shields Duri behind his collar. Late afternoon light, uncomfortable accused mood."}, {"text": "‘발자국이 여섯 개예요!’\n하고 싶은 말을 꾹 삼킨 링키는\n주먹을 폈다 쥐고 조용히 돌아섰어요.", "prompt": "Reengki the quokka (wearing his pink felt hat) walks away alone down a narrow alley, fists slowly unclenching at his sides, head slightly bowed but eyes resolute. Behind him the plaza crowd blurs in warm light while his path leads into cool shadow. A speech bubble-like empty cloud above him fades, unspoken. Bittersweet determined mood, medium wide shot."}]}, {"ep": 5, "title": "밉다고 도둑은 아닌데", "pages": [{"text": "‘나는 이 마을에서 받기만 했네.’\n링키는 담요를 단정히 개고\n신발을 꼭 여며 신었어요.", "prompt": "Evening interior of the travelers' inn. Reengki the quokka (wearing his pink felt hat) folds his blanket neatly with a resolved expression, a plate of jujubes on the wooden floor beside him. Around him, soft memory vignettes glow faintly: the inn grandmother, Shira catching his bag, a baker offering bread. Warm candlelight, quiet determination."}, {"text": "“시라야, 발자국이 여섯 개야.”\n시라는 물통을 벽에 세우고 일어났어요.\n“……오늘은 값 안 받아.”", "prompt": "Night alley stairway. Reengki the quokka (wearing his pink felt hat) holds up six spread fingers toward the sand-colored cat Shira, who sits tired on the steps with drooping shoulders beside her water buckets. Shira's yellow eyes catch the lantern light as she slowly rises, leaning a bucket against the wall. Cool blue night with one warm lamp, quiet alliance forming."}, {"text": "“범인은 물골목의 바르 일당일 거야!”\n셋은 지붕 위에 납작 엎드려\n평상을 뚫어져라 지켜보았어요.", "prompt": "Rooftop stakeout scene under the moon. Reengki the quokka (wearing his pink felt hat), the sand-colored cat Shira, and the tiny mouse Duri lie flat on clay roof tiles, peeking over the ridge down at the wooden platform in the water alley where three big cats lounge. Moonlit rooftops stretch around them. Playful spy-movie mood, deep blue night."}, {"text": "한 시간, 두 시간…… 딸꾹, 딸꾹!\n두리의 딸꾹질이 자꾸 새어 나왔고\n링키는 꾸벅꾸벅 졸기 시작했어요.", "prompt": "Comedic rooftop scene late at night. The mouse Duri hiccups with puffed cheeks while Reengki the quokka (wearing his pink felt hat) tries to muffle it with his collar, his own eyelids drooping heavily and head nodding. Shira watches the alley below, unimpressed, one ear turned toward them. A crescent moon high above, sleepy humorous mood."}, {"text": "링키가 미끄러지려는 순간, 시라가\n꼬리를 재빨리 붙잡아 주었어요.\n“자려면 내려가.” “안 잤어!”", "prompt": "Dynamic moment on the tilted rooftop: a roof tile slips and Reengki the quokka (wearing his pink felt hat) slides down the slope on his belly with a startled face, while the sand-colored cat Shira grips his tail firmly with both front paws, braced against the ridge. Duri clings to Reengki's hat. One tile tumbles off the edge. Moonlight, comic rescue energy."}, {"text": "바르 일당은 밤새 아무 데도 안 갔어요.\n“……아니었네.” 링키의 볼이 발개졌어요.\n“밉다고 도둑인 건 아닌데.”", "prompt": "Pale dawn over the rooftops. Below, the three big cats sleep harmlessly on their platform — one snoring, one slumped mid-grooming, the torn-eared boss gazing at fading stars. On the roof, Reengki the quokka (wearing his pink felt hat) rests his chin on a tile with flushed cheeks and a humbled expression, Shira beside him. Soft pink dawn light, reflective gentle mood."}, {"text": "셋은 다시 곳간으로 갔어요.\n시라가 킁킁— 자루 냄새를 맡았지요.\n“기름 냄새야. 며칠은 안 빠지는 냄새.”", "prompt": "Morning at the granary. The sand-colored cat Shira presses her nose close to a torn sack, eyes closed in concentration, big ears angled as she catches a scent. Reengki the quokka (wearing his pink felt hat) and the mouse Duri lean in watching intently. Faint scent trails drawn as delicate swirls in the air. Soft morning light, keen detective mood."}, {"text": "“……남쪽이야.”\n골목은 갈수록 좁아지고\n무너진 담이 하나둘 늘어났어요.", "prompt": "The trio walks south through increasingly narrow, crumbling alleys — the sand-colored cat Shira leads with her nose lifted, Reengki the quokka (wearing his pink felt hat) follows pushing past a collapsed wall, Duri riding on his shoulder. Faint shallow paw prints continue along the sandy ground. Houses grow shabbier, dry earth tones, quiet adventurous tension."}, {"text": "마지막 집 앞에서 시라가 멈췄어요.\n지붕은 반쯤 내려앉고\n마당엔 마른 풀만 듬성듬성했지요.", "prompt": "Wide shot of a lonely house at the village's southern edge: roof half caved in, windows patched with old cloth, sparse dry grass in a sandy yard. The sand-colored cat Shira stands still at the broken gate, one paw raised, while Reengki the quokka (wearing his pink felt hat) stops behind her. Late afternoon light casting long shadows, hushed melancholy mood."}, {"text": "그때, 집 안에서 소리가 들렸어요.\n콜록……\n아주 작고, 오래 앓아 쉬어 버린 기침이었어요.", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat) and the sand-colored cat Shira frozen side by side outside the ruined house, ears turned toward the cloth-covered window, eyes wide and soft with concern. A faint small sound line drifts from the dark window. Duri peeks from Reengki's collar. Fading golden light, tender suspenseful hush."}]}, {"ep": 6, "title": "창문 안의 호랑이", "pages": [{"text": "둘은 발소리를 죽이고 집을 돌았어요.\n뒤뜰의 낡은 창고 문틈으로\n선명한 주황빛이 언뜻 보였지요.", "prompt": "Reengki the quokka (wearing his pink felt hat) tiptoes along a crumbled wall behind the ruined house, carefully stepping only in the paw prints of the sand-colored cat Shira ahead. In the backyard stands an old shed, its door open a hand's width, a sliver of vivid orange visible through the gap. Dusky light, sneaky quiet adventure mood."}, {"text": "끼익— 문을 밀자 어둠 속에서\n무언가가 링키를 내려다보았어요!\n“히익!” 링키는 시라 뒤로 폴짝 숨었지요.", "prompt": "Inside the dark shed, seen from behind Reengki the quokka (wearing his pink felt hat) as he leaps behind the sand-colored cat Shira in fright. High on the shadowy wall, a large orange striped tiger face looms, catching a thin beam of light. Dust motes float in the doorway light. Startling but softly comic mood, dramatic low light."}, {"text": "그런데 호랑이는 꼼짝도 안 했어요.\n자세히 보니 벽에 걸린 낡은 탈!\n줄무늬는 희끗하고 이빨 하나가 없었지요.", "prompt": "Closer view revealing the tiger is an old worn costume mask hanging on the shed wall — stripes faded to whitish streaks, one tooth missing entirely, fabric patched and saggy. Reengki the quokka (wearing his pink felt hat) peeks out from behind Shira with round relieved eyes. Gentle light through the door gap, mystery-solving mood."}, {"text": "탈 안쪽엔 어깨 자리가 둘,\n다리 자리가 넷이었어요.\n“앞발 둘, 뒷발 넷…… 모두 여섯!”", "prompt": "Reengki the quokka (wearing his pink felt hat) holds open the tiger costume to show its inside: two shoulder slots and four leg openings, which he counts on his fingers with dawning realization. The sand-colored cat Shira looks on, her big ears slowly folding back. Duri points at the openings from Reengki's shoulder. Dim shed interior, eureka moment."}, {"text": "바닥엔 마른 대추 씨 몇 알.\n탈의 앞발을 모래에 꾹 눌러 보니\n뭉툭한 발톱 자국이 그대로 찍혔어요!", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat) pressing the costume's stuffed front paw onto the sandy shed floor, lifting it to reveal a stamped print with four blunt claw marks — identical to the granary print. Nearby lie a few dried jujube seeds. Shira crouches to compare. Focused lantern-like light on the print, decisive discovery mood."}, {"text": "둘은 작은 창문으로 다가갔어요.\n어둡고 서늘한 방 안에는\n몹시 마른 엄마 고양이가 누워 있었지요.", "prompt": "View through a torn corner of cloth covering a small window: inside a dim cool room, a very thin adult mother cat lies under a worn blanket, her frail shoulders rising with each labored breath. Outside, Reengki the quokka (wearing his pink felt hat) and Shira peer in side by side, faces gone soft and still. Muted blues and grays, deep quiet compassion."}, {"text": "장녀는 물수건을 꼭 짜서 이마에 올리고\n둘째는 빈 항아리를 두 손으로\n소리 나지 않게 조심조심 내려놓았어요.", "prompt": "Interior scene through the window: the eldest kitten wrings a damp cloth and lays it gently on her mother's forehead, while the second kitten tilts an empty water jar, finds nothing, and lowers it silently with both paws, careful not to make a sound. Their small faces are serious beyond their years. One thin ray of light, tender hushed mood."}, {"text": "막내는 천으로 엮은 그림책을 펼치고\n소리 없이 입만 오물오물 움직였어요.\n예전에 들었던 말을 흉내 내는 거였지요.", "prompt": "Close-up through the window of the smallest kitten sitting against the wall, a handmade picture book of stitched cloth pieces open on its knees, one tiny finger tracing a drawn tiger while its mouth moves silently, remembering a voice. The book's fabric pages show colorful stitched animal shapes. Soft dim light on the kitten's face, heartbreaking sweetness."}, {"text": "링키는 창문 아래에 주저앉았어요.\n시라도 곁에 등을 기대었지요.\n한동안 아무도 말하지 못했어요.", "prompt": "Outside the ruined house, Reengki the quokka (wearing his pink felt hat) sits slumped beneath the small window, knees drawn up, and the sand-colored cat Shira sits beside him leaning against the same wall, both staring ahead in silence. The mouse Duri sits quietly on Reengki's knee. Evening shadows lengthen across the yard, heavy thoughtful stillness."}, {"text": "“우리…… 뭘 찾으러 여기까지 왔지?”\n도둑을 찾아냈는데도\n링키는 아무 대답도 할 수 없었어요.", "prompt": "Wide melancholy shot of the two small figures — Reengki the quokka (wearing his pink felt hat) and the sand-colored cat Shira — sitting tiny against the big ruined house under a vast dusk sky turning violet. The shed with the tiger mask is faintly visible behind. Between them hangs an unanswered silence. Sparse dry grass sways, poignant open-ended mood."}]}, {"ep": 7, "title": "말할 수 없는 비밀", "pages": [{"text": "아침, 광장 벽에 벽보가 붙었어요.\n“도둑을 잡아 오면 상을 준다.”\n쿵, 쿵, 쿵— 못 소리가 세 번 울렸지요.", "prompt": "Morning plaza scene: the granary keeper cat hammers a paper notice onto the clay wall, the sound visualized as bold impact rings. A crowd of cats gathers to read it, some already whittling wooden sticks in the background. Reengki the quokka (wearing his pink felt hat) watches from a distance with a troubled face. Harsh bright morning light, ominous busy mood."}, {"text": "“링키야, 말해야 해.”\n시라가 먼저 입을 열었어요.\n“알고도 숨기면 우리도 같은 편이야.”", "prompt": "Narrow alley confrontation. The sand-colored cat Shira faces Reengki the quokka (wearing his pink felt hat) with serious yellow eyes, one paw raised mid-argument. Reengki looks down at the ground, jaw set. The mouse Duri watches anxiously from between them on a step. Cool shaded alley with a strip of bright sky above, tense friction between friends."}, {"text": "“봤으니까 더 빨리 말해야지!\n다른 이들이 먼저 잡으면 어떡해?”\n“그럼 나보고 어떻게 하라는 거야!”", "prompt": "Emotional peak of the argument: Shira leans forward shouting, ears back, while Reengki the quokka (wearing his pink felt hat) shouts back with clenched fists, both startled by their own voices. Above them, a window shutter snaps closed. Their shadows cross on the alley wall. High contrast light and shadow, painful but non-violent conflict."}, {"text": "“……너는 어차피 떠날 동물이잖아.”\n시라는 스스로도 놀란 듯 귀를 눕혔지만\n사과 대신 먼저 돌아서 버렸어요.", "prompt": "Quiet devastating moment: the sand-colored cat Shira turns her back and walks away down the alley, ears flattened low in regret she won't show. Reengki the quokka (wearing his pink felt hat) stands frozen, hurt washing over his face. Dust drifts in a shaft of light between them. Muted colors, wide space between the two figures, aching mood."}, {"text": "두리가 링키의 신발 끝을 톡톡 쳤어요.\n“시라 편이 아니야. 혼자 가면\n무서울까 봐 따라가는 거야.”", "prompt": "Ground-level close-up of the tiny mouse Duri tapping the shoe tip of Reengki the quokka (wearing his pink felt hat) with one small paw, looking up with earnest apologetic eyes. In the blurred background, Shira's small figure waits at the alley's end. Reengki looks down, touched despite his sadness. Warm low light, bittersweet loyal-friend moment."}, {"text": "링키는 골목에 홀로 남았어요.\n담벼락은 아직 따뜻했지만\n지나가는 바람이 유난히 서늘했지요.", "prompt": "Wide lonely shot of Reengki the quokka (wearing his pink felt hat) standing alone in the empty alley at dusk, arms hanging at his sides, his shadow long on the warm clay wall. A cool breeze lifts a few grains of sand and the corner of his hat's leaf decoration. Empty alley stretching both ways, deep solitary mood, fading orange light."}, {"text": "그날 밤, 링키는 잠들지 못했어요.\n떨리던 아주머니의 손과\n빈 항아리를 안은 아기 고양이가 겹쳐 떠올랐지요.", "prompt": "Night interior of the inn: Reengki the quokka (wearing his pink felt hat resting beside his pillow) lies awake, eyes open, blanket half kicked off. Above him two soft dream-cloud vignettes overlap — the granary keeper's trembling paws dropping jujubes, and the small kitten carefully lowering an empty jar. Moonlight through the window, restless empathetic mood."}, {"text": "링키는 구슬 주머니를 꺼냈어요.\nI와 L, 두 구슬이 톡 부딪쳤어요.\n‘훔친 건 잘못이야. 하지만…….’", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat) sitting cross-legged on his blanket at night, holding an open small pouch on his lap. Two glowing marbles engraved with the letters I and L touch with a tiny spark of light. His face is lit from below by their soft glow, deep in thought. Dark cozy room, contemplative magical mood."}, {"text": "창밖 물골목엔 밤에도 등불이 켜 있었어요.\n‘만약 저 골목이 막혀 있지 않았다면…….’\n링키는 천천히 등을 곧게 폈어요.", "prompt": "View from the inn window at night: far below, a single lantern burns on the wooden platform still blocking the water alley, a guard silhouette lounging on it. In the foreground, Reengki the quokka (wearing his pink felt hat) straightens his back at the windowsill, eyes clearing with realization. Deep blue night, one stubborn orange flame, turning-point mood."}, {"text": "생각만으로는 아무것도 바뀌지 않아요.\n해가 떠오를 무렵, 링키는 담요를 개고\n조용히 자리에서 일어났어요.", "prompt": "Dawn light spills through the inn window as Reengki the quokka (wearing his pink felt hat) folds his blanket into a neat square and stands, silhouetted against the pale gold sky, small but resolute. His bag is packed at his feet and the pink ribbon on his wrist catches the first light. First rooster-hour stillness, quiet courage, hopeful new-day mood."}]}, {"ep": 8, "title": "엄마가 들려준 이야기", "pages": [{"text": "새벽, 마른 풀 끝마다 이슬이 맺혔어요.\n링키는 할 말을 몇 번이나 연습하고\n똑, 똑. 문을 두드렸어요.", "prompt": "Early dawn at the ruined southern house, dewdrops hanging on every blade of dry grass in the yard. Reengki the quokka (wearing his pink felt hat) stands before the old door, one fist raised to knock, rehearsal words floating as faint jumbled letters in a thought bubble above him. Cool misty morning light, nervous brave mood."}, {"text": "문틈으로 노란 눈 하나가 나타났다가\n금세 닫히려 했어요. 링키가 외쳤지요.\n“이를 거였으면 벌써 일렀어!”", "prompt": "Tense close-up of the door open just a crack, one wary yellow kitten eye peering out, the door already pushing shut. Reengki the quokka (wearing his pink felt hat) wedges his foot in the gap, leaning in with an urgent honest expression, both hands raised peacefully. Morning light on his back, dramatic but gentle standoff."}, {"text": "부지깽이를 든 장녀 모라,\n막내를 감싼 둘째 탄이 나타났어요.\n“뭐 하러 왔어?” “물어보러. 왜 그랬는지.”", "prompt": "The door opens to reveal the eldest kitten Mora holding a fire poker defensively, while the second kitten Tan spreads both arms shielding the tiny youngest Mio behind him. Reengki the quokka (wearing his pink felt hat) stands calmly on the doorstep with open empty hands. A single beam of morning light between them, cautious first-meeting tension."}, {"text": "“엄마가 봄부터 기침을 시작했어.\n우물은 광장에 하나뿐인데\n우린 골목 값을 낼 게 없어.”", "prompt": "Dim interior of the poor house where one ray of morning light drifts with slow dust motes. The mother cat breathes weakly under a worn blanket while Mora explains, gesturing toward the empty water jar in the corner. Reengki the quokka (wearing his pink felt hat) listens sitting on the floor, hands clasped tight on his knees. Muted tones, sorrowful honest mood."}, {"text": "“내가 하자고 했어.” “거짓말!”\n그때 미오가 조그맣게 손을 들었어요.\n“……호랑이 흉내는 내가 하자고 한 거야.”", "prompt": "The three kittens in a row: Mora insisting with a raised voice, Tan protesting loudly, and between them the tiny Mio timidly raising one small paw, eyes brimming. Reengki the quokka (wearing his pink felt hat) watches the siblings protect each other, moved. Soft interior light, tender confession moment among small figures."}, {"text": "미오가 천 그림책을 내밀었어요.\n《The Tricky Tiger》\n“엄마가 우리를 위해 만들어 주신 책이야.”", "prompt": "Close-up of the tiny kitten Mio holding out a handmade book of colorful stitched cloth pages toward Reengki the quokka (wearing his pink felt hat). The cover shows a hand-drawn tiger and stitched lettering reading 'The Tricky Tiger'. The first open page shows a little goat, foal and calf beside a big bear waving them away. Warm intimate lighting on the fabric textures."}, {"text": "“내가 읽어 볼까?” 두리가 나섰어요.\n“Babies aren't invited.\n어린애들은 잔치에 오지 말라는 뜻이야.”", "prompt": "The tiny mouse Duri stands proudly on the open cloth book, one paw pointing at stitched English words, reading aloud like a small scholar. The three kittens lean in around the book, first startled by the mouse then captivated. Reengki the quokka (wearing his pink felt hat) smiles encouragingly. Cozy circle of small animals around a glowing book, storytime warmth."}, {"text": "“We'll make a tiger costume. We're ready.”\n그 소리에 미오의 눈물이 후드득!\n“엄마가 읽어 줄 때 나던 소리야…….”", "prompt": "Emotional close-up of the tiny kitten Mio, big tears rolling down as Duri reads from the cloth book. Behind Mio, a faint warm dream-vignette shows the healthy mother cat once reading the same book with the three kittens nestled around her. Mora and Tan look down, holding back tears. Golden memory light against the dim room, deeply tender mood."}, {"text": "“훔친 건 잘못이야. 마을에 말해야 해.\n하지만 말로만 하지 말고, 모두가\n직접 보게 하자. 연극으로!”", "prompt": "Reengki the quokka (wearing his pink felt hat) stands up with new energy, pointing toward the old tiger mask hanging on the shed wall visible through the doorway, his other hand open toward the three kittens. The kittens exchange uncertain but hopeful looks. Duri strikes a tiny theatrical pose. Brightening light, the spark of a plan, uplifting turn."}, {"text": "창고는 온종일 시끌벅적했어요.\n시라도 말없이 들어와 숯을 받았지요.\n모라가 숨을 고르고 말했어요. “We're ready.”", "prompt": "Lively shed workshop scene at golden hour: Reengki the quokka (wearing his pink felt hat) draws jagged charcoal stripes on the tiger costume, Tan sneaks a bite of the dry bread meant for the missing tooth, Mio giggles, and the sand-colored cat Shira quietly joins in, sharing charcoal with Reengki. The finished mask stands proudly at center. Warm busy joyful mood."}]}, {"ep": 9, "title": "Showtime!", "pages": [{"text": "“오늘 밤 호랑이를 잡아요!\n모두 광장으로 오세요!”\n링키는 광장을 세 바퀴나 돌며 외쳤어요.", "prompt": "Daytime plaza scene: Reengki the quokka (wearing his pink felt hat) runs in a circle around the well, hands cupped around his mouth, shouting his announcement. A trail of curious kittens follows behind him like a parade, while adult cats open shutters and lean out of windows above. Bright afternoon light, growing excitement and motion."}, {"text": "해가 지자 광장은 가득 찼어요.\n지붕 위까지 고양이들이 줄줄이!\n링키의 다리는 후들후들 떨렸지요.", "prompt": "Wide nighttime shot of the plaza packed with cats, more perched in rows along the rooftops, torches burning at the edges. At the center stands tiny Reengki the quokka (wearing his pink felt hat), knees visibly trembling, clutching the pink ribbon on his wrist. The well keeper grandmother and stern adults watch from the front. Grand stage-fright atmosphere."}, {"text": "“‘여러분’부터 시작해.” 두리가 속삭였어요.\n링키는 힘껏 외쳤지요.\n“여러분! 호랑이가 여기 있어요!”", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat) with the tiny mouse Duri whispering into his ear from his shoulder. Reengki cups his hands and shouts with all his might, eyes squeezed shut then flying open. The crowd of cat faces around them falls silent mid-murmur, all turning at once. Torchlight, breath-held moment before the show."}, {"text": "어두운 골목에서 주황빛 호랑이가\n천천히 걸어 나왔어요.\n“으악!” 어른들이 우르르 물러났지요.", "prompt": "Dramatic reveal: from a dark alley the patched tiger costume steps slowly into the torch-lit plaza — jagged charcoal stripes, one oddly white bread tooth. Front-row adult cats stumble backward, a dropped wooden stick falling, while a kitten on its mother's lap peeks through parted paws. Reengki the quokka (wearing his pink felt hat) stands calm at center. Theatrical firelight."}, {"text": "호랑이는 아무도 덮치지 않았어요.\n빈 항아리를 톡— 데구루루—\n“이 집에는 마실 물이 없어요.”", "prompt": "The tiger costume gently taps an empty clay water jar with one paw, sending it rolling and spinning across the plaza stones, clearly hollow and dry. The crowd of cats watches in confused silence. Reengki the quokka (wearing his pink felt hat) narrates from the side with a quiet steady voice, one hand extended toward the jar. Torch shadows, hushed pantomime mood."}, {"text": "우물로 가는 길목엔 평상이 떡!\n그 위의 두리가 앞발을 내밀었어요.\n“Pay first.” 광장 곳곳에서 “어?”", "prompt": "Comedic yet pointed scene: a small prop platform of wooden crates blocks the tiger costume's path to the well, and on it sits the tiny mouse Duri with legs crossed, holding out one demanding paw. The tiger turns out its empty pockets, not even dust falling. Watching cats exchange startled knowing glances. Torchlight, satire performed with charm."}, {"text": "호랑이는 광장을 빙— 돌기 시작했어요.\n한 바퀴, 두 바퀴…… 웃음이 사라지고\n세 바퀴째엔 다리가 휘청거렸지요.", "prompt": "The tiger costume trudges in a wide circle around the crowded plaza carrying the empty jar, legs wobbling with exhaustion on the third lap. The cats' faces shift from amusement to dawning shame as they watch — some lowering their eyes, an elder covering her mouth. Reengki the quokka (wearing his pink felt hat) watches quietly. Slow heavy torchlit rhythm, conscience awakening."}, {"text": "“그 집엔 아픈 엄마가 누워 있어요.”\n호랑이는 자루를 탈탈 털었어요.\n겨우 두 손 만큼의 먹을거리였지요.", "prompt": "The tiger costume empties a single sack upside down at the plaza's center: only a small scatter of dried meat and a few jujubes patters onto the stones — barely two handfuls. The granary keeper cat looks down, wringing her apron, her exaggeration exposed gently. No cat holds a stick anymore. Somber torchlight on the tiny pile, quiet moral weight."}, {"text": "탈이 벗겨지자, 땀에 젖은\n아기 고양이 셋이 나타났어요.\n“저희가 훔쳤어요. 죄송합니다.”", "prompt": "The great tiger mask lifts away revealing three small kittens drenched in sweat, holding each other's paws tightly — Mora bowing her head, Tan stepping forward bravely, tiny Mio hugging the cloth picture book to her chest. The entire plaza of cats stands speechless. Reengki the quokka (wearing his pink felt hat) stands protectively near. Poignant torchlit reveal."}, {"text": "그때 굵은 목소리가 울렸어요.\n“도둑을 잡으면 상을 준댔지? 상금은 내 거야.”\n바르 앞을, 링키가 막아섰어요.", "prompt": "The crowd parts as the big torn-eared cat Bar strides forward flanked by two henchcats, the torn-down reward notice crumpled in his paw, reaching toward the three kittens. Small Reengki the quokka (wearing his pink felt hat) plants himself in the way, arms spread wide, legs trembling but unmoving. High tension standoff under torchlight, cliffhanger energy."}]}, {"ep": 10, "title": "모두의 길", "pages": [{"text": "“비켜.” “안 비켜요.”\n링키는 바르보다 한참 작았지만\n두 팔을 활짝 벌린 채 꼼짝도 안 했어요.", "prompt": "Low-angle shot emphasizing the size difference: tiny Reengki the quokka (wearing his pink felt hat) stands with arms stretched wide before the towering torn-eared cat Bar, knees shaking but feet planted. Behind Reengki, Mora hugs little Mio close. The torch-lit crowd holds its breath. David-and-Goliath courage, dramatic warm light."}, {"text": "“저는 사흘 동안 매일 값을 냈어요.\n하지만 저 골목은 원래\n누구나 다닐 수 있는 길이잖아요.”", "prompt": "Reengki the quokka (wearing his pink felt hat) turns from Bar to address the whole plaza, one arm pointing toward the blocked water alley where the wooden platform sits in lantern light. Cat faces in the crowd glance at one another, uncomfortable truths surfacing. Bar scowls but says nothing. Wide plaza shot, torchlight, a small voice filling a big space."}, {"text": "시라가 무거운 물통을 메고 나섰어요.\n“저도 평생 냈어요. 하루 대추 세 알씩.\n돌아가면 다섯 집밖에 못 가요.”", "prompt": "The sand-colored cat Shira steps out of the crowd, a heavy yoke of full water buckets across her small shoulders, chin lifted as she testifies clearly. Water glints in the torchlight. Reengki the quokka (wearing his pink felt hat) looks at her with grateful shining eyes. The crowd listens in stillness. Brave clear-voiced moment, warm firelight."}, {"text": "“나도 냈어.” “나도.”\n하나둘 손이 올라오기 시작했어요.\n카라반 대표도 말했지요. “We paid too.”", "prompt": "Moving wide shot of the plaza as paws rise one after another — the water-carrier auntie, the baker, then dozens more including many tiny kitten paws. A robed desert caravan leader cat steps forward with a raised paw too. A sea of lifted paws in torchlight around Reengki the quokka (wearing his pink felt hat). Swelling solidarity, hopeful crescendo."}, {"text": "쿵! 우물지기 할머니의 지팡이 소리.\n“바르. 누가 길을 막아도 된다고 했지?”\n바르는 아무 말도 못 했어요.", "prompt": "The elderly well keeper cat slams her cane on the plaza stones with a resounding strike, facing the big cat Bar with unwavering authority. Bar's ears droop as he stares at the ground, his two henchcats sliding backward behind him. The crowd watches justice arrive. Commanding pose of a small old cat over a big one, satisfying righteous mood."}, {"text": "그날 밤 회의에서 약속들이 정해졌어요.\n평상은 뜯어 우물가 의자로,\n곳간 옆엔 나눔 ‘바구니’를 놓기로 했지요.", "prompt": "Warm night meeting around the well, the grandmother giving Reengki the quokka (wearing his pink felt hat) a seat in the inner circle. Around them small vignette scenes: cats prying boards off the platform, Bar hammering the granary door in repair, a large woven basket being set beside the granary with a cat placing bread inside. Cozy communal firelight, mending mood."}, {"text": "우물가에서 미오가 물을 벌컥벌컥!\n무섭던 발자국의 주인은\n이렇게 작은 아이들이었어요.", "prompt": "Tender night scene at the well: tiny kitten Mio drinks deeply from a gourd ladle held in both paws, water dribbling down her chin, not stopping until it is empty. Reengki the quokka (wearing his pink felt hat) sits on the well's edge watching her with a soft fond smile. Moonlight and lantern glow on the water, peaceful satisfied quiet."}, {"text": "가방 속에서 툭— 구슬 주머니가 움직였어요.\n어둠 속 눈동자처럼 빛나는 세 번째 구슬.\n글자가 또렷이 떠올랐어요. O!", "prompt": "Magical close-up of Reengki the quokka (wearing his pink felt hat) holding a new glowing marble on his open palm: its inside is dark like a midnight alley with a single round light floating at its center like a watchful eye, and a bright letter O shimmering within. Mio leans in close, nose almost touching it. Sparkles reflect in both their eyes, wonder-filled night."}, {"text": "떠나는 날, 시라가 다가왔어요.\n“그 말, 사과할게. 그리고 이거.”\n모래바람을 막는 천을 둘러 주었지요.", "prompt": "Farewell at the village entrance under the 'THE CAT VILLAGE' sign: the sand-colored cat Shira wraps a thin sand-colored scarf around the neck of Reengki the quokka (wearing his pink felt hat), her eyes shy but warm. Behind them wave the three kittens, Duri on Mora's shoulder, the baker, the water carrier and travelers. The alley to the well stretches open and unblocked. Golden sunset farewell."}, {"text": "사막에 새하얀 털과 낯선 발자국이!\n어둠 저편에서 딸랑, 딸랑—\n방울 소리가 노래처럼 들려왔어요.", "prompt": "Night desert scene under brilliant stars: Reengki the quokka (wearing his pink felt hat and his new scarf) kneels beside a trail of small unfamiliar paw prints, holding up a tiny silver bell necklace with a blank name tag engraved with a single music note on its back. One snow-white hair glints on the sand. Far off in the darkness, faint bell-chime sparkles echo in rhythm. Mysterious enchanting sequel-hook mood."}]}]}, "4": {"chapter": 4, "animal": "말티즈", "animal_en": "maltese puppy", "letter": "V", "village": "몽글몽글 마을", "episodes": [{"ep": 1, "title": "구름처럼 하얀 마을", "pages": [{"text": "링키의 가방 속에서 구슬 세 개가\n반짝반짝 빛났어요. I, L, O!\n“다음 구슬은 어디에 있을까?”", "prompt": "Reengki the quokka (wearing his pink felt hat) rides his little bicycle along a sunny country road, a small satchel open at his side. Three glowing alphabet beads marked I, L and O sparkle inside the satchel. He looks ahead with bright, curious eyes. Rolling green hills and a soft blue sky stretch behind him. Medium wide shot, warm morning light."}, {"text": "언덕을 슝— 넘어가자,\n솜사탕처럼 하얀 마을이 보였어요.\n“우와, 구름이 내려앉은 것 같아!”", "prompt": "Wide shot from a hilltop as Reengki the quokka (wearing his pink felt hat) pauses on his bicycle, gazing down at a village of round white cottages that look like puffs of cotton candy. Fluffy white rooftops cluster in a green valley dotted with daisies. Reengki's mouth is open in delighted wonder. Soft pastel daylight, dreamy atmosphere."}, {"text": "마을 입구 간판에는 이렇게\n적혀 있었죠.\n‘MALTESE VILLAGE’", "prompt": "Reengki the quokka (wearing his pink felt hat) stands beside his bicycle at a village gate, looking up at a wooden signpost that reads 'MALTESE VILLAGE'. The sign is decorated with tiny carved hearts and a white ribbon. Round white cottages are visible beyond the gate. Medium shot, cheerful midday light."}, {"text": "골목마다 하얀 말티즈들이\n복슬복슬 꼬리를 흔들었어요.\n빨랫줄엔 리본이 팔랑팔랑!", "prompt": "A cozy village lane where several fluffy white maltese puppies wag their tails and chat happily. Colorful ribbons flutter on clotheslines strung between white cottages. Reengki the quokka (wearing his pink felt hat) walks his bicycle through the lane, smiling at everyone. Wide shot, warm and lively atmosphere."}, {"text": "광장 게시판에 알록달록\n포스터가 붙어 있었어요.\n‘가족 노래잔치가 열려요!’", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat) standing before a village notice board, studying a colorful poster decorated with musical notes and heart shapes. Curious maltese puppies peek at the poster beside him. A round fountain sparkles in the plaza behind. Soft afternoon light."}, {"text": "그때 어디선가 노랫소리가\n바람을 타고 들려왔어요.\n“라… 라라…” 아주 작은 목소리로요.", "prompt": "Reengki the quokka (wearing his pink felt hat) tilts his head and cups one ear, listening to a faint melody drifting on the breeze. Tiny musical notes float visually through the air from a hillside path. Flower petals drift past him. Medium shot, gentle golden light, curious mood."}, {"text": "노랫소리를 따라 언덕을 오르니,\n작은 마당에서 하얀 강아지가\n혼자 노래 연습을 하고 있었죠.", "prompt": "Wide shot of a small hilltop garden with a white picket fence. A fluffy white maltese puppy stands on a tree stump, singing shyly with eyes closed, small musical notes rising. Reengki the quokka (wearing his pink felt hat) peeks over the fence, charmed. Late afternoon light through apple tree branches."}, {"text": "“앗, 누구세요?” 강아지가\n깜짝 놀라 꼬리를 만 채 물었어요.\n“난 링키! 옆 마을에서 온 쿼카야.”", "prompt": "The maltese puppy jumps back in surprise on the tree stump, ears lifted and tail tucked, while Reengki the quokka (wearing his pink felt hat) waves a friendly paw over the fence with a big warm smile. Close-up on both characters facing each other. Soft warm light, gentle humorous mood."}, {"text": "“나는 보리야. 이 마을에 살아.”\n보리는 수줍게 웃으며\n마을 구경을 시켜 주겠다고 했어요.", "prompt": "The maltese puppy named Bori smiles shyly and gestures with a paw toward the village below, while Reengki the quokka (wearing his pink felt hat) claps his hands in excitement. The white cotton-like village glows in the valley behind them. Medium wide shot, warm sunset colors beginning to appear."}, {"text": "해 질 무렵, 보리네 집 앞에\n도착했어요. 문 너머로\n왁자지껄 즐거운 소리가 들렸죠!", "prompt": "Reengki the quokka (wearing his pink felt hat) and Bori the maltese puppy stand before a round white cottage with a heart-shaped door knocker, warm golden light spilling from the windows. Cheerful shadows of a dog family move behind the curtains. Evening sky in soft purple and orange. Medium shot, cozy inviting mood."}]}, {"ep": 2, "title": "보리네 가족", "pages": [{"text": "문이 활짝 열리자 하얀 털뭉치\n가족이 우르르 나왔어요.\n“보리 왔니? 어머, 손님이네!”", "prompt": "The cottage door swings open and a family of fluffy white maltese dogs pours out warmly: a mother with a flower apron, a father with round glasses, a tiny puppy, and a grandmother with a knitted shawl. Reengki the quokka (wearing his pink felt hat) stands at the doorstep beside Bori, a little shy. Warm lamplight, wide shot."}, {"text": "엄마 솜이, 아빠 구름,\n막내 콩이, 그리고 몽실 할머니.\n모두 보리네 가족이었어요.", "prompt": "Cozy interior of the cottage living room where the maltese family gathers around Reengki the quokka (wearing his pink felt hat): the apron-wearing mother, the father with glasses, the tiny bouncing puppy Kongi, and the gentle grandmother in a rocking chair with a knitted shawl. Family portraits hang on the round walls. Warm interior light, wide shot."}, {"text": "몽실 할머니가 방긋 웃으며\n말했어요. “Welcome! 어서 오렴.\n환영한다는 뜻이란다.”", "prompt": "Close-up of the grandmother maltese in her rocking chair, smiling warmly and reaching out a soft paw to Reengki the quokka (wearing his pink felt hat), who beams back. A knitted blanket rests on her lap and a cup of tea steams beside her. Golden lamplight, tender welcoming mood."}, {"text": "저녁 식탁엔 김이 모락모락 나는\n고구마수프가 놓였어요.\n숟가락 소리가 달그락달그락!", "prompt": "The maltese family and Reengki the quokka (wearing his pink felt hat) sit around a round wooden dinner table with steaming bowls of sweet potato soup. The tiny puppy Kongi holds a big spoon with both paws. Everyone is laughing warmly. Overhead warm light, cozy medium wide shot."}, {"text": "식사 후 할머니가 낡은 오르골의\n태엽을 감았어요. 딸랑딸랑—\n포근한 자장가가 흘러나왔죠.", "prompt": "Close-up of the grandmother maltese gently winding a small antique music box on a side table, delicate musical notes drifting up. Reengki the quokka (wearing his pink felt hat), Bori and Kongi lean in, mesmerized by the glowing little box. Soft warm lamplight, magical tender atmosphere."}, {"text": "“이 자장가는 할아버지가\n만들어 준 노래란다.”\n할머니의 눈이 반달이 되었어요.", "prompt": "The grandmother maltese holds the small music box to her chest with closed happy eyes, remembering. Faint dreamy imagery of musical notes and tiny hearts floats around her rocking chair. Bori and Reengki the quokka (wearing his pink felt hat) listen quietly at her feet. Warm nostalgic lighting, close-up."}, {"text": "보리가 링키에게 속삭였어요.\n“노래잔치에서 할머니께 이 자장가를\n불러 드리고 싶어. 그런데…”", "prompt": "Bori the maltese puppy whispers into the ear of Reengki the quokka (wearing his pink felt hat) in a corner of the warm living room, one paw cupped around his mouth. Bori's eyes are hopeful but nervous. The family chats in the soft-lit background. Close-up on the two friends, secretive cozy mood."}, {"text": "“나는 부끄러움쟁이라\n노래만 하면 목소리가 덜덜 떨려.”\n보리의 귀가 시무룩 처졌어요.", "prompt": "Close-up of Bori the maltese puppy with drooping ears and a worried expression, paws fidgeting together. Reengki the quokka (wearing his pink felt hat) listens with a caring, thoughtful face beside him. Warm lamplight casts soft shadows. Gentle sympathetic mood."}, {"text": "링키가 보리의 손을 꼭 잡았어요.\n“걱정 마! 내가 도와줄게.\n우리 내일부터 같이 연습하자!”", "prompt": "Reengki the quokka (wearing his pink felt hat) clasps Bori the maltese puppy's paws with both hands, eyes shining with encouragement. Bori's face brightens with a hopeful smile. Warm firelight glows behind them in the cozy living room. Close-up, uplifting warm mood."}, {"text": "그날 밤, 딸랑딸랑 오르골 소리를\n들으며 링키는 잠들었어요.\n내일은 어떤 하루가 될까요?", "prompt": "Reengki the quokka (wearing his pink felt hat resting on the bedpost) sleeps snugly under a patchwork quilt in a small guest bed, a peaceful smile on his face. The music box glows faintly on the windowsill under moonlight, tiny notes drifting. Wide shot of the quiet bedroom, dreamy blue night light."}]}, {"ep": 3, "title": "덜덜 떨리는 목소리", "pages": [{"text": "다음 날 아침, 마당은\n햇살로 가득했어요.\n“자, 노래 연습 시작!”", "prompt": "Bright morning in the hilltop garden. Reengki the quokka (wearing his pink felt hat) stands energetically beside the tree stump like a coach, while Bori the maltese puppy steps up onto it nervously. Dew sparkles on the grass and daisies. Wide shot, fresh sunny atmosphere."}, {"text": "링키가 먼저 시범을 보였어요.\n“라라라~♪” 씩씩하고\n우렁찬 목소리였죠.", "prompt": "Reengki the quokka (wearing his pink felt hat) sings boldly on the tree stump with arms spread wide and chest puffed out, big musical notes bursting into the air. Bori the maltese puppy watches from the grass with admiring round eyes. Medium shot, lively cheerful morning light."}, {"text": "이번엔 보리 차례!\n“라… 라라…” 그런데 목소리가\n모기 소리처럼 작아졌어요.", "prompt": "Bori the maltese puppy stands stiffly on the tree stump, singing with squeezed-shut eyes, only tiny faint musical notes coming out. His tail is tucked and paws pressed together. Reengki the quokka (wearing his pink felt hat) leans in, straining to hear. Close-up, gently humorous mood."}, {"text": "구경하던 막내 콩이가 까르르 웃었어요.\n“형아 목소리, 개미 같아!”\n보리의 귀가 축 처졌죠.", "prompt": "The tiny puppy Kongi rolls in the grass giggling, while Bori the maltese puppy stands on the stump with drooping ears and a blushing embarrassed face. Reengki the quokka (wearing his pink felt hat) raises his hands trying to comfort Bori. Wide shot of the sunny garden, light comedic but sympathetic mood."}, {"text": "“괜찮아, 다시 해 보자!\n크게, 더 크게!” 링키가\n두 팔을 번쩍 들며 외쳤어요.", "prompt": "Reengki the quokka (wearing his pink felt hat) throws both arms high in the air with an encouraging grin, demonstrating a big voice. Bori the maltese puppy takes a deep brave breath, cheeks puffed. Sunlight and floating dandelion seeds around them. Medium shot, energetic hopeful mood."}, {"text": "하지만 높은 음만 나오면\n보리의 목소리는 꽁꽁 숨었어요.\n“으으, 또 떨렸어…”", "prompt": "Bori the maltese puppy crouches low on the tree stump covering his face with both paws, a tiny wobbly musical note fading above him. Reengki the quokka (wearing his pink felt hat) scratches his head, puzzled. Soft clouds pass over the sun, slightly deflated mood. Medium shot."}, {"text": "링키는 곰곰이 생각했어요.\n‘크게 부르라고만 하면\n안 되는 걸까…?’", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat) sitting on the grass with chin resting on his hands, deep in thought, a small question mark hovering above his head. Bori sits quietly beside him hugging his knees. Warm afternoon light, contemplative gentle mood."}, {"text": "보리가 작게 말했어요.\n“할머니 앞에서 잘하고 싶어서\n더 떨리는 것 같아…”", "prompt": "Bori the maltese puppy speaks softly with lowered eyes, one paw drawing circles in the dirt, while Reengki the quokka (wearing his pink felt hat) listens closely with a caring expression. A dreamy thought bubble above Bori shows the grandmother smiling. Close-up, tender honest mood, golden hour light."}, {"text": "어느새 해가 뉘엿뉘엿 저물고,\n두 친구의 그림자도\n길게 축 늘어졌어요.", "prompt": "Wide shot of Reengki the quokka (wearing his pink felt hat) and Bori the maltese puppy sitting side by side on the tree stump at sunset, their long shadows stretching across the garden. Both look tired and a little discouraged. Orange and pink sunset sky, quiet melancholy but warm mood."}, {"text": "그때 창가에서 몽실 할머니가\n두 친구를 지그시 바라보았어요.\n할머니는 살짝 미소 지었답니다.", "prompt": "View from the garden of the grandmother maltese watching through a warmly lit round cottage window, a knowing gentle smile on her face. In the foreground, Reengki the quokka (wearing his pink felt hat) and Bori sit on the stump in the dusk, unaware. Medium shot, warm window glow against twilight, mysterious hopeful mood."}]}, {"ep": 4, "title": "할머니의 비밀", "pages": [{"text": "“얘들아, 이리 오렴.”\n할머니가 따끈한 꿀차를\n두 잔 내주었어요.", "prompt": "The grandmother maltese beckons warmly from her rocking chair, holding a tray with two steaming cups of honey tea. Reengki the quokka (wearing his pink felt hat) and Bori the maltese puppy trot toward her in the cozy lamplit living room. Medium shot, inviting golden interior light."}, {"text": "“할머니도 옛날엔 이 마을에서\n자장가를 제일 잘 부르는\n가수였단다.” “정말요?”", "prompt": "The grandmother maltese gestures gently as she tells a story, while a dreamy sepia-toned thought bubble above shows a young maltese singing on a small flower-decorated stage. Reengki the quokka (wearing his pink felt hat) and Bori sit on a rug, eyes wide with amazement. Warm nostalgic lighting, close-up."}, {"text": "“그런데 할머니도 처음엔\n덜덜 떨려서 한 소절도\n못 불렀지 뭐니.” “에이, 설마!”", "prompt": "The grandmother maltese chuckles softly with a paw over her mouth, while Bori the maltese puppy and Reengki the quokka (wearing his pink felt hat) lean forward in disbelief, mouths open. The music box sits on the side table between them. Cozy close-up, playful warm mood."}, {"text": "할머니가 속삭였어요.\n“비밀 하나 알려 줄까?\n사랑받는 마음으로 말하면\n목소리가 따뜻해진단다.”", "prompt": "Close-up of the grandmother maltese leaning in to whisper, one paw beside her mouth, eyes twinkling kindly. Reengki the quokka (wearing his pink felt hat) and Bori lean in close, ears perked. Soft golden lamplight wraps the three of them, tiny heart shapes glowing faintly in the air. Intimate magical mood."}, {"text": "보리가 고개를 갸웃했어요.\n“사랑받는 마음이요?\n그게 뭐예요, 할머니?”", "prompt": "Bori the maltese puppy tilts his head with a big question mark floating above, ears flopping to one side. The grandmother smiles patiently in her rocking chair. Reengki the quokka (wearing his pink felt hat) tilts his head the same way beside Bori, mirroring him. Close-up, cute puzzled mood, warm light."}, {"text": "할머니는 보리를 폭 안아 주며\n말했어요. “우리 보리,\n할머니는 네가 정말 사랑스럽단다.”", "prompt": "The grandmother maltese wraps Bori the maltese puppy in a soft warm hug, her knitted shawl draping around him, both with closed content eyes. Reengki the quokka (wearing his pink felt hat) watches with hands clasped, touched. Gentle heart shapes glow around the hug. Close-up, tender loving mood."}, {"text": "포근한 품에서 나온 보리가\n한 소절을 불렀어요. “라라라~♪”\n어라? 목소리가 몽글몽글해졌어요!", "prompt": "Bori the maltese puppy sings a note with a surprised joyful face, warm round musical notes floating up like little clouds. The grandmother claps softly and Reengki the quokka (wearing his pink felt hat) jumps up in delight. Warm lamplight, sparkles in the air. Medium shot, breakthrough moment mood."}, {"text": "링키는 눈이 동그래졌어요.\n‘노래는 목이 아니라\n마음으로 부르는 거구나!’", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat) with wide sparkling eyes and a hand on his chest, a small glowing heart and musical note appearing above his head as he realizes something important. Bori sings happily in the soft-focus background. Warm golden light, wonder-filled mood."}, {"text": "그날 밤, 두 친구의 연습에는\n새 바람이 불었어요.\n“내일은 더 잘될 것 같아!”", "prompt": "Reengki the quokka (wearing his pink felt hat) and Bori the maltese puppy practice singing together by the fireplace, sheet music pages scattered around, both smiling brightly with warm musical notes mingling above them. The grandmother watches fondly from her rocking chair. Wide cozy shot, hopeful evening mood."}, {"text": "그런데 잠자리에 든 링키의\n표정이 살짝 어두워졌어요.\n무슨 걱정이 있는 걸까요?", "prompt": "Reengki the quokka lies in the guest bed under the patchwork quilt, his pink felt hat on the bedpost, gazing at the moonlit window with a wistful faraway expression. A faint dreamy thought bubble hints at a distant home. Blue quiet night light, gentle melancholy mood, close-up."}]}, {"ep": 5, "title": "아이 러브 유!", "pages": [{"text": "깊은 밤, 링키는 잠이 오지 않아\n창밖의 둥근 달을 바라봤어요.\n‘엄마도 저 달을 보고 있을까…’", "prompt": "Reengki the quokka sits on the windowsill in pajamas, his pink felt hat held gently in his lap, gazing up at a big round full moon. His reflection glows faintly in the glass. A soft thought bubble shows a mother quokka silhouette. Deep blue night, quiet longing mood, medium shot."}, {"text": "“링키야, 안 자?”\n보리가 문틈으로 빼꼼\n고개를 내밀었어요.", "prompt": "Bori the maltese puppy peeks through the slightly open bedroom door, only his fluffy white head visible, ears raised in concern. Reengki the quokka (wearing his pink felt hat) turns from the moonlit windowsill in surprise. Soft moonlight and warm hallway light mix, gentle caring mood, medium shot."}, {"text": "링키가 조용히 말했어요.\n“씩씩한 척했지만…\n사실 우리 가족이 보고 싶어.”", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat) sitting on the windowsill with knees hugged, speaking with honest teary eyes. Bori the maltese puppy sits close beside him, resting a comforting paw on his shoulder. Moonlight bathes them in soft silver-blue, tender heartfelt mood."}, {"text": "다음 날 저녁, 보리네 가족은\n부엌에서 소곤소곤,\n무언가를 몰래 준비했어요.", "prompt": "The maltese family whispers conspiratorially in the warm kitchen: the mother stirring a pot, the father hanging a small paper garland, Kongi carrying cookies on a wobbly tray, Bori shushing everyone with a paw to his lips. Wide shot, warm secretive playful mood, golden kitchen light."}, {"text": "“짜잔—! 링키 환영 저녁이야!”\n콩이가 폴짝 뛰며 외쳤어요.\n“오늘부터 링키도 우리 가족!”", "prompt": "Reengki the quokka (wearing his pink felt hat) stands amazed at the dining room doorway as the maltese family cheers around a table decorated with a paper garland, candles and a small cake. Tiny Kongi leaps joyfully into the air. Confetti-like petals drift down. Wide shot, bursting warm celebration mood."}, {"text": "몽실 할머니가 말했어요.\n“사랑을 전하는 영어 인사를\n알려 줄까? 아이 러브 유!”", "prompt": "The grandmother maltese stands at the head of the table teaching with a raised paw, while the whole family and Reengki the quokka (wearing his pink felt hat) watch attentively. A warm glowing heart floats above the table between them. Candlelit dinner scene, cozy teaching moment, medium shot."}, {"text": "“I love you!” 가족 모두가\n링키를 보며 외쳤어요.\n링키의 눈에 눈물이 그렁그렁.", "prompt": "The maltese family all lean toward Reengki the quokka (wearing his pink felt hat) with open arms and joyful faces, glowing hearts floating above them. Reengki smiles hugely with happy tears sparkling in his eyes, hands pressed to his chest. Close-up on the group, overwhelming warm love, golden light."}, {"text": "“I love you, too!” 하고 외친\n링키의 목소리는 스스로도 놀랄 만큼\n따뜻하고 몽글몽글했답니다.", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat) calling out with arms wide open, his voice visualized as warm round golden musical notes and little hearts filling the air. The maltese family beams around him. Radiant warm light, emotional joyful peak."}, {"text": "그날 밤, 모두 모여 자장가를\n함께 흥얼거렸어요.\n몽글몽글, 참 포근한 밤이었죠.", "prompt": "Wide cozy shot of the whole maltese family and Reengki the quokka (wearing his pink felt hat) cuddled together on the big sofa under one huge knitted blanket, humming with closed eyes, soft musical notes floating up to the ceiling. The music box glows on the table. Dim warm firelight, peaceful loving night."}, {"text": "그런데 다음 날 아침—\n콜록콜록! 어디선가\n기침 소리가 들려왔어요.", "prompt": "Morning light fills the cottage hallway as Reengki the quokka (wearing his pink felt hat) and Bori the maltese puppy stop mid-step, ears perked, alarmed by coughing sounds coming from behind the grandmother's slightly open bedroom door. Worried expressions on both faces. Medium shot, soft morning light with an uneasy mood."}]}, {"ep": 6, "title": "멈춰 버린 오르골", "pages": [{"text": "몽실 할머니가 감기에 걸려\n자리에 눕고 말았어요.\n“콜록콜록… 걱정 말거라.”", "prompt": "The grandmother maltese lies in bed under a thick quilt with a scarf around her neck, smiling weakly. The worried maltese family and Reengki the quokka (wearing his pink felt hat) gather around her bed, the mother placing a wet cloth on her forehead. Soft morning light through lace curtains, tender worried mood, medium shot."}, {"text": "보리는 발을 동동 굴렀어요.\n“노래잔치가 사흘밖에 안 남았는데,\n할머니가 편찮으시다니…”", "prompt": "Bori the maltese puppy paces anxiously in the hallway, paws clasped, while Reengki the quokka (wearing his pink felt hat) tries to reassure him. A wall calendar behind them shows a circled festival date three days away. Muted daylight, anxious mood, medium shot."}, {"text": "“할머니께 자장가를 들려 드리자!”\n링키가 오르골 태엽을 감았어요.\n그런데… 딸랑… 뚝.", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat) winding the little antique music box on the side table while Bori watches hopefully. A single faint musical note fades and breaks apart in the air above the box. Both characters freeze mid-expression. Warm interior light, sudden suspense."}, {"text": "“어? 왜 멈췄지?”\n오르골은 아무리 흔들어도\n소리를 내지 않았어요.", "prompt": "Bori the maltese puppy holds the silent music box to his ear, shaking it gently with a panicked face, while Reengki the quokka (wearing his pink felt hat) peers underneath it. No musical notes appear. The grandmother's bedroom door stands ajar in the background. Close-up, worried urgent mood."}, {"text": "뚜껑을 열어 보니, 작은\n톱니바퀴 하나가 감쪽같이\n사라져 있었어요!", "prompt": "Extreme close-up of the open music box interior showing tiny brass gears, with one gear slot conspicuously empty. Reengki the quokka (wearing his pink felt hat) and Bori press their faces close together, peering inside with shocked round eyes. Warm light glinting on the brass parts, mystery mood."}, {"text": "“이 오르골은 할아버지가\n만들어 주신 거란 말이야…”\n보리의 눈에 눈물이 핑 돌았죠.", "prompt": "Bori the maltese puppy hugs the silent music box tightly to his chest, tears welling in his eyes, ears drooped low. Reengki the quokka (wearing his pink felt hat) gently pats his back. A framed photo of the grandparents sits on the shelf behind them. Soft sad lighting, close-up, emotional mood."}, {"text": "두 친구는 온 집 안을 뒤졌어요.\n소파 밑, 화분 뒤, 계단 틈까지!\n하지만 톱니는 없었어요.", "prompt": "A busy scene of Reengki the quokka (wearing his pink felt hat) crawling under the sofa with only his tail sticking out, while Bori the maltese puppy digs behind a flower pot, cushions and books scattered everywhere. Dust puffs float in the air. Wide shot of the living room, frantic but cute searching mood."}, {"text": "그때 링키는 보았어요.\n구석에서 콩이가 안절부절,\n꼬리를 배배 꼬고 있는 것을요.", "prompt": "Reengki the quokka (wearing his pink felt hat) pauses mid-search and glances across the room where tiny Kongi the puppy fidgets nervously in a corner, twisting his tail with guilty darting eyes. Bori keeps searching, unaware. Medium shot with focus on Kongi, subtle suspicious mood, soft light."}, {"text": "“맞다! 시계방 째깍 아저씨라면\n고칠 수 있을지 몰라!”\n보리가 벌떡 일어났어요.", "prompt": "Bori the maltese puppy leaps up with one paw raised high in sudden inspiration, a glowing lightbulb above his head. Reengki the quokka (wearing his pink felt hat) jumps up too, clutching the music box carefully. Energetic determined poses, warm interior light, medium shot."}, {"text": "창밖엔 먹구름이 몰려오고,\n빗방울이 뚝, 뚝.\n두 친구는 우산을 펼쳤어요.", "prompt": "Reengki the quokka (wearing his pink felt hat) and Bori the maltese puppy stand at the open cottage door opening one big yellow umbrella together, dark rain clouds gathering over the white village and the first raindrops falling. The music box is wrapped safely in a cloth bundle. Wide shot, adventurous determined mood in moody grey-blue light."}]}, {"ep": 7, "title": "빗속의 멜로디", "pages": [{"text": "토독토독 비 내리는 골목 끝,\n‘째깍째깍 시계방’의 불빛이\n노랗게 반짝이고 있었어요.", "prompt": "Rainy village lane at dusk with Reengki the quokka (wearing his pink felt hat) and Bori the maltese puppy sharing a yellow umbrella, walking toward a tiny clock shop with a glowing warm window full of clocks. Rain streaks and puddle reflections shimmer. Wide shot, cozy rainy atmosphere."}, {"text": "하얀 수염의 째깍 아저씨가\n돋보기로 오르골을 살폈어요.\n“음… 톱니가 하나 없구먼.”", "prompt": "Inside the clock shop, an elderly maltese craftsman with a magnifying glass over one eye examines the open music box on a cluttered workbench covered with gears and tools. Reengki the quokka (wearing his pink felt hat) and Bori watch anxiously on tiptoe. Warm workshop lamplight, ticking clocks on every wall, close-up."}, {"text": "“이 톱니는 아주 귀한 물건이라\n지금은 가게에 없단다.”\n두 친구의 어깨가 축 처졌어요.", "prompt": "The elderly maltese craftsman shakes his head gently, holding up an empty parts drawer. Reengki the quokka (wearing his pink felt hat) and Bori the maltese puppy slump with drooping shoulders in front of the workbench. Rain patters on the shop window behind them. Medium shot, disappointed mood in warm light."}, {"text": "“그런데 참, 지난주에 아주 작은\n손님이 똑같은 톱니를 사 갔지.”\n“작은 손님이요?”", "prompt": "The elderly maltese craftsman strokes his white beard thoughtfully, one paw raised as he remembers. A faint thought bubble shows a tiny hooded figure reaching up to the tall counter. Reengki the quokka (wearing his pink felt hat) and Bori exchange wide-eyed curious glances. Close-up, mystery mood, warm lamplight."}, {"text": "돌아오는 길, 보리가 훌쩍였어요.\n“할머니께 자장가를\n못 들려드리면 어떡하지…”", "prompt": "Reengki the quokka (wearing his pink felt hat) and Bori the maltese puppy walk home under the yellow umbrella through the rain, Bori sniffling with his head down. Street lamps glow softly along the wet cobblestone lane. Wide shot from behind, melancholy rainy evening mood."}, {"text": "그때 링키가 걸음을 멈췄어요.\n“오르골이 없으면,\n우리가 오르골이 되면 되잖아!”", "prompt": "Reengki the quokka (wearing his pink felt hat) stops in the rain and spins toward Bori with a brilliant grin, one finger raised high, the umbrella tilting. A glowing lightbulb and musical notes pop above his head. Bori looks up, startled and hopeful. Medium shot, rain sparkling in lamplight, turning-point energy."}, {"text": "두 친구는 빗속에서 자장가를\n흥얼거렸어요. 첨벙첨벙!\n물웅덩이도 박자를 맞췄죠.", "prompt": "Reengki the quokka (wearing his pink felt hat) and Bori the maltese puppy hum and splash playfully through puddles under the umbrella, warm musical notes rising through the rain. Their reflections dance in the water. Wide joyful shot, rain turning gentle, playful musical mood."}, {"text": "그러자 지나가던 마을 강아지들이\n하나둘 따라 흥얼거렸어요.\n골목이 온통 노래로 가득!", "prompt": "A charming rainy street scene where several maltese villagers under colorful umbrellas join in humming, musical notes floating from every direction and mingling above the lane. Reengki the quokka (wearing his pink felt hat) and Bori lead the impromptu chorus, laughing. Wide shot, magical community warmth in the rain."}, {"text": "어느새 비가 그치고,\n하늘엔 커다란 무지개가\n걸려 있었답니다.", "prompt": "Wide shot of the white cotton-like village gleaming after rain, a huge vivid rainbow arching over the rooftops. Reengki the quokka (wearing his pink felt hat) and Bori the maltese puppy stand on the wet lane pointing up at it in wonder, the closed umbrella at their side. Fresh clear evening light, hopeful uplifting mood."}, {"text": "집에 돌아오니, 콩이 방에서\n달그락달그락 이상한 소리가\n들려왔어요. 무슨 소리일까요?", "prompt": "Nighttime cottage hallway where Reengki the quokka (wearing his pink felt hat) and Bori the maltese puppy press their ears against Kongi's bedroom door, eyes wide with curiosity. A sliver of light glows under the door with faint clinking sound effects visualized as small rattling lines. Close-up, suspenseful cute mood."}]}, {"ep": 8, "title": "콩이의 비밀 상자", "pages": [{"text": "끼익— 문을 열자,\n콩이가 화들짝 놀라며\n작은 상자를 숨겼어요.", "prompt": "Kongi the tiny maltese puppy spins around in his cluttered little bedroom, hiding a small wooden box behind his back with a startled guilty face. Reengki the quokka (wearing his pink felt hat) and Bori stand at the open door. Scattered tools and ribbon on the floor. Medium shot, caught-in-the-act moment, warm lamplight."}, {"text": "보리가 소리쳤어요.\n“콩이 너지! 네가 오르골\n톱니를 가져갔구나!”", "prompt": "Bori the maltese puppy points an accusing paw at Kongi, brows furrowed, while the tiny puppy shrinks back clutching the hidden box. Reengki the quokka (wearing his pink felt hat) raises both hands between them, alarmed. Tense but child-friendly confrontation, close-up, warm room light."}, {"text": "콩이의 눈에 눈물이\n그렁그렁 맺혔어요.\n“그, 그게 아니라…”", "prompt": "Extreme close-up of Kongi the tiny maltese puppy with huge teary eyes and trembling lips, hugging the small wooden box to his chest. Soft lamplight catches the welling tears. Bori's stern expression begins to soften in the blurred foreground. Emotional tender mood."}, {"text": "상자 안에는 반짝이는 새 톱니와\n삐뚤빼뚤 편지가 들어 있었어요.\n‘할머니, 빨리 나으세요.’", "prompt": "Close-up of the opened wooden box revealing a shiny new brass gear nestled in cotton and a cr
