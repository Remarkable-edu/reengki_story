ute. Reengki the quokka (wearing his pink felt hat) follows behind, watching in admiration. A line of ribbons trails up the colorful slope."}, {"text": "저녁, 마을 회의가 열렸어요.\n\"새 길을 냅시다!\" 바우가 외쳤죠.", "prompt": "Wide shot of a cozy evening village meeting around a big wooden table lit by acorn lanterns. The tiger stands tall with one paw raised, speaking with determination. Squirrels, the badger, the goat elder, and Reengki the quokka (wearing his pink felt hat) all listen closely."}, {"text": "\"덤불이 너무 많아…\" \"비탈이 가팔라…\"\n친구들은 고개를 절레절레.", "prompt": "Medium shot of the worried villagers shaking their heads around the meeting table, ears drooping and paws fidgeting. The squirrel siblings exchange doubtful looks. Warm lantern light makes long soft shadows, and the mood is hesitant but gentle."}, {"text": "산양 할아버지도 걱정했어요.\n\"축제까지 겨우 일주일이란다.\n시간이 모자라지 않겠니?\"", "prompt": "Close-up of the old mountain goat elder adjusting his round glasses with a worried frown, pointing at a small calendar board. The tiger and Reengki the quokka (wearing his pink felt hat) listen thoughtfully across the table. Lantern light flickers over their faces."}, {"text": "링키가 손을 번쩍 들었어요.\n\"저, 저도 도울게요! 음… 아마도?\"\n목소리가 기어들어 갔죠.", "prompt": "Medium shot of Reengki the quokka (wearing his pink felt hat) raising his little paw high but with a shy nervous face, cheeks slightly blushing. The villagers turn to look at him with gentle surprise. The tiger smiles proudly at the small brave quokka."}, {"text": "바우가 링키의 어깨를 토닥토닥.\n\"결정할 땐 이렇게 말하는 거야.\nLet's go! 가자! 라고.\"", "prompt": "Warm close-up of the big tiger patting Reengki the quokka (wearing his pink felt hat) on the shoulder with his huge gentle paw. The tiger's face is bright and encouraging as he speaks. Cozy lantern glow surrounds the two friends like a spotlight."}, {"text": "\"레츠 고…?\" 링키는 따라 했지만\n마음은 아직 콩닥콩닥.\n과연 길을 낼 수 있을까요?", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat) clenching his tiny fists with a mix of nervousness and budding courage, eyes looking up at the dark mountain outside the window. Stars twinkle over the autumn peak. The mood is hopeful anticipation."}]}, {"ep": 4, "title": "마음의 힘", "pages": [{"text": "다음 날 아침, 바우와 링키는\n호미와 밧줄을 챙겼어요.\n도토와 도리도 따라나섰죠.", "prompt": "Bright morning wide shot of the big tiger carrying coiled ropes and small tools on his back, with Reengki the quokka (wearing his pink felt hat) holding a tiny hoe. The two squirrel siblings march behind with little baskets. Dew sparkles on the red maple leaves along the trail."}, {"text": "\"하나, 둘, 셋! Let's go!\"\n바우의 우렁찬 소리에\n모두 씩씩하게 출발!", "prompt": "Energetic wide shot of the tiger raising his paw high as the group cheers and sets off up the bushy slope. Reengki the quokka (wearing his pink felt hat) and the squirrels pump their fists in the air. Leaves swirl around the excited party in golden morning light."}, {"text": "바우는 큰 발로 덤불을 척척,\n도토와 도리는 잔가지를 사사삭.", "prompt": "Medium action shot of the big tiger pushing thick bushes aside with his strong paws, clearing a rough path. The two squirrels nibble and snip small twigs, tossing them into neat piles. Sunlight streams through the autumn canopy onto the busy workers."}, {"text": "링키는 돌멩이를 나르다가\n데굴— 굴려서 발등을 콩!\n\"아이코!\"", "prompt": "Comical close-up of Reengki the quokka (wearing his pink felt hat) hopping on one foot after dropping a round stone on his toes, face scrunched in an exaggerated ouch. The dropped stone rolls away down the slope. The squirrels peek over with sympathetic giggles."}, {"text": "밧줄을 당기다 미끄러지고,\n낙엽 더미에 폭 파묻히고.\n링키는 시무룩해졌어요.", "prompt": "Medium shot of Reengki the quokka (wearing his pink felt hat) buried up to his chest in a big pile of fallen leaves, only his head and hat poking out, looking deflated. A slack rope lies beside him. The autumn slope rises steeply behind, work half finished."}, {"text": "\"난 힘도 약하고 서툴러…\"\n링키의 귀가 축 처졌죠.", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat) sitting on a tree stump with drooping ears and sad eyes, hugging his knees. Fallen red leaves drift slowly around him in the quiet afternoon light. The mood is gentle melancholy."}, {"text": "바우가 곁에 앉으며 말했어요.\n\"힘은 몸에만 있는 게 아니야.\n마음에도 있단다.\"", "prompt": "Heartwarming medium shot of the big tiger sitting down beside the little quokka on the stump, speaking softly. Reengki the quokka (wearing his pink felt hat) looks up at the tiger's kind face. Warm sunset light bathes the two friends among the maples."}, {"text": "\"마음의 힘?\"\n\"그래. '하기로 정하는 힘'이지.\n그게 제일 센 힘이야.\"", "prompt": "Close-up of the tiger gently tapping his own chest with one paw while smiling at Reengki the quokka (wearing his pink felt hat). The quokka's eyes begin to sparkle with understanding. Soft orange dusk light glows through the leaves behind them."}, {"text": "링키는 주먹을 꼭 쥐었어요.\n\"나, 내일도 또 올래!\"\n바우가 씩 웃었죠.", "prompt": "Medium shot of Reengki the quokka (wearing his pink felt hat) standing up on the stump with both fists clenched in determination, eyes shining. The big tiger grins proudly beside him. The evening sky glows pink and orange over the half-cleared trail."}, {"text": "그날 밤 링키는 결심했어요.\n'내가 잘하는 걸로 도울 거야!'\n그게 뭘까요?", "prompt": "Cozy night close-up of Reengki the quokka (wearing his pink felt hat) lying in a little guest bed by a round window, eyes open with a bright idea forming, one paw raised. Moonlight and a few glowing lanterns shine on the autumn village outside. The mood is quiet excitement."}]}, {"ep": 5, "title": "링키의 응원 노래", "pages": [{"text": "다음 날, 링키는 나뭇잎 나팔을\n만들어 갔어요.\n\"내가 잘하는 건 노래니까!\"", "prompt": "Morning close-up of Reengki the quokka (wearing his pink felt hat) proudly holding a little trumpet rolled from a big golden maple leaf. His face beams with fresh confidence. The sunny village path stretches behind him toward the mountain slope."}, {"text": "\"영차 영차, 단풍고개!\n한 발 두 발, 길이 된다!\"\n링키가 노래를 시작했어요.", "prompt": "Lively medium shot of Reengki the quokka (wearing his pink felt hat) standing on a rock, singing loudly through his leaf trumpet with sparkling musical energy. Colorful leaves spiral around him like dancing notes. The workers on the slope turn toward the cheerful sound."}, {"text": "신기한 일이 벌어졌어요.\n노래에 맞춰 모두의 손발이\n척척 맞기 시작한 거예요!", "prompt": "Wide rhythmic shot of the tiger, squirrels, and villagers working in perfect unison on the slope, moving like a joyful dance to the beat. Reengki the quokka (wearing his pink felt hat) conducts from his rock with his leaf trumpet. Leaves and wood chips fly in playful arcs."}, {"text": "바우가 바위를 굴릴 때\n링키가 외쳤죠. \"You can do it!\"\n\"유 캔 두 잇! 넌 할 수 있어!\"", "prompt": "Action medium shot of the big tiger pushing a boulder aside with mighty effort, muscles taut, while Reengki the quokka (wearing his pink felt hat) cheers him on with both paws raised. The squirrels wave little leaf flags. Bright midday sun lights the colorful hillside."}, {"text": "도토와 도리도 따라 불렀어요.\n\"유 캔 두 잇! 영차 영차!\"", "prompt": "Cute close-up of the two squirrel siblings singing at the top of their lungs while hauling a small bundle of branches together. Their cheeks puff with effort and joy. Reengki the quokka (wearing his pink felt hat) sings along beside them in the leafy sunlight."}, {"text": "오소리 아주머니는 꿀떡을,\n산양 할아버지는 물을 날라 왔어요.\n마을이 조금씩 움직였죠.", "prompt": "Warm wide shot of the kindly badger arriving with a basket of maple-honey rice cakes and the old goat elder carrying a water jug up the slope. Workers pause to wave happily. The new trail is visibly taking shape through the bushes behind them."}, {"text": "해 질 무렵, 비탈길 반쯤에\n제법 길다운 길이 생겼어요!", "prompt": "Wide sunset shot of a neat new dirt path winding halfway up the autumn slope, lined with ribbon markers. The tired but proud group stands along the path admiring their work. Golden-orange light floods the valley of red maples below."}, {"text": "\"봐, 링키. 네 노래가\n모두의 마음에 힘을 줬어.\"\n바우가 엄지를 척!", "prompt": "Close-up of the big tiger giving a huge thumbs-up with his paw, grinning at Reengki the quokka (wearing his pink felt hat). The quokka blushes happily holding his leaf trumpet. Warm dusk light wraps the two friends on the new trail."}, {"text": "링키는 가슴이 뿌듯했어요.\n'마음의 힘, 조금 알 것 같아!'", "prompt": "Tender close-up of Reengki the quokka (wearing his pink felt hat) pressing both paws over his chest with a proud glowing smile, eyes closed in contentment. Fireflies and drifting leaves sparkle in the twilight air around him."}, {"text": "그런데 그날 밤, 하늘에서\n우르릉— 소리가 들려왔어요.\n무슨 일이 생기려는 걸까요?", "prompt": "Wide night shot of the cozy village under gathering dark clouds, a soft rumble suggested by swirling sky and swaying lanterns. Reengki the quokka (wearing his pink felt hat) looks out a round window at the cloudy peak. The mood is gentle suspense, not frightening."}]}, {"ep": 6, "title": "비바람이 몰아친 밤", "pages": [{"text": "밤새 비가 쏴아아 내렸어요.\n링키는 창밖을 보며\n밤새 뒤척였죠.", "prompt": "Cozy interior night shot of Reengki the quokka (wearing his pink felt hat) wrapped in a blanket, watching heavy rain streak down a round window. Warm candlelight glows inside while the storm blurs the village lights outside. His face shows quiet worry."}, {"text": "아침이 되자 비는 그쳤지만,\n새로 낸 길이 진흙에\n주르륵 쓸려 있었어요.", "prompt": "Wide morning-after shot of the new trail partly washed away, muddy streaks running down the slope and ribbon markers dangling loose. Puddles mirror the grey-blue clearing sky. Reengki the quokka (wearing his pink felt hat) and the tiger stand at the trailhead looking at the damage."}, {"text": "\"우리 길이…!\" 도리의 눈에\n눈물이 그렁그렁 맺혔어요.", "prompt": "Close-up of a small squirrel with big teary eyes looking at the muddy ruined path, her sibling patting her back gently. Reengki the quokka (wearing his pink felt hat) stands beside them with a sympathetic expression. Wet red leaves stick to the ground everywhere."}, {"text": "게다가 등불을 실은 수레가\n불어난 개울가 통나무 다리에\n덜컹 걸려 버렸지 뭐예요!", "prompt": "Wide shot of a wooden cart full of acorn lanterns stuck at an angle on a slippery log bridge over a swollen sparkling stream. The cart wheel is wedged between logs. Villagers gather at the bank with worried faces under the clearing morning sky."}, {"text": "\"등불이 없으면 축제도 없어…\"\n친구들은 발만 동동 굴렀어요.", "prompt": "Medium shot of anxious villagers pacing on the stream bank, the badger wringing her paws and the goat elder tugging his beard. The lantern cart teeters gently on the bridge behind them. The mood is worried but warm, with soft misty light."}, {"text": "그때 바우가 앞으로 성큼!\n\"울고 있을 시간에 움직이자.\n지금, 바로!\"", "prompt": "Heroic medium shot of the big tiger stepping boldly to the front of the group, standing tall with a determined confident expression, one paw pointing at the bridge. The villagers look up at him with renewed hope. Sunbeams break through the clouds behind him."}, {"text": "바우의 눈이 반짝 빛났어요.\n\"도토, 도리는 밧줄!\n링키는 노래로 박자를!\"", "prompt": "Dynamic close-up of the tiger giving quick clear directions, eyes shining, as the squirrels dash off to grab ropes. Reengki the quokka (wearing his pink felt hat) salutes with his leaf trumpet ready. Everyone springs into coordinated motion by the stream."}, {"text": "\"하나, 둘, 셋! Ready, set, go!\"\n\"레디, 셋, 고!\"\n모두가 한목소리로 외쳤죠.", "prompt": "Energetic wide shot of the whole team shouting together in unison by the log bridge, ropes taut in their paws. Reengki the quokka (wearing his pink felt hat) beats time with his arms like a tiny conductor. Spray from the lively stream sparkles in the morning light."}, {"text": "바우가 다리를 꽉 붙들고\n친구들이 수레를 영차영차!", "prompt": "Action wide shot of the big tiger bracing the log bridge steady with his powerful forelegs while squirrels and villagers heave the lantern cart with ropes. Reengki the quokka (wearing his pink felt hat) pulls at the front rope with all his might. Tension and teamwork fill the scene."}, {"text": "수레가 조금씩 움직였어요.\n과연 등불을 구할 수 있을까요?", "prompt": "Suspenseful close-up of the cart wheel slowly lifting free from between the wet logs, lanterns jingling inside the cart. Straining paws grip the ropes at the edge of the frame. The swollen stream glitters below, the outcome hanging in the balance."}]}, {"ep": 7, "title": "구해 낸 등불 수레", "pages": [{"text": "수레는 무겁고 다리는 미끌미끌.\n바퀴가 자꾸 헛돌았어요.\n끼익, 끼익!", "prompt": "Tense medium shot of the lantern cart's wheels spinning and slipping on the wet log bridge despite everyone pulling hard. The tiger grits his teeth holding the bridge steady. Reengki the quokka (wearing his pink felt hat) frowns in thought while gripping the rope."}, {"text": "링키가 번뜩 소리쳤어요.\n\"바퀴 밑에 둥근 나무를 깔면\n데굴데굴 굴러갈 거야!\"", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat) with a lightbulb-moment expression, pointing excitedly at a pile of small round logs by the stream bank. His eyes sparkle with the clever idea. The squirrels turn toward him with hopeful faces."}, {"text": "\"좋은 생각이야! 바로 하자!\"\n바우는 망설이지 않았어요.", "prompt": "Medium shot of the big tiger nodding firmly with a decisive grin, already reaching for the round logs with his free paw. His quick confident movement inspires the villagers into action. Morning light glows on the busy stream bank."}, {"text": "통나무를 데구르르 깔자\n수레가 스르륵 움직였어요!", "prompt": "Action close-up of small round logs laid like rollers under the cart wheels, the cart gliding smoothly forward across the bridge. Squirrels scurry to move the rear log to the front. The lanterns sway gently as the cart finally moves."}, {"text": "\"영차! You can do it!\"\n\"조금만 더! 유 캔 두 잇!\"", "prompt": "Joyful wide shot of the whole team pulling together in rhythm, chanting with bright faces as the cart rolls along the log rollers. Reengki the quokka (wearing his pink felt hat) leads the cheer from the front. Sunlight bursts across the sparkling stream."}, {"text": "마침내 수레가 언덕 위로 쑥!\n등불들이 짤랑짤랑 무사했어요.", "prompt": "Triumphant wide shot of the lantern cart safely rolling onto the grassy bank as everyone throws their paws up in celebration. Acorn lanterns jingle unharmed in the cart. The big tiger releases the bridge and shakes water from his fur with a relieved smile."}, {"text": "\"와아—!\" 모두 얼싸안고\n폴짝폴짝 뛰었지요.", "prompt": "Heartwarming medium shot of Reengki the quokka (wearing his pink felt hat), the squirrels, the badger, and the goat elder hugging and jumping in a happy circle. The tiger laughs warmly beside the rescued cart. Autumn leaves rain down like confetti."}, {"text": "산양 할아버지가 말했어요.\n\"바우야, 네 결단이 등불을 살렸다.\n고맙구나.\"", "prompt": "Touching close-up of the old goat elder placing his hoof gratefully on the big tiger's paw, eyes moist behind his round glasses. The tiger bows his head humbly. Soft golden light and drifting leaves make the moment tender."}, {"text": "바우는 링키를 보며 웃었어요.\n\"네 꾀와 노래도 한몫했지!\"", "prompt": "Warm close-up of the tiger winking at Reengki the quokka (wearing his pink felt hat) and ruffling the fur on his head with one gentle paw. Reengki giggles bashfully holding his leaf trumpet. The rescued lantern cart glows softly behind them."}, {"text": "하지만 쓸려 간 길이 남았어요.\n축제까지 남은 날은 사흘.\n다시 해낼 수 있을까요?", "prompt": "Wide evening shot of the group gazing up at the muddy half-ruined trail on the slope, silhouetted against a pink and orange sunset. Reengki the quokka (wearing his pink felt hat) stands beside the tiger, both looking determined. Three lantern flames flicker like a countdown in the foreground."}]}, {"ep": 8, "title": "커다란 바윗돌", "pages": [{"text": "마을 친구들이 모두 모였어요.\n\"이번엔 다 같이 하자!\"\n호미와 삽이 반짝반짝.", "prompt": "Bright morning wide shot of the whole village gathered at the trailhead with hoes, shovels, and baskets, faces full of resolve. The big tiger stands at the center with Reengki the quokka (wearing his pink felt hat) on his shoulder. Tools gleam in the crisp autumn sunlight."}, {"text": "진흙길엔 낙엽과 자갈을 깔고\n미끄러운 곳엔 밧줄 손잡이를.\n길이 다시 살아났어요.", "prompt": "Busy medium shot of villagers spreading gravel and dry leaves over the muddy path while squirrels tie rope handrails between trees. Reengki the quokka (wearing his pink felt hat) pats the ground flat with a tiny wooden board. The repaired trail winds neatly up the colorful slope."}, {"text": "그런데 마지막 모퉁이에\n집채만 한 바윗돌이 떡!", "prompt": "Wide dramatic shot of an enormous round boulder sitting squarely on the final bend of the trail, blocking the way to the summit. The group stops and stares up at it, tiny in comparison. Red maples frame the huge stone under a clear blue sky."}, {"text": "모두 밀어 봤지만 바위는\n꿈쩍도 하지 않았어요.\n\"영차! …안 되잖아.\"", "prompt": "Comical medium shot of the whole group pushing the giant boulder with all their might, cheeks puffed and feet sliding, but the rock not moving an inch. Even the big tiger strains with his shoulder against it. Little dust clouds puff around their scrambling feet."}, {"text": "\"돌아가는 길을 낼까?\"\n\"시간이 없는데…\"\n또 웅성웅성 망설임이 시작됐죠.", "prompt": "Medium shot of the villagers huddling again in doubt, some pointing around the boulder, others shaking their heads at the sinking sun. Reengki the quokka (wearing his pink felt hat) watches the hesitation spread. The boulder looms quietly behind them."}, {"text": "그때 링키가 바우를 봤어요.\n바우가 고개를 끄덕였죠.\n\"정하자. 우리는 넘는다!\"", "prompt": "Powerful close-up of Reengki the quokka (wearing his pink felt hat) and the big tiger exchanging a determined look, then the tiger declaring boldly with a raised paw. The wavering villagers straighten up with fresh courage. Late golden light rims the tiger's confident face."}, {"text": "긴 통나무를 바위 밑에 끼우고\n다 같이 지렛대처럼 눌렀어요.\n\"하나, 둘, 셋! Let's go!\"", "prompt": "Action wide shot of the team wedging a long sturdy log under the boulder like a lever, everyone hanging onto the raised end together. The tiger pushes at the very tip while Reengki the quokka (wearing his pink felt hat) counts down with raised arms. Muscles and hopes strain in unison."}, {"text": "우지끈… 데구르르르—!\n바위가 비탈 아래로 굴러가\n폭신한 덤불에 폭 안겼어요.", "prompt": "Dynamic wide shot of the giant boulder tipping off the trail and rolling harmlessly down the empty slope into a big soft bush, leaves bursting up like a green-orange splash. The team tumbles backward in happy surprise. Nobody is anywhere near the boulder's path."}, {"text": "길이 뻥 뚫렸어요!\n산꼭대기가 바로 저기!\n\"우리가 해냈어!\"", "prompt": "Triumphant wide shot of the completed trail curving up to the visible summit, the group cheering and hugging on the cleared bend. Reengki the quokka (wearing his pink felt hat) rides the tiger's head waving his hat high. The peak glows in warm late-afternoon light."}, {"text": "이제 남은 건 단 하나,\n등불 축제의 밤이에요.\n산꼭대기엔 어떤 풍경이 기다릴까요?", "prompt": "Serene dusk wide shot of the finished trail lined with unlit acorn lanterns waiting on posts, winding all the way to the summit. Reengki the quokka (wearing his pink felt hat) and the tiger gaze up the path side by side. The first stars appear over the crimson mountain."}]}, {"ep": 9, "title": "단풍 등불 축제", "pages": [{"text": "드디어 축제의 날 저녁,\n새 길을 따라 등불이\n하나둘 켜졌어요.", "prompt": "Magical wide shot of the new mountain trail at dusk as acorn lanterns light up one by one along its winding curve. Villagers with small lantern poles walk the path. The warm dots of light glow like a golden river through the dark red forest."}, {"text": "도토리 등불이 줄지어 반짝반짝,\n단풍잎 사이로 별처럼 빛났죠.", "prompt": "Dreamy close-up of glowing acorn lanterns strung between maple branches, their warm light shining through translucent red and gold leaves. Soft bokeh sparkles fill the night air. Reengki the quokka (wearing his pink felt hat) gazes up at them with wonder-filled eyes."}, {"text": "마을 친구들이 새 길을 걸어\n산꼭대기에 올랐어요.\n\"이 길, 우리가 만든 길이야!\"", "prompt": "Wide shot of the villagers walking proudly up the lantern-lit trail in a cheerful procession, squirrels skipping and the badger carrying treats. The big tiger walks at the front with Reengki the quokka (wearing his pink felt hat) on his back. Everyone beams with pride."}, {"text": "꼭대기에 서자 온 산의 단풍이\n바다처럼 넘실넘실 펼쳐졌어요.", "prompt": "Breathtaking panoramic wide shot from the summit showing endless waves of autumn foliage rolling like a crimson and gold sea under a deep blue twilight sky. The small silhouettes of the tiger and Reengki the quokka (wearing his pink felt hat) stand at the edge taking in the view."}, {"text": "산양 할아버지가 외쳤어요.\n\"올해의 첫 등불은\n바우와 링키가 켜 주렴!\"", "prompt": "Medium shot of the old goat elder announcing warmly beside a grand unlit lantern on the summit, gesturing toward the tiger and Reengki the quokka (wearing his pink felt hat). The gathered villagers clap and cheer. Anticipation glows on every face in the twilight."}, {"text": "바우와 링키가 큰 등불을 켜자\n와아— 함성이 터졌어요.", "prompt": "Radiant medium shot of the big tiger and Reengki the quokka (wearing his pink felt hat) together lighting the grand summit lantern, its golden light blooming across their happy faces. Villagers cheer with raised paws around them. Warm light spills over the mountaintop."}, {"text": "링키의 축하 무대가 시작됐어요.\n\"영차 영차, 단풍고개!\"\n모두 어깨동무하고 따라 불렀죠.", "prompt": "Festive wide shot of Reengki the quokka (wearing his pink felt hat) singing and dancing on a small wooden stage under the grand lantern, arms wide with joy. Villagers link shoulders and sway along in a circle. Lanterns and drifting leaves swirl in the celebration night."}, {"text": "바우도 쿵쿵 발장단을 맞췄어요.\n순한 호랑이의 커다란 웃음소리가\n산에 울려 퍼졌죠.", "prompt": "Joyful medium shot of the big tiger stomping his paws to the beat and laughing heartily, head thrown back, beside the stage. Squirrels bounce on his shoulders. The lantern-lit summit party glows warmly against the starry sky."}, {"text": "\"링키야, 오늘 알았지?\n정하고 밀고 나가는 힘,\n그게 결단이야.\"", "prompt": "Quiet warm close-up of the tiger and Reengki the quokka (wearing his pink felt hat) sitting together at the summit edge, away from the party lights, talking softly. The tiger's gentle eyes reflect lantern glow. The vast dark valley twinkles below them."}, {"text": "링키는 밤하늘을 올려다봤어요.\n가슴속에서 무언가 반짝!\n내일은 어떤 일이 기다릴까요?", "prompt": "Dreamy close-up of Reengki the quokka (wearing his pink felt hat) gazing up at a sky full of stars, one bright star twinkling above the mountain. His chest seems to glow softly with warmth. Lantern light and falling leaves frame the hopeful night scene."}]}, {"ep": 10, "title": "열세 번째 구슬 G", "pages": [{"text": "다음 날 아침, 바우가 링키를\n산꼭대기로 불렀어요.\n아침 안개가 몽글몽글.", "prompt": "Serene morning wide shot of the big tiger and Reengki the quokka (wearing his pink felt hat) standing on the summit above a sea of soft white morning mist. Autumn peaks poke through the clouds like islands. Gentle sunrise light paints everything gold and pink."}, {"text": "\"링키야, 너는 노래로 마음을 모으고\n포기하지 않기로 정했어.\n그게 진짜 힘이란다.\"", "prompt": "Warm close-up of the tiger speaking earnestly to Reengki the quokka (wearing his pink felt hat), one large paw resting gently on the quokka's small shoulder. Reengki listens with shining moved eyes. Morning mist glows softly around the two friends."}, {"text": "바우가 내민 커다란 발 위에\n주황빛 구슬이 반짝!\n알파벳 G가 새겨져 있었죠.", "prompt": "Magical close-up of the tiger's big open paw holding a glowing orange marble engraved with the letter G, sparkling in the sunrise. Reengki the quokka (wearing his pink felt hat) reaches for it with awe-struck wide eyes. Light rays burst gently from the radiant marble."}, {"text": "\"결단의 구슬 G야.\n망설여질 때 꼭 쥐렴.\n그리고 외치는 거야. Let's go!\"", "prompt": "Medium shot of the tiger closing Reengki's tiny paws around the orange marble with both of his big paws, smiling with proud encouragement. Reengki the quokka (wearing his pink felt hat) nods with determination. Warm golden morning light wraps the tender moment."}, {"text": "\"고마워, 바우! Thank you!\"\n링키의 눈이 그렁그렁.\n구슬은 이제 열세 개!", "prompt": "Heartfelt close-up of Reengki the quokka (wearing his pink felt hat) hugging the tiger's big foreleg with teary happy eyes, the orange marble glowing in his paw. His open satchel shows thirteen marbles now shimmering together. Maple leaves drift softly around them."}, {"text": "마을 친구들이 모두 나와\n손을 흔들었어요.\n\"또 와, 링키! 꼭 와!\"", "prompt": "Wide farewell shot at the village entrance with squirrels, the badger, the goat elder, and villagers all waving warmly. Acorn lanterns sway above them in the breeze. Reengki the quokka (wearing his pink felt hat) waves back with his hat held high."}, {"text": "도토와 도리는 도토리 꿀떡을\n가방에 한가득 넣어 줬어요.\n\"가다가 배고프면 먹어!\"", "prompt": "Sweet close-up of the two squirrel siblings stuffing wrapped maple-honey rice cakes into Reengki's satchel, cheeks round with smiles. Reengki the quokka (wearing his pink felt hat) laughs as the bag bulges full. The cozy village street glows in the morning sun."}, {"text": "바우는 고개 끝까지\n링키를 등에 태워다 줬어요.\n\"다음은 유니콘 마을이란다.\"", "prompt": "Wide shot of the big tiger carrying Reengki the quokka (wearing his pink felt hat) on his back along the ridge trail to the far end of the mountain pass. Falling leaves swirl behind them like a golden ribbon. The distant horizon opens toward soft pastel clouds."}, {"text": "\"꿈과 상상의 친구, 유니콘이\n너를 기다리고 있을 거야.\"\n하늘엔 무지개가 살짝 걸렸죠.", "prompt": "Dreamlike wide shot of the tiger and Reengki the quokka (wearing his pink felt hat) at the edge of the pass, gazing at a faint beautiful rainbow arching over distant pastel clouds beyond the autumn valley. The path ahead glitters with promise. The mood is wonder and gentle farewell."}, {"text": "\"Let's go! 가자!\"\n링키는 씩씩하게 외치며\n무지개 쪽으로 콩콩 달려갔어요.", "prompt": "Uplifting wide shot of Reengki the quokka (wearing his pink felt hat) bounding energetically down the far slope toward the distant rainbow, satchel of thirteen marbles sparkling at his side. The big tiger waves from the ridge behind him. Bright morning sky and swirling leaves send him off on his next adventure."}]}]}, "14": {"chapter": 14, "animal": "유니콘", "animal_en": "unicorn", "letter": "K", "village": "드리미 구름 마을", "episodes": [{"ep": 1, "title": "무지개 다리를 건너서", "pages": [{"text": "호랑이 마을을 떠난 링키의 가방에서\n구슬 열세 개가 짤랑짤랑 노래했어요.\n“이제 두 개만 더 모으면 돼!”", "prompt": "Wide shot of Reengki the quokka (wearing his pink felt hat) walking along a sunny hilltop path with a small backpack, thirteen glowing alphabet beads sparkling through the open flap. Rolling green hills stretch behind him and a huge rainbow arcs across the bright blue sky ahead. His expression is cheerful and determined. Soft morning light, hopeful adventurous mood."}, {"text": "그때 무지개가 스르르 내려오더니\n반짝이는 계단으로 변했어요.\n링키는 폴짝폴짝 계단을 올랐죠.", "prompt": "Wide shot of a giant rainbow bending down to the ground and transforming into glowing rainbow stairs that rise into the clouds. Reengki the quokka (wearing his pink felt hat) hops up the sparkling steps with excitement, arms out for balance. Tiny motes of colorful light drift off each step. Magical bright daylight, wonder-filled mood."}, {"text": "구름 위에 올라서자 링키는 “우와!”\n몽글몽글 구름 사이로 사탕처럼\n알록달록한 집들이 떠 있었어요.", "prompt": "Wide establishing shot of a mystical village floating on fluffy rainbow-tinted clouds, with round candy-colored cottages resting on puffy cloud islands connected by little rainbow bridges. Reengki the quokka (wearing his pink felt hat) stands at the top of the rainbow stairs in the foreground, mouth open in awe. Pastel sky with soft golden light, dreamy magical atmosphere."}, {"text": "폭신한 구름 문이 스르륵 열리자\n달콤한 솜사탕 냄새가 퐁퐁 났어요.\n“여긴 정말 신기한 마을이야!”", "prompt": "Medium shot of a big fluffy cloud gate slowly swirling open in front of Reengki the quokka (wearing his pink felt hat), revealing the pastel village square beyond. Wisps of cotton-candy-like cloud puffs float around him as he sniffs the air happily. Warm pink and lavender light spills through the gate, inviting cozy mood."}, {"text": "그때 하얀 구름 양 한 마리가\n데굴데굴 굴러와 인사했어요.\n“안녕! 난 몽몽이야!”", "prompt": "Close-up of a small round cloud-white sheep with a puffy fluffy coat rolling to a gentle stop in front of Reengki the quokka (wearing his pink felt hat). The sheep looks up with big friendly eyes and a shy smile while Reengki crouches down to greet it. Soft cloud ground beneath them, warm pastel light, sweet friendly mood."}, {"text": "“여긴 드리미 구름 마을이야.\n상상한 것이 진짜로 나타나는\n마법의 마을이지!” 몽몽이 말했어요.", "prompt": "Medium wide shot of the little cloud sheep proudly gesturing with its hoof toward the floating village while Reengki the quokka (wearing his pink felt hat) listens with sparkling curious eyes. Around them, small imagined objects like floating teacups and tiny stars pop softly out of the clouds. Colorful pastel houses in the background, playful magical mood."}, {"text": "그때 하늘 저편에서 은빛 갈기가\n반짝— 바람을 가르며 달려왔어요.\n“저건… 유니콘이야!”", "prompt": "Dramatic wide shot of a graceful unicorn with a flowing silver mane galloping across the sky above the cloud village, leaving a trail of rainbow sparkles behind its hooves. Reengki the quokka (wearing his pink felt hat) and the small cloud sheep look up in amazement from below. Sunbeams break through pastel clouds, breathtaking magical mood."}, {"text": "유니콘이 사뿐히 내려앉자\n이마의 뿔이 무지개빛으로\n반짝반짝 빛났어요.", "prompt": "Medium shot of the unicorn landing gently on a fluffy cloud, its spiral horn glowing with shifting rainbow light. Tiny sparkles drift down around its silver mane. Reengki the quokka (wearing his pink felt hat) gazes up at the unicorn with wide admiring eyes. Soft glowing light on the cloud ground, awe-inspiring gentle mood."}, {"text": "“Welcome! 어서 와, 링키!”\n유니콘 루미가 방긋 웃었어요.\n링키도 따라 했죠. “웰컴… Welcome!”", "prompt": "Close-up of the unicorn lowering its head warmly to greet Reengki the quokka (wearing his pink felt hat), who beams and mimics the greeting with one paw raised. The little cloud sheep bounces happily beside them. Rainbow light glows softly from the unicorn's horn, cheerful welcoming mood."}, {"text": "“우리 마을의 비밀을 보여줄게.\n따라와!” 루미가 앞장섰어요.\n과연 어떤 비밀이 기다리고 있을까요?", "prompt": "Wide shot of the unicorn trotting ahead along a winding cloud path glowing with faint rainbow light, glancing back invitingly. Reengki the quokka (wearing his pink felt hat) and the cloud sheep hurry after it with excited faces. The path leads toward a bright glowing village square in the distance. Sparkling pastel dusk light, mysterious exciting mood."}]}, {"ep": 2, "title": "말하면 이루어지는 마을", "pages": [{"text": "루미는 링키를 마을 광장으로\n데려갔어요. 한가운데에는\n무지개 분수가 솟아오르고 있었죠.", "prompt": "Wide shot of a magical village square on the clouds with a fountain spraying liquid rainbow light into the air at its center. The unicorn stands beside Reengki the quokka (wearing his pink felt hat) as colorful droplets sparkle and float upward instead of falling. Pastel cloud houses circle the square, bright joyful atmosphere."}, {"text": "“여기선 마음속으로 또렷이 상상하고\n말하면 그대로 나타나. 잘 봐!”\n루미가 외쳤어요. “Rainbow!”", "prompt": "Medium shot of the unicorn closing its eyes in concentration, its horn glowing brightly as it speaks. A small perfect rainbow pops into the air above its head with a soft burst of sparkles. Reengki the quokka (wearing his pink felt hat) watches with astonished round eyes. Glittering magical light, delightful surprising mood."}, {"text": "몽몽도 신이 나서 외쳤어요.\n“Cookie!” 그러자 구름 쿠키가\n퐁퐁퐁 하늘에서 떨어졌어요.", "prompt": "Playful medium shot of the little cloud sheep shouting joyfully with eyes squeezed shut as fluffy cloud-shaped cookies rain down gently around it. Reengki the quokka (wearing his pink felt hat) catches one cookie in his paws, laughing. Crumbs of sparkle dust float in the air, fun whimsical mood."}, {"text": "“우와, 정말 나타났어!”\n링키의 눈이 별처럼 반짝였어요.\n“나도 해 보고 싶어!”", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat) with wide sparkling eyes and an eager grin, holding a cloud cookie, tiny star reflections shining in his eyes. The unicorn smiles warmly beside him. Soft rainbow light from the fountain glows in the background, excited hopeful mood."}, {"text": "“이 구름들은 영어 단어를\n제일 좋아해. 먼저 이렇게 말해 봐.\nHat! 모자!” 루미가 알려줬어요.", "prompt": "Medium shot of the unicorn leaning close to Reengki the quokka (wearing his pink felt hat) like a gentle teacher, tracing a sparkling hat shape in the air with its glowing horn. Reengki listens carefully with paws clasped. Little glowing letters of light swirl playfully in the air between them, warm encouraging mood."}, {"text": "링키가 힘차게 외쳤어요. “Hat!”\n퐁— 하고 모자가 나왔지만\n삐뚤빼뚤 찌그러져 있었어요.", "prompt": "Humorous medium shot of Reengki the quokka (wearing his pink felt hat) shouting with effort as a lumpy, crooked, misshapen hat pops into the air in front of him with a small puff of sparkles. The cloud sheep giggles behind its hoof while the unicorn smiles kindly. Bright pastel square background, lighthearted funny mood."}, {"text": "“괜찮아. 마음속 그림이\n또렷해야 해.” 루미가 말했어요.\n“천천히, 반짝반짝 떠올려 봐.”", "prompt": "Gentle close-up of the unicorn speaking softly to Reengki the quokka (wearing his pink felt hat), touching its glowing horn lightly near his forehead as if sharing a spark of imagination. Reengki closes his eyes, calm and focused. A faint dreamy glow surrounds them, tender encouraging mood."}, {"text": "링키는 눈을 감고 자기의 소중한\n핑크 모자를 곰곰이 떠올렸어요.\n“Hat!” 퐁! 완벽한 모자가 나왔죠!", "prompt": "Medium shot of Reengki the quokka (wearing his pink felt hat) with eyes closed in deep concentration as a perfect glowing pink felt hat with a leaf decoration pops into the air above his paws in a burst of sparkles. His face breaks into pure joy. The unicorn rears slightly in celebration, triumphant sparkling mood."}, {"text": "마을 친구들이 모여들어\n박수를 짝짝짝 쳤어요.\n링키는 신이 나서 “Flower! Star!”", "prompt": "Wide festive shot of cloud village animal friends including the cloud sheep and small rainbow birds gathered around clapping, while Reengki the quokka (wearing his pink felt hat) joyfully conjures a glowing flower and a shining star that float above the square. The unicorn watches proudly. Confetti-like sparkles everywhere, celebratory happy mood."}, {"text": "그날 밤 루미가 속삭였어요.\n“곧 일 년에 한 번, 상상 축제가 열려.”\n상상 축제라니, 과연 어떤 축제일까요?", "prompt": "Cozy night scene of the unicorn and Reengki the quokka (wearing his pink felt hat) sitting side by side on a cloud edge under a sky full of stars, the village lights glowing softly behind them. The unicorn whispers with a twinkle in its eye while Reengki tilts his head with curiosity. Deep blue starry sky, quiet magical anticipation."}]}, {"ep": 3, "title": "엉뚱한 상상 소동", "pages": [{"text": "다음 날 아침, 링키는 일찍 일어나\n상상 연습을 시작했어요.\n“오늘은 케이크를 만들어 볼래!”", "prompt": "Bright morning medium shot of Reengki the quokka (wearing his pink felt hat) standing on a fluffy cloud with fists raised in determination, morning sunlight washing the pastel village in gold. A small practice space of open cloud around him. Fresh energetic mood, soft warm light."}, {"text": "“Cake!” 링키가 외치자 퐁—\n그런데 나온 건 길쭉한\n오이 케이크였어요!", "prompt": "Funny medium shot of a bizarre long cucumber-shaped green cake popping into the air with sparkles in front of Reengki the quokka (wearing his pink felt hat), whose face is frozen in comic shock. The cloud sheep peeks over and bursts into giggles. Playful bright colors, silly humorous mood."}, {"text": "다시 도전! “Cake!” 이번에는\n신발 모양 케이크가 퐁!\n몽몽이 데굴데굴 구르며 웃었어요.", "prompt": "Humorous wide shot of a cake shaped exactly like a big boot popping onto the cloud in front of a flustered Reengki the quokka (wearing his pink felt hat), while the little cloud sheep rolls on its back laughing helplessly. Sparkle puffs drift from the failed cake. Cheerful pastel morning, giggly playful mood."}, {"text": "링키는 시무룩해졌어요.\n“내 상상은 자꾸 엉뚱해져…\n난 왜 안 되는 걸까?”", "prompt": "Quiet close-up of Reengki the quokka (wearing his pink felt hat) sitting on the cloud with drooping shoulders and sad eyes, poking at the silly boot-shaped cake with one paw. The lively village blurs softly in the background. Muted pastel tones, gentle melancholy mood."}, {"text": "루미가 사뿐히 다가와 말했어요.\n“상상은 연습할수록 또렷해져.\n나도 처음엔 엉망이었는걸!”", "prompt": "Warm medium shot of the unicorn lying down on the cloud next to Reengki the quokka (wearing his pink felt hat) so their eyes are level, speaking with a kind reassuring smile. Its rainbow horn glows softly. Reengki looks up with a small hopeful expression, comforting intimate mood."}, {"text": "루미와 링키는 구름 바닥에\n반짝 가루로 그림을 그리며\n상상 연습을 했어요.", "prompt": "Overhead medium shot of Reengki the quokka (wearing his pink felt hat) and the unicorn drawing glowing pictures of cakes and stars on the cloud floor with trails of sparkle dust, like chalk drawings made of light. Both look focused and happy. Golden afternoon light, cozy learning mood."}, {"text": "“천천히, 한 글자씩 말해 봐.\nC-a-k-e, Cake!” 루미를 따라\n링키도 또박또박 연습했죠.", "prompt": "Medium shot of the unicorn tracing glowing letter shapes of light in the air with its horn while Reengki the quokka (wearing his pink felt hat) carefully repeats after it, mouth open mid-word, paw following the floating lights. Soft sparkles hang between them like a lesson in the air, focused encouraging mood."}, {"text": "링키는 눈을 감고 딸기 케이크를\n곰곰이 떠올렸어요. “Cake!”\n퐁! 진짜 딸기 케이크가 나왔어요!", "prompt": "Triumphant medium shot of a beautiful strawberry cake with cream swirls popping into the air in a burst of pink sparkles before Reengki the quokka (wearing his pink felt hat), whose eyes fly open in delighted disbelief. The unicorn rears happily and the cloud sheep bounces in the background. Bright joyful light, victorious sweet mood."}, {"text": "모두 둘러앉아 케이크를 냠냠!\n“링키가 만든 케이크가\n세상에서 제일 맛있어!” 몽몽이 말했죠.", "prompt": "Cozy wide shot of Reengki the quokka (wearing his pink felt hat), the unicorn, and the cloud sheep sitting in a circle on the cloud sharing slices of strawberry cake, all with happy full cheeks. Crumbs and little sparkles scattered around, warm sunset colors, contented friendship mood."}, {"text": "그때 루미가 눈을 반짝이며 말했어요.\n“링키, 축제 무대에서 노래해 볼래?”\n링키의 가슴이 콩닥콩닥 뛰었어요!", "prompt": "Close-up of the unicorn leaning toward Reengki the quokka (wearing his pink felt hat) with sparkling excited eyes, as Reengki's face lights up with surprise and joy, paws pressed to his chest. Warm evening glow over the cloud village behind them, thrilling anticipatory mood."}]}, {"ep": 4, "title": "상상 축제 준비", "pages": [{"text": "드리미 마을은 축제 준비로\n북적북적! 일 년에 한 번,\n모두의 상상을 뽐내는 날이래요.", "prompt": "Lively wide shot of the cloud village bustling with preparations, animal villagers hanging garlands of glowing stars between pastel houses and stacking rainbow lanterns. Reengki the quokka (wearing his pink felt hat) walks through the busy square looking around with wonder. Bright cheerful daylight, festive bustling mood."}, {"text": "몽몽은 폭신한 구름 베개를,\n무지개 새 삐요는 노래하는 별을\n상상해서 보여 줄 거래요.", "prompt": "Medium shot of the little cloud sheep proudly conjuring a small mountain of pink cotton candy while a tiny rainbow-feathered bird hovers nearby with a glowing musical star. Reengki the quokka (wearing his pink felt hat) claps in admiration. Colorful sparkles fill the air, playful creative mood."}, {"text": "링키는 결심했어요.\n“난 무지개 무대를 상상해서\n그 위에서 노래할 거야!”", "prompt": "Determined close-up of Reengki the quokka (wearing his pink felt hat) with fists clenched and eyes shining, imagining hard, a faint dreamy vision of a grand rainbow stage glowing above his head like a thought bubble made of light. Village preparations blur behind him, ambitious hopeful mood."}, {"text": "“Stage!” 링키가 외쳤지만\n무대는 반쪽만 퐁— 나오다가\n스르르 사라져 버렸어요.", "prompt": "Medium shot of a half-formed translucent rainbow stage flickering and dissolving into sparkle dust in front of Reengki the quokka (wearing his pink felt hat), who reaches out with a disappointed frown. Little wisps of fading light drift away. Soft afternoon light, gently frustrated mood."}, {"text": "“무대는 너무 커서 어려워…”\n링키가 한숨을 쉬자 루미가 왔어요.\n“큰 상상은 나눠서 하면 돼!”", "prompt": "Warm medium shot of the unicorn arriving beside a sighing Reengki the quokka (wearing his pink felt hat) and nudging him gently with its nose, horn glowing with an encouraging light. Reengki looks up with renewed curiosity. Fluffy clouds around them, supportive kind mood."}, {"text": "“Stage! Light! Drum!”\n조각조각 나누어 상상하니\n무대가 조금씩 만들어졌어요!", "prompt": "Dynamic wide shot of Reengki the quokka (wearing his pink felt hat) and the unicorn conjuring together, pieces of a rainbow stage assembling in midair one part at a time, a floor of rainbow light, glowing lanterns, a sparkling drum, snapping into place with bursts of sparkles. Exciting collaborative mood, bright magical light."}, {"text": "“우와, 진짜 무대 같아!”\n링키는 무대에 폴짝 올라가\n노래 연습을 시작했어요.", "prompt": "Wide shot of Reengki the quokka (wearing his pink felt hat) standing proudly on the newly built glowing rainbow stage floating on the clouds, singing with his mouth open joyfully and arms spread wide. Musical notes of light float around him. The unicorn and cloud sheep watch from below, uplifting joyful mood."}, {"text": "루미도 하늘을 가르며\n달리기 연습을 했어요.\n은빛 갈기가 바람에 휘날렸죠.", "prompt": "Sweeping wide shot of the unicorn galloping across the open sky above the village in a great arc, silver mane streaming, hooves trailing ribbons of rainbow light. Reengki the quokka (wearing his pink felt hat) cheers from the rainbow stage below. Golden late-afternoon sky, free exhilarating mood."}, {"text": "노을이 물들 무렵, 루미가 말했어요.\n“내 꿈은 별들 사이를 달리는 거야.\n아주아주 먼 옛날부터의 꿈이지.”", "prompt": "Quiet close-up of the unicorn gazing up at the first evening stars with dreamy longing eyes, sitting on a cloud edge beside Reengki the quokka (wearing his pink felt hat) who listens attentively. The sunset paints the clouds in pink and orange. Tender wistful mood, soft warm light."}, {"text": "그런데 그때, 하늘 저 끝에서\n회색 구름이 스멀스멀\n다가오고 있었어요…", "prompt": "Ominous but soft wide shot from behind Reengki the quokka (wearing his pink felt hat) and the unicorn as they notice a distant bank of gray fog creeping slowly toward the colorful cloud village on the horizon. The sunset colors fade where the gray touches them. Quiet suspenseful mood, contrast of warm and gray light."}]}, {"ep": 5, "title": "몽몽의 작은 꿈", "pages": [{"text": "축제 전날, 몽몽이 구름 구석에서\n시무룩하게 앉아 있었어요.\n링키가 살금살금 다가갔죠.", "prompt": "Gentle medium shot of the little cloud sheep sitting alone in a quiet corner of the clouds with drooping ears and a sad face, while Reengki the quokka (wearing his pink felt hat) approaches quietly and carefully from behind. Soft muted pastel light, concerned caring mood."}, {"text": "“왜 그래, 몽몽?”\n“내 상상은 너무 작아서…\n축제에서 웃음거리가 될 거야.”", "prompt": "Close-up of the cloud sheep looking down shyly, hiding half its face in its fluffy wool, while Reengki the quokka (wearing his pink felt hat) sits beside it with a gentle worried expression. A tiny faint dream image of a small pillow glows weakly above the sheep's head. Quiet tender mood."}, {"text": "몽몽의 꿈은 세상에서 제일\n폭신한 베개를 만드는 것이었어요.\n“다들 크고 멋진 걸 상상하는데…”", "prompt": "Medium shot of the cloud sheep gesturing sadly toward the village where other animals conjure big impressive creations, a cotton candy mountain and giant glowing stars visible in the distance, while its own small dream pillow floats humbly beside it. Reengki the quokka (wearing his pink felt hat) listens closely, sympathetic mood."}, {"text": "링키는 자기 모자를 살짝 잡았어요.\n“이 모자도 작지만 나한텐\n세상에서 제일 소중한걸!”", "prompt": "Warm close-up of Reengki the quokka (wearing his pink felt hat) holding the brim of his pink felt hat with both paws and smiling brightly at the cloud sheep, whose ears lift slightly with hope. Soft glowing afternoon light on the clouds, heartfelt encouraging mood."}, {"text": "“작은 상상도 누군가에겐\n큰 행복이 될 수 있어.\n같이 연습해 보자!”", "prompt": "Medium shot of Reengki the quokka (wearing his pink felt hat) offering his paw to the cloud sheep, who takes it shyly and stands up. Behind them the sky is soft gold and pink. Little sparkles begin to gather around the sheep, hopeful uplifting mood."}, {"text": "몽몽은 눈을 꼭 감고 외쳤어요.\n“P-i-l-l-o-w… Pillow!”\n퐁! 구름 베개가 나타났어요!", "prompt": "Joyful medium shot of the cloud sheep with eyes squeezed tight as a wonderfully fluffy cloud pillow pops into the air in a burst of soft white sparkles. Reengki the quokka (wearing his pink felt hat) jumps up cheering beside it. Bright happy light, triumphant sweet mood."}, {"text": "그 베개는 마을에서 제일 폭신폭신!\n아기 새들이 날아와 베개 위에서\n새근새근 낮잠을 잤어요.", "prompt": "Adorable medium shot of several tiny rainbow birds nestled asleep on the fluffy cloud pillow, breathing peacefully, while the cloud sheep watches them with amazed proud eyes and Reengki the quokka (wearing his pink felt hat) gives a happy thumbs-up gesture with his paw. Warm cozy light, tender heartwarming mood."}, {"text": "“내 베개가 친구들을 재웠어!”\n몽몽은 신이 나서 외쳤어요.\n“이제 백 개도 만들 수 있을 것 같아!”", "prompt": "Energetic medium shot of the cloud sheep bouncing high with joy, several more fluffy pillows popping into existence around it in little sparkle bursts, while Reengki the quokka (wearing his pink felt hat) laughs and claps. Pillows float gently on the clouds, exuberant confident mood."}, {"text": "루미가 다가와 방긋 웃었어요.\n“몽몽의 작은 꿈이 오늘\n온 마을을 포근하게 했는걸!”", "prompt": "Warm wide shot of the unicorn arriving and lowering its head affectionately to the proud cloud sheep, with fluffy pillows scattered around the clouds and sleeping birds on them. Reengki the quokka (wearing his pink felt hat) stands beside them smiling. Golden evening light, proud gentle mood."}, {"text": "그런데 그날 밤, 바람이 차가워지고\n회색 안개가 어느새 마을 코앞까지\n성큼 다가와 있었어요…", "prompt": "Nighttime wide shot of the sleeping cloud village under the stars as a thick gray fog creeps closer along the edges of the clouds, dimming the village lanterns one by one at the far edge. In the foreground Reengki the quokka (wearing his pink felt hat) stirs in his sleep on a cloud bed. Quiet suspenseful mood, cool blue-gray tones."}]}, {"ep": 6, "title": "회색 안개가 몰려와요", "pages": [{"text": "아침이 되자 마을이 온통\n회색빛이었어요. 알록달록하던\n집들도 뿌옇게 변해 버렸죠.", "prompt": "Wide shot of the cloud village blanketed in thick gray fog, the once-colorful pastel houses now faded and dim, lanterns barely glowing. Reengki the quokka (wearing his pink felt hat) steps out of a cloud house and looks around in shock. Muted gray palette with only Reengki's hat keeping its pink color, worried gloomy mood."}, {"text": "“이건 시무룩 안개야.”\n루미가 걱정스레 말했어요.\n“상상하는 법을 잊게 만들지.”", "prompt": "Medium shot of the unicorn standing protectively beside Reengki the quokka (wearing his pink felt hat), gazing at the swirling gray fog with worried eyes, its horn glowing faintly like a small lamp in the mist. Wisps of fog curl around their feet, tense concerned mood."}, {"text": "마을 친구들이 아무리 외쳐도\n이제 아무것도 나타나지 않았어요.\n“Flower!” …조용했죠.", "prompt": "Sad wide shot of several village animals standing in the foggy square calling out with open mouths, but nothing appears, only thin gray mist swirling where sparkles used to burst. Reengki the quokka (wearing his pink felt hat) watches with a worried frown. Heavy gray atmosphere, quiet discouraged mood."}, {"text": "몽몽도 “Cookie! Cookie!”\n외쳤지만 퐁 소리는 나지 않았어요.\n몽몽의 눈에 눈물이 그렁그렁.", "prompt": "Heartbreaking close-up of the little cloud sheep calling out desperately into the fog with teary glistening eyes, its fluffy wool drooping and slightly gray. Reengki the quokka (wearing his pink felt hat) kneels beside it and puts a comforting paw on its back. Soft gray light, tender sorrowful mood."}, {"text": "마을의 색이 점점 빠져나갔어요.\n무지개 분수도 힘없이\n주르륵… 낮아졌지요.", "prompt": "Melancholy wide shot of the village square where the rainbow fountain has shrunk to a weak gray trickle, its colors drained away. Faded houses loom in the fog behind it. Reengki the quokka (wearing his pink felt hat) and the unicorn stand small in the empty square, somber muted mood."}, {"text": "루미가 뿔의 빛으로 안개를\n밀어냈지만, 안개는 금세\n다시 스멀스멀 몰려왔어요.", "prompt": "Dynamic medium shot of the unicorn bravely sweeping its glowing horn in an arc, pushing a wave of fog back with a fan of rainbow light, but thick gray mist already curling back in from all sides. Reengki the quokka (wearing his pink felt hat) shields the cloud sheep behind him. Dramatic contrast of rainbow light against gray, valiant strained mood."}, {"text": "링키도 상상이 자꾸 흐릿해졌어요.\n딸기 케이크를 떠올려도\n뿌연 그림자만 아른아른…", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat) with eyes closed trying hard to imagine, but only a blurry gray shadow of a cake flickers weakly above his head before dissolving. His brow is furrowed with effort. Fog swirls around him, frustrated fading mood."}, {"text": "“이 안개는 시무룩한 마음을\n먹고 자란단다.” 루미가 말했어요.\n“슬퍼할수록 점점 커지지.”", "prompt": "Medium shot of the unicorn explaining gravely to Reengki the quokka (wearing his pink felt hat) and the cloud sheep huddled close, the fog visibly thickening and swirling in the background as sad villagers sit slumped nearby. The unicorn's horn is the only warm light, serious informative mood."}, {"text": "링키가 벌떡 일어났어요.\n“그럼 신나는 마음으로 이기면 돼!”\n링키는 씩씩하게 노래를 시작했죠.", "prompt": "Uplifting medium shot of Reengki the quokka (wearing his pink felt hat) jumping to his feet with fists raised and starting to sing bravely into the fog, small warm sparkles of light beginning to flicker around his voice. The unicorn and cloud sheep look up with surprised hope. First hints of color returning near him, defiant hopeful mood."}, {"text": "그런데 그 순간, 짙은 안개가\n루미의 뿔을 스르르 감싸는 게\n아니겠어요…!", "prompt": "Suspenseful close-up of a tendril of thick gray fog wrapping slowly around the unicorn's glowing horn, its rainbow light flickering and dimming. The unicorn's eyes widen in alarm while Reengki the quokka (wearing his pink felt hat) reaches out in the background mid-song. Dramatic tense mood, fading light."}]}, {"ep": 7, "title": "빛을 잃은 뿔", "pages": [{"text": "루미의 뿔이 깜빡깜빡…\n무지개빛이 점점 흐려지더니\n빛을 잃고 말았어요.", "prompt": "Sad close-up of the unicorn's horn flickering weakly, its rainbow glow fading to a dull gray, sparkles falling from it like dying embers. The unicorn's eyes are wide with fear and sorrow. Fog swirls thickly around, heartbreaking dimming mood."}, {"text": "“내 꿈은 너무 커서…\n어쩌면 이룰 수 없을지도 몰라.”\n루미가 작게 속삭였어요.", "prompt": "Melancholy medium shot of the unicorn with lowered head and drooping silver mane, whispering sadly, its dimmed horn pointing at the cloud ground. Gray fog presses close around it. Reengki the quokka (wearing his pink felt hat) watches from a few steps away with a pained expression, sorrowful quiet mood."}, {"text": "루미는 커다란 구름 뒤로\n터벅터벅 걸어가 숨어 버렸어요.\n마을은 더 어두워졌지요.", "prompt": "Wide shot of the unicorn walking away slowly with hanging head and disappearing behind a large gray cloud bank, leaving faint fading hoofprints of light. The village behind grows darker as fog thickens. Reengki the quokka (wearing his pink felt hat) stands small in the foreground watching, lonely somber mood."}, {"text": "링키는 살며시 다가가\n루미 곁에 앉았어요.\n아무 말 없이, 꼭 붙어서요.", "prompt": "Tender medium shot of Reengki the quokka (wearing his pink felt hat) quietly sitting down close against the curled-up unicorn behind the big cloud, leaning his small body against its side without a word. The unicorn's eyes soften slightly. Dim gray light with a faint warm glow between them, silent comforting mood."}, {"text": "“나도 무서웠어. 로트네스트 섬은\n너무너무 멀어 보였거든.\n노래도 자꾸 틀렸고 말이야.”", "prompt": "Intimate close-up of Reengki the quokka (wearing his pink felt hat) speaking softly with honest vulnerable eyes, one paw on his chest, while the unicorn turns its head to listen. A faint dreamy image of a distant island glows dimly in the fog above them like a memory. Gentle confessional mood."}, {"text": "링키는 가방에서 구슬 열세 개를\n꺼내 보여 줬어요.\n“그래도 한 걸음씩 오다 보니, 여기야.”", "prompt": "Beautiful close-up of Reengki the quokka (wearing his pink felt hat) holding out his open paws filled with thirteen glowing alphabet beads, their warm colorful light pushing back the gray fog in a small circle around them. The unicorn gazes at the beads, reflections shining in its eyes. Hopeful glowing mood."}, {"text": "“한 걸음씩…” 루미의 눈이\n다시 반짝이기 시작했어요.\n“그래, 꿈은 한 걸음씩 가는 거야.”", "prompt": "Close-up of the unicorn lifting its head, eyes regaining their sparkle as it repeats the words, a tiny point of rainbow light rekindling at the very tip of its dimmed horn. Reengki the quokka (wearing his pink felt hat) smiles encouragingly beside it. The fog begins to thin slightly around them, reawakening hopeful mood."}, {"text": "루미가 천천히 일어나\n작은 상상부터 시작했어요.\n“Star!” 퐁— 작은 별이 반짝!", "prompt": "Medium shot of the unicorn standing tall again and conjuring a single small golden star that pops into the air with a soft burst of sparkles, its horn glowing brighter. Reengki the quokka (wearing his pink felt hat) cheers with raised paws. The star's light carves a warm hole in the fog, triumphant tender mood."}, {"text": "뿔이 다시 무지개빛으로 반짝!\n루미와 링키는 마주 보며\n활짝 웃었어요.", "prompt": "Joyful close-up of the unicorn's horn blazing back to full rainbow brilliance, colorful light washing over its silver mane, as the unicorn and Reengki the quokka (wearing his pink felt hat) beam at each other face to face. Sparkles swirl around them pushing the fog away, radiant warm friendship mood."}, {"text": "“이제 마을을 구하러 가자!\n친구들을 모두 모으는 거야!”\n둘은 힘차게 달려나갔어요.", "prompt": "Dynamic wide shot of Reengki the quokka (wearing his pink felt hat) riding on the unicorn's back as it gallops out from behind the cloud toward the foggy village, its horn shining like a beacon and a trail of rainbow light cutting through the gray. Determined heroic mood, dramatic lighting."}]}, {"ep": 8, "title": "다 함께 상상해요", "pages": [{"text": "링키와 루미는 마을 친구들을\n광장으로 모두 모았어요.\n“여러분, 좋은 생각이 있어요!”", "prompt": "Wide shot of village animals gathering in the foggy square around Reengki the quokka (wearing his pink felt hat) who stands on a small cloud mound calling out with cupped paws, the unicorn beside him with its horn glowing like a lantern. Curious faces emerge from the mist, rallying hopeful mood."}, {"text": "“혼자 하는 상상은 흐려져도\n다 같이 하면 또렷해져요!\n우리 함께 상상해요!”", "prompt": "Medium shot of Reengki the quokka (wearing his pink felt hat) speaking passionately with arms spread wide to the gathered animals, tiny sparkles dancing around his words. The cloud sheep nods eagerly at the front of the crowd. The unicorn stands tall behind him, inspiring speech mood."}, {"text": "모두 손에 손을 잡고\n둥글게 둥글게 모였어요.\n그리고 살며시 눈을 감았죠.", "prompt": "Heartwarming overhead wide shot of all the village animals joining paws and hooves in a big circle on the clouds, Reengki the quokka (wearing his pink felt hat) holding the unicorn's leg on one side and the cloud sheep on the other, all with eyes gently closed. Fog surrounds the circle, quiet unified mood."}, {"text": "“하나, 둘, 셋!”\n“Light!” 모두 함께 외쳤어요.\n목소리가 하늘까지 울렸죠.", "prompt": "Powerful medium shot of the circle of animals all shouting together with open mouths toward the sky, their combined breath forming a swirl of golden light rising upward through the fog. Reengki the quokka (wearing his pink felt hat) shouts loudest with squeezed-shut eyes, unified powerful mood."}, {"text": "퐁! 퐁! 퐁!\n작은 빛방울들이 몽글몽글\n하늘로 떠오르기 시작했어요!", "prompt": "Magical wide shot of dozens of small glowing orbs of warm light popping into existence above the circle of animals and floating upward like bubbles, each one pushing a hole in the gray fog. All the animals gaze up in wonder, Reengki the quokka (wearing his pink felt hat) reaching toward the lights. Sparkling awakening mood."}, {"text": "“Flower! Song! Rainbow!”\n외침이 이어질 때마다\n꽃과 음표와 무지개가 퐁퐁퐁!", "prompt": "Joyous dynamic wide shot of flowers, glowing musical notes, and small rainbows bursting into the air one after another above the cheering circle of animals, colors exploding against the gray fog. Reengki the quokka (wearing his pink felt hat) dances as he shouts, celebratory colorful mood."}, {"text": "마을에 색이 돌아오기 시작했어요!\n분홍, 노랑, 하늘색이 번져 가자\n안개가 주춤주춤 물러났죠.", "prompt": "Beautiful wide shot of color visibly spreading through the village like watercolor blooming on wet paper, pink and yellow and sky-blue washing over the faded houses while the gray fog retreats toward the edges. The animals cheer in the square, Reengki the quokka (wearing his pink felt hat) jumping with joy. Triumphant color-returning mood."}, {"text": "루미가 하늘로 솟구쳐 올라\n뿔에 모두의 빛을 모았어요.\n뿔이 태양처럼 환해졌죠!", "prompt": "Epic wide shot of the unicorn soaring high above the village, all the floating light orbs streaming toward its horn which blazes like a small sun against the sky. Below, the animals and Reengki the quokka (wearing his pink felt hat) watch with uplifted faces. Dramatic radiant mood, brilliant light against parting fog."}, {"text": "번쩍—! 커다란 빛의 무지개가\n마을을 감싸자, 시무룩 안개가\n스르르 녹아 사라졌어요.", "prompt": "Climactic wide shot of an enormous arc of brilliant rainbow light sweeping from the unicorn's horn over the entire cloud village like a protective dome, the last of the gray fog dissolving into harmless glittering mist. The village shines in full color again, awe-inspiring victorious mood."}, {"text": "“해냈다! 우리가 해냈어!”\n모두 얼싸안고 기뻐했어요.\n그리고 내일은 드디어, 상상 축제!", "prompt": "Joyful wide shot of all the village animals hugging and bouncing in celebration in the fully colorful square, the unicorn landing among them as Reengki the quokka (wearing his pink felt hat) and the cloud sheep embrace happily. Confetti-like sparkles rain down, festive triumphant evening mood with warm lantern light."}]}, {"ep": 9, "title": "상상 축제의 밤", "pages": [{"text": "드디어 축제의 날이 밝았어요!\n마을은 어느 때보다\n반짝반짝 알록달록 빛났죠.", "prompt": "Festive wide establishing shot of the cloud village decorated for the festival, glowing star garlands, rainbow lanterns, ribbon banners between the pastel houses, everything more vivid than ever. Reengki the quokka (wearing his pink felt hat) runs excitedly through the square. Bright celebratory morning light, thrilling festival mood."}, {"text": "몽몽은 폭신폭신 베개 솜사탕을,\n삐요는 노래하는 별을 선보였어요.\n“우와!” 박수가 쏟아졌죠.", "prompt": "Lively medium shot of the cloud sheep proudly presenting fluffy pillow-shaped cotton candy to delighted villagers while the tiny rainbow bird conducts a small choir of glowing singing stars overhead. The audience of animals claps enthusiastically. Colorful festival stalls in the background, cheerful showcase mood."}, {"text": "이제 링키의 차례!\n가슴이 콩닥콩닥 뛰었지만\n루미가 윙크해 주었어요.", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat) waiting nervously at the side of the festival grounds, paws pressed to his pounding chest, while the unicorn gives him a warm encouraging wink. Festival lights bokeh in the background, nervous-but-supported mood."}, {"text": "링키는 눈을 감고 크게 외쳤어요.\n“Stage!” 퐁—!\n찬란한 무지개 무대가 나타났어요!", "prompt": "Spectacular wide shot of a magnificent rainbow stage bursting into existence in the center of the festival grounds in a huge fountain of sparkles, as Reengki the quokka (wearing his pink felt hat) stands before it with arms flung wide and eyes shining. The crowd of animals gasps in delight, grand magical reveal mood."}, {"text": "링키가 무대에서 노래를 시작하자\n루미가 하늘을 빙글빙글 달리며\n무지개 리본을 그렸어요.", "prompt": "Dynamic wide shot of Reengki the quokka (wearing his pink felt hat) singing joyfully on the glowing rainbow stage while the unicorn spirals through the evening sky above, its hooves painting swirling ribbons of rainbow light around the stage. Musical notes of light drift from Reengki's song, dazzling performance mood."}, {"text": "“Music! Star! Rainbow!”\n친구들도 다 함께 외치자\n상상이 퐁퐁퐁 쏟아졌어요!", "prompt": "Exuberant wide shot of the entire audience of village animals shouting together, conjured wonders bursting overhead, glowing instruments playing themselves, shooting stars, small rainbows arcing between clouds. Reengki the quokka (wearing his pink felt hat) sings at the center of it all on stage, explosive joyful creativity mood."}, {"text": "밤하늘 가득 별 폭죽이 펑펑!\n드리미 마을 최고의 축제라고\n모두 입을 모았어요.", "prompt": "Breathtaking wide shot of the night sky above the cloud village filled with star-shaped firework bursts of imagined light in every color, reflecting on the fluffy clouds below. Silhouettes of celebrating animals and the rainbow stage glow in the foreground, Reengki the quokka (wearing his pink felt hat) with arms raised in triumph. Spectacular festive night mood."}, {"text": "링키가 말했어요. “신기해!\n영어로 말하니까 상상이\n진짜가 되다니!”", "prompt": "Warm medium shot of Reengki the quokka (wearing his pink felt hat) catching his breath after the performance, face glowing with wonder as he talks to the unicorn beside the stage, small conjured stars still floating around them. Festival lights twinkle behind, exhilarated amazed mood."}, {"text": "루미가 부드럽게 말했어요.\n“상상한 건 뭐든지 영어로 말할 수\n있어. 그럼 온 세상 친구와 꿈을 나누지.”", "prompt": "Tender close-up of the unicorn speaking gently to Reengki the quokka (wearing his pink felt hat) under the starry festival sky, its glowing horn casting soft rainbow light on his upturned face. A dreamy vision of tiny lights connecting across a globe of clouds shimmers faintly above them, wise heartfelt mood."}, {"text": "축제가 끝나갈 무렵,\n루미가 속삭였어요. “링키,\n너에게 줄 것이 있어. 내일 아침에…”", "prompt": "Quiet night close-up of the unicorn whispering into the ear of Reengki the quokka (wearing his pink felt hat) as festival lanterns dim softly around them and stars glitter above. Reengki's eyes widen with curiosity and anticipation. Hushed magical mood, warm lantern glow against deep blue night."}]}, {"ep": 10, "title": "열네 번째 구슬 K", "pages": [{"text": "다음 날 아침, 무지개 언덕에\n마을 친구들이 모두 모였어요.\n하늘은 눈부시게 맑았죠.", "prompt": "Wide shot of all the village animals gathered on a gentle rainbow-tinted cloud hill in brilliant morning light, the unicorn standing at the crest with Reengki the quokka (wearing his pink felt hat) before it. The restored colorful village glows below, ceremonial bright morning mood."}, {"text": "루미가 말했어요. “링키는 우리에게\n함께 상상하는 기쁨을 알려 줬어.\n그리고 꿈을 믿는 법도.”", "prompt": "Medium shot of the unicorn addressing the gathered animals warmly while looking down at Reengki the quokka (wearing his pink felt hat), who blushes shyly with paws behind his back. The cloud sheep beams proudly in the front row. Soft golden light, ceremonial affectionate mood."}, {"text": "루미의 뿔이 환하게 빛나더니\n반짝— 알파벳 K 구슬이\n두둥실 떠올랐어요.", "prompt": "Magical close-up of the unicorn's horn blazing with rainbow light as a glowing bead engraved with the letter K rises slowly from its tip, floating in the air surrounded by swirling sparkles. Reengki the quokka (wearing his pink felt hat) gazes up at it with awe-filled eyes, sacred wondrous mood."}, {"text": "“꿈과 상상의 구슬 K야.\n어디서든 마음껏 상상하고,\n마음껏 꿈꾸렴.” 루미가 웃었어요.", "prompt": "Heartfelt medium shot of the glowing K bead drifting gently down into the open paws of Reengki the quokka (wearing his pink felt hat), the unicorn smiling tenderly above him. Warm rainbow light bathes both their faces. Villagers watch with happy tears, touching gift-giving mood."}, {"text": "구슬을 가방에 넣자\n열네 개의 구슬이 짤랑짤랑\n기쁜 노래를 불렀어요.", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat) placing the K bead into his backpack where fourteen alphabet beads now glow together, their combined colorful light shining out of the bag like a small treasure chest. His face reflects the glow with pure happiness, satisfying milestone mood."}, {"text": "“이제 마지막 구슬 하나!\n피닉스 마을로 가면\n로트네스트 섬에 갈 수 있어!”", "prompt": "Determined medium shot of Reengki the quokka (wearing his pink felt hat) pointing boldly toward the far horizon where the dawn sky glows with warm flame-orange light, his backpack sparkling on his shoulders. The unicorn and villagers stand behind him following his gaze, adventurous resolute mood."}, {"text": "몽몽이 눈물을 그렁그렁 매달고\n작은 구름 베개를 내밀었어요.\n“여행길에 폭신하게 자, 링키야…”", "prompt": "Emotional close-up of the little cloud sheep with teary eyes offering a tiny fluffy cloud pillow to Reengki the quokka (wearing his pink felt hat), who accepts it and hugs the sheep tightly. Other villagers dab their eyes in the background, bittersweet farewell mood, soft morning light."}, {"text": "“내가 태워다 줄게!”\n루미가 몸을 낮추자 링키는\n은빛 갈기 위에 폴짝 올라탔어요.", "prompt": "Uplifting medium shot of the unicorn kneeling gracefully so Reengki the quokka (wearing his pink felt hat) can climb onto its back, gripping the silver mane with excited determination. Villagers wave from the rainbow hill, bright departure-morning light, generous friendship mood."}, {"text": "“Goodbye! Thank you!”\n링키가 외치자 친구들도 외쳤죠.\n“Goodbye, Reengki! 꿈을 잊지 마!”", "prompt": "Wide farewell shot of the unicorn leaping into the sky with Reengki the quokka (wearing his pink felt hat) waving from its back, while the cloud sheep, rainbow birds, and all the villagers wave and call out from the cloud hill below. A rainbow trail streams behind them, emotional joyous send-off mood."}, {"text": "불꽃처럼 붉게 물든 노을 너머,\n마지막 마을이 기다리고 있어요.\n링키의 마지막 모험이 시작됩니다!", "prompt": "Epic wide shot of the unicorn soaring with Reengki the quokka (wearing his pink felt hat) on its back toward a distant horizon glowing with flame-red and golden sunset clouds, hinting at a fiery mystical land far ahead. The cloud village grows small behind them, fourteen beads twinkling in his backpack. Grand hopeful finale mood, cinematic warm light."}]}]}, "15": {"chapter": 15, "animal": "피닉스", "animal_en": "phoenix", "letter": "I", "village": "노을 등불 마을", "episodes": [{"ep": 1, "title": "노을빛 섬에 도착했어요", "pages": [{"text": "유니콘 마을을 떠난 링키는\n바다 위 작은 배에 앉아 있었어요.\n주머니 속 구슬 열네 개가 반짝반짝!", "prompt": "Wide shot of Reengki the quokka (wearing his pink felt hat) sitting in a small wooden boat on a calm golden sea at sunset. He holds open a little pouch glowing with fourteen colorful marbles. Warm orange light sparkles on gentle waves, and his tail curls happily. Peaceful, hopeful mood."}, {"text": "저 멀리 노을빛 섬이 보였어요.\n화산 꼭대기에선 무서운 연기 대신\n따뜻한 김이 폴폴 피어올랐죠.", "prompt": "Wide shot from the boat looking toward a cozy volcanic island glowing in sunset colors. The rounded volcano puffs soft, friendly white steam like a teapot, not smoke. Reengki the quokka (wearing his pink felt hat) leans forward at the bow with sparkling, curious eyes. Warm pink and orange sky, magical but gentle atmosphere."}, {"text": "배가 스르륵 해변에 닿았어요.\n모래사장엔 조개 등불이\n줄줄이 반짝이고 있었어요.", "prompt": "Medium shot of Reengki the quokka (wearing his pink felt hat) stepping off a small boat onto a warm sandy beach at dusk. A row of glowing seashell lanterns lines the shore, casting soft amber light. The volcanic island rises gently in the background under a peach-colored sky. Inviting, twinkling mood."}, {"text": "언덕 위 마을이 보였어요.\n집집마다 주황 등불이 걸려\n온 마을이 별밭처럼 빛났죠.", "prompt": "Wide shot of a charming hillside village on the volcanic island, every round cottage hung with orange paper lanterns glowing like a field of stars. Reengki the quokka (wearing his pink felt hat) stands on the beach path below, gazing up in wonder. Twilight sky in violet and rose, warm light spilling down the hill."}, {"text": "“Hello!” 작은 목소리가 들렸어요.\n초록 꼬마 도마뱀이 등불을 들고\n포롱포롱 달려왔어요.", "prompt": "Close-up of a friendly little green lizard holding a small orange lantern, waving cheerfully at Reengki the quokka (wearing his pink felt hat) on the lantern-lit beach path. The lizard's big round eyes sparkle in the lantern glow. Warm dusk light, joyful first-meeting mood."}, {"text": "“나는 등불지기 도도야!\n여긴 노을 등불 마을이란다.”\n도도는 꼬리를 살랑살랑 흔들었어요.", "prompt": "Medium shot of the little green lizard proudly introducing himself, one hand on his chest, the other holding up his lantern, in front of Reengki the quokka (wearing his pink felt hat). Behind them the lantern village glows on the hillside. Cozy orange light on their smiling faces."}, {"text": "링키는 구슬 주머니를 열어 보였어요.\n“난 구슬을 열네 개나 모았어!\n이제 딱 하나만 남았지.”", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat) opening his pouch to show fourteen glowing colorful marbles to the amazed little green lizard. The marbles cast rainbow sparkles on their faces in the twilight. Excited, proud mood on the lantern-lit path."}, {"text": "도도의 눈이 동그래졌어요.\n“마지막 구슬은 불사조 피오 님이\n가지고 계셔. 아주 특별한 새란다!”", "prompt": "Medium shot of the little green lizard speaking with wide, awed eyes, pointing his lantern toward the volcano peak, while Reengki the quokka (wearing his pink felt hat) listens closely. Soft glowing steam rises from the friendly volcano in the background. Mysterious yet warm evening atmosphere."}, {"text": "화산 꼭대기엔 등대처럼\n환하게 빛나는 둥지가 있었어요.\n링키의 가슴이 콩닥콩닥 뛰었죠.", "prompt": "Wide shot looking up at the volcano summit where a large golden nest glows like a lighthouse against the deep violet night sky. Reengki the quokka (wearing his pink felt hat) and the little green lizard gaze up from the village path, their backs to the camera. Gentle stars appear, magical anticipation in the air."}, {"text": "“내일 아침, 함께 올라가 보자!”\n링키는 등불 아래에서 잠들며\n마지막 구슬을 꿈꾸었답니다.", "prompt": "Cozy close-up of Reengki the quokka (wearing his pink felt hat resting beside him) curled up asleep under a warm orange lantern in a snug cottage, a tiny smile on his face. Through the round window, the glowing nest on the volcano peak twinkles far away. Soft warm night light, dreamy peaceful mood."}]}, {"ep": 2, "title": "불사조 피오", "pages": [{"text": "아침 해가 방긋 떠올랐어요.\n링키와 도도는 화산 언덕길을\n영차영차 올라갔어요.", "prompt": "Wide shot of Reengki the quokka (wearing his pink felt hat) and the little green lizard climbing a winding path up the gentle volcano in bright morning light. Wildflowers and small unlit lanterns line the trail. Fresh blue sky with soft pink clouds, cheerful adventurous mood."}, {"text": "길가엔 따뜻한 바람이 살랑,\n작은 불티새들이 반딧불처럼\n반짝반짝 날아다녔어요.", "prompt": "Medium shot of tiny glowing ember birds, small round birds with softly sparkling orange feathers, fluttering like fireflies around Reengki the quokka (wearing his pink felt hat) on the volcano path. He reaches up with delighted eyes as the little green lizard laughs. Golden morning light, magical gentle sparkles."}, {"text": "드디어 꼭대기 둥지에 닿았어요.\n황금 깃털의 커다란 새가\n노을처럼 은은히 빛나고 있었죠.", "prompt": "Wide shot of a magnificent phoenix with flowing golden and sunset-orange feathers resting gracefully in a huge glowing nest at the volcano summit. Reengki the quokka (wearing his pink felt hat) and the little green lizard stand at the nest's edge, looking up in awe. The phoenix glows softly like a warm sunset, kind eyes, majestic yet gentle atmosphere."}, {"text": "“Hello! Welcome, 링키.”\n피오의 목소리는 따뜻한\n모닥불처럼 포근했어요.", "prompt": "Close-up of the phoenix lowering its graceful head to greet Reengki the quokka (wearing his pink felt hat), who waves shyly. The phoenix's kind golden eyes shine warmly, its feathers glowing like embers. Soft morning light around the nest, welcoming tender mood."}, {"text": "피오가 살짝 노래를 불렀어요.\n그러자 깃털이 노을빛으로 물들고\n온 섬의 등불이 반짝 웃었죠.", "prompt": "Wide shot of the phoenix singing with its head lifted, feathers rippling in waves of pink, orange and gold light. Down the volcano slope, all the village lanterns twinkle to life in response. Reengki the quokka (wearing his pink felt hat) watches with sparkling amazed eyes. Radiant, musical, magical moment."}, {"text": "링키는 여행 이야기를 들려줬어요.\n열네 마을, 열네 친구,\n그리고 열네 개의 구슬 이야기를요.", "prompt": "Medium shot of Reengki the quokka (wearing his pink felt hat) sitting on the nest's edge, happily telling stories with open arms, his pouch of fourteen glowing marbles beside him. The phoenix and the little green lizard listen warmly. Soft golden daylight, cozy storytelling mood."}, {"text": "피오는 고개를 끄덕였어요.\n“마지막 구슬은 넘어져도\n다시 일어나는 마음에게 준단다.”", "prompt": "Close-up of the phoenix speaking gently, one wing raised gracefully, a single glowing marble faintly visible nestled among its chest feathers. Reengki the quokka (wearing his pink felt hat) listens with wide serious eyes. Warm ember light, quiet meaningful moment."}, {"text": "링키의 가슴이 콩닥콩닥!\n“다시 일어나는 마음이요?”\n링키가 조심스레 물었어요.", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat) with both paws on his chest, eyes wide with wonder and a little nervousness, tilting his head at the phoenix. Sunset-colored feather glow reflects softly on his face. Curious, heartfelt mood."}, {"text": "“곧 등불 축제가 열린단다.\n불꽃 무대에서 열네 마을의\n노래를 들려주겠니?” 피오가 물었어요.", "prompt": "Medium shot of the phoenix gesturing with its glowing wing toward the village below, where a round stage is being decorated with lanterns in the plaza. Reengki the quokka (wearing his pink felt hat) and the little green lizard look down at the stage together. Bright warm afternoon light, exciting invitation mood."}, {"text": "“네! 해볼게요!” 링키가 외쳤어요.\n하지만 열네 마을의 노래를 전부…\n과연 잘 부를 수 있을까요?", "prompt": "Medium shot of Reengki the quokka (wearing his pink felt hat) jumping up with a determined fist in the air on the sunny volcano summit, while the phoenix smiles warmly and the little green lizard cheers. A tiny hint of worry in Reengki's eyebrows. Bright sky, hopeful cliffhanger feeling."}]}, {"ep": 3, "title": "마지막 시험, 불꽃 무대", "pages": [{"text": "마을 광장 한가운데엔\n둥근 불꽃 무대가 있었어요.\n등불이 무대를 빙 둘러 반짝였죠.", "prompt": "Wide shot of a round wooden stage in the village plaza, encircled by dozens of glowing orange lanterns on curved poles. Reengki the quokka (wearing his pink felt hat) stands at the center looking around, small against the warm space. Late afternoon golden light, festive preparation mood."}, {"text": "축제의 노래는 특별했어요.\n열네 마을에서 배운 노래를\n하나로 이어 부르는 거였죠.", "prompt": "Medium shot of the little green lizard unrolling a long decorative scroll of colorful song notes shaped like a winding ribbon, showing it to Reengki the quokka (wearing his pink felt hat). Reengki's eyes go wide at how long it is. Lantern-lit plaza, playful slightly-overwhelmed mood."}, {"text": "링키는 연습을 시작했어요.\n“햄스터 마을의 첫 노래부터!”\n랄랄라, 목소리가 울려 퍼졌죠.", "prompt": "Medium shot of Reengki the quokka (wearing his pink felt hat) singing energetically on the round stage, one paw raised, musical sparkles floating around him. The little green lizard taps the rhythm with his tail nearby. Warm sunset light on the plaza, lively practice mood."}, {"text": "토끼 마을 노래엔 폴짝폴짝,\n펭귄 마을 노래엔 뒤뚱뒤뚱!\n춤 스텝도 신이 났어요.", "prompt": "Dynamic medium shot of Reengki the quokka (wearing his pink felt hat) mid-dance on the stage, hopping high like a rabbit with a big joyful grin, tiny motion sparkles around his feet. Lanterns glow around the stage in the dusk. Fun, bouncy, energetic mood."}, {"text": "그런데 일곱 번째 노래에서\n“어… 다음 가사가 뭐였지?”\n링키가 멈칫 멈춰 섰어요.", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat) frozen mid-pose on the stage, one paw scratching his head, eyes looking up in confusion, a small sweat drop by his cheek. The little green lizard watches with concern from the stage edge. Dusky lantern light, gentle comic worry."}, {"text": "처음부터 다시! 랄랄라…\n그런데 이번엔 아홉 번째에서\n또 가사가 꼬여 버렸어요.", "prompt": "Medium shot of Reengki the quokka (wearing his pink felt hat) tangled in his own dance pose, ears drooping slightly, jumbled musical notes swirling messily above his head. The lanterns around the stage glow patiently in the evening. Sympathetic, lightly humorous mood."}, {"text": "“You can do it!” 도도가 외쳤어요.\n“괜찮아, 링키! 천천히 해봐!”\n불티새들도 짹짹 응원했죠.", "prompt": "Medium shot of the little green lizard cheering with both arms up beside the stage, while tiny glowing ember birds flutter and chirp encouragement around Reengki the quokka (wearing his pink felt hat). Reengki gives a small tired smile. Warm lantern glow in the night plaza, supportive mood."}, {"text": "그래도 링키는 조금 시무룩.\n“열네 곡은 너무 길어…\n나 정말 할 수 있을까?”", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat) sitting on the edge of the stage with drooping shoulders, hugging his knees, looking down at his pouch of glowing marbles. Soft orange lantern light wraps him gently. Quiet, wistful but tender mood."}, {"text": "그 모습을 화산 꼭대기에서\n피오가 가만히 지켜보았어요.\n입가엔 따뜻한 미소가 번졌죠.", "prompt": "Wide shot from behind the phoenix perched at the volcano summit, looking down at the tiny lantern-lit plaza far below where Reengki the quokka (wearing his pink felt hat) sits on the stage. The phoenix's feathers glow softly against the starry night. Watchful, warm, protective mood."}, {"text": "다음 날 아침, 피오가 링키를\n둥지로 불렀어요. 피오에겐\n특별한 가르침이 있었거든요.", "prompt": "Medium shot of a tiny glowing ember bird delivering a golden feather like an invitation to sleepy Reengki the quokka (wearing his pink felt hat) at his cottage window in soft morning light. The volcano nest glows in the distance. Curious, promising new-day mood."}]}, {"ep": 4, "title": "다시, 또 다시", "pages": [{"text": "링키는 둥지로 올라갔어요.\n피오는 재가 소복한 둥지 가운데\n포근히 앉아 있었죠.", "prompt": "Medium shot of Reengki the quokka (wearing his pink felt hat) arriving at the great nest where the phoenix sits gracefully on a soft bed of pale silver ash, feathers glowing gently. Morning light streams over the volcano summit. Calm, welcoming teacher-and-student mood."}, {"text": "“링키야, 나는 지금까지\n백 번도 넘게 넘어졌단다.”\n피오가 나직이 말했어요.", "prompt": "Close-up of the phoenix speaking softly with wise, kind eyes, one wing folded over its chest, glowing feathers rippling like a calm sunset. Reengki the quokka (wearing his pink felt hat) sits close, listening with wide attentive eyes. Warm intimate morning light."}, {"text": "“나는 가끔 재 속에서 잠들어.\n그리고 아침 해처럼 다시 일어나\n새 노래를 부르지.”", "prompt": "Dreamy medium shot of the phoenix gesturing with its wing as soft golden light swirls above the nest, forming a gentle glowing image of a small bird rising like a sunrise from cozy silver ash. Reengki the quokka (wearing his pink felt hat) watches the light-picture in wonder. Magical, comforting, not scary."}, {"text": "“넘어지는 건 부끄럽지 않아.\n다시 일어나면 되니까.\n자, 따라 해보렴. Try again!”", "prompt": "Close-up of the phoenix and Reengki the quokka (wearing his pink felt hat) facing each other, the phoenix's wingtip gently raised like a conductor, Reengki repeating the words with a brave smile. Golden feather-glow lights both faces. Encouraging, heartwarming lesson mood."}, {"text": "“Try again! 다시 한 번!”\n링키가 씩씩하게 외쳤어요.\n한 소절씩, 천천히 또박또박.", "prompt": "Medium shot of Reengki the quokka (wearing his pink felt hat) standing tall on the nest's edge singing one clear phrase, chest out, paws clenched cheerfully. Neat little musical notes float in an orderly line above him. Bright morning sky, confident fresh-start mood."}, {"text": "한 번, 두 번, 열 번!\n같은 소절을 반복할수록\n노래가 열 배로 반짝였어요.", "prompt": "Joyful medium shot of Reengki the quokka (wearing his pink felt hat) singing the same phrase with growing sparkle, ten glowing musical notes now shining brightly around him like little stars. The phoenix nods approvingly, feathers shimmering. Radiant, rewarding practice mood."}, {"text": "링키는 깨달았어요.\n“반복은 지루한 게 아니라\n반짝임을 쌓는 마법이구나!”", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat) with a big bright realization smile, eyes shining, small sparkles gathering like stacked stars beside him. Warm golden light from the phoenix's feathers glows behind. Epiphany moment, uplifting mood."}, {"text": "불티새들도 포로롱 날아와\n링키의 소절을 따라 불렀어요.\n짹짹, 랄랄라, 짹짹!", "prompt": "Medium shot of a flock of tiny glowing ember birds perched in a row on the phoenix's outstretched wing, chirping along as Reengki the quokka (wearing his pink felt hat) conducts them with a twig like a baton. Everyone singing together, sparkles everywhere. Playful chorus mood in warm daylight."}, {"text": "노을이 질 때까지 링키는\n다시, 또 다시 노래했어요.\n목소리가 점점 단단해졌죠.", "prompt": "Wide shot of Reengki the quokka (wearing his pink felt hat) singing on the volcano summit against a glorious pink and orange sunset, the phoenix and ember birds silhouetted warmly beside him. His posture is confident and steady. Golden-hour glow, montage-like perseverance mood."}, {"text": "“이제 마을에서 연습해 볼까?”\n내일은 친구들과 함께예요.\n어떤 신나는 일이 기다릴까요?", "prompt": "Medium shot of Reengki the quokka (wearing his pink felt hat) and the little green lizard walking down the volcano path at dusk, chatting excitedly, the lantern village twinkling below them. The phoenix watches from above with a fond smile. Cozy anticipation, gentle cliffhanger mood."}]}, {"ep": 5, "title": "등불과 함께 연습해요", "pages": [{"text": "다음 날, 링키는 광장에서\n연습을 이어갔어요.\n도도가 등불로 박자를 맞췄죠.", "prompt": "Medium shot of Reengki the quokka (wearing his pink felt hat) singing on the plaza stage while the little green lizard swings a small lantern side to side like a metronome. Warm daylight fills the lantern-decorated plaza. Rhythmic, cheerful practice mood."}, {"text": "등불이 흔들, 링키가 랄라!\n박자에 맞춰 노래하니\n실수가 훨씬 줄어들었어요.", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat) singing in perfect time with the swinging lantern, eyes closed happily, steady musical notes flowing in an even wave.
