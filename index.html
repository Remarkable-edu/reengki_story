age shot of the duo performing, warm lantern glow against deep blue night, soaring heartfelt mood."}, {"text": "“Little by little, day by day!”\n링키가 외치자 판다들도\n“리를 바이 리를!” 합창했죠.", "prompt": "Reengki the quokka (wearing his pink felt hat) raises one paw high on stage as the whole audience of pandas joyfully chants along, paws lifted in unison. The baby panda bounces on his cushion shouting loudest. Wide interactive concert moment, lanterns twinkling, exuberant united mood."}, {"text": "모두 일어나 느릿느릿,\n물결처럼 함께 춤췄어요.\n둥실둥실, 몽글몽글.", "prompt": "The entire village dances together in a slow gentle wave, pandas and Reengki the quokka (wearing his pink felt hat) swaying side to side in unison beneath the lanterns, arms flowing like water. The full moon crowns the scene. Wide festive shot of the swaying crowd, dreamlike joyful harmony mood."}, {"text": "달빛은 은은하게 반짝,\n대숲은 사락사락 노래하고,\n마음은 티 없이 평화로웠어요.", "prompt": "A serene overhead view of the moonlit celebration: the glowing stage, the circle of dancing pandas, Reengki the quokka (wearing his pink felt hat) at the heart of it, all embraced by silver bamboo swaying in rhythm. Perfectly peaceful composition under the full moon, luminous tranquil mood."}, {"text": "음악회가 끝나고 포포가\n속삭였어요. “링키, 내일 아침\n대숲 한가운데로 와 줄래?”", "prompt": "After the concert, the panda leans close to Reengki the quokka (wearing his pink felt hat) and whispers with a mysterious warm smile, pointing toward the deep heart of the moonlit grove. Reengki's eyes go round with wonder. Close-up two-shot with drifting lantern light, secretive exciting cliffhanger mood."}]}, {"ep": 10, "title": "반짝이는 구슬 Y", "pages": [{"text": "아침 안개가 스르르 걷히자\n대숲 한가운데에\n포포가 기다리고 있었어요.", "prompt": "Morning mist parts softly in the heart of the bamboo grove, revealing the panda standing quietly beside an ancient thick bamboo stalk, waiting with a serene smile. Reengki the quokka (wearing his pink felt hat) approaches along the dewy path. Wide misty morning shot with golden light rays, solemn beautiful mood."}, {"text": "포포가 대나무 상자를 열자\n노란 구슬이 반짝!\n‘Y’ 글자가 새겨져 있었죠.", "prompt": "The panda opens a small carved bamboo box, and inside a radiant marble engraved with the letter Y glows with warm golden light, illuminating both faces. Reengki the quokka (wearing his pink felt hat) gasps with sparkling eyes. Extreme close-up on the glowing marble in the box, magical reveal mood."}, {"text": "“링키, 잘 들어 줘.\n느리지만 꾸준하면\n누구도 못 이겨요.”", "prompt": "The panda holds the glowing marble between his paws and speaks gently and earnestly to Reengki the quokka (wearing his pink felt hat), who listens with both paws over his heart. Soft light rays fall between the bamboo around them. Warm eye-level two-shot, solemn heartfelt mentoring mood."}, {"text": "“오늘도 한 문장,\n내일도 한 문장.\n그거면 충분하단다.”", "prompt": "Close-up of the panda's kind face as he finishes his gentle words, one claw raised like marking a single line in the air, with Reengki the quokka (wearing his pink felt hat) nodding slowly with shining moved eyes. Golden morning light halos the scene, quietly powerful message mood."}, {"text": "링키는 두 손으로 구슬을 받아\n주머니에 소중히 넣었어요.\n이제 구슬이 여섯 개!", "prompt": "Reengki the quokka (wearing his pink felt hat) receives the glowing Y marble with both paws held out reverently, then tucks it into his pouch where five other marbles shimmer. His face glows with gratitude and pride. Close-up on the paws and pouch of six sparkling marbles, treasured milestone mood."}, {"text": "“I, L, O, V, E… 그리고 Y!”\n링키가 구슬을 세어 보니\n마법의 말이 자라나고 있었죠.", "prompt": "Reengki the quokka (wearing his pink felt hat) lines up six glowing marbles on a flat stone, each engraved with its letter, counting them happily with one paw. The marbles cast tiny colored lights on his amazed face. Overhead close-up of the marble row and Reengki's delight, whimsical hopeful mood."}, {"text": "콩콩이가 달려와 내밀었어요.\n“내 잎 도장이야! 콩!”\n포포는 새 공책을 선물했죠.", "prompt": "The baby panda dashes up and proudly presses his little leaf stamp gift into Reengki's paw, while the panda presents a brand-new blank notebook tied with a grass ribbon. Reengki the quokka (wearing his pink felt hat) hugs both gifts to his chest. Warm gift-giving moment at the village square, bright tender farewell-preparation mood."}, {"text": "“매일 한 문장씩 쓸게!\n약속!” 링키가 새끼손가락을\n콩콩이와 꼬옥 걸었어요.", "prompt": "Reengki the quokka (wearing his pink felt hat) and the baby panda link pinky fingers in a solemn adorable promise, both grinning with squeezed-shut eyes. The panda watches over them with a proud gentle smile. Close-up on the pinky promise, sunny warm light, sweet vow mood."}, {"text": "판다들이 문 앞에 모여\n느릿느릿 손을 흔들었어요.\n“Goodbye! 또 만나요오—!”", "prompt": "The whole panda village gathers at the round bamboo gate, slowly waving goodbye with both paws as Reengki the quokka (wearing his pink felt hat) rides his bicycle away down the path, waving back over his shoulder. Bamboo leaves flutter like confetti. Wide farewell shot with the village behind, bittersweet warm mood."}, {"text": "바람결에 피리 소리가 실려 왔죠.\n다음 마을엔 목이 아주 긴\n친구가 산다는데— 정말일까요?", "prompt": "Reengki the quokka (wearing his pink felt hat) pedals along a sunny road away from the bamboo forest, a faint musical ribbon from a distant flute trailing behind him. Far on the horizon, extremely tall trees hint at a new land with a tiny long-necked silhouette among them. Wide onward-journey shot with bright open sky, adventurous curious ending mood."}]}]}, "7": {"chapter": 7, "animal": "기린", "animal_en": "giraffe", "letter": "O", "village": "너른들 마을", "episodes": [{"ep": 1, "title": "끝없는 풀의 바다", "pages": [{"text": "링키의 가방 속에서 구슬 여섯 개가\n또르르, 사이좋게 부딪혔어요.\n일곱 번째 마을로 가는 길이었죠.", "prompt": "Wide shot of Reengki the quokka (wearing his pink felt hat) walking along a dirt path toward a vast golden-green grassland under a bright blue sky with puffy clouds. He carries a small backpack, and six glowing alphabet marbles peek out of its open pocket. Tall grass sways at the horizon like waves. Cheerful morning light with a sense of a big journey beginning."}, {"text": "“우와, 풀의 바다다!”\n초원의 풀은 링키 키보다 훌쩍 컸어요.\n바람이 불자 풀들이 쏴아— 춤을 췄죠.", "prompt": "Reengki the quokka (wearing his pink felt hat) stands at the edge of towering green grass that rises well above his head. He looks up with wide sparkling eyes and an open mouth. Wind bends the grass into rolling waves under a sunny sky. Wide shot emphasizing how tiny he is beside the grass."}, {"text": "링키는 신이 나서 풀숲으로 폴짝!\n“이쪽일까? 저쪽일까?”\n초록 터널 속을 슝슝 걸어갔어요.", "prompt": "Reengki the quokka (wearing his pink felt hat) hops happily through a tunnel of tall grass, blades arching overhead like a green canopy. Dappled sunlight speckles the ground. Close-up from the front as he bounds forward with a joyful grin. Playful, adventurous mood."}, {"text": "그런데 어라?\n어디를 봐도 초록 풀뿐이었어요.\n링키는 그만 길을 잃고 말았죠.", "prompt": "Reengki the quokka (wearing his pink felt hat) stands in the middle of dense tall grass, turning around with a worried expression, one paw on his hat. Identical green grass surrounds him in every direction. Slightly high wide angle showing him lost in a maze of grass. The light is still warm but his face is anxious."}, {"text": "“여기요! 아무도 없나요?”\n링키의 가슴이 콩닥콩닥 뛰었어요.\n그때, 위에서 목소리가 들렸죠.", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat) cupping his paws around his mouth and calling out in the tall grass, eyes a little teary. Above him the tips of the grass part slightly, a gentle shadow falling over him. Soft afternoon light, gentle suspense."}, {"text": "“꼬마야, 왜 그렇게 뱅뱅 돌고 있니?”\n풀숲 사이로 누군가 쑥\n얼굴을 내밀었어요. 기린이었어요!", "prompt": "A friendly young giraffe lowers his long neck down through the tall grass, his big gentle face coming close to tiny Reengki the quokka (wearing his pink felt hat), who looks up in astonishment. The giraffe's head seems to descend from the sky itself. Tall vertical composition emphasizing the height difference. Warm and humorous mood."}, {"text": "“난 기루야. 위에서 다 보였어.”\n“난 링키! 노래하는 쿼카야.”\n둘은 마주 보고 씩 웃었어요.", "prompt": "Reengki the quokka (wearing his pink felt hat) and the young giraffe smile at each other, the giraffe bending his neck so their faces are level. Tall grass frames them on both sides. Medium shot capturing the first spark of friendship, golden sunlight, cheerful atmosphere."}, {"text": "“풀숲에도 길이 있어.\n높은 데서 보면 다 보이거든!”\n기루가 목을 쭉 펴고 앞장섰어요.", "prompt": "The young giraffe walks ahead through the grassland with his neck stretched tall, scanning over the top of the grass, while Reengki the quokka (wearing his pink felt hat) follows close behind his legs. From the giraffe's high viewpoint a faint winding path is visible through the grass sea. Wide shot in late afternoon glow."}, {"text": "풀숲을 빠져나오자, 우와!\n너른 들판에 아늑한 마을이 보였어요.\n한가운데엔 높다란 탑도 있었죠.", "prompt": "Wide establishing shot of a cozy grassland village of round thatched-roof houses nestled in a wide open meadow, with one tall wooden tower rising at its center. Reengki the quokka (wearing his pink felt hat) and the young giraffe stand on a small rise looking down at the village. Warm sunset colors, welcoming mood."}, {"text": "“저 탑은 뭐야?” 링키가 묻자\n기루의 눈이 반짝 빛났어요.\n“우리 마을의 보물, 하늘 등대야!”", "prompt": "Close-up of the young giraffe's face with proudly sparkling eyes as he gazes toward the tall wooden tower glowing in the sunset, Reengki the quokka (wearing his pink felt hat) beside him looking curious. The tower's tiny lantern room catches the orange light. Air of wonder and anticipation."}]}, {"ep": 2, "title": "하늘 등대와 바람 할아버지", "pages": [{"text": "“여기는 너른들 마을이야!”\n마을 친구들이 링키를 반겨 주었어요.\n“안녕! 어서 와, 꼬마 손님!”", "prompt": "Reengki the quokka (wearing his pink felt hat) arrives at the grassland village square with the young giraffe, greeted by friendly giraffes and small meerkats waving. Round thatched houses and grass gardens surround the square. Warm evening light, festive welcoming mood, wide shot."}, {"text": "그날 저녁, 기루네 집에서는\n달콤한 아카시아 잎 수프가 보글보글.\n링키는 배가 불러 배시시 웃었죠.", "prompt": "Cozy interior of a giraffe family home with a very tall doorway, where Reengki the quokka (wearing his pink felt hat) and the young giraffe share steaming bowls of leaf soup at a long table. Soft lantern light, steam curling up, homely and warm atmosphere. Medium shot."}, {"text": "다음 날 아침, 기루가 말했어요.\n“하늘 등대 보러 갈래?\n우리 할아버지가 등대지기셔!”", "prompt": "Morning scene of the young giraffe excitedly leading Reengki the quokka (wearing his pink felt hat) along a grassy path toward the tall wooden lookout tower on a hill. Dew sparkles on the grass under a fresh blue sky. Wide shot with the tower rising ahead."}, {"text": "등대는 구름에 닿을 듯 높았어요.\n“우와아…” 링키는 고개를 젖히다\n모자가 뒤로 툭 떨어질 뻔했죠.", "prompt": "Low-angle shot from the base of the tall wooden lookout tower stretching up toward puffy clouds. Tiny Reengki the quokka (wearing his pink felt hat) tilts his head far back, holding his hat with one paw, mouth open in awe. The young giraffe stands beside him smiling. Dramatic height, playful mood."}, {"text": "꼭대기에서 할아버지 기린이\n망원경을 들고 내려왔어요.\n“허허, 난 바람 할아버지란다!”", "prompt": "An elderly giraffe with a kind wrinkled face and a small scarf comes down the tower's spiral ramp holding a brass telescope, greeting Reengki the quokka (wearing his pink felt hat) and the young giraffe below. Gentle smile, morning sunlight on the wooden tower. Medium wide shot."}, {"text": "“밤이 되면 이 등대에 불을 켠단다.\n풀의 바다를 건너는 친구들이\n불빛을 보고 길을 찾지.”", "prompt": "The elderly giraffe gestures with his telescope toward the vast grassland stretching to the horizon like a sea, explaining to Reengki the quokka (wearing his pink felt hat) who listens with shining eyes. At the tower top a big lantern is visible. Sweeping wide shot of the grass sea, inspiring mood."}, {"text": "할아버지가 빙그레 웃으며 말했어요.\n“멀리 본 사람만이\n큰 길을 찾을 수 있단다.”", "prompt": "Close-up of the elderly giraffe bending his long neck down to speak gently to Reengki the quokka (wearing his pink felt hat), who looks up thoughtfully. Soft warm backlight halos them, tall grass swaying softly behind. Tender, wise atmosphere."}, {"text": "기루가 망원경을 들고 외쳤어요.\n“이럴 땐 이렇게 말해. Look!”\n“룩! 봐!” 링키도 따라 외쳤죠.", "prompt": "The young giraffe holds the brass telescope to his eye and points to the horizon while Reengki the quokka (wearing his pink felt hat) copies him with cupped paws like a pretend telescope. Both are laughing on the grassy hill by the tower. Bright cheerful daylight, playful medium shot."}, {"text": "“곧 바람 축제가 열린단다.\n등대 아래에서 노래도 부르지.”\n링키의 귀가 쫑긋 섰어요!", "prompt": "The elderly giraffe nods toward villagers below carrying colorful flags and kites toward the square, while Reengki the quokka (wearing his pink felt hat) perks up with excited round eyes and raised ears. The young giraffe grins beside him. Lively wide shot full of festival preparations."}, {"text": "“나도 노래하고 싶어요!” 링키가 외쳤어요.\n그런데 어쩐 일인지 기루는\n등대 계단만 물끄러미 보고 있었죠.", "prompt": "Reengki the quokka (wearing his pink felt hat) cheers with raised paws, but beside him the young giraffe gazes quietly up at the tower's tall spiral stairs with an uneasy expression. Contrast between the excited quokka and the worried giraffe. Late morning light, subtle foreshadowing mood."}]}, {"ep": 3, "title": "기루의 비밀", "pages": [{"text": "마을은 축제 준비로 북적북적!\n깃발이 펄럭, 연이 팔랑.\n링키도 콧노래를 흥얼거렸어요.", "prompt": "Bustling grassland village square with giraffes hanging colorful flags between tall poles and meerkats carrying rolled-up kites. Reengki the quokka (wearing his pink felt hat) hums happily while hopping between them. Bright midday light, festive energy, wide shot."}, {"text": "그런데 기루는 혼자 등대 앞에서\n후우— 긴 한숨을 쉬고 있었어요.\n긴 목이 축 처져 있었죠.", "prompt": "The young giraffe stands alone at the base of the tall wooden lookout tower, his long neck drooping low and his ears flat, letting out a big sigh. The festive village bustles blurrily in the background. Soft afternoon light, quiet melancholy mood, medium wide shot."}, {"text": "“기루야, 무슨 일 있어?”\n링키가 살금살금 다가가 물었어요.\n기루는 발끝만 콕콕 굴렀죠.", "prompt": "Reengki the quokka (wearing his pink felt hat) tiptoes up to the young giraffe and looks up at him with a gentle, worried expression. The giraffe looks away, scuffing the ground with one hoof, embarrassed. Close-up on the two friends by the tower base, warm soft light."}, {"text": "“사실은… 나, 높은 곳이 무서워.”\n기루가 조그맣게 속삭였어요.\n“계단만 봐도 다리가 후들후들해.”", "prompt": "Close-up of the young giraffe whispering with drooping ears and teary shy eyes, bending his neck down toward Reengki the quokka (wearing his pink felt hat), who listens carefully. Behind them the spiral stairs of the tower wind upward. Muted gentle colors, confessional intimate mood."}, {"text": "“목은 하늘까지 닿는데 말이야….”\n기루의 볼이 발그레해졌어요.\n“친구들이 웃을까 봐 말 못 했어.”", "prompt": "The young giraffe blushes and lowers his head almost to the ground, hiding half his face behind a tuft of tall grass, while Reengki the quokka (wearing his pink felt hat) pats his cheek comfortingly. Gentle late afternoon glow, tender embarrassed mood, medium shot."}, {"text": "축제 밤에는 특별한 전통이 있어요.\n어린 기린이 등대에 올라가\n첫 등불을 켜는 거예요.", "prompt": "Imagined scene shown softly like a memory: a small giraffe silhouette climbing the spiral ramp of the lookout tower at night, lifting a warm lantern to the big lamp at the top while villagers watch from below with glowing eyes. Dreamy dusk palette with soft stars, storybook flashback mood."}, {"text": "“올해는 내 차례인데….\n난 못 할 거야.” 기루가 말했어요.\n큰 눈에 눈물이 그렁그렁 맺혔죠.", "prompt": "Close-up of the young giraffe's large sad eyes brimming with tears as he looks down at the ground, the tall tower looming softly out of focus behind him. Reengki the quokka (wearing his pink felt hat) reaches up to hold his chin. Blue-tinted evening light, tender emotional moment."}, {"text": "“기루야, 나도 무서운 게 많아.\n그런데 조금씩 하면 되더라!”\n링키가 가슴을 탕탕 두드렸어요.", "prompt": "Reengki the quokka (wearing his pink felt hat) puffs out his chest and thumps it confidently with one paw, smiling up at the young giraffe with encouraging bright eyes. The giraffe lifts his head a little, a spark of hope on his face. Warm sunset light, uplifting medium shot."}, {"text": "“내일부터 같이 연습하자.\n한 칸씩, 한 칸씩!”\n둘은 새끼손가락을 꼬옥 걸었어요.", "prompt": "Reengki the quokka (wearing his pink felt hat) stands on a wooden crate to hook his tiny finger around the tip of the young giraffe's lowered hoof in a pinky-promise pose, both smiling warmly. The tower stands tall behind them against an orange-pink sky. Heartwarming promise scene, medium shot."}, {"text": "그날 밤 기루는 창밖의 등대를\n오래오래 바라보았어요.\n내일, 첫걸음을 뗄 수 있을까요?", "prompt": "Night scene of the young giraffe looking out of a tall window of his home at the distant lookout tower glowing faintly under a starry sky, his expression a mix of worry and quiet determination. Cool indigo night palette with warm window light. Medium shot, hopeful suspense."}]}, {"ep": 4, "title": "한 칸씩, 한 칸씩", "pages": [{"text": "이른 아침, 둘은 등대 앞에 섰어요.\n계단이 하늘까지 뱅글뱅글!\n기루가 꿀꺽, 침을 삼켰죠.", "prompt": "Early morning at the base of the tall wooden lookout tower, its spiral ramp winding up into the sky. The young giraffe gulps nervously while Reengki the quokka (wearing his pink felt hat) stands beside him striking a cheerful ready pose. Fresh dewy light, low-angle wide shot emphasizing the climb ahead."}, {"text": "“오늘은 딱 한 칸만!”\n기루가 조심조심 발을 올렸어요.\n다리가 후들후들 떨렸지만요.", "prompt": "Close-up of the young giraffe placing one trembling front hoof onto the first wooden step of the spiral ramp, biting his lip in concentration. Reengki the quokka (wearing his pink felt hat) cheers right beside the step with raised paws. Soft morning light, tense but encouraging mood."}, {"text": "링키가 신나는 노래를 만들었어요.\n“한 칸, 두 칸, 폴짝폴짝!\n기루는 할 수 있어, 랄랄라!”", "prompt": "Reengki the quokka (wearing his pink felt hat) dances and sings on the wooden ramp, clapping a rhythm, while the young giraffe carefully climbs one more step with a small brave smile. Musical notes implied by his joyful open-mouthed singing pose. Bright cheerful daylight, playful medium shot."}, {"text": "하나, 둘, 셋! 세 칸 성공!\n“해냈어! 내가 올라갔어!”\n기루가 처음으로 활짝 웃었어요.", "prompt": "The young giraffe stands proudly on the third step of the spiral ramp, beaming with a wide-open smile, while Reengki the quokka (wearing his pink felt hat) jumps high in celebration below him. Sunlight bursts warmly around them. Joyful triumphant moment, medium wide shot."}, {"text": "그때 풀 사이에서 쪼르르—\n미어캣 남매 도도와 레레가 나왔어요.\n“우리도 응원할래!”", "prompt": "Two small meerkat siblings pop up from the tall grass and scurry over to the tower base, standing upright with excited waving paws. Reengki the quokka (wearing his pink felt hat) and the young giraffe on the ramp turn to greet them happily. Sunny grassland backdrop, lively cute wide shot."}, {"text": "도도가 폴짝 뛰며 외쳤어요.\n“힘낼 땐 이렇게 말해. Go, go!”\n“고, 고!” 링키도 함께 외쳤죠.", "prompt": "The meerkat sibling jumps up punching a tiny fist into the air in a cheering pose, while Reengki the quokka (wearing his pink felt hat) copies the cheer with sparkling eyes and the young giraffe laughs on the steps above. Bright midday light, energetic cheering scene, medium shot."}, {"text": "“고, 고! 기루, 고, 고!”\n응원 소리에 기루는 어느새\n등대 중간까지 올라갔어요!", "prompt": "Wide shot of the tall lookout tower with the young giraffe halfway up the spiral ramp, climbing steadily, while Reengki the quokka (wearing his pink felt hat) and the two meerkats cheer with waving arms from below. Flags of the village flutter in the distance. Uplifting bright afternoon mood."}, {"text": "그런데 아래를 힐끗 본 순간—\n으아, 마을이 콩알만 했어요!\n기루는 그 자리에 얼음이 됐죠.", "prompt": "View from halfway up the tower ramp: the young giraffe freezes stiff, eyes wide with dizzy fear, gripping the railing as he glances down at the tiny thatched roofs far below. His legs wobble. High-angle composition showing the dizzying height, tense moment with wind-blown grass far beneath."}, {"text": "“괜찮아, 천천히 내려오자.”\n기루는 조심조심 내려왔어요.\n그래도 어제보다 훨씬 높이 갔는걸요!", "prompt": "Reengki the quokka (wearing his pink felt hat) gently guides the young giraffe as he steps carefully back down the spiral ramp, the giraffe still shaky but relieved. The two meerkats hold up their paws encouragingly at the bottom. Warm reassuring late-afternoon light, gentle medium shot."}, {"text": "멀리서 바람 할아버지가\n허허, 흐뭇하게 지켜보고 있었어요.\n내일은 더 높이 오를 수 있을까요?", "prompt": "The elderly giraffe watches from a grassy hill with a warm knowing smile, telescope tucked under his neck scarf, as the young giraffe and Reengki the quokka (wearing his pink felt hat) walk home from the tower in the sunset. Golden evening glow over the grassland, tender hopeful wide shot."}]}, {"ep": 5, "title": "발끝 말고, 저 멀리", "pages": [{"text": "다음 날, 기루는 씩씩하게\n어제보다 더 높이 올라갔어요.\n“고, 고!” 응원이 쩌렁쩌렁 울렸죠.", "prompt": "The young giraffe climbs the spiral ramp past the halfway point with determined eyes, while Reengki the quokka (wearing his pink felt hat) and the two meerkats cheer loudly from below with raised arms. Clear blue morning sky, energetic climbing scene, wide low-angle shot."}, {"text": "그때 바람이 휘잉— 불었어요.\n등대가 삐그덕 흔들리자\n기루는 또 얼음이 되고 말았어요.", "prompt": "A gust of wind sweeps across the tower, making the wooden ramp creak, and the young giraffe freezes mid-step with wide frightened eyes, ears pressed back, hugging the railing. Grass below bends in waves. Dynamic wind-blown scene with tense atmosphere, medium shot from the side."}, {"text": "터덜터덜 내려온 기루는\n풀밭에 목을 늘어뜨렸어요.\n“역시 난 안 되나 봐….”", "prompt": "The young giraffe lies in the meadow with his long neck drooped flat along the grass, eyes sad and discouraged. Reengki the quokka (wearing his pink felt hat) sits quietly beside his cheek, and the two meerkats peek worriedly from the grass. Muted soft afternoon light, gentle melancholy wide shot."}, {"text": "그때 바람 할아버지가 오셨어요.\n“기루야, 할아버지도 어릴 적엔\n계단이 무서워 벌벌 떨었단다.”", "prompt": "The elderly giraffe lowers himself beside the sad young giraffe in the meadow, speaking gently with kind wrinkled eyes, while Reengki the quokka (wearing his pink felt hat) listens nearby. Tall grass sways softly around them. Warm storytelling mood, golden light, medium shot."}, {"text": "“그런데 말이다, 비밀이 하나 있지.\n발끝을 보면 무섭지만\n저 멀리를 보면 가슴이 트인단다.”", "prompt": "Close-up of the elderly giraffe pointing his nose toward the far horizon where the grass sea meets the sky, one hoof gesturing outward, as the young giraffe and Reengki the quokka (wearing his pink felt hat) follow his gaze. Vast open horizon glowing in warm light, wise inspiring atmosphere."}, {"text": "기루는 다시 계단에 섰어요.\n이번엔 발끝 대신 고개를 들고\n저어기 먼 곳을 바라보았죠.", "prompt": "The young giraffe stands on the spiral ramp again, chin lifted high, eyes fixed on the distant horizon instead of his hooves, taking a brave breath. Reengki the quokka (wearing his pink felt hat) climbs beside him giving a thumbs-up-like paw gesture. Fresh determined mood, low-angle medium shot."}, {"text": "“우와… 풀의 바다에 길이 보여!\n구불구불, 반짝반짝!”\n무서움이 조금씩 작아졌어요.", "prompt": "Breathtaking view from high on the tower: the endless grass sea rolls to the horizon with a faint winding path shining through it. The young giraffe gazes out with amazed sparkling eyes, fear melting from his face, Reengki the quokka (wearing his pink felt hat) beside him. Sweeping panoramic wide shot, wondrous mood."}, {"text": "한 칸, 또 한 칸!\n기루는 꼭대기 바로 아래까지\n성큼성큼 올라갔어요!", "prompt": "The young giraffe strides confidently up the last stretch of the spiral ramp, just below the lantern room at the top, his neck tall and proud. Reengki the quokka (wearing his pink felt hat) rides near his shoulder cheering. Dramatic height with puffy clouds close by, triumphant ascent, wide shot."}, {"text": "“고, 고, 기루! 고, 고!”\n아래에서 도도와 레레가\n폴짝폴짝 뛰며 환호했어요.", "prompt": "Seen from above, the two meerkat siblings jump and cheer wildly at the tower base, tiny in the meadow, waving up at the young giraffe and Reengki the quokka (wearing his pink felt hat) high on the ramp. High-angle shot capturing the joyful distance climbed, bright celebratory afternoon."}, {"text": "축제는 이제 이틀 뒤!\n그런데 그날 밤, 풀의 바다 위로\n잿빛 안개가 스멀스멀 몰려왔어요.", "prompt": "Night scene of the grassland village under a darkening sky as a thick gray mist creeps slowly over the distant grass sea toward the village, the lookout tower standing quiet against the last light. Ominous but soft storybook mood, wide establishing shot with cool gray-blue palette."}]}, {"ep": 6, "title": "잿빛 안개가 몰려와요", "pages": [{"text": "아침이 되자 온 세상이 뿌예졌어요.\n한 발짝 앞도 잘 안 보였죠.\n“안개가 정말 두껍네!”", "prompt": "The grassland village wrapped in thick gray-white fog, thatched roofs fading into the mist. Reengki the quokka (wearing his pink felt hat) stretches out one paw in front of his face, barely able to see it, eyes round with surprise. Soft diffused light, mysterious foggy morning, medium wide shot."}, {"text": "펄럭이던 깃발도, 팔랑이던 연도\n모두 조용히 멈춰 있었어요.\n마을 친구들 얼굴에 걱정이 가득했죠.", "prompt": "Festival flags hang limp and kites lie abandoned on the misty village square, where giraffes and meerkats stand in small worried clusters looking at the gray sky. Reengki the quokka (wearing his pink felt hat) and the young giraffe stand among them. Muted foggy palette, quiet concerned mood, wide shot."}, {"text": "그때 엄마 미어캣이 달려왔어요.\n“도도와 레레가 없어졌어요!\n아침에 달콤베리를 따러 갔는데….”", "prompt": "A mother meerkat rushes into the square with frantic worried eyes, paws clasped, speaking to the gathered villagers. Reengki the quokka (wearing his pink felt hat) and the young giraffe listen with shocked expressions. Fog swirls around the crowd. Urgent but gentle storybook tension, medium shot."}, {"text": "달콤베리 덤불은 풀의 바다\n저어 깊은 곳에 있었어요.\n마을이 웅성웅성 술렁였죠.", "prompt": "Villagers murmur anxiously at the edge of the village where the tall grass sea disappears into thick fog, a faint berry-bush path swallowed by mist. The young giraffe peers into the gray wall of fog with worry. Cool gray-green palette, wide shot conveying the vast hidden grassland."}, {"text": "어른 기린들이 앞장섰어요.\n“우리가 풀의 바다를 살펴볼게!”\n성큼성큼 안개 속으로 떠났죠.", "prompt": "Several adult giraffes stride bravely into the foggy tall grass in different directions, their long necks rising above the mist like ship masts. Villagers watch them go from the village edge. Reengki the quokka (wearing his pink felt hat) clenches his paws hopefully. Misty heroic departure, wide shot."}, {"text": "바람 할아버지가 말했어요.\n“밤이 오기 전에 등대 불을 켜야 해.\n안개 속에선 불빛이 길잡이란다.”", "prompt": "The elderly giraffe speaks solemnly to the remaining villagers, gesturing with his telescope toward the fog-shrouded lookout tower whose top vanishes into gray mist. Reengki the quokka (wearing his pink felt hat) and the young giraffe listen intently. Dim silvery light, grave determined mood, medium shot."}, {"text": "할아버지는 서둘러 계단을 오르다\n앗, 발을 삐끗하고 말았어요!\n“아이고, 늙은 다리가 말썽이구나.”", "prompt": "On the lower steps of the tower ramp, the elderly giraffe stumbles and sits down holding one foreleg, wincing but trying to smile. Reengki the quokka (wearing his pink felt hat) and the young giraffe rush to his side with alarmed faces. Fog drifting around the tower base, gentle mishap scene, medium shot."}, {"text": "“어른 기린들은 모두 풀의 바다에….\n등불을 켤 수 있는 건\n이제 기루, 너뿐이란다.”", "prompt": "The elderly giraffe, resting against the tower base, looks up earnestly at the young giraffe, whose eyes widen in shock. Reengki the quokka (wearing his pink felt hat) looks back and forth between them. The tall ramp spirals up into thick fog above. Heavy meaningful moment, low-angle medium shot."}, {"text": "기루의 가슴이 콩닥콩닥.\n무서운 계단, 캄캄한 안개….\n그때 링키가 손을 꼭 잡았어요.", "prompt": "Close-up of the young giraffe staring up at the fog-hidden tower top with a pounding anxious expression, while tiny Reengki the quokka (wearing his pink felt hat) firmly holds his lowered hoof with both paws, eyes full of trust. Cool misty background, warm bond between friends, intimate shot."}, {"text": "“내가 같이 갈게. 우리 둘이서!”\n둘은 등대 문을 열었어요.\n과연 꼭대기까지 오를 수 있을까요?", "prompt": "Reengki the quokka (wearing his pink felt hat) and the young giraffe push open the heavy wooden door at the tower base together, warm lantern light spilling out against the surrounding fog. Both wear determined expressions. Dramatic doorway framing, adventurous cliffhanger mood, medium shot."}]}, {"ep": 7, "title": "캄캄한 계단", "pages": [{"text": "링키는 작은 랜턴을 들고\n기루의 머리 위에 올라탔어요.\n“출발! 한 칸씩, 한 칸씩!”", "prompt": "Inside the dim tower, Reengki the quokka (wearing his pink felt hat) sits atop the young giraffe's head holding a small glowing lantern like a tiny lighthouse himself. The giraffe takes his first step up the shadowy spiral ramp. Warm lantern glow against deep blue shadows, brave beginning, medium shot."}, {"text": "“한 칸, 두 칸, 폴짝폴짝!”\n링키의 노래가 등대 안에\n동글동글 울려 퍼졌어요.", "prompt": "The young giraffe climbs the wooden spiral ramp while Reengki the quokka (wearing his pink felt hat) sings cheerfully from his head, the lantern swinging gently. The song seems to fill the tall hollow tower with warmth. Cozy golden light rising through darkness, rhythmic hopeful climb, wide interior shot."}, {"text": "절반쯤 올랐을 때였어요.\n바람이 우우웅— 울부짖고\n낡은 등대가 삐거덕거렸죠.", "prompt": "Halfway up the tower, wind howls through the window openings, rattling the old wooden beams. The young giraffe pauses nervously on the creaking ramp as fog swirls past the windows. Reengki the quokka (wearing his pink felt hat) steadies the lantern. Tense atmosphere, cool drafty shadows, medium shot."}, {"text": "기루는 그만 발끝을 보고 말았어요.\n다리가 후들후들, 몸이 꽁꽁.\n“무, 무서워… 못 가겠어….”", "prompt": "Close-up of the young giraffe frozen on the dark ramp, staring down at his trembling hooves, eyes squeezed half-shut in fear. The lantern light flickers over his frightened face. Reengki the quokka (wearing his pink felt hat) leans down toward his ear with concern. Dramatic chiaroscuro, tense moment."}, {"text": "링키가 귓가에 속삭였어요.\n“기루야, 발끝 말고 저 멀리.\nLook! 멀리 봐!”", "prompt": "Reengki the quokka (wearing his pink felt hat) whispers gently into the young giraffe's ear, pointing one small paw toward a window opening where the fog glows faintly. The giraffe's eye turns slowly toward the light. Intimate close-up, warm lantern glow against blue darkness, turning-point mood."}, {"text": "기루가 천천히 고개를 들었어요.\n창밖 안개 사이로 마을의 불빛들이\n반딧불처럼 반짝이고 있었죠.", "prompt": "Through the tower window, the young giraffe sees tiny warm house lights of the village twinkling through drifting fog like fireflies below. His frightened eyes soften with wonder and courage. Reengki the quokka (wearing his pink felt hat) smiles beside his cheek. Magical foggy night view, hopeful shift, medium shot."}, {"text": "“저 불빛처럼… 나도 도도와 레레의\n불빛이 되어 줄 거야!”\n기루는 후우— 숨을 고르고 한 칸!", "prompt": "The young giraffe lifts his head with newfound resolve, takes a deep breath, and steps firmly up the next stair, neck stretched tall. Reengki the quokka (wearing his pink felt hat) raises the lantern high from his head like a flag. Determined heroic climb, warm light pushing back shadows, low-angle shot."}, {"text": "한 칸, 또 한 칸, 성큼성큼!\n드디어 꼭대기 등불 방 앞에\n다다랐어요!", "prompt": "The young giraffe reaches the top of the spiral ramp, standing before the small wooden door of the lantern room, chest heaving proudly. Reengki the quokka (wearing his pink felt hat) cheers on his head. Wind and fog swirl outside the openings. Triumphant arrival, dramatic high setting, medium shot."}, {"text": "문을 열자 바람이 휘이잉!\n링키의 랜턴 불이\n깜빡깜빡 위태롭게 흔들렸어요.", "prompt": "The lantern room door swings open and a gust of foggy wind rushes in, making the small lantern flame in Reengki the quokka's paws flicker dangerously (he wears his pink felt hat, holding it down with one paw). The young giraffe shields the lantern with his neck. Windy tense scene, flickering light and shadow."}, {"text": "커다란 등불까지 이제 한 걸음.\n둘은 서로를 마주 보았어요.\n불을 무사히 켤 수 있을까요?", "prompt": "Inside the lantern room, the big unlit glass lamp waits on its stand as the young giraffe and Reengki the quokka (wearing his pink felt hat) exchange a determined nod, the tiny flickering lantern between them. Fog presses against the glass walls. Suspenseful final-step moment, close medium shot."}]}, {"ep": 8, "title": "하늘에 켜진 불빛", "pages": [{"text": "기루가 긴 목을 쭈욱 뻗어\n랜턴의 불씨를 등불에 옮겼어요.\n화르르— 따뜻한 불이 피어났죠!", "prompt": "The young giraffe stretches his long neck carefully, tilting the small lantern so its flame lights the big glass lamp, which blooms into a warm golden blaze. Reengki the quokka (wearing his pink felt hat) shields his eyes from the sudden glow, smiling. Radiant warm light filling the lantern room, triumphant close shot."}, {"text": "등불 빛이 빙그르르 돌며\n두꺼운 안개를 가르고\n풀의 바다 멀리멀리 뻗어 갔어요.", "prompt": "Exterior wide shot of the lookout tower at night, its lamp sending a great rotating beam of golden light slicing through thick fog, sweeping over the endless dark grass sea. The village roofs glow faintly below. Majestic lighthouse scene, dramatic light and mist, awe-inspiring mood."}, {"text": "그 시간, 풀의 바다 깊은 곳.\n도도와 레레는 서로 꼭 붙어\n훌쩍훌쩍 울고 있었어요.", "prompt": "Deep in the foggy tall grass at night, the two small meerkat siblings huddle together under a big leaf, sniffling with teary frightened eyes, a little basket of berries beside them. Cold bluish fog surrounds them. Vulnerable tender scene, close medium shot."}, {"text": "그때, 안개 사이로 반짝!\n“저기 봐! 하늘 등대야!”\n“마을이 저쪽이야! 가자!”", "prompt": "The two meerkat siblings leap up pointing excitedly as a golden beam of light sweeps through the fog above the grass, their faces lit with hope. One grabs the berry basket, the other tugs a paw forward. Magical rescue-light moment, glowing beam cutting the misty night, dynamic medium shot."}, {"text": "불빛을 따라 아장아장 걷다 보니\n어른 기린들도 만났어요.\n“얘들아! 찾았다, 찾았어!”", "prompt": "In the foggy tall grass, adult giraffes bend their long necks down joyfully to the two small meerkat siblings, who wave with relief. The lighthouse beam glows warmly overhead, showing the way home. Reunion in the misty night grass, warm gold against soft gray, wide shot."}, {"text": "마을 광장에서 엄마 미어캣이\n도도와 레레를 꼬옥 안았어요.\n모두가 손뼉을 짝짝 쳤죠.", "prompt": "In the village square at night, the mother meerkat hugs her two children tightly, all three teary and smiling, while villagers around them clap warmly. The lighthouse beam circles softly overhead through thinning fog. Emotional heartwarming reunion, warm lantern-lit square, medium wide shot."}, {"text": "“그런데 등불은 누가 켰지?”\n모두 등대 꼭대기를 올려다봤어요.\n“기루가! 우리 기루가 켰단다!”", "prompt": "Villagers look up in wonder at the glowing lantern room atop the tower, where the small silhouettes of the young giraffe and Reengki the quokka (wearing his pink felt hat) wave down. The elderly giraffe announces proudly, one foreleg wrapped in a small bandage. Proud revealing moment, upward wide shot at night."}, {"text": "도도와 레레가 크게 외쳤어요.\n“Thank you! 고마워, 기루!”\n“Thank you, 링키!”", "prompt": "The two meerkat siblings cup their paws around their mouths and shout gratefully up toward the tower top, jumping with joy in the lantern-lit square. Villagers smile all around them. Joyful thankful energy, warm night celebration, medium shot from behind the meerkats looking up."}, {"text": "기루의 볼이 발그레 물들었어요.\n링키와 기루는 마주 보며\n손바닥을 짝! 마주쳤죠.", "prompt": "In the glowing lantern room, the young giraffe blushes happily as Reengki the quokka (wearing his pink felt hat) jumps up to slap a tiny high-five against his lowered cheek-level hoof. The great lamp shines warmly behind them. Best-friends victory moment, golden light, close medium shot."}, {"text": "안개는 밤사이 스르르 걷혔어요.\n내일은 드디어 바람 축제!\n어떤 신나는 일이 기다릴까요?", "prompt": "The fog melts away from the night grassland, revealing a sky full of twinkling stars above the village and the softly glowing tower. Festival flags flutter faintly in a fresh breeze. Peaceful cleared night, anticipation of celebration, wide establishing shot."}]}, {"ep": 9, "title": "바람 축제의 밤", "pages": [{"text": "축제 날 아침, 하늘은 씻은 듯\n파랗고 눈부셨어요.\n바람도 살랑살랑 기분이 좋았죠.", "prompt": "Brilliant clear morning over the grassland village, deep blue sky with a few cotton clouds, dew sparkling on the meadow. Reengki the quokka (wearing his pink felt hat) stretches happily outside the giraffe home while flags flutter in a gentle breeze. Fresh festival-morning mood, wide shot."}, {"text": "광장은 알록달록 연과 깃발,\n달콤베리 주스와 잎사귀 과자로\n가득가득 채워졌어요.", "prompt": "The village square bustling with festival stalls: colorful kites leaning in rows, flag garlands overhead, jugs of berry juice and plates of leaf cookies. Giraffes and meerkats busily decorate while Reengki the quokka (wearing his pink felt hat) helps carry a small flag. Vibrant cheerful daytime, busy wide shot."}, {"text": "해가 지자 축제가 시작됐어요.\n“올해의 첫 등불은\n용감한 기루가 켜겠습니다!”", "prompt": "Dusk festival scene at the tower base: the elderly giraffe proudly announces to the gathered villagers, gesturing toward the young giraffe who stands tall with a ceremonial lantern hanging from a ribbon around his neck. Warm twilight colors, lantern-lit crowd, ceremonial exciting mood, wide shot."}, {"text": "기루는 성큼성큼 계단을 올랐어요.\n고개를 들고, 저 멀리 보면서요.\n이제 하나도 떨리지 않았죠!", "prompt": "The young giraffe climbs the spiral ramp confidently at dusk, head held high and eyes on the far horizon, the ceremonial lantern glowing at his neck. Below, villagers watch with upturned faces. No fear in his stride. Proud graceful ascent, purple-orange twilight, low-angle wide shot."}, {"text": "화르르— 등불이 켜지자\n“와아아—!” 함성이 터졌어요.\n밤하늘이 환하게 밝아졌죠.", "prompt": "The big lamp atop the tower bursts into golden light as the young giraffe lights it, and the crowd below erupts in cheers with raised paws and hooves. The beam sweeps over the celebrating square. Explosive joyful celebration, radiant night lighting, dynamic wide shot."}, {"text": "이번엔 링키 차례!\n등대 발코니에 오른 링키가\n고운 목소리로 노래를 시작했어요.", "prompt": "Reengki the quokka (wearing his pink felt hat) stands on the tower's balcony railing like a little stage, arms open wide, singing his heart out under the glowing lamp. Villagers gaze up enchanted from the lantern-lit square below. Star-filled sky, magical concert moment, medium shot from slightly below."}, {"text": "노랫소리는 바람을 타고\n풀의 바다 멀리멀리 퍼져 갔어요.\n풀들도 사아아— 춤을 추었죠.", "prompt": "Wide dreamy shot of the moonlit grass sea rippling in waves as if dancing to music drifting from the glowing tower in the distance. Soft musical sparkles ride the wind over the grass. Poetic nighttime landscape, gentle silver-and-gold palette, enchanted mood."}, {"text": "“Let's dance! 같이 춰요!”\n기루도, 도도와 레레도, 할아버지도\n덩실덩실 신나게 춤췄어요.", "prompt": "Joyful dance scene in the festival square: the young giraffe sways his long neck, the two meerkat siblings spin holding paws, and the elderly giraffe taps his hooves, all dancing under strings of lanterns while Reengki the quokka (wearing his pink felt hat) sings above. Lively festive night, warm glowing colors, wide shot."}, {"text": "연들이 밤하늘로 두둥실 올라가\n별처럼 반짝반짝 빛났어요.\n정말 꿈같은 밤이었죠.", "prompt": "Dozens of colorful kites with tiny lanterns rise into the starry night sky above the village, glittering like new stars. Villagers and Reengki the quokka (wearing his pink felt hat) watch from below with wonder-filled upturned faces. Breathtaking dreamy night sky, magical wide shot."}, {"text": "할아버지가 흐뭇하게 말했어요.\n“오늘 밤 가장 멀리 본 건 기루구나.”\n그리고 링키를 살짝 불렀답니다.", "prompt": "The elderly giraffe smiles proudly at the young giraffe silhouetted against the glowing tower, then gently beckons Reengki the quokka (wearing his pink felt hat) with a curl of his neck, a knowing twinkle in his eye. Quiet warm moment amid the fading festival, soft lantern light, medium shot."}]}, {"ep": 10, "title": "일곱 번째 구슬 O", "pages": [{"text": "다음 날 새벽, 링키와 기루는\n할아버지를 따라 등대 꼭대기에\n나란히 올라갔어요.", "prompt": "In the pale pre-dawn light, Reengki the quokka (wearing his pink felt hat), the young giraffe, and the elderly giraffe stand together in the lantern room at the top of the tower, looking out over the sleeping grass sea. Soft lavender-blue dawn palette, quiet expectant mood, wide shot."}, {"text": "지평선 너머로 동그란 해가\n두둥실 떠올랐어요.\n풀의 바다가 금빛으로 반짝였죠.", "prompt": "A perfectly round golden sun rises over the far horizon of the grass sea, turning the endless grass to shimmering gold. Reengki the quokka (wearing his pink felt hat) and the two giraffes watch from the tower balcony, faces glowing. Breathtaking sunrise panorama, warm radiant light, sweeping wide shot."}, {"text": "할아버지가 등불 밑에서\n작은 상자를 꺼냈어요.\n안에서 무언가 반짝! 빛났죠.", "prompt": "The elderly giraffe carefully lifts a small wooden box from a nook beneath the great lamp, opening the lid as a bright glow spills out onto his and the others' amazed faces. Reengki the quokka (wearing his pink felt hat) leans in with wide sparkling eyes. Mysterious warm glow, treasure-reveal close shot."}, {"text": "동그란 알파벳 구슬 O였어요!\n“등대가 오래오래 지켜 온\n우리 마을의 구슬이란다.”", "prompt": "Inside the small box rests a glowing round alphabet marble shaped like the letter O, shining like a tiny sun. The elderly giraffe holds it out gently while Reengki the quokka (wearing his pink felt hat) gazes at it in awe. Magical golden glow reflecting in everyone's eyes, close-up shot."}, {"text": "기루가 구슬을 링키에게 건넸어요.\n“네 덕분에 나도 훌쩍 자랐어.\n이제 이 구슬은 네 거야!”", "prompt": "The young giraffe lowers his neck to offer the glowing letter O marble to Reengki the quokka (wearing his pink felt hat), who receives it with both paws and shining grateful eyes. The sunrise glows behind them on the tower balcony. Heartfelt gift-giving moment, warm golden light, medium shot."}, {"text": "“O는 동그란 해, 동그란 지평선.\n멀리 보는 눈을 닮았지.\n멀리 본 사람만이 큰 길을 찾는단다.”", "prompt": "The elderly giraffe gestures with his nose from the glowing O marble in Reengki's paws toward the round rising sun and the curved horizon beyond, as if they are all the same circle (Reengki the quokka wears his pink felt hat). Poetic inspiring composition connecting marble, sun, and horizon, warm wide shot."}, {"text": "링키는 구슬을 가방에 쏙!\n일곱 개의 구슬이 부딪히며\n또로롱, 고운 소리를 냈어요.", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat) tucking the glowing O marble into his small backpack, where seven alphabet marbles now nestle together, chiming with soft sparkles. His face beams with proud joy. Warm morning light, satisfying collection moment."}, {"text": "떠나는 날, 마을 친구들이 모였어요.\n“Goodbye! 또 놀러 와!”\n도도와 레레는 눈물이 그렁그렁했죠.", "prompt": "The whole grassland village gathers at the village edge to see Reengki the quokka (wearing his pink felt hat) off, giraffes waving their long necks and the two meerkat siblings wiping teary eyes while waving tiny paws. Flags flutter overhead in morning light. Bittersweet farewell, warm wide shot."}, {"text": "기루는 링키를 목에 태우고\n풀의 바다 끝 언덕까지 데려다줬어요.\n“저기 북쪽 길이 보여. Look!”", "prompt": "The young giraffe carries Reengki the quokka (wearing his pink felt hat) on his neck through the tall grass to a hilltop, pointing his nose toward a path winding north where the sky looks pale and cool. From the high viewpoint the road ahead is clear. Adventurous farewell ride, bright morning, wide shot."}, {"text": "북쪽 끝에는 눈처럼 하얀\n곰 친구가 산다고 해요.\n하얀 마을엔 어떤 이야기가 기다릴까요?", "prompt": "Wide shot of Reengki the quokka (wearing his pink felt hat) walking alone up the northern path away from the grassland, waving back at the young giraffe on the hill behind him. Far ahead on the horizon, faint white snowy peaks glimmer under a cool pale sky. Hopeful journey-onward mood, soft morning light."}]}]}, "8": {"chapter": 8, "animal": "북극곰", "animal_en": "polar bear", "letter": "U", "village": "눈별 마을", "episodes": [{"ep": 1, "title": "하얀 마을의 첫 발자국", "pages": [{"text": "링키의 가방 속에서 구슬 일곱 개가\n반짝반짝 빛났어요.\n\"다음 마을은 북쪽 끝이래!\"", "prompt": "Wide shot of Reengki the quokka (wearing his pink felt hat) walking along a snowy path with a small backpack, peeking inside at seven glowing alphabet marbles. Soft morning light over rolling white hills, pine trees dusted with snow. His breath makes a tiny white puff in the cold air. Cheerful, adventurous mood."}, {"text": "눈이 소복소복 내렸어요.\n세상이 온통 하얗고 조용했죠.\n\"우와, 콧김이 하얘!\"", "prompt": "Medium shot of Reengki the quokka (wearing his pink felt hat) standing in gently falling snow, catching snowflakes on his paw with wide amazed eyes. Everything around him is soft white, with big fluffy snowflakes drifting down. His warm breath forms a little cloud. Quiet, magical winter atmosphere."}, {"text": "저 멀리 언덕 너머에\n노란 불빛이 반짝였어요.\n\"저기가 눈별 마을인가 봐!\"", "prompt": "Wide shot from behind Reengki the quokka (wearing his pink felt hat) looking across a snowy valley toward a tiny village of glowing igloo-like houses in the distance. Warm yellow window lights twinkle against the blue-white dusk snow. A small wooden signpost points toward the village. Hopeful, cozy mood."}, {"text": "그런데 미끄덩—!\n링키가 눈더미에 폭 빠졌어요.\n\"으앗! 누가 좀 도와줘요!\"", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat) stuck upside-down halfway in a deep fluffy snowdrift, little legs kicking in the air, hat still on. Snow sprays around him in a comic puff. His expression is surprised but not hurt. Playful, funny moment in soft daylight."}, {"text": "그때 커다란 하얀 손이\n쑥— 내려왔어요.\n링키를 번쩍 들어 올렸죠.", "prompt": "Medium shot of a huge gentle white polar bear paw lifting Reengki the quokka (wearing his pink felt hat) out of the snowdrift. The polar bear's big friendly face leans into frame, kind dark eyes and a soft smile. Snowflakes sparkle in the air between them. Warm, reassuring rescue moment."}, {"text": "\"난 우루야. 눈별 마을의 곰이지.\"\n\"난 링키! 만나서 반가워!\"\n\"Hello, Reengki!\"", "prompt": "Two-shot of Uru the big polar bear kneeling in the snow to greet tiny Reengki the quokka (wearing his pink felt hat), shaking his small paw with one giant paw. Both are smiling warmly, snow falling softly around them. The size difference is sweet and funny. Friendly first-meeting mood, soft afternoon light."}, {"text": "우루는 링키를 썰매에 태웠어요.\n\"꽉 잡아! 슝— 간다!\"\n바람이 시원하게 스쳤어요.", "prompt": "Dynamic wide shot of Uru the polar bear pulling a small wooden sled through the snow with Reengki the quokka (wearing his pink felt hat) riding on it, arms up in delight. Snow sprays from the sled runners, scarf and hat leaf fluttering in the wind. Rolling white hills blur past. Joyful, exciting motion."}, {"text": "마을에 도착했어요.\n둥근 얼음집마다 등불이 반짝.\n북극여우와 아기 물범이 마중 나왔죠.", "prompt": "Wide shot of a cozy arctic village of round ice houses with glowing lanterns hanging by each door. A small white arctic fox and a chubby baby seal wave happily as Uru the polar bear arrives pulling the sled with Reengki the quokka (wearing his pink felt hat). Warm lantern light against blue evening snow. Welcoming, festive mood."}, {"text": "북극여우가 말했죠. \"난 리라야!\"\n아기 물범이 말했죠. \"난 뽀뽀예요!\"\n몸이 사르르 녹았죠.", "prompt": "Cozy interior close-up of Reengki the quokka (wearing his pink felt hat) holding a steaming bowl of soup with both paws, sitting between Rira the arctic fox and Popo the baby seal, with Uru the polar bear serving from a big pot. Warm firelight fills the round ice house, steam curls up. Snug, family-dinner atmosphere."}, {"text": "그날 밤, 창밖 하늘 끝에\n초록빛이 스르르 흘렀어요.\n\"우루야, 저 빛은 뭐야…?\"", "prompt": "Night shot through a round ice-house window, Reengki the quokka (wearing his pink felt hat) pressing his paws to the glass, eyes wide with wonder. Outside, a faint ribbon of green aurora glows above snowy rooftops and stars. Uru the polar bear stands behind him smiling knowingly. Mysterious, dreamy night mood."}]}, {"ep": 2, "title": "오로라와 얼음 종", "pages": [{"text": "다음 날 아침, 우루가 링키에게\n마을을 구경시켜 주었어요.\n눈길이 뽀드득뽀드득 울렸죠.", "prompt": "Wide shot of Uru the polar bear walking through the snowy village with Reengki the quokka (wearing his pink felt hat) trotting beside him, leaving tiny and huge footprints side by side. Round ice houses, hanging lanterns, and snow-covered fences line the path. Bright morning sun makes the snow sparkle. Cheerful sightseeing mood."}, {"text": "리라가 하늘을 가리키며 말했어요.\n\"어젯밤 그 초록빛은 오로라야.\n하늘이 치는 빛의 커튼이지!\"", "prompt": "Medium shot of Rira the arctic fox pointing her paw at the pale morning sky while Reengki the quokka (wearing his pink felt hat) looks up with sparkling eyes. Behind them, a faint memory-like wisp of green light is suggested among soft clouds. Snowy village rooftops in the background. Curious, storytelling mood."}, {"text": "마을 뒤에는 별빛 언덕이 있고,\n꼭대기엔 얼음 종이 매달려 있대요.\n햇빛에 파랗게 반짝였어요.", "prompt": "Wide shot looking up a tall snowy hill behind the village, with a small wooden arch at the summit holding a beautiful bell carved from clear blue ice. The bell glints in the sunlight. Reengki the quokka (wearing his pink felt hat), Uru the polar bear, and Rira the arctic fox gaze up from below. Majestic, sparkling winter scene."}, {"text": "\"오로라가 가장 밝은 밤,\n종을 울리고 다 함께 노래해.\n그게 오로라 축제란다!\"", "prompt": "Imaginative scene of the village festival as Uru the polar bear describes it: villagers of arctic foxes and seals gathered on the hilltop under a brilliant green and purple aurora, the ice bell glowing. Slightly dreamy, storybook-vision framing with soft glowing edges. Wide shot, magical celebratory mood."}, {"text": "우루는 마을의 지킴이였어요.\n무거운 얼음도 번쩍, 눈길도 척척.\n\"우루는 정말 힘이 세구나!\"", "prompt": "Medium shot of Uru the polar bear proudly carrying a huge block of ice on one shoulder while clearing snow from a path with his other paw. Reengki the quokka (wearing his pink felt hat) watches with admiring wide eyes, little fists clenched in excitement. Village houses in the background. Strong, heroic but friendly mood."}, {"text": "링키의 가슴이 콩닥콩닥 뛰었어요.\n\"나도 축제에서 노래하고 싶어!\n오로라 아래에서 말이야!\"", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat) with both paws on his chest, eyes shining with a big dream, imagining himself singing. Above him a tiny thought-bubble-like glow of aurora colors. Snowy village softly blurred behind. Hopeful, heart-fluttering mood."}, {"text": "뽀뽀와 리라가 박수를 짝짝 쳤어요.\n\"같이 불러요! Let's sing!\"\n\"렛츠 씽! 같이 노래하자!\"", "prompt": "Cheerful two-shot of Popo the baby seal clapping his flippers and Reengki the quokka (wearing his pink felt hat) striking a happy singing pose with one paw raised. Rira the arctic fox laughs beside them. Sparkling snow and lantern posts around. Bright, musical, playful energy."}, {"text": "하지만 별빛 언덕은 미끄럽고\n바람이 쌩쌩 차가웠어요.\n링키는 몇 걸음 만에 주춤했죠.", "prompt": "Wide shot of Reengki the quokka (wearing his pink felt hat) attempting to walk up the icy hill path, arms wobbling for balance, scarf whipping in the cold wind. The hill looks tall and slippery, snow spraying sideways. Uru the polar bear watches from below with a gentle expression. Challenging but not scary mood."}, {"text": "우루가 다정하게 말했어요.\n\"추운 곳에서는 몸도 마음도\n조금씩 연습이 필요해.\"", "prompt": "Warm medium shot of Uru the polar bear crouching down to speak gently to Reengki the quokka (wearing his pink felt hat), one big paw softly on the little quokka's shoulder. Wind-blown snow settles around them, soft golden afternoon light. Kind, mentoring mood, close and tender framing."}, {"text": "링키는 주먹을 꼭 쥐었어요.\n\"좋아, 내일부터 연습이야!\"\n과연 잘할 수 있을까요?", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat) with a determined smile, both little fists clenched, cheeks rosy from the cold. Behind him the starlit hill and ice bell glimmer in the sunset. Determined, hopeful cliffhanger mood."}]}, {"ep": 3, "title": "미끄러운 얼음 연습", "pages": [{"text": "아침 일찍, 얼음 연못에서\n걷기 연습이 시작됐어요.\n\"얼음 위를 잘 걸어야 언덕도 오르지!\"", "prompt": "Wide shot of a frozen pond glittering like glass at the edge of the village. Uru the polar bear stands steadily on the ice while Reengki the quokka (wearing his pink felt hat) steps on nervously from the snowy bank. Morning light, long soft shadows on the ice. Fresh, first-lesson mood."}, {"text": "미끄덩— 꽈당!\n링키가 엉덩방아를 찧었어요.\n\"아야야… 얼음은 너무 미끄러워!\"", "prompt": "Comic medium shot of Reengki the quokka (wearing his pink felt hat) sliding with legs splayed and landing on his bottom on the ice, little stars and snow puffs around him. His hat tilts sideways but stays on. Popo the baby seal giggles kindly from the bank. Funny, light-hearted tumble."}, {"text": "일어나면 또 미끄덩, 또 꽈당.\n발바닥이 꽁꽁 시렸어요.\n콧김만 하얗게 포옥포옥.", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat) sitting on the ice rubbing his cold little feet, breath puffing in white clouds, ears drooping slightly. Small slide marks and paw prints cover the ice behind him showing many falls. Slightly tired but endearing mood, cool blue tones."}, {"text": "\"너무 추워… 나 그만할까 봐…\"\n링키의 어깨가 축 처졌어요.\n눈썹에 눈송이가 살짝 앉았죠.", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat) sitting sadly at the edge of the frozen pond, shoulders slumped, a tiny snowflake resting on his brow. His reflection shows faintly in the ice. Muted blue-grey light, gentle melancholy without being scary."}, {"text": "우루가 천천히 시범을 보였어요.\n\"무릎을 굽히고, 한 걸음씩.\n서두르지 않는 게 비결이야.\"", "prompt": "Medium shot of Uru the polar bear demonstrating a careful walk on the ice, knees bent, arms out for balance, moving slowly and steadily. Reengki the quokka (wearing his pink felt hat) watches closely, copying the pose from the side. Clear teaching moment, bright reflective ice surface."}, {"text": "\"넘어져도 괜찮아.\n다시 일어나면 되는 거야.\"\n우루의 목소리는 포근했어요.", "prompt": "Warm close-up of Uru the polar bear offering his big paw to help Reengki the quokka (wearing his pink felt hat) stand up on the ice, both smiling at each other. Soft sunlight breaks through clouds onto the pond. Encouraging, heartwarming mood, gentle golden light."}, {"text": "링키는 다시 일어섰어요.\n한 걸음, 두 걸음, 세 걸음!\n\"우와! 나 지금 걷고 있어!\"", "prompt": "Joyful medium shot of Reengki the quokka (wearing his pink felt hat) taking three careful steps across the ice with knees bent, face glowing with pride and surprise. Uru the polar bear cheers with raised paws in the background. Sparkles of ice dust in the air. Triumphant small-victory mood."}, {"text": "리라가 폭신한 목도리를\n링키의 목에 둘러 주었어요.\n\"연습엔 따뜻함도 필요하지!\"", "prompt": "Sweet close-up of Rira the arctic fox wrapping a fluffy knitted scarf around the neck of Reengki the quokka (wearing his pink felt hat), who giggles at the tickle. The scarf is warm-toned against the blue ice. Kind, caring gesture, soft cozy mood."}, {"text": "걷고 또 걸으니 신기하게도\n몸이 후끈후끈해졌어요.\n\"움직이니까 따뜻해지네!\"", "prompt": "Wide shot of Reengki the quokka (wearing his pink felt hat) happily marching in circles on the frozen pond with steady steps, cheeks rosy, scarf trailing. Little heart-shaped puffs of warm breath float up. Uru the polar bear and Rira the arctic fox watch proudly. Energetic, warm-in-the-cold mood."}, {"text": "저녁이 되자 다리는 뻐근했지만\n마음은 뿌듯하게 차올랐어요.\n내일은 드디어 언덕 오르기!", "prompt": "Sunset wide shot of Reengki the quokka (wearing his pink felt hat) walking home through the village with Uru the polar bear, both silhouetted against a pink and orange sky over the snow. The starlit hill looms gently in the distance with the ice bell glinting. Satisfied, hopeful end-of-day mood."}]}, {"ep": 4, "title": "하나, 둘, 호—", "pages": [{"text": "다음 날, 별빛 언덕 아래.\n링키는 고개를 쭉 들었어요.\n\"우와… 진짜 높다…\"", "prompt": "Low-angle wide shot from behind Reengki the quokka (wearing his pink felt hat) looking up at the tall snowy hill, the icy path winding to the summit where the ice bell hangs. Uru the polar bear stands beside him pointing the way. Morning light, vast white landscape, awe-inspiring but friendly scale."}, {"text": "바람이 쌩쌩 불어왔어요.\n링키는 한 걸음 만에 주춤.\n\"바람이 자꾸 밀어내!\"", "prompt": "Medium shot of Reengki the quokka (wearing his pink felt hat) leaning hard into a strong wind on the hill path, scarf and hat leaf streaming backward, one paw shielding his face. Loose snow streams sideways in soft lines. Uru the polar bear stands solid as a rock behind him. Windy, effortful but safe mood."}, {"text": "우루가 특별한 주문을 알려줬어요.\n\"하나, 둘, 호— 하나, 둘, 호—\n숨을 내쉬며 한 걸음씩!\"", "prompt": "Medium shot of Uru the polar bear marching up the slope in rhythm, exhaling a big visible white breath, with Reengki the quokka (wearing his pink felt hat) mimicking him right behind, tiny breath puff and all. Their footprints make a neat rhythmic line. Playful marching-lesson mood."}, {"text": "\"하나, 둘, 호—!\"\n링키의 콧김이 포옥포옥.\n걸음이 씩씩해졌어요.", "prompt": "Close-up side view of Reengki the quokka (wearing his pink felt hat) climbing with determined rhythm, cheeks puffed as he exhales a white breath cloud, little arms swinging. Snow crunches under his feet. Bright daylight, plucky and rhythmic energy."}, {"text": "그런데 언덕 중턱에서\n다리가 후들후들 떨렸어요.\n\"헉헉… 너무 힘들어…\"", "prompt": "Medium shot of Reengki the quokka (wearing his pink felt hat) paused halfway up the hill, hands on knees, legs wobbling, panting with big breath clouds. The summit still looks far above. Uru the polar bear waits a few steps ahead, looking back kindly. Honest tired moment, soft encouraging light."}, {"text": "우루가 웃으며 외쳤어요.\n\"이럴 때 하는 말이 있지.\nDon't give up! 포기하지 마!\"", "prompt": "Uplifting medium shot of Uru the polar bear turning back on the slope with a big warm grin, one paw raised high in an encouraging cheer toward Reengki the quokka (wearing his pink felt hat) below. Wind swirls sparkling snow around them. Motivating, coach-like mood."}, {"text": "\"돈, 기브, 업!\n포기하지 않아!\"\n링키가 씩씩하게 따라 외쳤어요.", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat) shouting joyfully with both fists raised, eyes squeezed with effort and a huge smile, breath puffing white. His whole body leans forward into the climb. Triumphant, spirited energy, crisp blue sky behind."}, {"text": "드디어 꼭대기!\n링키는 얼음 종을 살짝 만졌어요.\n댕— 맑은 소리가 울렸죠.", "prompt": "Magical medium shot at the hilltop: Reengki the quokka (wearing his pink felt hat) gently touching the beautiful clear-blue ice bell hanging from its wooden arch, a soft visible ring of sound rippling out as sparkles. Uru the polar bear watches with pride. Crisp air, glittering summit, wonder-filled mood."}, {"text": "내려다본 눈별 마을은\n장난감처럼 반짝반짝했어요.\n\"우리가 여기까지 올라왔어!\"", "prompt": "Sweeping wide shot from the hilltop showing the tiny village of round ice houses far below, lantern lights twinkling on white snow. Reengki the quokka (wearing his pink felt hat) and Uru the polar bear stand side by side at the edge, the quokka pointing excitedly. Vast, rewarding view, golden afternoon light."}, {"text": "그런데 하늘 저 끝에\n회색 구름이 스멀스멀…\n\"우루야, 저 구름은 뭐지?\"", "prompt": "Wide shot of the horizon where thick soft grey clouds slowly gather far beyond the snowy hills, while Reengki the quokka (wearing his pink felt hat) points at them curiously from the hilltop. Uru the polar bear narrows his eyes thoughtfully, sniffing the wind. Calm but intriguing cliffhanger, muted light on the horizon."}]}, {"ep": 5, "title": "구름이 몰려와요", "pages": [{"text": "다음 날 아침, 하늘이\n온통 뿌연 회색이 되었어요.\n바람도 붕— 낮게 울었죠.", "prompt": "Wide establishing shot of the village under a heavy soft grey sky, lanterns swaying gently in a low wind. Reengki the quokka (wearing his pink felt hat) steps out of an ice house and looks up at the clouds. Muted grey-blue palette, calm-before-snow atmosphere, not frightening."}, {"text": "리라가 코를 킁킁거렸어요.\n\"이 냄새… 눈 폭풍이 오고 있어.\n오늘 밤엔 눈이 아주 많이 올 거야.\"", "prompt": "Close-up of Rira the arctic fox lifting her nose to sniff the wind, ears alert, while Reengki the quokka (wearing his pink felt hat) watches her with round curious eyes. A few early snowflakes drift between them. Grey sky background, attentive and slightly serious but gentle mood."}, {"text": "마을은 바빠졌어요.\n창문을 닫고, 등불에 기름을 채우고,\n먹을 것을 차곡차곡 모았죠.", "prompt": "Busy wide shot of the village preparing: arctic foxes closing round shutters, seals rolling barrels, lanterns being filled and hung. Uru the polar bear carries a big basket of fish on his shoulder. Reengki the quokka (wearing his pink felt hat) runs along helping. Cooperative, bustling energy under a grey sky."}, {"text": "우루는 얼음집 지붕마다\n눈덩이를 꾹꾹 눌러 단단히 했어요.\n\"이러면 바람에도 끄떡없지!\"", "prompt": "Medium shot of Uru the polar bear standing tall to press and pat snow firmly onto the dome roof of an ice house with his huge paws, working with confident strength. Reengki the quokka (wearing his pink felt hat) hands him snow from below. Teamwork mood, soft grey daylight."}, {"text": "링키도 물고기 바구니를 날랐어요.\n\"낑낑… 무겁지만… 끝까지!\"\n\"하나, 둘, 호—!\"", "prompt": "Endearing medium shot of Reengki the quokka (wearing his pink felt hat) hauling a basket of fish almost as big as himself, leaning back with effort, tongue out in concentration, breath puffing. His little footprints wobble in the snow behind him. Determined, cute struggle, warm humorous tone."}, {"text": "무거워서 쩔쩔맸지만\n링키는 멈추지 않았어요.\n\"계속하면 힘이 나는걸!\"", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat) finally setting the heavy basket down by a doorway, wiping his brow with a proud grin, cheeks rosy. Popo the baby seal claps his flippers beside him. Small-triumph mood, cozy village doorway with a glowing lantern."}, {"text": "\"다 됐다!\" 모두 함께 웃었어요.\n뽀뽀가 조개 나팔을 뿌— 불었죠.\n준비 끝을 알리는 소리였어요.", "prompt": "Cheerful group wide shot in the village square: Uru the polar bear, Rira the arctic fox, Reengki the quokka (wearing his pink felt hat), and Popo the baby seal blowing a spiral seashell horn with a visible playful note. Villagers wave from doorways. Festive relief before the snow, lanterns glowing warmly."}, {"text": "저녁이 되자 눈송이가\n한 개, 두 개 내리기 시작했어요.\n곧 함박눈이 펑펑 쏟아졌죠.", "prompt": "Atmospheric medium shot of huge soft snowflakes beginning to fall over the village at dusk, quickly thickening into heavy gentle snowfall. Reengki the quokka (wearing his pink felt hat) watches from a warm doorway, lantern light glowing on the falling snow. Hushed, snow-globe-like beauty."}, {"text": "바람이 붕붕— 노래하고\n창밖은 온통 하얘졌어요.\n집 안은 난롯불로 포근포근.", "prompt": "Cozy interior shot inside Uru's round ice house: firelight flickering, Reengki the quokka (wearing his pink felt hat) wrapped in a blanket sipping cocoa while snow whirls white outside the small round window. Uru the polar bear adds wood to the fire. Safe, snug contrast between storm and hearth."}, {"text": "그때 리라가 문을 벌컥 열었어요.\n\"얘들아! 뽀뽀가 안 보여!\"\n링키의 심장이 철렁했어요.", "prompt": "Dramatic but gentle medium shot of Rira the arctic fox bursting through the doorway with snow swirling behind her, ears back, calling out worriedly. Reengki the quokka (wearing his pink felt hat) and Uru the polar bear turn from the fire in surprise. Urgent but warm-toned interior light, cliffhanger tension without fear."}]}, {"ep": 6, "title": "소복소복 눈폭풍", "pages": [{"text": "\"뽀뽀는 얼음 연못에 두고 온\n조개 나팔을 찾으러 갔나 봐!\"\n리라가 발을 동동 굴렀어요.", "prompt": "Interior medium shot of Rira the arctic fox explaining anxiously, gesturing toward the window, while a small empty cushion where Popo usually sits is visible with a tiny blanket. Reengki the quokka (wearing his pink felt hat) listens with worried round eyes. Warm firelight, concerned but composed mood."}, {"text": "우루가 벌떡 일어났어요.\n\"내가 갈게. 곰은 눈길에 강하니까.\"\n\"나도 갈래! 내 귀는 밝거든!\"", "prompt": "Medium shot of Uru the polar bear standing tall and resolute, pulling on a lantern strap, while Reengki the quokka (wearing his pink felt hat) hops up bravely beside him pointing to his own big round ears. Determined teamwork moment, firelight glinting on their faces."}, {"text": "둘은 등불을 들고 나섰어요.\n눈이 소복소복, 바람이 붕붕.\n하지만 우루는 크고 든든했죠.", "prompt": "Wide shot of Uru the polar bear striding into the gentle blizzard holding a glowing lantern, with Reengki the quokka (wearing his pink felt hat) walking close in his wind shadow. Thick soft snowflakes swirl in the lantern's golden halo. The storm looks fluffy and soft, not menacing. Brave, warm-lit adventure."}, {"text": "링키는 우루의 커다란\n발자국을 따라 걸었어요.\n폭, 폭, 폭— 딱 맞게 쏙쏙!", "prompt": "Charming close-up from behind of tiny Reengki the quokka (wearing his pink felt hat) hopping from one giant polar bear footprint to the next in the deep snow, like stepping stones. Uru the polar bear's large form leads ahead with the lantern glow. Sweet, clever detail shot, blue night tones with warm light."}, {"text": "\"뽀뽀야—! 어디 있니—!\"\n부르는 소리가 눈 속에 묻혔어요.\n둘은 포기하지 않고 또 불렀죠.", "prompt": "Medium shot of Uru the polar bear and Reengki the quokka (wearing his pink felt hat) cupping paws around their mouths calling out into the swirling snow near the frozen pond. Their breath clouds glow in the lantern light. Soft white-out background, persistent and hopeful mood."}, {"text": "그때 링키의 귀가 쫑긋!\n바람 사이로 뿌— 뿌—\n작은 나팔 소리가 들렸어요.", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat) with ears perked high, one paw raised for quiet, eyes wide with focus. Faint musical note symbols drift through the falling snow from off-frame. Uru the polar bear leans in listening too. Hopeful discovery moment, hushed snowy night."}, {"text": "눈 쌓인 낡은 나무배 아래,\n뽀뽀가 꼭 웅크리고 있었어요!\n\"뽀뽀야! 찾았다!\"", "prompt": "Relieving medium shot of Popo the baby seal huddled snugly under an old overturned wooden boat dusted with thick snow, hugging his seashell horn, looking up with teary happy eyes as lantern light falls on him. Reengki the quokka (wearing his pink felt hat) reaches out with open arms. Rescue-joy mood, warm light in blue night."}, {"text": "\"무서웠어요… 하지만 나팔을 불며\n기다렸어요!\" \"잘했어, 뽀뽀!\"\n셋은 꼬옥 안았어요. \"Warm hug!\"", "prompt": "Heartwarming close-up group hug: Uru the polar bear wrapping his huge arms around both Popo the baby seal and Reengki the quokka (wearing his pink felt hat), snowflakes settling on their fur. Everyone's eyes are closed with relieved smiles. Lantern glowing beside them in the snow. Tender, warm emotional peak."}, {"text": "그런데 돌아가는 길이\n눈 더미에 폭 막혀 버렸어요.\n\"이런, 길이 사라졌네.\"", "prompt": "Wide shot of the trio facing a tall soft wall of drifted snow blocking the path home, snow still falling steadily. Uru the polar bear scratches his head calmly while Reengki the quokka (wearing his pink felt hat) holds Popo the baby seal's flipper. Problem moment kept gentle and calm, lantern light on the drift."}, {"text": "우루가 씩 웃으며 말했어요.\n\"걱정 마. 곰들에게는\n특별한 방법이 있단다.\"", "prompt": "Close-up of Uru the polar bear giving a confident wink and warm grin, one paw raised reassuringly, snowflakes on his snout. Reengki the quokka (wearing his pink felt hat) and Popo the baby seal look up at him with trusting, curious faces. Cozy cliffhanger mood, golden lantern glow against blue snow."}]}, {"ep": 7, "title": "눈 동굴의 따뜻한 밤", "pages": [{"text": "우루는 커다란 앞발로\n눈을 슥슥 파기 시작했어요.\n금세 아늑한 눈 동굴이 생겼죠!", "prompt": "Medium shot of Uru the polar bear digging powerfully into a big snowdrift with his front paws, snow flying in soft arcs, a cozy cave opening taking shape. Reengki the quokka (wearing his pink felt hat) and Popo the baby seal watch amazed, holding the lantern. Industrious, clever survival moment, warm light."}, {"text": "셋은 동굴 안에 옹기종기 모였어요.\n등불 하나가 동그란 벽을\n노랗게 물들였죠.", "prompt": "Intimate interior shot inside the snug snow cave: Uru the polar bear, Reengki the quokka (wearing his pink felt hat), and Popo the baby seal sitting close together around a single lantern, its golden light glowing on the smooth curved snow walls. Outside the entrance, snow falls softly. Safe den-like coziness."}, {"text": "링키가 덜덜 떨자\n우루가 폭 안아 주었어요.\n곰의 털은 폭신한 난로 같았죠.", "prompt": "Tender close-up of Reengki the quokka (wearing his pink felt hat) nestled into Uru the polar bear's thick warm fur, the bear's big arm curled around him like a blanket, Popo the baby seal tucked in on the other side. Shivers turning into a content smile. Ultimate warmth-and-safety image, soft lantern glow."}, {"text": "우루가 낮은 목소리로 말했어요.\n\"북극곰은 추울수록\n서로 꼭 붙어서 견딘단다.\"", "prompt": "Storytelling medium shot of Uru the polar bear speaking gently, eyes soft in the lantern light, while Reengki the quokka (wearing his pink felt hat) and Popo the baby seal listen from within his embrace. A dreamy faint image of polar bears huddling in a snowfield glows on the cave wall like a shadow story. Wise, calm mood."}, {"text": "\"춥고 힘들어도 포기하지 않아.\n계속하면 따뜻해지거든.\"\n링키는 그 말을 가슴에 새겼어요.", "prompt": "Emotional close-up of Reengki the quokka (wearing his pink felt hat) looking up at Uru the polar bear with shining moved eyes, one small paw pressed to his own chest. The lantern light wraps them in gold. Quiet, meaningful heart-to-heart moment, the emotional core of the story."}, {"text": "링키가 조용히 노래를 불렀어요.\n뽀뽀는 나팔로 뿌— 반주했죠.\n동굴 안이 음악으로 몽글몽글.", "prompt": "Cozy medium shot of Reengki the quokka (wearing his pink felt hat) singing softly with eyes closed and paws clasped, Popo the baby seal puffing gentle notes on his seashell horn, Uru the polar bear swaying and humming. Soft musical sparkles float in the lantern light of the snow cave. Lullaby warmth."}, {"text": "바람 소리도 어느새\n자장가처럼 들렸어요.\n후우— 후우— 쉬이—", "prompt": "Dreamy wide shot of the snow cave from outside at night: a small warm golden glow from the entrance in a vast calm blue snowscape, snow falling slower now, wind lines drawn soft like a lullaby. Peaceful, hushed nighttime atmosphere, tiny warm light in gentle wilderness."}, {"text": "뽀뽀가 새근새근 잠들고\n링키의 눈도 스르르 감겼어요.\n우루의 품은 참 따뜻했죠.", "prompt": "Sleepy close-up of Popo the baby seal and Reengki the quokka (wearing his pink felt hat) fast asleep against Uru the polar bear's chest fur, the bear smiling down at them with half-closed eyes, lantern dimmed low. Breathing puffs tiny and calm. Deep peaceful sleep, maximum coziness."}, {"text": "아침이 되자 사방이 조용했어요.\n눈이 그친 거예요!\n동굴 밖 세상이 반짝반짝 눈부셨죠.", "prompt": "Bright wide shot of the trio emerging from the snow cave into dazzling morning sunshine, the storm over, fresh snow sparkling like diamonds across the landscape. Reengki the quokka (wearing his pink felt hat) shields his eyes and beams. Crisp clean air feeling, triumphant fresh morning."}, {"text": "그런데 별빛 언덕 쪽을 보니\n언덕길이 몽땅 사라졌어요!\n\"오늘 밤이 축제인데… 어떡하지?\"", "prompt": "Wide shot from the village edge looking toward the starlit hill: the winding path is completely buried under deep smooth snowdrifts, and the ice bell at the top wears a thick cap of snow. Reengki the quokka (wearing his pink felt hat), Uru the polar bear, and Popo the baby seal stare with worried faces. Bright morning light, cliffhanger concern."}]}, {"ep": 8, "title": "사라진 언덕길", "pages": [{"text": "마을로 돌아오자 친구들이\n와아— 달려와 반겨 주었어요.\n\"뽀뽀야! 무사해서 다행이야!\"", "prompt": "Joyful wide shot of villagers—arctic foxes and seals—rushing to welcome back Uru the polar bear, Reengki the quokka (wearing his pink felt hat), and Popo the baby seal at the village entrance. Rira the arctic fox hugs Popo tightly. Fresh snow everywhere, bright relieved reunion energy."}, {"text": "하지만 곧 모두 시무룩해졌어요.\n언덕길이 눈에 파묻히고\n얼음 종도 눈 모자를 썼거든요.", "prompt": "Wide shot of the village crowd gazing up at the buried hill path, shoulders drooping, ears down. In the distance the ice bell is capped with a comically thick dome of snow. Reengki the quokka (wearing his pink felt hat) stands among them looking thoughtful. Muted disappointed mood under a clear sky."}, {"text": "\"오늘 밤이 일 년 중\n오로라가 가장 밝은 밤인데…\"\n리라의 꼬리가 축 처졌어요.", "prompt": "Close-up of Rira the arctic fox with drooping tail and sad eyes explaining to the group, one paw gesturing at the sky. Behind her, villagers murmur with worried faces. Reengki the quokka (wearing his pink felt hat) listens intently, paw on chin. Gentle sorrow, soft daylight."}, {"text": "\"축제는 틀렸어…\"\n\"눈이 너무 많이 쌓였는걸…\"\n한숨 소리가 여기저기서 폭폭.", "prompt": "Medium shot of discouraged villagers sitting on snow-covered benches and crates, sighing with little white breath puffs, festival lanterns lying unhung in a basket. The mood is deflated but softly drawn. Reengki the quokka (wearing his pink felt hat) watches them, a spark of resolve growing in his eyes."}, {"text": "그때 링키가 앞으로 나섰어요.\n\"포기하지 마요!\n조금씩, 다 같이 파면 돼요!\"", "prompt": "Inspiring medium shot of Reengki the quokka (wearing his pink felt hat) standing on a snow-covered crate, fists on hips, calling out bravely to the crowd of villagers. His scarf flutters, morning light haloing him. The villagers look up in surprise. Rallying, hopeful turning-point energy."}, {"text": "\"춥고 힘들어도 포기하지 않아요.\n계속하면 따뜻해져요!\n우루가 알려준 말이에요!\"", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat) with a heartfelt expression, one paw on his chest and the other pointing toward Uru the polar bear, who looks touched and proud. Villagers' faces begin to brighten around them. Emotional, message-carrying moment, warm sunlight."}, {"text": "우루가 씩 웃으며 나섰어요.\n첫 눈 더미를 어깨로 쿠웅—\n밀어내기 시작했죠.", "prompt": "Powerful medium shot of Uru the polar bear pressing his broad shoulder into a big snowdrift at the base of the hill path, snow crumbling and sliding aside, muscles set with a smiling grunt. Reengki the quokka (wearing his pink felt hat) digs beside him with a small wooden shovel. Determined teamwork begins, dynamic action."}, {"text": "리라도, 뽀뽀도, 마을 친구들도\n하나둘 모여들었어요.\n\"We can do it! 우린 할 수 있어!\"", "prompt": "Energetic wide shot of the whole village joining in along the buried path: arctic foxes shoveling, seals rolling snow away, Popo the baby seal pushing a snowball, all in a lively line up the hill. Reengki the quokka (wearing his pink felt hat) cheers with a raised paw. Uplifting all-together spirit, bright midday snow."}, {"text": "조금씩, 조금씩\n하얀 길이 다시 드러났어요.\n하지만 해가 뉘엿뉘엿 기울었죠.", "prompt": "Wide shot showing the hill path half-cleared, a neat brown-and-white trail emerging through the drifts, villagers still working in a line. The sun sinks low, painting the snow orange and pink. Long shadows stretch. Progress mixed with time pressure, warm sunset tones."}, {"text": "오로라가 뜨기 전에\n꼭대기까지 갈 수 있을까요?\n모두의 손이 더 빨라졌어요.", "prompt": "Tension-with-hope medium shot of villagers digging faster in the dusky light, breath clouds everywhere, the ice bell still snow-capped at the summit above. Reengki the quokka (wearing his pink felt hat) glances at the darkening sky where the first faint stars appear. Race-against-time cliffhanger, purple twilight."}]}, {"ep": 9, "title": "별빛 언덕의 종소리", "pages": [{"text": "\"하나, 둘, 호—! 하나, 둘, 호—!\"\n모두 우루의 주문에 맞춰\n척척 눈을 밀었어요.", "prompt": "Rhythmic wide shot of the villagers working in unison up the twilight hill, pushing snow in time together, breath puffs rising in a synchronized row. Uru the polar bear leads the chant at the front. Reengki the quokka (wearing his pink felt hat) keeps the beat clapping. United, musical labor, deep blue dusk with lantern light."}, {"text": "링키는 즉석에서 노래를 지었어요.\n\"춥고 힘들어도 포기 안 해요~♪\n계속하면 따뜻해져요~♪\"", "prompt": "Joyful medium shot of Reengki the quokka (wearing his pink felt hat) singing atop a cleared snow mound like a little conductor, arms swinging, musical sparkles floating from him. Villagers below shovel in rhythm with smiling faces. Lanterns glow along the cleared path. Musical, heartwarming momentum."}, {"text": "지친 친구가 보이면\n서로 꼬옥 안아 주었어요.\n\"Warm hug! 따뜻한 포옹!\"", "prompt": "Sweet medium shot of a tired little arctic fox being hugged warmly by Popo the baby seal, while Reengki the quokka (wearing his pink felt hat) hugs another villager nearby—a chain of warm hugs along the snowy path. Breath clouds mingle, everyone smiling again. Tender, community warmth in the twilight."}, {"text": "마지막 커다란 눈더미 앞!\n우루가 어깨를 낮추고—\n쿠웅—! 힘껏 밀었어요.", "prompt": "Dramatic action shot of Uru the polar bear charging shoulder-first into the last giant snowdrift near the summit, snow bursting outward in a spectacular soft explosion of white powder. Villagers cheer behind him. Reengki the quokka (wearing his pink felt hat) pumps his fists. Climactic strength moment, dusk sky deepening."}, {"text": "\"뚫렸다—!\"\n길이 활짝 열렸어요.\n모두 와아— 환호성을 질렀죠.", "prompt": "Celebratory wide shot of the fully cleared path opening to the summit, villagers throwing paws and flippers in the air, snow dust settling like glitter. Uru the polar bear stands proudly in the gap, panting happily. Reengki the quokka (wearing his pink felt hat) leaps for joy. Victory energy, first stars overhead."}, {"text": "링키와 우루는 함께\n얼음 종의 줄을 당겼어요.\n댕— 댕— 맑은 소리가 퍼졌죠.", "prompt": "Iconic medium shot at the summit: Reengki the quokka (wearing his pink felt hat) and Uru the polar bear pulling the bell rope together, the clear blue ice bell swinging and ringing, visible sound ripples sparkling across the night sky. Villagers gather around holding lanterns. Reverent, magical peak moment."}, {"text": "그 순간, 하늘이 촤르르—\n초록빛, 보랏빛 커튼이\n온 하늘에 펼쳐졌어요!", "prompt": "Breathtaking wide shot of a magnificent aurora unfurling across the entire night sky—flowing curtains of green, teal, and purple light above the snowy hilltop. Below, the small silhouettes of Reengki the quokka (wearing his pink felt hat), Uru the polar bear, and the villagers gaze up in awe. Grand, luminous, unforgettable."}, {"text": "오로라 축제가 시작됐어요!\n모두 노래하고 춤을 췄죠.\n링키의 꿈같은 무대였어요.", "prompt": "Festive wide shot of the hilltop celebration under the blazing aurora: villagers dancing in a circle, lanterns glowing, Reengki the quokka (wearing his pink felt hat) singing joyfully at the center with arms spread wide. The ice bell glimmers with aurora colors. Pure celebration, dream-come-true energy."}, {"text": "링키와 우루는 듀엣을 불렀어요.\n뽀뽀의 나팔이 뿌— 반주하고\n리라의 꼬리가 지휘봉처럼 살랑.", "prompt": "Charming medium shot of Reengki the quokka (wearing his pink felt hat) and Uru the polar bear singing a duet side by side under the aurora, the bear's deep voice and the quokka's bright one shown as intertwining sparkle trails. Popo the baby seal plays his seashell horn and Rira the arctic fox waves her tail like a conductor. Musical, joyful harmony."}, {"text": "오로라 아래 눈별 마을이\n온통 반짝반짝 빛났어요.\n링키 인생 최고의 밤이었죠.", "prompt": "Sweeping final wide shot of the whole village and hilltop glowing beneath the vast aurora, lantern lights mirroring the sky, tiny figures still dancing on the summit. Reengki the quokka (wearing his pink felt hat) stands with Uru the polar bear, silhouetted against the green-purple light. Epic, serene, wonder-filled night."}]}, {"ep": 10, "title": "구슬 U와 새로운 바람", "pages": [{"text": "다음 날 아침, 눈밭이\n햇살에 은가루처럼 반짝였어요.\n링키는 떠날 짐을 쌌죠.", "prompt": "Gentle morning wide shot of the village sparkling under clear sunshine, fresh snow like silver dust. Reengki the quokka (wearing his pink felt hat) packs his small backpack outside Uru's ice house, folding his borrowed scarf carefully. Calm, bittersweet morning-after mood."}, {"text": "우루가 링키의 손을 잡고\n별빛 언덕으로 올라갔어요.\n둘의 발자국이 나란히 남았죠.", "prompt": "Warm wide shot of Uru the polar bear and Reengki the quokka (wearing his pink felt hat) walking hand in paw up the cleared hill path, one set of giant footprints and one set of tiny footprints side by side in the snow. Soft golden morning light, quiet companionship."}, {"text": "꼭대기에서 우루가\n얼음빛으로 반짝이는\n구슬 하나를 꺼냈어요.", "prompt": "Close-up of Uru the polar bear's huge open paw holding a beautiful glowing marble the color of clear blue ice, with the letter shape shimmering inside it. Reengki the quokka (wearing his pink felt hat) gasps softly, eyes reflecting the glow. The ice bell and morning sky behind. Sacred gift moment."}, {"text": "\"이건 구슬 U야.\n우루의 U, 그리고 'You'—\n바로 너라는 뜻이란다.\"", "prompt": "Tender medium shot of Uru the polar bear gently placing the glowing U marble into the small paws of Reengki the quokka (wearing his pink felt hat), speaking with a warm smile. Soft light wraps them both at the hilltop. Meaningful, quiet gift-giving scene, emotional warmth."}, {"text": "\"너는 춥고 힘들어도\n포기하지 않았어.\n그게 진짜 강인함이야.\"", "prompt": "Emotional close-up of Uru the polar bear resting his big paw softly on the head of Reengki the quokka (wearing his pink felt hat), the little quokka's eyes glistening with happy tears as he clutches the marble to his chest. Morning sun halos them. Proud mentor and friend moment."}, {"text": "가방 속 구슬이 여덟 개!\n짤랑짤랑, 반짝반짝.\n링키의 가슴이 벅차올랐어요.", "prompt": "Bright close-up of the open backpack showing eight glowing alphabet marbles nestled together, each shimmering a different soft color, the new ice-blue U marble brightest. Reengki the quokka (wearing his pink felt hat) beams down at them. Sparkling treasure shot, joyful accomplishment."}, {"text": "마을 입구에서 모두 모였어요.\n뽀뽀는 눈물이 그렁그렁.\n\"Thank you!\" \"See you, 링키!\"", "prompt": "Farewell wide shot at the village entrance: villagers gathered to wave, Popo the baby seal teary-eyed hugging Reengki the quokka (wearing his pink felt hat), Rira the arctic fox wrapping the fluffy scarf around him one more time as a keepsake. Lanterns and snow sparkle. Bittersweet, loving send-off."}, {"text": "리라가 방향을 알려 주었어요
