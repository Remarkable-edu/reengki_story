.\n\"다음은 바람이 사는 높은 절벽,\n독수리 마을이야!\"", "prompt": "Medium shot of Rira the arctic fox pointing toward distant high cliffs on the horizon where tiny birds soar in the bright sky, while Reengki the quokka (wearing his pink felt hat) shades his eyes and gazes that way with excitement. Wind lifts a little snow. New-horizon anticipation, crisp clear day."}, {"text": "우루가 썰매로 마을 끝까지\n슝— 태워다 주었어요.\n\"고마워, 우루! 잊지 않을게!\"", "prompt": "Dynamic wide shot of Uru the polar bear pulling the sled one last time with Reengki the quokka (wearing his pink felt hat) aboard, snow spraying, both laughing as they speed toward the village edge. The scarf streams in the wind. Joyful farewell ride, sun glittering on the snow."}, {"text": "링키는 손을 흔들고 또 흔들었어요.\n\"계속하면 따뜻해져요!\"\n독수리 마을은 어떤 곳일까요?", "prompt": "Final wide shot of Reengki the quokka (wearing his pink felt hat) walking away along the snowy road toward distant cliffs, turning back to wave at Uru the polar bear and the villagers, who wave from the village entrance. Eight marbles glow faintly from his backpack. Warm sunlight ahead, hopeful onward-journey ending."}]}]}, "9": {"chapter": 9, "animal": "독수리", "animal_en": "eagle", "letter": "R", "village": "바람바위 마을", "episodes": [{"ep": 1, "title": "바람바위 마을에 도착했어요", "pages": [{"text": "링키의 주머니에서 구슬 여덟 개가 짤랑짤랑.\n북극곰 마을을 떠나 남쪽으로, 남쪽으로.\n저 멀리 뾰족한 바위산이 보였어요.", "prompt": "Wide shot of Reengki the quokka (wearing his pink felt hat) walking along a winding mountain trail with a small pouch of glowing marbles at his side. In the far distance rises a dramatic rocky mountain with sharp cliffs. Morning light, clear blue sky, hopeful adventurous mood."}, {"text": "산길은 가파르고 꼬불꼬불했어요.\n\"영차, 영차!\" 링키는 씩씩하게 올랐죠.\n바람이 모자 잎사귀를 간질였어요.", "prompt": "Medium shot of Reengki the quokka (wearing his pink felt hat) climbing a steep zigzag rocky path, cheeks puffed with effort but smiling. The leaf on his hat flutters in the mountain wind. Rugged boulders and tufts of grass line the trail, bright midday light."}, {"text": "절벽 꼭대기에 아기자기한 마을이!\n바위틈마다 둥지 모양 집들이 포옥.\n여기가 바로 바람바위 마을이에요.", "prompt": "Wide establishing shot of a charming village built on top of towering cliffs, with cozy nest-shaped houses tucked into rock crevices. Reengki the quokka (wearing his pink felt hat) stands at the village entrance gazing up in wonder. Fluffy clouds drift below the cliff edge, warm sunlight, storybook atmosphere."}, {"text": "하늘에는 독수리들이 슝— 슝—.\n날개를 활짝 펴고 미끄러지듯 날았죠.\n\"우와, 멋지다!\" 링키의 눈이 반짝반짝.", "prompt": "Low-angle shot looking up from behind Reengki the quokka (wearing his pink felt hat) as several eagles soar gracefully across the sky above the cliff village, wings spread wide. Reengki's eyes sparkle with admiration. Vast blue sky with streaks of white clouds, sense of freedom and height."}, {"text": "그때 그림자 하나가 휙 지나갔어요.\n어린 독수리가 링키 앞에 사뿐 내려앉았죠.\n\"처음 보는 친구네? 난 아로야!\"", "prompt": "Medium shot of a young eagle with brown feathers landing lightly on a flat rock right in front of Reengki the quokka (wearing his pink felt hat), who looks pleasantly surprised. Small dust and feathers swirl from the landing. Sunny cliff-top plaza in the background, friendly first-meeting mood."}, {"text": "\"난 링키! 쿼카야. 만나서 반가워!\"\n아로의 갈색 깃털이 바람에 살랑살랑.\n금빛 눈동자가 햇살처럼 빛났어요.", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat) and the young eagle facing each other with warm smiles, meeting for the first time. The eagle's brown feathers ripple in the breeze and his golden eyes catch the sunlight. Soft warm lighting, gentle friendly atmosphere."}, {"text": "아로는 마을을 구경시켜 주었어요.\n바위 미끄럼틀, 구름 전망대, 바람 우물!\n링키는 폴짝폴짝 신이 났죠.", "prompt": "Wide shot of the young eagle guiding Reengki the quokka (wearing his pink felt hat) through the cliff village, passing a smooth rock slide, a lookout platform above the clouds, and a round stone well. Reengki hops excitedly along the path. Cheerful daylight, lively village details."}, {"text": "\"우리 마을은 하늘과 제일 가까워.\"\n아로가 자랑스럽게 말했어요.\n\"그래서 모두 나는 걸 좋아해!\"", "prompt": "Medium shot of the young eagle standing proudly at the cliff edge with one wing gesturing toward the open sky, while Reengki the quokka (wearing his pink felt hat) looks out beside him. A sea of clouds spreads below the cliff. Golden afternoon light, proud and airy mood."}, {"text": "광장에는 알록달록 깃발이 펄럭펄럭.\n\"곧 활공 축제가 열리거든!\"\n아로의 날개가 들썩들썩 신났어요.", "prompt": "Wide shot of the village plaza decorated with colorful triangular flags fluttering between rock pillars. The young eagle flaps his wings excitedly while explaining to Reengki the quokka (wearing his pink felt hat). Villager eagles carry garlands in the background, festive bright atmosphere."}, {"text": "\"활공 축제가 뭐야?\" 링키가 물었어요.\n아로가 씨익 웃으며 하늘을 가리켰죠.\n내일, 놀라운 이야기가 시작될 거예요!", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat) tilting his head curiously while the young eagle grins and points one wing toward the wide evening sky. Sunset colors of orange and pink wash over the cliff village. Warm anticipatory mood, storybook ending-page feel."}]}, {"ep": 2, "title": "활공 축제와 구름 할아버지", "pages": [{"text": "아침 해가 바위산을 주황빛으로 물들였어요.\n\"링키, 광장으로 와!\" 아로가 불렀죠.\n마을이 온통 북적북적했어요.", "prompt": "Wide morning shot of the rocky mountain village glowing orange in sunrise light. The young eagle calls from above while Reengki the quokka (wearing his pink felt hat) hurries toward the bustling plaza filled with eagles. Fresh energetic morning atmosphere."}, {"text": "가장 높은 바위 위에 하얀 깃털 독수리.\n마을에서 제일 지혜로운 구름 할아버지예요.\n\"어서 오렴, 꼬마 손님.\"", "prompt": "Low-angle shot of an old white-feathered eagle elder perched with dignity on the tallest rock in the plaza, looking down kindly. Reengki the quokka (wearing his pink felt hat) and the young eagle look up at him from below. Soft sunbeams behind the elder, wise and gentle mood."}, {"text": "\"활공 축제는 우리 마을의 큰 잔치란다.\n바람을 타고 누가 멋지게 나는지 겨루지.\"\n링키의 가슴이 콩닥콩닥 뛰었어요.", "prompt": "Medium shot of the old white-feathered eagle elder spreading one wing toward the sky as he explains, with flags and cliff peaks in the background. Reengki the quokka (wearing his pink felt hat) listens with wide sparkling eyes and paws clasped in excitement. Bright festive daylight."}, {"text": "\"목표를 정하고, 눈을 떼지 않는 것.\n그게 하늘을 나는 비결이란다.\"\n할아버지의 목소리는 바람처럼 깊었죠.", "prompt": "Close-up of the old white-feathered eagle elder's calm wise face, one wingtip pointing to a distant sunlit peak on the horizon. Reengki the quokka (wearing his pink felt hat) follows his gaze intently. Deep blue sky, serene and inspiring mood."}, {"text": "독수리들이 하늘에서 연습을 시작했어요.\n빙글 돌고, 쭉 미끄러지고, 높이 솟고!\n링키는 목을 쭉 빼고 구경했어요.", "prompt": "Wide dynamic shot of many eagles practicing in the sky above the cliffs, some spinning, some gliding in long lines, some soaring upward. Reengki the quokka (wearing his pink felt hat) watches from the plaza with his neck stretched up. Clear blue sky, energetic motion-filled scene."}, {"text": "\"나도 날아 보고 싶다…\" 링키가 중얼중얼.\n\"쿼카는 날개가 없는데?\" 아로가 갸웃.\n\"그래도 방법이 있을 거야!\"", "prompt": "Medium shot of Reengki the quokka (wearing his pink felt hat) gazing dreamily at the flying eagles, one paw on his chest, while the young eagle beside him tilts his head in puzzlement. Determined little smile forming on Reengki's face. Warm daylight, hopeful mood."}, {"text": "구름 할아버지가 빙그레 웃었어요.\n\"꼬마야, 축제에 나가 보련?\n날개가 없어도 바람은 친구가 된단다.\"", "prompt": "Medium shot of the old white-feathered eagle elder smiling warmly down at Reengki the quokka (wearing his pink felt hat), one wing gently touching the quokka's shoulder. Soft golden light wraps the scene, flags fluttering behind. Encouraging grandfatherly mood."}, {"text": "아로가 링키에게 인사말을 가르쳐 줬어요.\n\"하늘에선 이렇게 외쳐. Fly high!\"\n\"플라이 하이! 높이 날아라!\"", "prompt": "Close-up of the young eagle leaning toward Reengki the quokka (wearing his pink felt hat) as if teaching him a cheer, both with open cheerful expressions. Reengki raises one paw high in imitation. Sunny plaza background with fluttering flags, playful teaching moment."}, {"text": "\"Fly high!\" 링키가 크게 외쳤어요.\n독수리들이 하늘에서 화답했죠.\n\"Fly high—!\" 메아리가 울렸어요.", "prompt": "Wide shot of Reengki the quokka (wearing his pink felt hat) standing on a boulder shouting joyfully toward the sky with both paws raised, while eagles circling above call back in response. Echo lines of wind swirl across the valley. Exhilarating bright atmosphere."}, {"text": "링키는 주먹을 불끈 쥐었어요.\n\"좋아, 내 목표는 활공 축제 완주!\"\n그런데 날개 없이 어떻게 날까요?", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat) clenching his little fists with a fiercely determined sparkle in his eyes, cliff peaks and blue sky behind him. A tiny question-mark-like swirl of wind curls beside his head. Bright determined mood with a hint of playful suspense."}]}, {"ep": 3, "title": "잎사귀 글라이더", "pages": [{"text": "링키는 바위산을 뒤지며 궁리했어요.\n\"가볍고, 넓고, 튼튼한 게 필요해!\"\n그때 쿵쿵 발소리가 들렸죠.", "prompt": "Medium shot of Reengki the quokka (wearing his pink felt hat) searching among rocks and shrubs on the mountainside, one paw on his chin in deep thought. Small pebbles bounce nearby hinting at approaching footsteps. Sunny rocky slope, curious inventive mood."}, {"text": "바위를 폴짝 뛰어온 건 산양 토프!\n\"내가 이 산의 풀은 다 알지, 음메!\"\n토프가 수염을 씰룩이며 말했어요.", "prompt": "Medium shot of a sturdy mountain goat with curved horns and a wispy beard leaping down onto a boulder in front of Reengki the quokka (wearing his pink felt hat). The goat wears a proud friendly grin, beard twitching. Rocky mountain terrain, humorous lively introduction scene."}, {"text": "토프는 링키를 골짜기로 데려갔어요.\n커다란 부채잎 풀이 무성했죠.\n\"이 잎은 바람을 잘 받는단다!\"", "prompt": "Wide shot of the mountain goat leading Reengki the quokka (wearing his pink felt hat) into a sheltered green valley filled with giant fan-shaped leaves swaying in the breeze. Reengki touches one huge leaf in amazement. Lush green tones against grey rock, discovery mood."}, {"text": "링키와 토프는 잎을 차곡차곡 엮었어요.\n덩굴로 묶고, 나뭇가지로 뼈대를 만들고.\n짜잔! 잎사귀 글라이더 완성!", "prompt": "Medium shot of Reengki the quokka (wearing his pink felt hat) and the mountain goat working together, weaving giant leaves onto a frame of branches tied with vines. The finished leaf glider stands proudly between them like a big green kite. Crafting tools of twigs scattered around, cheerful workshop feel."}, {"text": "\"첫 번째 시험 비행, 출발!\"\n링키가 낮은 언덕에서 폴짝 뛰었어요.\n푸드득… 툭! 데굴데굴 굴렀죠.", "prompt": "Wide action shot of Reengki the quokka (wearing his pink felt hat) leaping off a low grassy hill holding the leaf glider, which flutters awkwardly as he tumbles head over heels onto soft grass. The mountain goat watches wide-eyed. Comic gentle tumble, no danger, bright day."}, {"text": "\"아이코!\" 두 번째는 빙글 돌다가 풀썩.\n세 번째는 나무에 대롱대롱 걸렸어요.\n토프가 뿔로 살살 내려 주었죠.", "prompt": "Medium shot of Reengki the quokka (wearing his pink felt hat) dangling upside down from a small tree branch, the leaf glider caught above him, while the mountain goat gently lifts him down with his horns. Both look amused rather than hurt. Soft afternoon light, funny warm moment."}, {"text": "아로가 하늘에서 내려와 살펴봤어요.\n\"링키, 넌 자꾸 아래를 보고 있어.\n나는 새는 멀리, 앞을 본단다!\"", "prompt": "Medium shot of the young eagle landing beside Reengki the quokka (wearing his pink felt hat), pointing one wing toward the far horizon while Reengki holds his slightly rumpled leaf glider. The eagle's expression is kind and coach-like. Rocky hillside, instructive gentle mood."}, {"text": "링키는 언덕 끝에 다시 섰어요.\n이번엔 멀리 노을 바위만 바라봤죠.\n후웅— 바람이 등을 밀어 주었어요.", "prompt": "Close-up from behind of Reengki the quokka (wearing his pink felt hat) standing at the hill's edge gripping the leaf glider, eyes fixed on a distant glowing sunset-colored rock formation. Wind lines sweep past him, his hat leaf streaming. Focused breath-holding moment, golden light."}, {"text": "슈웅! 글라이더가 두둥실 떠올랐어요!\n\"난다, 날아! Fly high!\"\n짧지만 분명히, 링키는 날았답니다.", "prompt": "Wide triumphant shot of Reengki the quokka (wearing his pink felt hat) gliding a short distance above the grassy slope on his leaf glider, mouth open in a joyful shout. The young eagle flies alongside and the mountain goat cheers from below. Sparkling golden-hour light, first-flight joy."}, {"text": "\"내일은 더 멀리 날 수 있을까?\"\n링키의 꿈이 몽글몽글 부풀었어요.\n하지만 진짜 훈련은 이제부터래요!", "prompt": "Medium shot of Reengki the quokka (wearing his pink felt hat) hugging his leaf glider at dusk, gazing at the first stars with a dreamy smile. The young eagle and mountain goat stand behind him exchanging knowing looks. Purple twilight sky, cozy hopeful cliffhanger mood."}]}, {"ep": 4, "title": "독수리 눈 집중 훈련", "pages": [{"text": "\"축제 코스는 바람이 씽씽 부는 골짜기야.\n집중하지 않으면 금방 흔들리지.\"\n아로가 진지하게 말했어요.", "prompt": "Wide shot of the young eagle and Reengki the quokka (wearing his pink felt hat) standing at a cliff edge overlooking a deep windy valley where gusts visibly bend the grass and swirl dust. The eagle speaks with a serious coaching expression. Dramatic but bright morning scenery."}, {"text": "첫 훈련은 '독수리 눈' 놀이!\n\"저 빨간 열매를 백까지 세며 바라봐.\"\n링키는 눈을 동그랗게 떴어요.", "prompt": "Medium shot of Reengki the quokka (wearing his pink felt hat) sitting cross-legged on a flat rock, staring wide-eyed at a single bright red berry on a distant bush that the young eagle points to. Clean simple composition, playful training-game atmosphere."}, {"text": "하나, 둘, 셋… 나비가 팔랑팔랑.\n\"우와 예쁜 나비—\" \"링키, 집중!\"\n\"앗, 맞다!\" 링키는 헤헤 웃었죠.", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat) with his head turned to follow a pretty fluttering butterfly, completely distracted, while the young eagle covers his face with one wing in fond exasperation. Sunny meadow-on-rock setting, lighthearted comic moment."}, {"text": "두 번째 훈련은 바람 소리 듣기.\n눈을 감고 바람의 방향을 맞히는 거예요.\n\"동쪽! …이 아니라 서쪽인가?\"", "prompt": "Medium shot of Reengki the quokka (wearing his pink felt hat) standing with eyes squeezed shut and ears perked, one paw pointing uncertainly in one direction then wavering. Wind streams ripple his fur and hat leaf. The young eagle watches nearby, gentle amusement on his face."}, {"text": "자꾸만 틀리는 링키.\n어깨가 축 처지고 말았어요.\n\"난 집중을 못하나 봐…\"", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat) sitting on a rock with drooping shoulders and downcast eyes, his hat tilted sadly. Soft overcast light, muted colors, a quiet moment of discouragement on the mountainside."}, {"text": "아로가 날개로 링키를 토닥였어요.\n\"나도 처음엔 구름만 세었는걸.\n하나만 기억해. 목표 하나, 마음 하나!\"", "prompt": "Medium shot of the young eagle wrapping one warm wing around Reengki the quokka (wearing his pink felt hat) in a comforting side hug, speaking gently. Reengki looks up with recovering hope in his eyes. Sunbeams breaking through clouds behind them, tender friendship moment."}, {"text": "\"목표 하나, 마음 하나!\" 링키가 따라했죠.\n빨간 열매를 다시 바라보았어요.\n이번엔 나비가 지나가도 끄떡없었죠!", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat) with a calm focused gaze locked on the distant red berry, while a butterfly flutters right past his nose completely ignored. Steady composed expression, crisp clear light, quiet triumph of concentration."}, {"text": "바람 소리 듣기도 다시 도전!\n귀를 쫑긋, 마음을 고요하게.\n\"남쪽 바람!\" \"정답이야, 링키!\"", "prompt": "Medium shot of Reengki the quokka (wearing his pink felt hat) with eyes closed and ears perked high, pointing confidently in one direction, while the young eagle flaps his wings in delighted approval. Visible gentle wind streams flow in that direction. Bright celebratory training scene."}, {"text": "해 질 녘, 링키는 글라이더로 골짜기를 슝!\n흔들려도 노을 바위만 바라봤어요.\n아로가 옆에서 나란히 날았죠.", "prompt": "Wide sunset shot of Reengki the quokka (wearing his pink felt hat) gliding through the windy valley on his leaf glider, eyes locked on a glowing rock ahead despite the buffeting wind, with the young eagle flying steadily beside him. Orange and pink sky, exhilarating side-by-side flight."}, {"text": "\"링키, 너 정말 빨리 늘었어!\"\n그런데 아로의 얼굴이 살짝 어두웠어요.\n아로에게 무슨 고민이 있는 걸까요?", "prompt": "Medium shot of Reengki the quokka (wearing his pink felt hat) landing happily with his leaf glider at dusk while the young eagle compliments him, but the eagle's eyes drift toward a tall dark rock spire in the distance with a troubled expression. Twilight colors, subtle foreshadowing mood."}]}, {"ep": 5, "title": "아로의 비밀", "pages": [{"text": "다음 날, 아로가 보이지 않았어요.\n링키는 마을 곳곳을 찾아다녔죠.\n\"아로야, 어디 있니?\"", "prompt": "Wide shot of Reengki the quokka (wearing his pink felt hat) wandering through the cliff village calling out, peeking behind nest-shaped houses and rock pillars. The plaza is quiet in soft morning light. Searching, slightly worried mood."}, {"text": "아로는 절벽 아래 바위틈에 혼자 있었어요.\n날개에 얼굴을 파묻고 시무룩.\n링키가 살며시 다가갔죠.", "prompt": "Medium shot of the young eagle huddled alone in a shadowy rock crevice below the cliff, face buried in his folded wings. Reengki the quokka (wearing his pink felt hat) approaches quietly on tiptoe from the side. Muted cool tones, gentle melancholy atmosphere."}, {"text": "\"축제의 마지막 코스는 번개 바위 급강하야.\n제일 높은 곳에서 곧장 내려 꽂는 거지.\"\n아로의 목소리가 떨렸어요.", "prompt": "Medium shot of the young eagle looking up at a towering jagged rock spire in the distance, his expression anxious, while Reengki the quokka (wearing his pink felt hat) sits close beside him listening. The tall spire looms against the sky. Serious confiding moment."}, {"text": "\"작년에 그곳에서 돌풍을 만났어.\n빙글빙글 돌다가 겨우 멈췄지.\n그 뒤로 높은 곳이 무서워…\"", "prompt": "Close-up of the young eagle with wings hugged tightly around himself, eyes glistening as he remembers, a faint imagined swirl of stormy wind sketched in the sky behind him like a memory. Reengki the quokka (wearing his pink felt hat) listens with a soft sympathetic face. Tender emotional scene."}, {"text": "링키는 아로 곁에 꼭 붙어 앉았어요.\n\"무서운 건 부끄러운 게 아니야.\n나도 어제 백 번은 굴렀는걸!\"", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat) sitting shoulder to shoulder with the young eagle in the rock crevice, patting the eagle's wing with a warm reassuring smile. Soft light spills into the crevice. Comforting intimate friendship moment."}, {"text": "\"우리 같이 연습하자. 조금씩, 한 칸씩!\"\n링키가 새끼발가락만 한 바위를 가리켰어요.\n아로가 피식 웃음을 터뜨렸죠.", "prompt": "Medium shot of Reengki the quokka (wearing his pink felt hat) dramatically pointing at a tiny pebble-sized rock on the ground with an exaggerated serious face, making the young eagle burst into laughter. Sunlight returning to the scene, mood lifting with humor."}, {"text": "첫날은 낮은 바위에서 폴짝.\n\"쉽잖아?\" \"그럼 다음 바위!\"\n둘은 계단을 오르듯 연습했어요.", "prompt": "Wide shot of the young eagle hopping off a knee-high rock with wings out while Reengki the quokka (wearing his pink felt hat) cheers, a series of progressively taller rocks lined up behind them like natural stairs. Bright playful training montage feel."}, {"text": "조금 높은 바위에서 아로가 머뭇머뭇.\n\"목표 하나, 마음 하나!\" 링키가 외쳤죠.\n아로는 숨을 크게 쉬고… 슝!", "prompt": "Medium shot of the young eagle hesitating at the edge of a taller boulder, talons gripping the rim, while Reengki the quokka (wearing his pink felt hat) shouts encouragement from below with paws cupped around his mouth. Wind streaks show the eagle beginning to dive. Suspenseful but supportive mood."}, {"text": "\"해냈다!\" 둘은 하이파이브를 했어요.\n\"You can do it! 넌 할 수 있어!\"\n링키가 배운 말을 외쳐 주었죠.", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat) and the young eagle slapping paw to wingtip in a joyful high-five, both beaming. Little celebration sparkles and dust kicked up around their feet. Golden afternoon light, victorious warm energy."}, {"text": "이제 남은 건 진짜 번개 바위.\n까마득히 높은 저 꼭대기…\n둘은 과연 해낼 수 있을까요?", "prompt": "Wide dramatic shot of Reengki the quokka (wearing his pink felt hat) and the young eagle standing side by side, gazing up at the immense jagged rock spire towering into the clouds. Their small figures contrast with the spire's height. Determined silhouettes in late-day light, suspenseful cliffhanger."}]}, {"ep": 6, "title": "심술쟁이 돌풍", "pages": [{"text": "축제가 사흘 앞으로 다가왔어요.\n광장엔 깃발과 화환이 주렁주렁.\n마을이 들썩들썩 신났죠.", "prompt": "Wide cheerful shot of the cliff village plaza being decorated, colorful flags strung between rock pillars and flower garlands hanging from nest-houses. Eagles bustle about carrying decorations while Reengki the quokka (wearing his pink felt hat) helps carry a small garland. Festive bright daylight."}, {"text": "그런데 오후, 하늘이 갑자기 어두워졌어요.\n휘이잉— 심술쟁이 돌풍이 몰려온 거예요!\n\"모두 바위틈으로 피해요!\"", "prompt": "Wide shot of dark grey clouds rolling over the cliff village as a fierce gust of wind sweeps through, bending flags sideways. Eagles hurry toward rock shelters, and Reengki the quokka (wearing his pink felt hat) holds onto his hat. Dramatic but not scary, windy motion everywhere."}, {"text": "깃발이 후두둑 날아가고\n화환이 데굴데굴 굴렀어요.\n링키의 글라이더도 팽그르르!", "prompt": "Medium action shot of colorful flags whipping loose into the swirling air and flower garlands rolling across the plaza, while Reengki the quokka (wearing his pink felt hat) chases his spinning leaf glider. Leaves and petals fly everywhere. Chaotic but playful storm energy."}, {"text": "링키는 글라이더를 꼭 끌어안았어요.\n아로가 날개로 링키를 감쌌죠.\n\"조금만 참자, 바람은 곧 지나가!\"", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat) hugging his leaf glider tightly inside a rock shelter while the young eagle shields him with a broad protective wing. Wind streaks rush past the shelter opening. Cozy protected feeling amid the storm."}, {"text": "이윽고 바람이 잠잠해졌어요.\n하지만 광장은 엉망진창.\n마을 친구들의 어깨가 축 처졌죠.", "prompt": "Wide shot of the plaza after the storm, flags tangled on rocks, garlands scattered, a decoration pole leaning over. Village eagles stand among the mess with drooping wings, and Reengki the quokka (wearing his pink felt hat) surveys the scene. Grey clearing sky, subdued mood."}, {"text": "\"축제를 미뤄야 하나…\" 누군가 한숨.\n그때 링키가 번쩍 손을 들었어요.\n\"우리 모두 함께 고치면 돼요!\"", "prompt": "Medium shot of Reengki the quokka (wearing his pink felt hat) standing on a small rock with one paw raised high and a bright determined smile, addressing the discouraged circle of eagles around him. A sunbeam breaks through the clouds onto him. Rallying hopeful moment."}, {"text": "독수리들은 높은 곳의 깃발을 줍고\n토프는 무거운 기둥을 쿵쿵 세웠어요.\n링키는 화환을 조롱조롱 엮었죠.", "prompt": "Wide busy shot of teamwork across the plaza, eagles flying up to retrieve flags from high ledges, the mountain goat pushing a heavy wooden pole upright with his horns, and Reengki the quokka (wearing his pink felt hat) re-stringing flower garlands. Warm cooperative energy, clearing sky."}, {"text": "\"Ready, set, go!\" 아로가 외치면\n모두 손발이 척척 맞았어요.\n일은 놀이처럼 즐거워졌죠.", "prompt": "Medium shot of the young eagle calling out like a cheerful team captain with one wing raised, while Reengki the quokka (wearing his pink felt hat), the mountain goat, and other eagles pass decorations along a lively working line. Smiles all around, work-as-play atmosphere, bright afternoon."}, {"text": "해가 질 무렵, 광장이 다시 반짝반짝!\n돌풍이 오기 전보다 더 예뻐졌어요.\n구름 할아버지가 흐뭇하게 웃었죠.", "prompt": "Wide golden-hour shot of the fully restored plaza glowing with neat rows of flags and fresh garlands, even lovelier than before. The old white-feathered eagle elder smiles proudly from his rock while Reengki the quokka (wearing his pink felt hat) and friends admire their work. Warm satisfied evening light."}, {"text": "\"고맙다, 얘들아. 축제는 계획대로!\"\n와아— 환호성이 울려 퍼졌어요.\n그런데 그날 밤, 작은 울음소리가?", "prompt": "Medium shot of the village celebrating with wings and paws raised in cheer under early evening stars, Reengki the quokka (wearing his pink felt hat) jumping happily in the middle. At the edge of the frame, a dark quiet corner of the cliff hints at something unnoticed. Joyful mood with a tiny mysterious note."}]}, {"ep": 7, "title": "삐요를 찾아라", "pages": [{"text": "삐요삐요… 어디선가 가냘픈 소리.\n제비 아주머니가 동동거리며 날아왔어요.\n\"우리 아기 삐요가 없어졌어요!\"", "prompt": "Medium night-to-morning shot of a worried mother swallow fluttering anxiously in front of Reengki the quokka (wearing his pink felt hat) and the young eagle in the plaza, wings trembling. Concerned faces all around. Soft dawn light, urgent but gentle mood."}, {"text": "돌풍에 아기 제비 삐요가\n둥지에서 날려 간 모양이에요.\n마을 친구들이 모두 모였죠.", "prompt": "Wide shot of village eagles, the mountain goat, and Reengki the quokka (wearing his pink felt hat) gathered in a circle around an empty swallow nest tucked in a rock niche, a few stray feathers drifting. Everyone leans in with concern. Cool morning tones, rescue-mission gathering."}, {"text": "\"울음소리는 골짜기 쪽이에요!\"\n링키가 귀를 쫑긋 세웠어요.\n바람 소리 훈련이 빛나는 순간!", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat) with eyes closed and ears perked high, one paw raised for silence, pointing decisively toward the misty valley. The young eagle and others watch him with hopeful surprise. Focused heroic little moment."}, {"text": "독수리들이 하늘에서 살폈지만\n안개가 뿌옇게 깔려 잘 안 보였어요.\n\"이럴 땐 독수리 눈으로 집중!\"", "prompt": "Wide shot of eagles circling above a valley blanketed in soft white fog, straining to see below. Reengki the quokka (wearing his pink felt hat) stands at the cliff edge calling up to them. Diffused misty light, searching tension."}, {"text": "아로가 바람을 타고 낮게 날았어요.\n링키는 글라이더로 그 뒤를 따랐죠.\n\"목표 하나, 마음 하나!\"", "prompt": "Dynamic wide shot of the young eagle flying low through wisps of fog along the cliff face, with Reengki the quokka (wearing his pink felt hat) gliding close behind on his leaf glider, both with intensely focused expressions. Streaming wind lines, determined rescue-flight energy."}, {"text": "저기! 절벽 중턱 좁은 바위 턱에\n삐요가 오들오들 떨고 있었어요.\n독수리가 앉기엔 너무 좁은 곳!", "prompt": "Medium shot revealing a tiny fluffy baby swallow chick trembling on a very narrow rock ledge halfway down a sheer cliff face, fog thinning around it. The young eagle hovers nearby unable to land on the small ledge. Precarious but hopeful discovery moment."}, {"text": "\"내가 갈게!\" 링키가 글라이더로 슝—\n바위 턱에 사뿐 내려앉았어요.\n\"삐요야, 이제 괜찮아.\"", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat) landing lightly on the narrow ledge with his leaf glider and kneeling to gently reassure the shivering baby swallow chick. Soft protective body language, cliff wall textures behind. Tender brave rescue scene."}, {"text": "링키는 삐요를 모자에 포옥 담았어요.\n\"아로, 준비됐지?\" \"언제든지!\"\n링키가 폴짝 뛰어내리자—", "prompt": "Medium shot of Reengki the quokka carefully tucking the baby swallow chick into his pink felt hat held like a basket, then leaping off the ledge with the leaf glider, while the young eagle swoops into position below. Mid-air suspense with clear teamwork, dramatic but safe feeling."}, {"text": "아로가 등으로 살짝 받아냈어요!\n슈웅— 둘은 미끄러지듯 마을로.\n\"삐요야!\" 엄마 품은 따뜻했죠.", "prompt": "Wide shot of the young eagle catching Reengki the quokka (holding his pink felt hat with the chick inside) gently on his back and gliding smoothly toward the village, where the mother swallow rushes forward with open wings. Fog clearing into sunshine, emotional joyful reunion."}, {"text": "\"링키, 아로, 정말 고마워요!\"\n둘은 마주 보며 씨익 웃었어요.\n이제 축제까지 딱 하루 남았어요!", "prompt": "Medium shot of the mother swallow nuzzling her rescued chick while villagers applaud, and Reengki the quokka (wearing his pink felt hat) and the young eagle exchange proud grins in the foreground. Warm midday light over the plaza, heartwarming closing with festive anticipation."}]}, {"ep": 8, "title": "가장 높은 바위의 밤", "pages": [{"text": "축제 전날 밤, 링키는 잠이 안 왔어요.\n창밖엔 번개 바위가 우뚝.\n달빛에 검게 빛나고 있었죠.", "prompt": "Medium night shot of Reengki the quokka (wearing his pink felt hat) sitting awake by the round window of a cozy nest-shaped house, gazing out at the tall jagged rock spire silhouetted against a huge moon. Deep blue night tones with silver moonlight, quiet restless mood."}, {"text": "밖으로 나오니 아로도 있었어요.\n\"잠이 안 와서.\" \"나도!\"\n둘은 마주 보고 웃었죠.", "prompt": "Medium shot of Reengki the quokka (wearing his pink felt hat) stepping outside into the moonlit plaza and finding the young eagle already sitting on a rock, both surprised then breaking into soft smiles. Starry sky above the sleeping village, warm companionship at night."}, {"text": "\"우리… 지금 올라가 볼래?\"\n아로의 눈이 반짝였어요.\n둘은 조용히 바위산을 올랐죠.", "prompt": "Wide shot of Reengki the quokka (wearing his pink felt hat) and the young eagle quietly beginning to climb the moonlit rocky slope together, the tall spire rising ahead of them. Their small figures glow in silver light. Adventurous hushed nighttime mood."}, {"text": "한 칸, 또 한 칸. 영차, 영차.\n연습했던 바위들을 지나서\n드디어 번개 바위 꼭대기에!", "prompt": "Medium shot of Reengki the quokka (wearing his pink felt hat) pulling himself up the final rock while the young eagle hops up beside him, the familiar stair-like practice boulders visible below. They reach the flat summit of the great spire. Moonlit determination, sense of arrival."}, {"text": "우와… 별이 손에 닿을 것 같았어요.\n마을 불빛이 콩알처럼 반짝반짝.\n바람이 조용히 노래했죠.", "prompt": "Breathtaking wide shot from the summit at night, Reengki the quokka (wearing his pink felt hat) and the young eagle sitting side by side under an enormous sky full of stars, the tiny warm lights of the village far below. Vast serene night panorama, awe and peace."}, {"text": "\"여기서 보니까 하나도 안 무섭네.\"\n아로가 가만히 말했어요.\n\"무서움보다 목표가 커졌나 봐.\"", "prompt": "Close-up of the young eagle's calm moonlit face as he gazes over the edge without fear, wings relaxed, while Reengki the quokka (wearing his pink felt hat) watches him with a gentle proud smile. Soft starlight, quiet emotional breakthrough moment."}, {"text": "링키가 고개를 끄덕였어요.\n\"높이 오르면 멀리 보이는구나.\n내 꿈도 저기 어딘가에 있겠지?\"", "prompt": "Medium shot of Reengki the quokka (wearing his pink felt hat) standing at the summit edge gazing toward the far dark horizon where sky meets distant sea, one paw over his heart. The young eagle sits beside him following his gaze. Dreamy contemplative night scene."}, {"text": "\"로트네스트 섬에서 노래할 거야.\n전 세계 친구들과 영어로!\"\n\"멋진 목표다. Fly high, 링키!\"", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat) speaking with shining eyes and open arms as if imagining a stage, while the young eagle raises one wing in salute. Faint sparkles of imagination in the starry air around them. Inspiring warm friendship."}, {"text": "둘은 새끼손가락을 걸었어요.\n\"내일, 여기서 함께 나는 거야!\"\n별똥별이 슝— 축하해 주었죠.", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat) linking his little finger with the young eagle's wingtip in a pinky promise, a shooting star streaking across the starry sky behind them. Magical night lighting, promise-sealed emotional peak."}, {"text": "산을 내려오는 발걸음이 가벼웠어요.\n내일은 드디어 활공 축제!\n두근두근, 아침이 기다려져요!", "prompt": "Wide shot of Reengki the quokka (wearing his pink felt hat) and the young eagle descending the moonlit slope with light happy steps, the village lights welcoming below and the first faint glow of dawn at the horizon's edge. Hopeful transition-to-morning mood."}]}, {"ep": 9, "title": "활공 축제", "pages": [{"text": "축제 날 아침, 하늘은 파랗고 높았어요.\n광장엔 마을 친구들이 가득!\n\"활공 축제를 시작합니다!\"", "prompt": "Wide festive shot of the cliff village plaza packed with cheering eagles, the mountain goat, and swallows under a brilliant high blue sky, flags and garlands everywhere. The old white-feathered eagle elder announces from the tall rock while Reengki the quokka (wearing his pink felt hat) stands ready with his leaf glider. Grand celebratory opening."}, {"text": "첫 코스는 바람 골짜기 통과!\n독수리들이 차례차례 슝— 슝—.\n링키도 글라이더를 꼭 잡았어요.", "prompt": "Wide shot of eagles launching one by one off the cliff into the windy valley course marked with small flag posts, while Reengki the quokka (wearing his pink felt hat) waits at the starting ledge gripping his leaf glider, heart visibly pounding. Dynamic race-day energy."}, {"text": "\"Ready, set, go!\"\n링키가 바람에 몸을 실었어요.\n골짜기 바람이 씽씽 몰아쳤죠.", "prompt": "Action shot of Reengki the quokka (wearing his pink felt hat) leaping off the starting ledge on his leaf glider as the crowd cheers, strong wind streaks rushing through the rocky valley ahead. His hat leaf streams back, expression brave and focused. Thrilling launch moment."}, {"text": "흔들흔들! 하지만 링키는\n노을 바위만 똑바로 바라봤어요.\n\"목표 하나, 마음 하나!\"", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat) mid-flight on the wobbling leaf glider, fur ruffled by gusts, but his eyes locked unwaveringly on a distant glowing rock formation. Swirling wind lines around him contrast with his steady gaze. Peak concentration."}, {"text": "슈웅— 골짜기를 통과했어요!\n\"와아!\" 박수가 쏟아졌죠.\n토프가 뿔을 흔들며 응원했어요.", "prompt": "Wide shot of Reengki the quokka (wearing his pink felt hat) gliding out of the valley's end past the final flag post, arms spread in triumph, while the crowd on the cliff erupts in cheers and the mountain goat waves his horned head excitedly. Bright victorious energy."}, {"text": "마지막 코스, 번개 바위 급강하.\n아로의 차례가 다가왔어요.\n꼭대기에 선 아로, 심장이 콩닥콩닥.", "prompt": "Dramatic low-angle shot of the young eagle standing alone on the summit of the great jagged spire, wings half-open, the whole village watching tiny and far below. Wind ripples his feathers. Tense breath-holding moment before the dive, vast blue sky."}, {"text": "그때 바람 사이로 목소리가 들렸어요.\n\"You can do it! 아로—!\"\n링키가 힘껏 외치고 있었죠.", "prompt": "Medium shot from behind the young eagle on the summit, looking down at the plaza where Reengki the quokka (wearing his pink felt hat) jumps and shouts encouragement with paws cupped around his mouth. Sound-wave-like wind lines rise from below. Emotional connection across the height."}, {"text": "아로는 눈을 감았다 떴어요.\n목표는 하나, 광장의 링키!\n날개를 접고… 슈우웅—!", "prompt": "Dynamic action shot of the young eagle folding his wings and diving straight down the face of the spire like an arrow, feathers streaming, eyes locked on the plaza far below. Speed lines and rushing air, thrilling courageous plunge."}, {"text": "화살처럼 곧게, 바람보다 빠르게!\n아로가 광장 위로 활짝 날아올랐어요.\n\"해냈다! 아로가 해냈어요!\"", "prompt": "Wide triumphant shot of the young eagle pulling out of the dive and sweeping upward over the plaza with wings fully spread, the crowd below erupting with joy and Reengki the quokka (wearing his pink felt hat) leaping highest of all. Sunlight blazing on his feathers, glorious climax."}, {"text": "구름 할아버지가 선언했어요.\n\"올해의 하늘 친구는 아로와 링키!\"\n하늘에서 꽃잎이 팔랑팔랑 내렸죠.", "prompt": "Wide celebration shot of the old white-feathered eagle elder raising his wings in proclamation while flower petals rain down over the plaza. Reengki the quokka (wearing his pink felt hat) and the young eagle stand together at the center wearing leaf-and-flower wreaths. Confetti-like petals, radiant festival finale."}]}, {"ep": 10, "title": "빨간 구슬 R과 바다로", "pages": [{"text": "축제 다음 날, 노을이 곱게 물들었어요.\n구름 할아버지가 링키를 불렀죠.\n번개 바위 꼭대기로요.", "prompt": "Wide sunset shot of the great rock spire glowing in soft orange and pink light, with the old white-feathered eagle elder waiting at the summit as Reengki the quokka (wearing his pink felt hat) climbs the final steps. Gentle solemn beauty, ceremonial evening atmosphere."}, {"text": "아로가 반짝이는 것을 물고 왔어요.\n루비처럼 빨간 알파벳 구슬!\n\"R 구슬이야. 링키, 네 거야.\"", "prompt": "Close-up of the young eagle presenting a glowing ruby-red marble to Reengki the quokka (wearing his pink felt hat), the marble sparkling like a tiny sunset in the eagle's talons. Reengki's eyes shine with wonder. Warm magical glow on the summit."}, {"text": "\"높은 목표를 품고, 끝까지 집중했지.\n그리고 우리의 진짜 친구가 되었단다.\"\n할아버지가 따뜻하게 말했어요.", "prompt": "Medium shot of the old white-feathered eagle elder speaking warmly with a wing resting on Reengki the quokka's shoulder (he wears his pink felt hat), the young eagle standing proudly beside them on the sunset summit. Tender ceremonial moment, golden-pink light."}, {"text": "링키는 구슬을 받아 들었어요.\n주머니 속 구슬이 아홉 개!\n짤랑짤랑, 기쁨의 소리가 났죠.", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat) holding open his small pouch where nine glowing alphabet marbles of different colors shimmer together, the new red one on top. His face glows with quiet joy. Sparkling magical light from the marbles."}, {"text": "\"높은 곳을 향해 날아오르렴.\n네 꿈도, 네 영어도 함께 날 거야.\"\n할아버지의 말이 가슴에 새겨졌어요.", "prompt": "Wide inspiring shot of the old white-feathered eagle elder gesturing toward the vast glowing horizon while Reengki the quokka (wearing his pink felt hat) stands at the summit edge, wind lifting his hat leaf, eyes full of resolve. Expansive sunset sky, uplifting blessing moment."}, {"text": "떠나는 날 아침이 밝았어요.\n토프가 산길 지도를 선물했죠.\n삐요는 모자에 깃털을 꽂아 줬어요.", "prompt": "Medium morning shot at the village gate, the mountain goat handing Reengki the quokka a rolled leaf map while the baby swallow chick tucks a tiny feather into his pink felt hat. Villager eagles gather around to say goodbye. Bright bittersweet farewell morning."}, {"text": "\"다음 마을은 어디야?\" 아로가 물었죠.\n\"바다 건너 돌고래 마을!\"\n링키의 눈이 파도처럼 반짝였어요.", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat, now with a tiny feather in it) pointing excitedly toward the distant blue sea visible beyond the mountains, while the young eagle looks in the same direction. Sea sparkling on the horizon, eager anticipation."}, {"text": "\"산 아래까지는 내가 데려다줄게!\"\n링키는 아로의 등에 폴짝 올라탔어요.\n\"Fly high—!\" 슈웅—!", "prompt": "Dynamic wide shot of Reengki the quokka (wearing his pink felt hat) riding on the young eagle's back as they launch off the cliff together, both shouting joyfully, the village friends waving below. Wind streaming, exhilarating farewell flight into open sky."}, {"text": "바람바위 마을이 점점 작아졌어요.\n\"고마워, 모두들! 또 만나요!\"\n메아리가 산울림으로 답했죠.", "prompt": "Aerial wide shot from behind Reengki the quokka (wearing his pink felt hat) on the young eagle's back, looking back at the cliff-top village shrinking below, tiny figures still waving from the plaza. Layers of mountains bathed in morning light, nostalgic soaring farewell."}, {"text": "산 아래 푸른 바다가 펼쳐졌어요.\n저 멀리 돌고래가 폴짝 인사하는 듯!\n링키의 새로운 이야기가 기다리고 있어요.", "prompt": "Wide breathtaking shot of the young eagle gliding down toward the coastline with Reengki the quokka (wearing his pink felt hat) on his back, the vast sparkling blue sea spreading ahead where a distant dolphin leaps playfully from the waves. Bright open horizon, promise of a new adventure."}]}]}, "10": {"chapter": 10, "animal": "돌고래", "animal_en": "dolphin", "letter": "E", "village": "반짝 항구 마을", "episodes": [{"ep": 1, "title": "반짝이는 항구 마을", "pages": [{"text": "링키의 주머니에서 구슬 아홉 개가\n짤랑짤랑 노래를 불렀어요.\n언덕 너머로 바다 냄새가 솔솔 났죠.", "prompt": "Wide shot of Reengki the quokka (wearing his pink felt hat) walking over a grassy seaside hill, a small pouch at his side glowing softly with nine tiny alphabet beads. Beyond the hill, a sparkling blue ocean stretches to the horizon under a bright morning sky. His nose is lifted happily as if smelling the sea breeze, cheeks rosy with excitement."}, {"text": "언덕 위에 오르자, 와아!\n반짝반짝 빛나는 항구 마을이\n바다를 안고 펼쳐져 있었어요.", "prompt": "Wide panoramic view from a hilltop showing a cozy harbor village hugging a glittering bay, with colorful little boats, round lighthouses, and shell-decorated cottages along the water. Reengki the quokka (wearing his pink felt hat) stands at the front with arms spread wide in delight. Sunlight sparkles on the waves like scattered diamonds, warm and inviting mood."}, {"text": "링키는 나무 부두를 콩콩 걸었어요.\n“어서 오렴, 여기는 반짝 항구란다.”\n게 아저씨가 집게를 흔들며 인사했죠.", "prompt": "Medium shot on a wooden pier where Reengki the quokka (wearing his pink felt hat) walks with a bouncy step, boards creaking gently. A friendly old crab with big kind eyes waves one claw in greeting beside a coiled rope and a small lantern. Fishing boats bob in the sparkling water behind them, cheerful seaside atmosphere."}, {"text": "그때 바다 저편에서\n라라라— 고운 노랫소리가\n파도를 타고 흘러왔어요.", "prompt": "Medium-wide shot of Reengki the quokka (wearing his pink felt hat) standing still on the pier, one ear perked, listening toward the open sea. Soft glowing musical notes drift over the rolling waves from far away, catching the sunlight. The crab beside him also looks toward the horizon, both faces full of wonder."}, {"text": "“어? 누가 노래하는 거지?”\n링키가 까치발을 들고\n바다를 요리조리 살펴보았어요.", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat) standing on tiptoe at the edge of the pier, paws shading his eyes as he scans the glittering sea. His expression is curious and eager, whiskers twitching. Sparkles of sunlight dance on the gentle blue waves in front of him."}, {"text": "그 순간, 슝—!\n은빛 돌고래 한 마리가\n무지개 물보라를 그리며 뛰어올랐어요.", "prompt": "Dynamic wide shot of a silvery dolphin leaping high out of the sparkling sea in a graceful arc, water spray forming a small rainbow in the sunlight. Reengki the quokka (wearing his pink felt hat) watches from the pier below, mouth open in amazement. Bright splashes and droplets frozen mid-air, joyful energetic mood."}, {"text": "“우와아! 돌고래다!”\n링키의 가슴이\n콩닥콩닥 신나게 뛰었어요.", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat) cheering with both paws raised high on the pier, eyes shining with excitement. In the background the dolphin's splash still sparkles above the waves. Warm sunlight, spray drifting like glitter, pure joyful moment."}, {"text": "돌고래는 꼬리로 물을 찰싹!\n반짝이는 물방울들이\n링키에게 인사하듯 흩날렸죠.", "prompt": "Medium shot of the dolphin slapping the water playfully with its tail near the pier, sending a fan of sparkling droplets toward Reengki the quokka (wearing his pink felt hat), who giggles and shields himself with his paws. The droplets glitter like tiny stars in the sunlight. Playful, friendly first-greeting mood."}, {"text": "“에코야, 오늘도 신나는구나!”\n부두의 친구들이 손을 흔들자\n돌고래가 노래로 대답했어요.", "prompt": "Wide shot of the harbor pier where a friendly crab and a chubby seal wave toward the dolphin swimming close to the dock, glowing musical notes rising from the dolphin like a cheerful reply. Reengki the quokka (wearing his pink felt hat) stands among them, watching with sparkling eyes. Colorful boats and shell-decorated houses in the background, lively harbor mood."}, {"text": "노래로 말하는 돌고래, 에코!\n“내일은 꼭 인사해야지.”\n링키의 밤은 두근두근 설렜답니다.", "prompt": "Cozy evening wide shot of the harbor village at dusk, lanterns glowing along the pier and stars beginning to twinkle over the calm sea. Reengki the quokka (wearing his pink felt hat) sits on a rooftop balcony of a small guesthouse, hugging his knees and gazing at the water where a faint dolphin silhouette glides. Warm purple-orange sky, dreamy hopeful mood."}]}, {"ep": 2, "title": "노래로 말하는 친구, 에코", "pages": [{"text": "다음 날 아침, 링키는\n부두 끝에 앉아 바다를 향해\n“안녕—!” 하고 외쳤어요.", "prompt": "Wide morning shot of Reengki the quokka (wearing his pink felt hat) sitting at the very end of the wooden pier, paws cupped around his mouth as he calls out toward the calm sparkling sea. Soft golden sunrise light, seagulls circling above, gentle waves lapping at the posts. Hopeful and fresh morning mood."}, {"text": "퐁— 물속에서 에코가\n빼꼼 고개를 내밀었어요.\n“네가 어제 온 꼬마 여행자구나?”", "prompt": "Medium shot at water level of the dolphin popping its smiling head out of the sea right beside the pier, droplets rolling off its silvery skin. Reengki the quokka (wearing his pink felt hat) leans over the edge, surprised and delighted, their eyes meeting. Sparkling morning water, warm friendly atmosphere."}, {"text": "“나는 링키야! 노래하는 쿼카!”\n“나는 에코! 우리 돌고래들은\n말 대신 노래로 이야기해.”", "prompt": "Close-up two-shot of Reengki the quokka (wearing his pink felt hat) lying on his belly on the pier, chin on paws, chatting happily with the dolphin whose head rests above the water. Small glowing musical notes float between them like words. Bright blue sea, cheerful getting-to-know-you mood."}, {"text": "에코가 고운 목소리로 불렀어요.\n“헬로— Hello—♪”\n노래가 파도 위로 반짝 퍼졌죠.", "prompt": "Medium shot of the dolphin singing with its head raised gracefully above the water, a ribbon of glowing musical notes flowing from it across the sparkling waves. Reengki the quokka (wearing his pink felt hat) listens with wide sparkling eyes from the pier. The notes shimmer in the sunlight, magical gentle mood."}, {"text": "링키도 따라 해 보았어요.\n“헤…헬로…”\n목소리가 모기만큼 작았어요.", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat) trying to sing shyly, paws fidgeting together, a tiny faint musical note barely floating from his mouth. The dolphin watches kindly from the water below. Soft light, gentle slightly bashful mood."}, {"text": "“후후, 노래 대화의 비밀은\n즐거운 마음이야!\n웃으면서 다시 해 볼래?”", "prompt": "Medium shot of the dolphin splashing a playful arc of water with its fin, smiling encouragingly up at Reengki the quokka (wearing his pink felt hat) on the pier. The dolphin's expression is warm like a friendly teacher. Sparkling droplets in the air, supportive cheerful atmosphere."}, {"text": "링키는 씨익 웃고 크게 외쳤어요.\n“헬로— Hello—!!”\n갈매기들도 “끼룩! 헬로!” 화답했죠.", "prompt": "Wide joyful shot of Reengki the quokka (wearing his pink felt hat) standing tall on the pier, arms flung wide, singing loudly with big glowing musical notes bursting from him. Three white seagulls swoop overhead answering with their own little notes. The dolphin leaps beside the pier in celebration, bright sparkling sea, triumphant happy mood."}, {"text": "“하하, 잘한다!” 그때 물개 소라가\n뒤뚱뒤뚱 다가와 말했어요.\n“나도 끼워 줘! 나는 소라야.”", "prompt": "Medium shot of a chubby young seal waddling along the pier toward Reengki the quokka (wearing his pink felt hat), flippers clapping happily. The dolphin watches from the water with a smile. Warm sunlight on the wooden boards, welcoming friendly mood."}, {"text": "셋은 얕은 물가에서\n첨벙첨벙 파도 놀이를 했어요.\n웃음소리가 항구 가득 퍼졌죠.", "prompt": "Wide playful shot in the shallow sparkling water near the beach, Reengki the quokka (wearing his pink felt hat) splashing water with both paws, the seal belly-sliding through a wave, and the dolphin circling them making rings of spray. Splashes glitter in the sun, pure laughter-filled joyful scene."}, {"text": "“내일은 파도 노래를 가르쳐 줄게!”\n에코의 약속에 링키는\n벌써부터 가슴이 두근거렸답니다.", "prompt": "Sunset medium shot of the dolphin's head above the golden water, singing a soft promise note to Reengki the quokka (wearing his pink felt hat) who waves from the beach with the seal beside him. Orange-pink sky reflecting on the calm sea. Warm anticipation-filled evening mood."}]}, {"ep": 3, "title": "파도 노래 배우기", "pages": [{"text": "“파도 노래는 말이야,\n파도의 박자에 마음을 싣는 거야.”\n에코가 아침 바다에서 말했어요.", "prompt": "Medium shot of the dolphin swimming slowly beside gentle rolling waves, explaining to Reengki the quokka (wearing his pink felt hat) who sits on a smooth rock at the water's edge, listening intently. Soft morning light, calm rhythmic waves, focused learning mood."}, {"text": "쏴아— 철썩, 쏴아— 철썩.\n에코는 물결을 타고\n라라라— 노래를 얹었어요.", "prompt": "Wide graceful shot of the dolphin gliding along the crest of a gentle wave, glowing musical notes trailing behind it in perfect rhythm with the rolling water. Reengki the quokka (wearing his pink felt hat) watches from the rock, tapping his paw to the beat. Sparkling sea, flowing musical atmosphere."}, {"text": "“나도 해 볼래!”\n링키가 노래를 시작했지만\n박자가 뒤죽박죽 엉켜 버렸어요.", "prompt": "Medium shot of Reengki the quokka (wearing his pink felt hat) standing knee-deep in the shallow water, singing with wobbly crooked musical notes tangling above his head like scribbles. The dolphin tilts its head with a gentle amused smile nearby. Playful clumsy but warm mood."}, {"text": "게다가 철썩! 파도가 덮쳐\n링키는 켁켁, 바닷물을 먹었어요.\n“으에, 짜다 짜!”", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat, now dripping wet) sputtering comically after a small wave splashed over him, tongue out at the salty taste, fur soaked and eyes squeezed shut. Foamy water swirls around his legs. Lighthearted funny moment, bright daylight."}, {"text": "“푸하하! 괜찮아, 링키?”\n소라가 배를 잡고 웃다가\n“힘내! 힘내!” 응원해 주었죠.", "prompt": "Medium shot of the chubby seal laughing warmly on the sandy shore, then clapping its flippers in an encouraging cheer for Reengki the quokka (wearing his soggy pink felt hat) who wipes his face in the shallows. The dolphin watches supportively from deeper water. Sunny beach, warm humorous friendship mood."}, {"text": "링키는 다시 도전했어요.\n쏴아— 라라, 철썩— 라라.\n이번엔 조금 맞아떨어졌어요!", "prompt": "Medium shot of Reengki the quokka (wearing his pink felt hat) singing again in the shallow water, this time a few of his musical notes lining up neatly with the wave rhythm, glowing a little brighter. His face shows concentration mixed with a small proud smile. The dolphin nods along beside him, encouraging progress mood."}, {"text": "그런데 지나가던 배가 보이자\n링키의 목소리가 점점 작아졌어요.\n“틀리면… 부끄러운걸.”", "prompt": "Medium shot of Reengki the quokka (wearing his pink felt hat) shrinking shyly in the water, paws over his mouth, his musical notes fading to tiny pale wisps, as a small colorful fishing boat passes in the background. His ears droop slightly. Soft light, tender bashful mood."}, {"text": "에코가 살며시 다가와 말했어요.\n“틀려도 괜찮아.\n노래는 즐거우면 이미 백 점이야!”", "prompt": "Close-up two-shot at water level, the dolphin gently touching its nose near Reengki the quokka (wearing his pink felt hat), speaking softly with a kind smile, small warm glowing notes floating between them. Reengki looks up, comforted. Golden afternoon light on calm water, heartwarming reassuring mood."}, {"text": "어느새 하늘이 주황빛으로 물들고\n오늘의 연습이 끝났어요.\n파도도 자장자장 잔잔해졌죠.", "prompt": "Wide sunset shot of the beach with Reengki the quokka (wearing his pink felt hat), the dolphin, and the seal resting together at the water's edge, the sea calm and glowing orange-pink. Long soft shadows on the sand, gentle waves whispering. Peaceful end-of-day mood."}, {"text": "“내일은 꼭, 크게 즐겁게 부를 거야!”\n링키는 주먹을 꼭 쥐었어요.\n과연 내일은 성공할 수 있을까요?", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat) on the twilight beach, clenching his little fists with a determined sparkling gaze toward the darkening sea. First stars appear above the harbor lights in the distance. Determined hopeful night mood."}]}, {"ep": 4, "title": "즐겁게 말하면 돼요", "pages": [{"text": "이른 새벽, 링키는 혼자\n조용한 부두에 나와\n소곤소곤 연습을 시작했어요.", "prompt": "Wide dawn shot of an empty misty pier, pale blue morning light, where tiny Reengki the quokka (wearing his pink felt hat) practices singing alone, very small faint musical notes drifting from him. Calm glassy water, quiet dedicated mood."}, {"text": "“헬로… 렛츠 씽…”\n“끼룩? 하나도 안 들려—!”\n갈매기들이 놀리듯 빙빙 돌았죠.", "prompt": "Medium shot of three cheeky seagulls circling above Reengki the quokka (wearing his pink felt hat) on the pier, tilting their heads teasingly as his whisper-thin musical notes dissolve into the air. Reengki looks up mid-mumble, embarrassed. Soft morning light, gently comic mood."}, {"text": "링키는 시무룩해졌어요.\n“열심히 하는데\n왜 자꾸 목소리가 숨을까?”", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat) sitting on the edge of the pier with drooping ears and shoulders, hugging his knees, gazing down at his sad reflection in the still water. Muted soft morning colors, gentle melancholy mood."}, {"text": "퐁— 에코가 물 위로 올라왔어요.\n“링키, 노래 대화의 진짜 비밀은\n잘하는 게 아니라 즐기는 거야.”", "prompt": "Medium shot of the dolphin surfacing right below the sad Reengki the quokka (wearing his pink felt hat), looking up at him with warm wise eyes, its head breaking the mirror-still water into gentle ripples. Soft sunrise glow spreading on the sea, comforting turning-point mood."}, {"text": "“자, 오늘의 마법 주문!\n렛츠 씽— Let's sing!♪”\n에코가 신나게 꼬리를 흔들었어요.", "prompt": "Medium shot of the dolphin wiggling its tail playfully and singing an upbeat phrase, bright bouncy glowing notes popping into the air like bubbles. Reengki the quokka (wearing his pink felt hat) lifts his head, a smile starting to grow. Sparkling morning sea, contagious cheerful energy."}, {"text": "둘은 첨벙첨벙 물장난을 치며\n노래를 주고받았어요.\n“렛츠 씽!” “렛츠 씽—!”", "prompt": "Wide playful shot of Reengki the quokka (wearing his pink felt hat) splashing in the shallows while the dolphin spins beside him, both trading glowing musical phrases back and forth like a game of catch. Water droplets sparkle everywhere in the sunlight. Pure fun, laughing energetic mood."}, {"text": "까르르 웃다 보니 어느새\n링키의 목소리가 쩌렁쩌렁!\n부끄러움이 사라져 버렸어요.", "prompt": "Medium shot of Reengki the quokka (wearing his pink felt hat) laughing with his head thrown back, singing at full volume, big bold glowing musical notes soaring high into the blue sky. The dolphin leaps joyfully behind him. Bright midday light, breakthrough triumphant mood."}, {"text": "쏴아— 라라라, 철썩— 라라라!\n파도 박자에 노래가 딱딱 맞았어요.\n“성공이야, 링키!”", "prompt": "Wide dynamic shot of Reengki the quokka (wearing his pink felt hat) riding rhythm with the waves from a rock, his glowing notes flowing in perfect wavy lines matching the rolling sea, while the dolphin surfs alongside singing harmony. Sun sparkles on every wave crest, victorious musical celebration mood."}, {"text": "부두의 친구들이 박수를 쳤어요.\n게 아저씨는 집게를 딱딱!\n소라는 지느러미를 팡팡!", "prompt": "Wide cheerful shot of the pier crowded with applauding friends: the old crab clacking his claws, the seal clapping flippers, seagulls flapping happily, all celebrating Reengki the quokka (wearing his pink felt hat) who takes a shy proud bow in the shallows with the dolphin beside him. Festive warm harbor atmosphere."}, {"text": "그날 밤, 신나는 소식이 들렸어요.\n“곧 반짝 항구 노래 축제가 열린대!”\n링키의 눈이 반짝 빛났답니다.", "prompt": "Cozy night medium shot inside a warm lantern-lit dockside gathering, the old crab pointing at a small wooden notice board decorated with musical note carvings, while Reengki the quokka (wearing his pink felt hat), the seal, and friends lean in excitedly, eyes sparkling. Warm lamplight against the deep blue night, buzzing anticipation mood."}]}, {"ep": 5, "title": "갈매기 삼총사와 작은 오해", "pages": [{"text": "축제 준비로 항구가 들썩들썩!\n리본이 걸리고, 조개 등불이\n반짝반짝 매달렸어요.", "prompt": "Wide lively shot of the harbor village being decorated for a festival: colorful ribbons strung between masts, glowing shell lanterns hung along the pier, friends carrying garlands. Reengki the quokka (wearing his pink felt hat) helps carry a string of small flags. Bright bustling cheerful preparation mood."}, {"text": "“링키, 나랑 듀엣 어때?”\n에코의 말에 링키는\n“좋아, 좋아!” 폴짝 뛰었어요.", "prompt": "Medium shot at the pier's edge of the dolphin proposing with a happy note bubble while Reengki the quokka (wearing his pink felt hat) jumps in the air with joy, arms up. Festival ribbons flutter in the background. Sunny excited mood."}, {"text": "그 모습을 지켜보던\n갈매기 삼총사도 두근두근.\n“우리도 무대에 서고 싶다!”", "prompt": "Medium shot of three seagulls perched in a row on a wooden post, leaning toward each other and whispering, eyes shining with longing as they watch Reengki the quokka (wearing his pink felt hat) and the dolphin celebrate in the background. Soft afternoon light, wistful hopeful mood."}, {"text": "“같이 할래?” 링키가 물었지만\n웅얼웅얼, 말끝이 흐려져\n“…갈매기는 빼고”처럼 들렸어요.", "prompt": "Medium shot of Reengki the quokka (wearing his pink felt hat) mumbling with a paw scratching his cheek, his speech bubble notes coming out blurry and half-faded, while the three seagulls' faces fall in shock and hurt as they mishear him. Awkward tense-but-gentle moment, muted light."}, {"text": "“흥! 안 껴 줘도 돼!”\n갈매기들은 새침하게 토라져\n푸드덕 등대로 날아가 버렸죠.", "prompt": "Wide shot of the three seagulls flying away in a huffy formation toward a striped lighthouse on the rocks, tail feathers flicked up indignantly. Reengki the quokka (wearing his pink felt hat) stands on the pier below, confused, reaching a paw after them. Overcast soft light, comic sulky mood."}, {"text": "“내가 뭘 잘못 말했지?”\n링키는 가슴이 답답했어요.\n에코가 조용히 다가왔죠.", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat) sitting on a coil of rope with a troubled frown, paw on his chest, while the dolphin surfaces quietly nearby with a caring look. Soft grey-blue tones, thoughtful reflective mood."}, {"text": "“말은 또렷하게, 마음은 활짝!\n웅얼거리면 마음도\n반쪽만 전해지는 거야.”", "prompt": "Medium two-shot of the dolphin gently teaching Reengki the quokka (wearing his pink felt hat) at the water's edge, one clear bright musical note glowing between them contrasted with a small faded half-note. Reengki nods with dawning understanding. Warm golden light returning, gentle lesson mood."}, {"text": "링키는 등대까지 씩씩하게 달려가\n숨을 크게 들이쉬었어요.\n“얘들아— 내 말 좀 들어 줘!”", "prompt": "Wide shot of Reengki the quokka (wearing his pink felt hat) standing at the base of a red-and-white striped lighthouse on the rocks, calling up bravely with paws cupped around his mouth, while three sulky seagulls peek down from the lighthouse railing. Wind ruffles his fur, sincere determined mood."}, {"text": "“같이 무대에 서자!\n너희 코러스가 꼭 필요해!”\n또박또박 진심이 전해졌어요.", "prompt": "Medium shot of the three seagulls swooping down happily around Reengki the quokka (wearing his pink felt hat), all smiles and flapping wings, reconciled, his clear bold musical notes shining brightly in the air. The lighthouse stands warm in golden afternoon light, joyful reconciliation mood."}, {"text": "다 함께 연습을 시작한 그때,\n바다 저편 하늘이\n뿌—옇게 흐려지고 있었어요.", "prompt": "Wide shot of the whole group practicing together on the pier — Reengki the quokka (wearing his pink felt hat), the dolphin in the water, the seal, and three seagulls in a chorus line — while far on the horizon a thick pale fog bank slowly creeps toward the harbor. Contrast of warm foreground and hazy ominous-but-soft distance, suspenseful transition mood."}]}, {"ep": 6, "title": "뿌연 안개가 내려온 날", "pages": [{"text": "다음 날 아침, 세상이 온통\n우유처럼 뽀얀 안개에 잠겼어요.\n한 치 앞도 보이지 않았죠.", "prompt": "Wide atmospheric shot of the harbor completely wrapped in thick milky fog, only faint silhouettes of boat masts and lantern glows visible. Reengki the quokka (wearing his pink felt hat) stands on the pier holding a small lantern, peering into the whiteness. Soft muted palette, hushed mysterious mood."}, {"text": "배들은 항구에 꽁꽁 묶이고\n마을은 조용— 해졌어요.\n“이런 안개는 처음이야.”", "prompt": "Medium shot of fishing boats tied tightly to the foggy dock, ropes secured, the old crab shaking his head worriedly beside Reengki the quokka (wearing his pink felt hat). Everything beyond a few steps fades into white mist. Quiet still concerned mood."}, {"text": "등대지기 문어 올리 아저씨가\n등대 불을 밝혔지만\n안개는 꿈쩍도 하지 않았어요.", "prompt": "Medium shot of a kindly octopus lighthouse keeper at the top of the striped lighthouse, several arms adjusting the great lamp whose warm beam is swallowed by the dense fog just meters away. His face shows gentle worry. Glowing amber light diffused in white mist, soft dramatic mood."}, {"text": "그때 소라 엄마가 달려왔어요.\n“소라가 안 보여요!\n아침에 물놀이를 나갔는데…”", "prompt": "Medium shot of a worried mother seal hurrying along the foggy pier toward Reengki the quokka (wearing his pink felt hat) and the crab, her flippers raised anxiously. Friends gather around her in the mist, faces concerned but gentle. Muted foggy tones, caring urgency mood."}, {"text": "마을 친구들이 웅성웅성 모였어요.\n“이 안개 속에서\n어떻게 소라를 찾지?”", "prompt": "Wide shot of villagers gathered in a circle on the misty dock — crabs, seagulls, the octopus keeper — heads together in worried discussion, lantern lights making soft halos in the fog. Reengki the quokka (wearing his pink felt hat) stands among them, thinking hard. Community-in-council mood, soft and warm despite worry."}, {"text": "퐁— 에코가 나타나 말했어요.\n“걱정 마세요.\n안개 속에서는 노래가 눈이 돼요!”", "prompt": "Medium shot of the dolphin surfacing confidently beside the foggy pier, head high, a bright clear musical note glowing above it like a small beacon in the mist. The gathered friends turn toward it with hope, Reengki the quokka (wearing his pink felt hat) at the front, eyes lighting up. Hopeful turning-point mood."}, {"text": "“우리가 노래하면 소라가 듣고,\n소라가 답하면 소리를 따라\n찾아갈 수 있어!”", "prompt": "Close-up of the dolphin explaining its plan, glowing musical notes traveling in a dotted path through the illustrated fog toward a faint distant answering note. Reengki the quokka (wearing his pink felt hat) leans in from the pier, nodding eagerly. Clever diagram-like magical visual, rising-hope mood."}, {"text": "노래 신호도 정했어요.\n“웨어 아 유— Where are you?”\n대답은 “아임 히어— I'm here!”", "prompt": "Medium shot of Reengki the quokka (wearing his pink felt hat) and the dolphin practicing the call-and-response signal together at the misty water's edge, two matching pairs of glowing notes echoing between them. The seagulls repeat the phrases overhead. Focused teamwork mood in soft fog light."}, {"text": "“내가 함께 갈게!”\n링키가 씩씩하게 나섰어요.\n작은 배에 등불을 달았죠.", "prompt": "Medium shot of Reengki the quokka (wearing his pink felt hat) bravely stepping into a small wooden rowboat, hanging a glowing shell lantern on its bow, while the dolphin waits in the water beside it. Friends watch from the foggy pier with hopeful expressions. Courageous departure mood."}, {"text": "스르르— 배가 안개 속으로\n미끄러져 들어갔어요.\n과연 소라를 찾을 수 있을까요?", "prompt": "Wide dramatic shot of the tiny lantern-lit rowboat carrying Reengki the quokka (wearing his pink felt hat) gliding into the wall of white fog, the dolphin's fin cutting the calm water alongside. The harbor lights fade behind them into the mist. Suspenseful brave adventure mood."}]}, {"ep": 7, "title": "안개 속 메아리 노래", "pages": [{"text": "안개 바다는 아주 고요했어요.\n노 젓는 소리만 찰박찰박,\n링키의 가슴은 콩닥콩닥.", "prompt": "Atmospheric medium shot of the small rowboat drifting through dense white fog, Reengki the quokka (wearing his pink felt hat) gripping the oars, eyes wide and alert, the lantern casting a warm golden circle around the boat. The dolphin's back glistens beside the hull. Hushed suspenseful yet cozy mood."}, {"text": "링키가 첫 신호를 보냈어요.\n“웨어 아 유— Where are you?♪”\n노래가 안개 속으로 퍼졌죠.", "prompt": "Medium shot of Reengki the quokka (wearing his pink felt hat) standing carefully in the boat, singing out with paws cupped, a stream of glowing musical notes sailing away into the thick fog like a searchlight beam. The dolphin listens with closed eyes beside the boat. Focused hopeful mood."}, {"text": "조용… 아무 대답이 없었어요.\n“더 크게, 더 즐겁게!”\n에코가 링키를 북돋았어요.", "prompt": "Close-up two-shot in the fog: Reengki the quokka (wearing his pink felt hat) looking uncertain as his notes fade unanswered, while the dolphin nudges the boat gently with an encouraging smile. Lantern glow warm against the grey mist, encouraging mood."}, {"text": "“웨어 아 유———!♪”\n둘이 함께 힘껏 부르자\n노래가 멀리멀리 날아갔어요.", "prompt": "Wide shot of Reengki the quokka (wearing his pink felt hat) and the dolphin singing together at full power, their combined glowing notes forming one big bright wave of sound rolling far into the fog. Ripples spread across the still water. Powerful united effort mood."}, {"text": "그때! 저 멀리서 가늘게—\n“아임 히어… I'm here…!”\n소라의 목소리였어요!", "prompt": "Dramatic medium shot of Reengki the quokka (wearing his pink felt hat) and the dolphin freezing mid-listen, ears and head turned toward a faint tiny glowing note drifting back through the fog from the far distance. Their faces bloom with joy and relief. Breakthrough hopeful moment."}, {"text": "에코는 소리의 길을 읽었어요.\n“이쪽이야! 바위섬 쪽!”\n배가 물살을 갈랐죠. 슝—!", "prompt": "Dynamic wide shot of the dolphin racing ahead through the fog following a trail of faint echo notes, the rowboat with Reengki the quokka (wearing his pink felt hat) speeding behind it, lantern light streaking, water splitting at the bow. Urgent exciting rescue-dash mood."}, {"text": "안개 사이로 바위섬이 나타났어요.\n그 위에 소라가 오들오들!\n“소라야—!” “링키야—!”", "prompt": "Wide shot of a small rocky islet emerging from the parting fog, the young seal huddled shivering on top, brightening with joy as the lantern-lit boat with Reengki the quokka (wearing his pink felt hat) and the dolphin approaches. Emotional reunion mood, warm light piercing mist."}, {"text": "“파도에 떠밀려 여기까지 왔어…\n무서웠는데, 노래가 들려서\n하나도 안 외로웠어!”", "prompt": "Close-up of the young seal safely hugged against Reengki the quokka (wearing his pink felt hat) in the rowboat, tears of relief turning into a smile, the dolphin resting its head on the boat's edge tenderly. Soft warm lantern glow in the fog, tearful-happy comfort mood."}, {"text": "“자, 이제 돌아가자!”\n그런데 안개가 너무 짙어\n돌아갈 길이 보이지 않았어요.", "prompt": "Wide shot of the rowboat turned around in the fog, Reengki the quokka (wearing his pink felt hat) and the seal peering in every direction at the featureless white mist, the dolphin circling uncertainly. The lantern glow feels small in the vast whiteness. Gentle new-problem suspense mood."}, {"text": "바로 그때, 아득히 먼 곳에서\n라라라— 노랫소리가 들려왔어요.\n저건… 마을 친구들의 목소리?!", "prompt": "Medium shot of Reengki the quokka (wearing his pink felt hat), the seal, and the dolphin all turning toward a faint warm chorus of glowing notes drifting through the distant fog like a string of tiny lights. Their faces fill with wonder and hope. Magical cliffhanger mood."}]}, {"ep": 8, "title": "마을을 잇는 노랫길", "pages": [{"text": "그 시각, 부두에서는\n올리 아저씨의 지휘 아래\n온 마을이 노래하고 있었어요.", "prompt": "Wide heartwarming shot of the foggy pier where the octopus lighthouse keeper conducts with several arms like a maestro, while crabs, seals, and villagers sing together, a great chorus of glowing musical notes rising into the mist. Lanterns line the dock, community-united mood."}, {"text": "갈매기 삼총사는 하늘에 떠서\n노래를 릴레이로 전했어요.\n“끼룩— 이쪽으로! 끼룩—!”", "prompt": "Wide aerial-feel shot of three seagulls hovering at intervals through the fog above the sea, passing glowing musical notes from one to the next like a relay chain stretching from the harbor outward. Their wings glow softly in the diffused light. Clever teamwork mood."}, {"text": "“노랫소리를 따라가자!”\n에코가 앞장서고\n작은 배가 뒤를 따랐어요.", "prompt": "Medium shot of the dolphin leading the rowboat through the fog, following the trail of glowing relay notes overhead, Reengki the quokka (wearing his pink felt hat) rowing steadily with the young seal pointing ahead excitedly. The note-trail curves like a shining path, guided-journey mood."}, {"text": "링키도 힘차게 화답했어요.\n“아임 히어— We're coming!♪”\n노래와 노래가 손을 잡았죠.", "prompt": "Wide magical shot of two streams of glowing musical notes meeting in the middle of the foggy sea — one from the distant harbor chorus, one from Reengki the quokka (wearing his pink felt hat) singing in the boat — linking together like joined hands forming a bridge of light. Deeply symbolic beautiful mood."}, {"text": "주고받는 노래가 이어질수록\n반짝이는 노랫길이\n바다 위에 길게 그려졌어요.", "prompt": "Wide dreamy shot from above of a long luminous path of musical notes stretching across the foggy sea from the harbor to the small rowboat, the dolphin swimming along it. The fog begins to glow softly around the path. Enchanting fairytale visual, wonder-filled mood."}, {"text": "스르르— 신기하게도\n노랫길을 따라 안개가\n조금씩 걷히기 시작했어요.", "prompt": "Wide shot of the fog thinning and parting along the glowing musical path, patches of blue sky and sparkling water appearing, the rowboat with Reengki the quokka (wearing his pink felt hat) and the seal emerging into clearer light with the dolphin leaping ahead. Uplifting clearing-skies mood."}, {"text": "“배가 보인다! 소라다—!”\n부두에서 환호성이 터졌어요.\n와아아— 만세, 만세!", "prompt": "Wide celebratory shot of the harbor pier crowded with cheering friends waving paws, claws, and flippers as the little rowboat glides in, Reengki the quokka (wearing his pink felt hat) waving back, the young seal standing proudly at the bow, the dolphin leaping beside them. Confetti-like spray sparkles, triumphant joyful mood."}, {"text": "소라는 엄마 품에 폭 안겼어요.\n“고마워, 정말 고마워!”\n따뜻한 눈물이 반짝였죠.", "prompt": "Close-up of the young seal nuzzled deep in its mother's embrace on the dock, both with happy tears, while Reengki the quokka (wearing his pink felt hat) and the dolphin watch warmly from the side. Soft golden light breaking through the last mist, tender emotional reunion mood."}, {"text": "올리 아저씨가 말했어요.\n“말이 오가면 길이 생긴단다.\n오늘 너희가 그걸 보여 줬어.”", "prompt": "Medium shot of the octopus lighthouse keeper gently patting Reengki the quokka (wearing his pink felt hat) on the head with one arm and gesturing to the sea with another, where the last traces of the glowing note-path still shimmer. Villagers listen around them, wise warm mood in golden afternoon light."}, {"text": "안개가 걷힌 하늘엔 노을이 활짝.\n“내일은 드디어 축제날이야!”\n링키의 마음이 두근두근했답니다.", "prompt": "Wide sunset shot of the fully cleared harbor glowing under a brilliant orange-pink sky, festival ribbons and shell lanterns sparkling, Reengki the quokka (wearing his pink felt hat) standing on the pier with the dolphin surfacing beside him, both gazing at the festival stage being finished at the dock's end. Eve-of-celebration excited mood."}]}, {"ep": 9, "title": "반짝 항구 노래 축제", "pages": [{"text": "축제 날 아침이 밝았어요!\n항구는 리본과 조개 등불로\n반짝반짝 눈부셨죠.", "prompt": "Wide festive morning shot of the harbor village fully decorated: colorful ribbons between masts, strings of shell lanterns, flower garlands on boats, and a small wooden sign that reads 'SONG FESTIVAL'. Villagers bustle happily. Bright sparkling celebratory mood."}, {"text": "무대는 부두 끝!\n객석은 넓고 푸른 바다!\n물고기들도 뻐끔뻐끔 모여들었어요.", "prompt": "Wide shot of a charming driftwood stage built at the end of the pier facing the open sea, where dolphins, seals, and schools of colorful fish gather in the sparkling blue water like an audience. Seagulls perch on masts as balcony seats. Whimsical grand-venue mood, brilliant daylight."}, {"text": "무대 뒤에서 링키는\n콩닥콩닥, 다리가 후들후들.\n“잘할 수 있을까…?”", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat) peeking nervously from behind a stage curtain made of woven sailcloth, paws clasped, knees wobbling, a big crowd visible beyond. His face shows classic stage fright. Warm backstage light, sympathetic jittery mood."}, {"text": "에코가 물 위에서 속삭였어요.\n“기억해, 링키.\n즐겁게 말하면 진짜 네 노래가 돼!”", "prompt": "Medium shot of the dolphin raising its head from the water just beside the backstage edge of the pier, whispering warmly to nervous Reengki the quokka (wearing his pink felt hat), one small steady glowing note floating between them like a promise. Reassuring intimate pre-show moment."}, {"text": "링키는 크게 숨을 쉬고 외쳤어요.\n“헬로, 에브리원— Hello, everyone!”\n와아— 함성이 터졌어요!", "prompt": "Wide dynamic shot of Reengki the quokka (wearing his pink felt hat) bursting onto the driftwood stage with arms flung wide, greeting the sea of cheering animal spectators, big bright musical notes exploding above him like fireworks. Sunlight sparkles on the water audience, electrifying opening mood."}, {"text": "쏴아— 라라, 철썩— 라라!\n링키와 에코의 파도 듀엣에\n갈매기 코러스가 어우러졌어요.", "prompt": "Wide musical shot of Reengki the quokka (wearing his pink felt hat) singing on stage while the dolphin arcs gracefully out of the water beside the pier in perfect rhythm, three seagulls singing chorus in the air above, all their glowing notes weaving into one flowing melody over the waves. Harmonious spectacular performance mood."}, {"text": "에코의 가족들도 뛰어올랐어요!\n슝— 슝— 물보라 사이로\n무지개가 아치를 그렸죠.", "prompt": "Spectacular wide shot of a whole pod of dolphins leaping in synchronized arcs behind the stage, their sparkling spray forming a shimmering rainbow over the sea, while Reengki the quokka (wearing his pink felt hat) sings at the front. Audience animals cheer wildly, breathtaking climax visual."}, {"text": "“레츠 씽 투게더— Let's sing together!”\n링키의 외침에 모두가\n한목소리로 노래했어요.", "prompt": "Wide emotional shot of the entire harbor singing together — villagers on the pier, seals and fish in the water, seagulls in the sky — every voice adding glowing notes that swirl into one great spiral of light above the festival, with Reengki the quokka (wearing his pink felt hat) leading joyfully from the stage. Overwhelming unity and joy."}, {"text": "신기했어요. 영어 노래가\n술술— 마음에서 흘러나왔죠.\n노래가 진짜 링키의 말이 된 거예요.", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat) mid-song with eyes closed in bliss, completely at ease, warm golden notes flowing effortlessly from him like a gentle stream of light. Soft glowing bokeh of lanterns and spray behind him. Deeply fulfilled transformative moment."}, {"text": "별빛 아래 피날레가 끝나자\n에코가 살짝 귓속말을 했어요.\n“링키, 내일 아침… 줄 게 있어.”", "prompt": "Night wide shot of the festival finale under a sky full of stars, shell lanterns glowing, the crowd applauding, while at the stage edge the dolphin whispers secretively to Reengki the quokka (wearing his pink felt hat), whose eyes widen with curiosity. Magical starlit night, intriguing gentle cliffhanger mood."}]}, {"ep": 10, "title": "열 번째 구슬, E", "pages": [{"text": "다음 날 아침, 바다는\n거울처럼 잔잔하고 반짝였어요.\n링키는 부두 끝에서 기다렸죠.", "prompt": "Serene wide morning shot of a mirror-calm sparkling sea under soft golden light, Reengki the quokka (wearing his pink felt hat) waiting at the end of the quiet pier, festival decorations still fluttering gently. Peaceful expectant morning-after mood."}, {"text": "퐁— 에코가 나타났어요.\n입에는 커다란 진주조개가\n소중히 물려 있었죠.", "prompt": "Medium shot of the dolphin surfacing gracefully before the pier, carefully holding a large beautiful pearl oyster shell in its mouth, water droplets glittering on the shell. Reengki the quokka (wearing his pink felt hat) kneels at the pier edge, breath held. Reverent gift-giving moment, soft morning glow."}, {"text": "조개가 스르르 열리자, 반짝—!\n알파벳 구슬 E가\n아침 햇살에 눈부시게 빛났어요.", "prompt": "Dramatic close-up of the pearl oyster opening on the pier to reveal a radiant glowing bead engraved with the letter 'E', beams of morning light bursting from it. Reengki the quokka (wearing his pink felt hat) and the dolphin lean in, faces lit by its glow, awe-struck wonder mood."}, {"text": "“이건 대화의 구슬 E야.\n즐겁게 말하는 너의 마음이\n이 구슬의 주인이 됐어.”", "prompt": "Warm medium two-shot of the dolphin gently nudging the glowing letter-E bead toward Reengki the quokka (wearing his pink felt hat), who receives it with both paws cupped like a treasure, eyes shimmering with emotion. Soft golden light wrapping both friends, heartfelt ceremonial mood."}, {"text": "주머니 속 구슬이 열 개!\n짤랑짤랑— 구슬들이\n축하 노래를 부르는 것 같았어요.", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat) holding open his small pouch where ten alphabet beads sparkle together like a tiny constellation, each glowing a different soft color. His face beams with pride and gratitude. Twinkling magical celebratory mood."}, {"text": "친구들이 배웅을 나왔어요.\n소라는 소라고둥 나팔을,\n올리 아저씨는 바닷길 지도를 주었죠.", "prompt": "Wide farewell shot on the pier with all the friends gathered: the young seal presenting a spiral conch shell horn, the octopus keeper handing over a rolled sea-route map, the crab and seagulls crowding around Reengki the quokka (wearing his pink felt hat). Warm bittersweet gift-giving mood, gentle morning light."}, {"text": "“씨 유 어게인— See you again!”\n링키가 또렷하고 즐겁게 외치자\n모두가 활짝 웃었어요.", "prompt": "Medium shot of Reengki the quokka (wearing his pink felt hat) waving with his whole arm and calling out a bright clear farewell, bold glowing musical notes rising from him, while the circle of friends laughs and waves back warmly. Sunlit pier, joyful heartfelt goodbye mood."}, {"text": "링키는 작은 돛단배에 올랐어요.\n바람이 살랑— 돛을 밀자\n배가 스르르 미끄러졌죠.", "prompt": "Wide shot of Reengki the quokka (wearing his pink felt hat) standing at the bow of a small sailboat with a cream-colored sail, the wind gently filling it as the boat glides away from the sparkling harbor. Friends wave from the shrinking pier behind. Adventurous departure mood, brilliant blue sea."}, {"text": "에코의 가족이 항구 밖까지\n슝— 슝— 뛰어오르며 배웅했어요.\n“고마워! 잊지 않을게!”", "prompt": "Dynamic wide shot of the dolphin pod escorting the little sailboat beyond the harbor mouth, leaping in joyful arcs on both sides of the boat, spray sparkling like scattered diamonds. Reengki the quokka (wearing his pink felt hat) waves from the deck, laughing with tears in his eyes. Grand moving farewell escort mood."}, {"text": "“다음은 코끼리 마을이래!”\n열 개의 구슬이 반짝이는 바다 위,\n링키의 새로운 노래가 시작됐답니다.", "prompt": "Wide hopeful shot of the small sailboat sailing toward the bright horizon where a distant green coastline hints at a new land, Reengki the quokka (wearing his pink felt hat) at the bow gazing forward with a determined smile, his pouch of ten beads glowing softly at his side. Vast sparkling ocean, open-ended adventurous ending mood."}]}]}, "11": {"chapter": 11, "animal": "코끼리", "animal_en": "elephant", "letter": "E", "village": "메모리 마을", "episodes": [{"ep": 1, "title": "책 향기 나는 마을", "pages": [{"text": "링키의 가방 속에서 구슬 열 개가\n반짝반짝 빛나고 있었어요.\n\"다음 마을은 어떤 곳일까?\"", "prompt": "Wide shot of Reengki the quokka (wearing his pink felt hat) walking along a sunny country path with a small travel bag open at his side. Ten glowing alphabet beads sparkle inside the bag with soft golden light. Rolling green hills and a warm morning sky stretch behind him. His expression is bright and curious as he looks toward the horizon."}, {"text": "언덕을 넘자 어마어마하게 큰\n바오밥 나무가 우뚝 서 있었어요.\n나무에는 창문이 송송 나 있었죠.", "prompt": "Wide establishing shot of an enormous ancient baobab tree standing in the middle of a cozy village, its thick trunk dotted with many round windows glowing warmly. Reengki the quokka (wearing his pink felt hat) stands small on a hilltop in the foreground, gazing up in awe. Little cottages with book-shaped rooftops surround the great tree. Soft afternoon light and drifting clouds."}, {"text": "그런데 바람이 휘잉— 불더니\n하얀 종이들이 팔랑팔랑\n하늘로 날아올랐어요.", "prompt": "Medium shot of white paper pages swirling and fluttering high into the air on a gust of wind above a village lane. Reengki the quokka (wearing his pink felt hat) looks up startled, one paw holding his hat down. The giant baobab tree looms in the background. Dynamic breezy atmosphere with leaves and papers dancing in the sky."}, {"text": "\"어어, 내 책 페이지들!\"\n아기 코끼리가 긴 코를 뻗어\n종이를 잡으려 폴짝폴짝 뛰었어요.", "prompt": "Medium shot of a cute young elephant hopping and stretching her long trunk upward, trying to catch fluttering white pages in the wind. Her big ears flap and her eyes are wide with worry. A dropped stack of books lies at her feet on the cobblestone path. Reengki the quokka (wearing his pink felt hat) watches from the side, about to jump in and help."}, {"text": "링키가 슝— 높이 뛰어올라\n종이를 착착 잡아 주었어요.\n\"자, 여기 있어!\"", "prompt": "Action shot of Reengki the quokka (wearing his pink felt hat) leaping high into the air, catching several white pages in his small paws. The young elephant below reaches up with her trunk, mouth open in delighted surprise. Papers swirl around them against a bright blue sky. Joyful, energetic mood."}, {"text": "\"고마워! 나는 엘리야.\"\n\"나는 링키! 만나서 반가워!\"\n둘은 씽긋 웃었어요.", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat) handing a neat stack of rescued pages to a young elephant, who curls her trunk happily around them. Both are smiling warmly at each other on a cobblestone village path. Warm golden afternoon light, gentle and friendly atmosphere."}, {"text": "\"여기는 메모리 마을이야.\n코끼리들이 마을의 모든 기억을\n기록하며 사는 곳이지.\"", "prompt": "Wide shot of the young elephant proudly gesturing with her trunk toward her village as she walks beside Reengki the quokka (wearing his pink felt hat). Elephants of various sizes carry books and scrolls with their trunks along the lanes. A wooden sign by the path reads 'MEMORY VILLAGE'. Cozy storybook village atmosphere with the baobab tree in the distance."}, {"text": "집집마다 담벼락에 그림 일기가\n빼곡히 그려져 있었어요.\n마을 전체가 커다란 책 같았죠.", "prompt": "Medium shot of Reengki the quokka (wearing his pink felt hat) and the young elephant strolling past cottage walls covered in charming painted picture-diaries of village life — suns, stars, harvests, and dancing elephants. Reengki touches a wall drawing with wonder. Warm colors, whimsical detailed village scene."}, {"text": "\"우리 마을 도서관 구경할래?\n저 바오밥 나무가 통째로\n도서관이거든!\"", "prompt": "Wide shot of the young elephant pointing her trunk excitedly toward the giant baobab tree library while Reengki the quokka (wearing his pink felt hat) claps his paws in excitement. The tree's round windows glow warmly in the late afternoon light. A winding path leads from the two friends to the tree's big arched wooden door."}, {"text": "삐그덕— 커다란 나무 문이 열리자\n안에서 무언가 반짝, 빛났어요.\n과연 그 빛의 정체는 무엇일까요?", "prompt": "Dramatic shot from behind Reengki the quokka (wearing his pink felt hat) and the young elephant as a huge arched wooden door of the baobab library slowly creaks open. A mysterious warm sparkle of light glows from deep inside the dark interior. Their silhouettes stand at the threshold, full of anticipation. Magical, inviting atmosphere."}]}, {"ep": 2, "title": "바오밥 큰 도서관", "pages": [{"text": "도서관 안은 놀라움 그 자체였어요.\n나선 계단을 따라 책장이\n하늘까지 빙글빙글 이어졌죠.", "prompt": "Breathtaking wide interior shot of the baobab library — a spiral staircase winding up the inside of the hollow tree trunk, lined with endless bookshelves reaching toward a skylight far above. Reengki the quokka (wearing his pink felt hat) stands at the bottom, tiny, head tilted all the way back in awe. The young elephant smiles beside him. Warm lantern light and floating dus
