 The little green lizard grins as he keeps the beat. Bright, harmonious mood."}, {"text": "지나가던 마을 친구들이\n하나둘 모여들었어요.\n“와, 노래가 참 좋다!”", "prompt": "Wide shot of the plaza as various friendly island animals, small lizards, round birds and a family of mice, gather around the stage where Reengki the quokka (wearing his pink felt hat) performs. Everyone's faces are delighted. Sunny community gathering mood with lanterns overhead."}, {"text": "노래는 점점 매끄러워졌어요.\n시냇물이 흐르듯 술술,\n열 곡이 하나로 이어졌죠.", "prompt": "Medium shot of Reengki the quokka (wearing his pink felt hat) singing with flowing ease, a long ribbon of connected musical notes streaming smoothly around the stage like a gentle river of light. The audience sways along. Fluid, graceful, accomplished mood."}, {"text": "링키는 친구들에게 외쳤어요.\n“다 같이! Let's sing!”\n“Let's sing!” 광장이 울렸죠.", "prompt": "Joyful wide shot of Reengki the quokka (wearing his pink felt hat) with arms spread wide on the stage as the whole crowd of island animals sings back, mouths open happily, lanterns bobbing. Sparkling notes rise above the plaza. Big warm sing-along energy."}, {"text": "함께 부르니 노래가\n두 배, 세 배로 커졌어요.\n등불도 신나서 반짝반짝!", "prompt": "Wide shot of the plaza glowing brighter as everyone sings together, the orange lanterns pulsing with light in rhythm. Reengki the quokka (wearing his pink felt hat) laughs with pure joy at the center. Festive, radiant late-afternoon mood."}, {"text": "“축제까지 앞으로 사흘!”\n도도가 달력을 가리켰어요.\n마을은 설렘으로 가득했죠.", "prompt": "Medium shot of the little green lizard pointing at a cute wooden calendar board with three suns marked on it, while Reengki the quokka (wearing his pink felt hat) nods with determination. Villagers hang extra lanterns in the background. Bustling, excited preparation mood."}, {"text": "하늘 높이 피오가 날아와\n노래를 가만히 들었어요.\n깃털이 기쁨으로 일렁였죠.", "prompt": "Wide low-angle shot of the phoenix circling gracefully above the plaza, golden feathers trailing soft light, listening to the music below. Reengki the quokka (wearing his pink felt hat) waves up from the stage. Warm sunset sky, serene joyful mood."}, {"text": "그런데 링키는 보았어요.\n피오의 깃털 끝 불빛이\n아주 조금 흐려진 것을요.", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat) looking up with a small worried tilt of his head, noticing the phoenix's wingtip feathers glowing dimmer, like embers softening. The sunset behind is still warm and beautiful. Subtle, gentle concern amid beauty."}, {"text": "‘피오 님, 괜찮으신 걸까?’\n링키의 마음에 작은 물음표가\n동동 떠올랐어요.", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat) at dusk, paw on his chin, gazing thoughtfully toward the glowing nest on the volcano summit, a soft question mark of lantern light reflected in his big eyes. Quiet, wondering cliffhanger mood."}]}, {"ep": 6, "title": "피오의 비밀", "pages": [{"text": "링키는 둥지를 찾아갔어요.\n“피오 님, 깃털 불빛이\n흐려진 것 같아서요…”", "prompt": "Medium shot of Reengki the quokka (wearing his pink felt hat) standing at the nest's edge in soft evening light, speaking gently with concerned eyes. The phoenix rests on its ash bed, feathers glowing a calmer, softer gold. Tender, caring visit mood."}, {"text": "피오는 부드럽게 웃었어요.\n“걱정 말렴. 나는 곧\n‘다시 태어나는 잠’을 잔단다.”", "prompt": "Close-up of the phoenix smiling warmly and reassuringly at Reengki the quokka (wearing his pink felt hat), wing gently touching his shoulder. Its eyes are peaceful and kind, feathers dimmed to a cozy candle-glow. Calm, comforting atmosphere."}, {"text": "“백 년에 한 번, 나는 재의 이불을\n덮고 포근히 잠들어. 그리고\n아침놀과 함께 새로 태어나지.”", "prompt": "Dreamy medium shot of the phoenix telling its story as glowing light above the nest forms a gentle scene: a sleeping bird tucked under a soft silver ash blanket, then a sunrise. Reengki the quokka (wearing his pink felt hat) watches, reassured. Magical bedtime-story mood, warm and safe."}, {"text": "“무서운 게 아니야, 링키.\n끝이 아니라 새로운 시작이거든.\n아침이 오는 것처럼 말이야.”", "prompt": "Close-up of the phoenix and Reengki the quokka (wearing his pink felt hat) looking together toward the horizon where the evening star rises over a calm sea. The phoenix's wing wraps softly around Reengki. Peaceful, philosophical, hopeful mood."}, {"text": "“다만 한 가지…\n내가 잠든 밤에는 섬의 등불이\n깜빡깜빡 흐려진단다.”", "prompt": "Wide shot from the nest looking down at the twinkling lantern village at night, a few lanterns flickering softly. The phoenix gestures toward them with its wing as Reengki the quokka (wearing his pink felt hat) looks down attentively. Quiet night, gentle foreshadowing mood."}, {"text": "“섬의 등불은 노래로 켜지거든.\n지금까지는 내 노래가\n등불을 지켜왔단다.”", "prompt": "Medium shot of the phoenix singing one soft note, and a nearby lantern on the nest's edge glowing brighter in response, casting warm light on amazed Reengki the quokka (wearing his pink felt hat). Intimate demonstration of gentle magic, warm glow against night sky."}, {"text": "피오가 링키를 바라봤어요.\n“내가 잠든 밤, 네 노래가\n등불을 지켜줄 수 있겠니?”", "prompt": "Close-up of the phoenix looking earnestly into the eyes of Reengki the quokka (wearing his pink felt hat), asking its important question. Reengki's eyes reflect the golden feather-light, surprised and moved. Solemn but warm trust-passing moment."}, {"text": "링키의 가슴이 두근두근.\n떨렸지만, 링키는\n고개를 힘차게 끄덕였어요.", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat) nodding firmly with brave, glistening eyes, both paws squeezed into determined little fists. The phoenix's soft glow lights his resolute face. Courageous, touching moment."}, {"text": "“I promise! 약속할게요!”\n피오는 깃털 하나를 뽑아\n링키의 모자에 꽂아 주었어요.", "prompt": "Medium shot of the phoenix gently placing one small glowing golden feather into the band of Reengki the quokka's pink felt hat, next to its leaf. Reengki stands proudly still, eyes shining. Ceremony-like tender moment under the stars."}, {"text": "그날 밤, 바람이 속삭였어요.\n‘다시 태어나는 밤’이\n성큼성큼 다가오고 있었죠.", "prompt": "Wide atmospheric shot of the volcanic island at night, warm wind visibly swirling soft glowing sparks through the sky between the nest and the village. Reengki the quokka (wearing his pink felt hat with the new golden feather) walks home along the lantern path. Mysterious, gentle anticipation."}]}, {"ep": 7, "title": "어두워진 마을", "pages": [{"text": "축제 전날 밤이 되었어요.\n피오는 재의 이불을 덮고\n포근히 잠들었답니다.", "prompt": "Tender wide shot of the phoenix curling up in its great nest, tucking itself under a soft blanket of pale silver ash like a cozy quilt, eyes closing peacefully with a faint smile. Gentle moonlight and a few drifting sparks. Sleepy, safe, lullaby mood, not sad."}, {"text": "그러자 마을의 등불이\n하나둘 깜빡… 깜빡…\n빛이 점점 흐려졌어요.", "prompt": "Wide shot of the hillside village at night as the orange lanterns dim one by one, their glow fading to faint embers. Villagers peek out of round doorways looking puzzled. Deep blue night settling over the island, hushed suspenseful but soft mood."}, {"text": "친구들이 광장에 모였어요.\n“등불이 꺼지면 축제는 어쩌지?”\n걱정이 소곤소곤 번졌죠.", "prompt": "Medium shot of worried island animals, lizards, round birds, mice, huddled together in the dim plaza, whispering with anxious faces under barely glowing lanterns. The empty stage waits in the middle. Muted blue night tones with faint warm embers."}, {"text": "링키가 무대에 올라섰어요.\n“내가 노래로 등불을 지킬게!”\n첫 소절이 울려 퍼졌어요.", "prompt": "Medium shot of Reengki the quokka (wearing his pink felt hat with the golden feather) stepping bravely onto the dim stage, taking a deep breath and beginning to sing, one paw over his heart. A nearby lantern flickers slightly brighter. Courageous, pivotal night-scene mood."}, {"text": "그때 바람이 휘잉— 불었어요.\n링키가 발을 헛디뎌\n꽈당! 넘어지고 말았죠.", "prompt": "Dynamic medium shot of a gust of wind sweeping across the stage, Reengki the quokka (wearing his pink felt hat) slipping and tumbling down onto the stage floor, hat tilting, small dizzy stars above his head. Lanterns flicker low. Dramatic but gentle stumble moment."}, {"text": "등불이 사르르 잦아들고\n링키의 눈에 눈물이 글썽.\n‘역시 나는 안 되는 걸까…’", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat) sitting on the dark stage floor, ears drooped, big teary eyes catching the last faint ember light. The plaza around him is nearly dark and silent. Poignant low point, soft and tender, not frightening."}, {"text": "그때 모자의 깃털이 반짝!\n피오의 목소리가 떠올랐어요.\n‘넘어져도 다시 일어나면 돼.’", "prompt": "Close-up of the small golden feather on Reengki the quokka's pink felt hat glowing warmly in the darkness, casting soft light on his tear-streaked but awakening face. A faint warm shimmer like a remembered voice surrounds him. Hopeful turning-point mood."}, {"text": "링키는 눈물을 쓱 닦았어요.\n“Try again! 다시 한 번!”\n링키가 벌떡 일어났죠.", "prompt": "Medium shot of Reengki the quokka (wearing his pink felt hat with the glowing golden feather) springing back up to his feet on the dark stage, wiping his eyes with one paw, chin lifted with new determination. The feather's glow lights his brave expression. Triumphant rise moment."}, {"text": "링키는 다시 첫 소절을 불렀어요.\n작지만 또렷한 목소리가\n어두운 광장에 번져 갔어요.", "prompt": "Medium shot of Reengki the quokka (wearing his pink felt hat) singing steadily into the dark plaza, a single thread of soft golden musical light flowing from him across the crowd of watching animals. Their faces begin to lift with hope. Quiet powerful resolve."}, {"text": "깜빡이던 등불 하나가\n숨을 쉬듯 파르르 떨렸어요.\n등불은 다시 켜질 수 있을까요?", "prompt": "Close-up of one dim lantern beginning to tremble with a tiny reviving flame inside, reflected in the hopeful eyes of Reengki the quokka (wearing his pink felt hat) singing nearby. Darkness all around except this fragile spark. Breath-holding cliffhanger mood."}]}, {"ep": 8, "title": "다시 켜진 불빛", "pages": [{"text": "도도가 무대로 뛰어올라\n링키 곁에서 함께 불렀어요.\n불티새들도 포로롱 모여들었죠.", "prompt": "Medium shot of the little green lizard hopping onto the stage to sing beside Reengki the quokka (wearing his pink felt hat), while tiny glowing ember birds land in a row around them adding their chirps. Their combined glow pushes back the darkness. Solidarity, friendship warmth."}, {"text": "“Let's sing!” 링키가 외치자\n마을 친구들 모두가\n한목소리로 노래를 보탰어요.", "prompt": "Wide shot of the whole plaza of island animals joining the song, mouths open together, paws and wings raised, as Reengki the quokka (wearing his pink felt hat) leads from the stage. Streams of soft golden musical light weave between everyone. Rising chorus of hope in the night."}, {"text": "그러자 등불 하나가 반짝!\n건너편 등불도 반짝!\n빛이 통통 튀며 번져 갔어요.", "prompt": "Joyful wide shot of lanterns relighting one after another across the plaza like popping sparks of warm orange, the light hopping from pole to pole. Animals cheer mid-song as Reengki the quokka (wearing his pink felt hat) sings brighter. Cascading light, celebratory momentum."}, {"text": "링키의 주머니 속에서도\n열네 개 구슬이 화답하듯\n무지개빛으로 빛났어요.", "prompt": "Close-up of Reengki the quokka's pouch glowing open at his side, fourteen marbles shining in rainbow colors, casting colorful sparkles up onto his singing face (he wears his pink felt hat). Lantern light warm in the background. Magical resonance moment."}, {"text": "노래는 파도처럼 넘실넘실\n골목골목 흘러갔어요.\n온 마을이 함께 출렁였죠.", "prompt": "Wide aerial-style shot of the hillside village at night with visible waves of soft golden song-light rolling through the winding lanes, lanterns lighting up along each wave. Tiny figures of singing animals fill the plaza below. Sweeping, musical, warm spectacle."}, {"text": "마침내 온 마을의 등불이\n환하게 활짝 피어났어요.\n별밭보다 눈부신 밤이었죠.", "prompt": "Grand wide shot of the entire village fully lit, hundreds of orange lanterns blazing warmly against the deep night, brighter than the stars above. Reengki the quokka (wearing his pink felt hat) stands on the stage, arms wide, glowing with joy. Breathtaking festival-of-light scene."}, {"text": "화산 꼭대기 재의 이불도\n노랫소리에 사르르 데워져\n금빛으로 은은히 물들었어요.", "prompt": "Medium shot of the phoenix's nest on the summit, the blanket of silver ash slowly warming into a gentle golden shimmer as threads of song-light drift up from the village below. The sleeping shape under the ash glows faintly. Tender, magical warmth rising."}, {"text": "친구들은 밤새 노래했어요.\n랄랄라, 랄랄라…\n어느새 하늘 끝이 발그레해졌죠.", "prompt": "Wide shot of t const selCh = document.getElementById('selCh');
const selEp = document.getElementById('selEp');
let cur = 0, pages = [];

const chKeys = Object.keys(DATA);
for (const k of chKeys) {
  const o = document.createElement('option');
  o.value = k;
  o.textContent = k === '0' ? '프롤로그' : `챕터 ${k}. ${DATA[k].village} (${DATA[k].animal})`;
  selCh.appendChild(o);
}

function onChapter() {
  const ch = DATA[selCh.value];
  selEp.innerHTML = '';
  selEp.style.display = selCh.value === '0' ? 'none' : '';
  if (selCh.value !== '0') {
    ch.episodes.forEach((e, i) => {
      const o = document.createElement('option');
      o.value = i;
      o.textContent = `에피소드 ${e.ep}. ${e.title}`;
      selEp.appendChild(o);
    });
  }
  onEpisode();
}

function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function fmt(t){
  return esc(t).split('\n')
    .map(l => l.replace(/([“‘][^”’]*[”’]|"[^"]*")/g, '<span class="q">$1</span>'))
    .join('<br>');
}

function onEpisode() {
  const chKey = selCh.value;
  const ch = DATA[chKey];
  const book = document.getElementById('book');
  const isPro = chKey === '0';
  const ep = isPro ? null : ch.episodes[+selEp.value];
  const pgs = isPro ? ch.pages : ep.pages;
  const dir = isPro ? 'img/prologue' : `img/chapter${chKey}/episode${ep.ep}`;
  const genKey = isPro ? '0' : `${chKey}/${ep.ep}`;
  document.getElementById('epTitle').textContent =
    isPro ? (ch.title || 'K-POP 스타를 꿈꾸는 쿼카') : '';
  if (!GEN[genKey]) {
    book.innerHTML = '<div class="missing">🎨 이 에피소드의 그림은 아직 생성 전이에요.<br>' +
      '크레딧 충전 후 이어서 생성하면 이 자리에 채워집니다.<br>(글은 완성되어 있어요)</div>';
    pages = []; renderNav(); return;
  }
  book.innerHTML = pgs.map((p, i) =>
    `<section class="page"><span class="pageno">${i+1} / ${pgs.length}</span>` +
    `<img loading="lazy" src="${dir}/${i+1}.jpg?v=${IMG_VER}" alt="장면 ${i+1}">` +
    `<div class="txt">${fmt(p.text)}</div></section>`).join('');
  pages = [...book.querySelectorAll('.page')];
  cur = 0; show();
}

function renderNav() {
  const dots = document.getElementById('dots');
  dots.innerHTML = '';
  pages.forEach((_, i) => {
    const d = document.createElement('i');
    if (i === cur) d.classList.add('on');
    dots.appendChild(d);
  });
  document.getElementById('prev').disabled = cur <= 0 || !pages.length;
  document.getElementById('next').disabled = cur >= pages.length - 1 || !pages.length;
}
function show() {
  pages.forEach((p, i) => p.classList.toggle('on', i === cur));
  renderNav();
  window.scrollTo({top: 0, behavior: 'smooth'});
}
function move(d) {
  if (!pages.length) return;
  cur = Math.max(0, Math.min(pages.length - 1, cur + d));
  show();
}
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') move(1);
  if (e.key === 'ArrowLeft') move(-1);
});
onChapter();
</script>
