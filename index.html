t motes."}, {"text": "반짝— 조그만 불빛이 다가왔어요.\n\"안녕! 나는 반디! 도서관의\n책장을 밝히는 반딧불이야.\"", "prompt": "Close-up of a tiny glowing firefly hovering in front of Reengki the quokka (wearing his pink felt hat), its warm yellow light illuminating his surprised, delighted face. The young elephant watches with a smile. Dark cozy bookshelves form a soft background, and the firefly's glow casts gentle light on the book spines."}, {"text": "계단 위에서 커다란 코끼리\n할아버지가 내려왔어요.\n\"허허, 손님이 오셨구나.\"", "prompt": "Medium shot of a big old elephant with kind wrinkled eyes and round spectacles slowly walking down the spiral staircase of the library, a scroll tucked in his curled trunk. Reengki the quokka (wearing his pink felt hat) and the young elephant look up at him respectfully from below. Warm, gentle lighting from lanterns on the shelves."}, {"text": "\"코고 할아버지는 마을에서\n가장 오래된 기억지기예요.\"\n엘리가 자랑스럽게 소개했어요.", "prompt": "Warm group shot of the young elephant proudly introducing the old elephant elder to Reengki the quokka (wearing his pink felt hat) in the library hall. The elder bows his great head kindly toward the small quokka. The firefly hovers above them like a little lamp. Shelves of ancient books surround the scene."}, {"text": "\"만나서 반가워요는 영어로\nNice to meet you! 란다.\"\n\"나이스 투 미츄!\" 링키가 따라 했어요.", "prompt": "Close-up of the old elephant gently teaching Reengki the quokka (wearing his pink felt hat), who repeats after him with sparkling eyes and raised paws. The young elephant giggles beside them. Cozy library interior with warm lantern light, a cheerful learning moment."}, {"text": "\"코끼리는 한번 본 것을\n좀처럼 잊지 않는단다.\n그래서 기억을 지키는 일을 하지.\"", "prompt": "Medium shot of the old elephant proudly gesturing with his trunk toward towering shelves filled with journals, scrolls, and picture books. Reengki the quokka (wearing his pink felt hat) listens closely, sitting on a small wooden stool. The firefly lights up an open ancient book nearby. Dignified, warm storybook atmosphere."}, {"text": "할아버지는 도서관 깊은 곳의\n작은 문을 보여 주었어요.\n\"저곳은 '기억의 방'이란다.\"", "prompt": "Atmospheric shot of a small carved wooden door glowing faintly at the end of a quiet corridor deep inside the baobab library, decorated with elephant patterns. The old elephant points his trunk toward it while Reengki the quokka (wearing his pink felt hat) and the young elephant peek curiously from behind him. Mysterious soft golden light seeps from under the door."}, {"text": "\"가장 소중한 기록과 함께\n알파벳 구슬 E가 잠들어 있지.\n지혜를 아는 친구에게 전해진단다.\"", "prompt": "Close-up through the slightly open carved door revealing a glowing alphabet bead resting on a velvet cushion among ancient books and scrolls, shining with warm golden light. Reengki the quokka (wearing his pink felt hat) gazes at it with wide, sparkling eyes from the doorway. Magical treasure-room atmosphere."}, {"text": "'지혜를 아는 친구라니…'\n링키는 콩닥콩닥 뛰는 가슴으로\n꼭 배우겠다고 다짐했어요.", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat) pressing both paws to his chest with a determined, hopeful expression, eyes shining. Bookshelves glow softly behind him in the lantern light. The young elephant and the firefly smile at him encouragingly. Warm inspiring moment."}, {"text": "그때 할아버지가 고개를 갸웃했어요.\n\"음? 내가 뭘 잊은 것 같은데…\"\n무슨 일이 생기려는 걸까요?", "prompt": "Medium shot of the old elephant pausing on the library staircase, tilting his head with a puzzled expression, one trunk-tip touching his temple. Reengki the quokka (wearing his pink felt hat) and the young elephant exchange curious glances below. A slightly mysterious mood settles over the warm library, with the firefly's light flickering."}]}, {"ep": 3, "title": "기억의 밤 축제", "pages": [{"text": "다음 날, 마을 광장이\n북적북적 시끌시끌했어요.\n모두 축제 준비에 바빴거든요.", "prompt": "Lively wide shot of a village square bustling with elephants hanging paper lanterns, carrying garlands with their trunks, and setting up a small wooden stage. Reengki the quokka (wearing his pink felt hat) and the young elephant walk into the busy scene. Bright morning light, festive cheerful colors."}, {"text": "\"곧 '기억의 밤' 축제야!\n코고 할아버지가 마을의 첫 이야기를\n들려주시는 특별한 밤이지.\"", "prompt": "Medium shot of the young elephant explaining excitedly to Reengki the quokka (wearing his pink felt hat), gesturing toward the wooden stage where a large storyteller's chair is being decorated with flowers. Lanterns and bunting hang above the square. Warm, anticipatory festival atmosphere."}, {"text": "무대 위에서 할아버지가\n이야기 연습을 시작했어요.\n\"아주 먼 옛날, 첫 코끼리들이…\"", "prompt": "Medium shot of the old elephant standing on the small wooden stage, rehearsing with an open ancient storybook resting on a stand, speaking with gentle grandeur. Reengki the quokka (wearing his pink felt hat), the young elephant, and a few village elephants listen from below. Soft daylight over the festive square."}, {"text": "그런데 이야기가 뚝, 멈췄어요.\n\"그 다음이… 그 다음이\n도무지 기억나지 않는구나.\"", "prompt": "Close-up of the old elephant frozen mid-sentence on stage, his eyes clouded with confusion, trunk hovering over the open book. His spectacles slip slightly down. Reengki the quokka (wearing his pink felt hat) and the young elephant look up with concerned expressions. The festive bunting sways quietly in the background."}, {"text": "책을 살펴보니, 이럴 수가!\n한가운데 페이지들이\n찢겨 사라지고 없었어요.", "prompt": "Dramatic close-up of the ancient storybook lying open, showing ragged torn edges where the middle pages are missing. The old elephant's trunk-tip and the small paws of Reengki the quokka (wearing his pink felt hat) touch the torn gap. The young elephant gasps beside them. Moody but soft lighting emphasizing the empty gap in the book."}, {"text": "\"첫 이야기가 사라졌대!\"\n소식을 들은 마을이\n술렁술렁 걱정에 잠겼어요.", "prompt": "Wide shot of village elephants gathered in the square murmuring to each other with worried faces, ears drooping, trunks lowered. Paper lanterns hang half-finished above them. Reengki the quokka (wearing his pink felt hat) stands among the crowd looking around at the anxious villagers. Overcast soft light matching the worried mood."}, {"text": "엘리는 시무룩 고개를 숙였어요.\n\"첫 이야기가 없으면\n기억의 밤도 열 수 없어…\"", "prompt": "Close-up of the young elephant sitting sadly on the edge of the stage, ears drooping, trunk curled limply on the floor. Reengki the quokka (wearing his pink felt hat) sits beside her, gently placing a paw on her trunk. Muted evening colors, tender and quiet mood."}, {"text": "링키가 벌떡 일어났어요.\n\"우리가 잃어버린 이야기를\n찾아보자! 분명 방법이 있을 거야!\"", "prompt": "Dynamic close-up of Reengki the quokka (wearing his pink felt hat) springing to his feet with one paw raised high, eyes blazing with determination. The young elephant lifts her head, hope returning to her eyes. The firefly zooms in a bright little loop above them. Uplifting warm light breaking through."}, {"text": "\"그래! 도서관 어딘가에\n단서가 남아 있을지도 몰라!\"\n셋은 힘차게 발을 굴렀어요.", "prompt": "Medium shot of Reengki the quokka (wearing his pink felt hat), the young elephant, and the tiny firefly stacking paw, trunk, and glowing light together in a team huddle, all smiling with determination. The baobab library rises in the background against the sunset. Energetic, hopeful team-spirit moment."}, {"text": "과연 세 친구는 사라진\n첫 이야기를 찾을 수 있을까요?\n모험이 시작되었어요!", "prompt": "Wide shot of Reengki the quokka (wearing his pink felt hat), the young elephant, and the firefly marching bravely toward the giant baobab library under an orange sunset sky, long shadows stretching behind them. The library's windows glow invitingly. Adventurous storybook composition full of promise."}]}, {"ep": 4, "title": "링키의 깜빡깜빡", "pages": [{"text": "링키에게 좋은 생각이 떠올랐어요.\n\"남은 이야기를 노래로 만들면\n모두가 오래 기억할 수 있어!\"", "prompt": "Bright close-up of Reengki the quokka (wearing his pink felt hat) with a lightbulb-moment expression, paws spread wide, musical notes floating playfully around his head. The young elephant claps her ears together happily. Cozy library reading nook with cushions and books in the background."}, {"text": "링키는 이야기 첫 부분을\n열심히 외우기 시작했어요.\n\"먼 옛날, 첫 코끼리들이… 어라?\"", "prompt": "Medium shot of Reengki the quokka (wearing his pink felt hat) pacing on a round rug in the library, eyes squeezed shut in concentration, reciting from memory. The ancient storybook lies open on a low table beside him. The firefly hovers overhead like a study lamp. Warm focused study atmosphere."}, {"text": "자꾸자꾸 중간에서 깜빡깜빡!\n\"으앙, 방금 외웠는데\n왜 자꾸 잊어버리지?\"", "prompt": "Comical close-up of Reengki the quokka (wearing his pink felt hat) clutching his head with both paws, cheeks puffed in frustration, little question marks and swirls floating above him. Crumpled leaf-notes are scattered around his feet. The young elephant watches with a sympathetic smile. Light-hearted, endearing mood."}, {"text": "엘리가 씽긋 웃으며 말했어요.\n\"괜찮아. 코끼리도 처음엔\n조금씩, 여러 번 기억을 쌓아.\"", "prompt": "Warm medium shot of the young elephant kneeling down to Reengki the quokka (wearing his pink felt hat)'s eye level, patting his shoulder gently with her trunk, smiling kindly. Reengki looks up at her, reassured. Soft lantern light in the cozy library corner, gentle encouraging mood."}, {"text": "\"비법은 바로 적어 두기!\"\n엘리는 커다란 나뭇잎 수첩에\n이야기를 사각사각 적었어요.", "prompt": "Close-up of the young elephant holding a charming notebook made of large pressed green leaves, writing on it with a twig pen held in her trunk. Reengki the quokka (wearing his pink felt hat) leans in, watching with fascination. The firefly lights the leaf pages brightly. Detailed, cozy crafting moment."}, {"text": "링키도 따라 적고, 읽고,\n노래하며 반복했어요.\n한 줄, 두 줄, 조금씩 늘었죠!", "prompt": "Cheerful montage-style shot of Reengki the quokka (wearing his pink felt hat) singing while pointing at lines on the leaf notebook, hopping in rhythm on the library rug. Musical notes float around him. The young elephant taps the beat with her foot. Bright, joyful practice scene in the library."}, {"text": "\"기억났어! 영어로는\nI remember! 라고 해!\"\n\"아이 리멤버!\" 셋이 함께 외쳤어요.", "prompt": "Joyful group close-up of Reengki the quokka (wearing his pink felt hat), the young elephant, and the firefly cheering together with raised paw, trunk, and glowing sparkle. Reengki's face beams with pride. Confetti-like paper bits flutter from a shelf above. Celebratory warm library scene."}, {"text": "지켜보던 코고 할아버지가\n빙그레 웃으며 말했어요.\n\"기억이 쌓이면 지식이 된단다.\"", "prompt": "Warm medium shot of the old elephant standing at the doorway of the reading nook, smiling proudly with gentle wrinkled eyes as he watches Reengki the quokka (wearing his pink felt hat) and the young elephant practice. Golden evening light falls through a round window onto the scene. Wise, tender atmosphere."}, {"text": "하지만 사라진 페이지들은\n여전히 찾지 못했어요.\n이야기의 한가운데가 텅 비었죠.", "prompt": "Quiet close-up of the ancient storybook open on the table, the torn gap in its middle pages lit by the firefly's soft glow. Reengki the quokka (wearing his pink felt hat) and the young elephant look down at it with thoughtful, determined faces. Muted evening light, a moment of resolve."}, {"text": "\"내일은 도서관을 샅샅이 뒤지자!\"\n세 친구의 눈이 반짝였어요.\n어떤 단서가 기다리고 있을까요?", "prompt": "Medium shot of Reengki the quokka (wearing his pink felt hat), the young elephant, and the firefly gathered around a lantern in the darkened library, faces lit from below with determined sparkling eyes, planning their big search. Tall shadowy bookshelves loom around them full of secrets. Adventurous nighttime mood."}]}, {"ep": 5, "title": "도서관 대탐색", "pages": [{"text": "이른 아침, 대탐색이 시작됐어요.\n\"위층은 엘리, 아래층은 나,\n어두운 곳은 반디가 맡아!\"", "prompt": "Wide shot of the baobab library interior at morning, sunlight streaming through round windows. Reengki the quokka (wearing his pink felt hat) points assignments with his paw like a little captain, while the young elephant salutes with her trunk and the firefly zips upward. Energetic mission-start atmosphere."}, {"text": "엘리가 분류법을 알려 줬어요.\n\"빨간 리본은 마을 이야기,\n파란 리본은 옛날 기록이야.\"", "prompt": "Medium shot of the young elephant pointing her trunk at bookshelves where books are neatly tied with red and blue ribbons, explaining to Reengki the quokka (wearing his pink felt hat) who nods studiously. Colorful organized shelves fill the frame. Bright educational and cozy scene."}, {"text": "링키는 사다리를 타고\n꼭대기 책장까지 올라갔어요.\n끼익, 끼익, 조심조심!", "prompt": "Vertical shot of Reengki the quokka (wearing his pink felt hat) carefully climbing a tall wooden rolling ladder along a towering bookshelf, high above the library floor. He peeks between old books on the top shelf. The young elephant steadies the ladder below with her trunk. Slight thrilling height, warm dusty light."}, {"text": "반디는 가장 어두운 구석을\n반짝반짝 비추었어요.\n거미줄 뒤에 무언가 보였죠!", "prompt": "Atmospheric close-up of the firefly's glow illuminating a dark forgotten corner of the library behind soft cobwebs, revealing the edge of an old wooden chest. Dust motes float in the beam of light. Mysterious but gentle discovery mood."}, {"text": "\"여기 오래된 상자가 있어!\"\n셋은 힘을 모아 낑낑\n상자를 꺼냈어요.", "prompt": "Medium shot of Reengki the quokka (wearing his pink felt hat) and the young elephant pulling together an old dusty wooden chest from a dark alcove, the elephant wrapping her trunk around it while Reengki pushes from behind with all his might. The firefly lights the scene. Teamwork moment with playful effort."}, {"text": "덜컹— 뚜껑을 열자\n페이지 대신 낡은 편지 한 통이\n곱게 놓여 있었어요.", "prompt": "Close-up overhead shot of the opened wooden chest, revealing a single aged letter with a wax seal resting on faded cloth inside. The paws of Reengki the quokka (wearing his pink felt hat) and the elephant's trunk-tip hover at the chest's edge. The firefly's light makes the old paper glow softly. Intriguing discovery moment."}, {"text": "편지에는 이렇게 적혀 있었어요.\n'첫 이야기는 종이보다 오래가는\n벽에 남겨 두었네.'", "prompt": "Close-up of the old letter held open by the young elephant's trunk, showing faded elegant handwriting-style marks on yellowed paper (no readable text, just suggestive script lines). Reengki the quokka (wearing his pink felt hat) reads it with wide curious eyes, the firefly perched on the letter's corner. Warm mysterious lamplight."}, {"text": "\"벽이라니? 어느 벽 말이지?\"\n링키와 엘리는 서로를 보며\n고개를 갸웃갸웃했어요.", "prompt": "Comical close-up of Reengki the quokka (wearing his pink felt hat) and the young elephant tilting their heads in opposite directions at each other, both puzzled, question marks floating between them. The letter lies on the floor in front of them. Light, humorous storybook moment in the library."}, {"text": "코고 할아버지도 편지를 보며\n한참을 갸웃거렸어요.\n\"벽… 벽이라… 기억날 듯 말 듯…\"", "prompt": "Medium shot of the old elephant studying the letter through his round spectacles, trunk scratching his temple thoughtfully, eyes half closed in deep effort to remember. Reengki the quokka (wearing his pink felt hat) and the young elephant wait hopefully at his side. Soft evening light in the library hall."}, {"text": "그때, 창밖 하늘에 시커먼\n먹구름이 몰려오고 있었어요.\n우르릉— 심상치 않은 소리와 함께!", "prompt": "Dramatic wide shot through a round library window showing dark storm clouds gathering over Memory Village, with a distant flash of lightning. Reengki the quokka (wearing his pink felt hat), the young elephant, and the old elephant look out the window with concern, silhouetted against the stormy sky. Ominous but storybook-soft atmosphere."}]}, {"ep": 6, "title": "주룩주룩 큰비", "pages": [{"text": "밤이 되자 큰비가 쏟아졌어요.\n주룩주룩, 쏴아아—\n바람도 세차게 불었죠.", "prompt": "Wide nighttime shot of Memory Village in heavy rain, raindrops streaking down and wind bending the trees, the giant baobab library standing firm with warm windows glowing. Puddles reflect the lantern light. Dramatic yet cozy storm atmosphere, no characters visible."}, {"text": "\"큰일이야! 지붕 틈에서\n빗물이 뚝뚝 새고 있어!\"\n반디가 다급하게 날아왔어요.", "prompt": "Urgent medium shot of the firefly zooming down the library staircase with an alarmed glow, while above, water drips from a crack in the wooden ceiling near the top shelves. Reengki the quokka (wearing his pink felt hat) and the young elephant look up in alarm from the library floor. Tense but child-friendly mood."}, {"text": "빗물이 떨어지는 곳 아래엔\n오래된 책들이 가득했어요.\n\"책들을 안전한 곳으로 옮기자!\"", "prompt": "Medium shot of water droplets falling toward a shelf of precious old books, with Reengki the quokka (wearing his pink felt hat) pointing urgently and the young elephant already reaching for books with her trunk. The firefly hovers above the endangered shelf like a warning light. Dynamic rescue-scene energy."}, {"text": "마을 코끼리들이 달려와\n긴 코로 책을 번쩍번쩍\n차례차례 날랐어요.", "prompt": "Wide action shot of several village elephants forming a line inside the library, passing stacks of books from trunk to trunk like a bucket brigade, moving them away from the leaking corner. Rain streaks the round windows behind them. Cooperative, determined atmosphere with warm lantern light."}, {"text": "링키도 작은 책들을 안고\n총총총 부지런히 뛰었어요.\n\"영차, 영차!\"", "prompt": "Endearing close-up of Reengki the quokka (wearing his pink felt hat) hugging a wobbly stack of small books almost taller than himself, scurrying across the library floor with determined puffed cheeks. Elephant legs move in the background as the rescue continues. Charming, energetic moment."}, {"text": "반디는 깜깜한 통로를\n환하게 밝혀 주었어요.\n덕분에 아무도 넘어지지 않았죠.", "prompt": "Atmospheric shot of the firefly flying ahead through a dark library corridor, casting a warm glowing path of light, while Reengki the quokka (wearing his pink felt hat) and elephants carrying books follow safely behind. The contrast of the firefly's glow against the dark hallway is beautiful and reassuring."}, {"text": "\"이제 지붕 틈을 막아야 해!\"\n엘리가 커다란 잎사귀를 가져와\n코를 쭉 뻗어 틈을 덮었어요.", "prompt": "Dynamic vertical shot of the young elephant standing on her hind legs, stretching her trunk high to press a huge green leaf over the crack in the wooden ceiling. Reengki the quokka (wearing his pink felt hat) cheers her on from a bookshelf ledge, and the firefly lights the spot. Heroic teamwork moment."}, {"text": "이윽고 비가 그치고\n도서관은 다시 조용해졌어요.\n\"휴우, 우리가 해냈어!\"", "prompt": "Relieved group shot of Reengki the quokka (wearing his pink felt hat), the young elephant, the old elephant, and village elephants sighing happily together in the library hall, surrounded by safely stacked books. Soft moonlight breaks through the clouds outside the round windows. Peaceful, accomplished mood."}, {"text": "다음 날, 모두 함께 젖은 책을\n햇볕에 널어 말렸어요.\n책장이 팔락팔락 춤을 췄죠.", "prompt": "Cheerful wide shot of the village square the next morning, with damp books laid open on lines and racks to dry in bright sunshine, pages fluttering in the breeze. Reengki the quokka (wearing his pink felt hat) and the young elephant carefully turn pages while elephants hang more books. Fresh, sparkling after-rain atmosphere."}, {"text": "그때, 낡은 책 한 권에서\n툭— 무언가 떨어졌어요.\n\"어? 이게 뭐지?\"", "prompt": "Close-up of a folded yellowed paper slipping out from between the pages of an old drying book, falling toward the ground. Reengki the quokka (wearing his pink felt hat) reaches out in surprise, eyes wide, while the young elephant leans in. Sunlit square background, a moment of intriguing discovery."}]}, {"ep": 7, "title": "말린 책 속의 지도", "pages": [{"text": "떨어진 것은 누렇게 바랜\n낡은 지도였어요.\n조심조심 펼쳐 보았죠.", "prompt": "Close-up overhead shot of small paws and a trunk-tip carefully unfolding an aged, yellowed map on a wooden table. Faded drawings of a forest, a river, and a cave are visible on it. Reengki the quokka (wearing his pink felt hat) and the young elephant lean over it with wide curious eyes. Warm sunlight on the weathered paper."}, {"text": "지도 끝에는 동굴 그림과 함께\n별표가 반짝 그려져 있었어요.\n\"속삭임 동굴이래!\"", "prompt": "Detailed close-up of the old map showing a hand-drawn cave entrance marked with a small star symbol, at the end of a dotted path through forest and river. The firefly hovers just above the star, illuminating it. The excited face of Reengki the quokka (wearing his pink felt hat) peeks at the map's edge."}, {"text": "지도를 본 코고 할아버지의\n눈이 번쩍 뜨였어요.\n\"아! 첫 코끼리들이 살던 동굴!\"", "prompt": "Dramatic close-up of the old elephant's face lighting up with sudden recognition, spectacles flashing, trunk raised high in an aha moment. The map is spread before him on the table. Reengki the quokka (wearing his pink felt hat) and the young elephant beam with excitement beside him. Bright revelation energy."}, {"text": "\"편지 속 '벽'은 바로\n동굴 벽이었구나!\n거기에 첫 이야기가 남아 있을 게다!\"", "prompt": "Medium shot of the old elephant tapping the map's cave drawing with his trunk-tip while explaining, eyes twinkling with wisdom. Reengki the quokka (wearing his pink felt hat) jumps up clapping, and the young elephant trumpets happily with raised trunk. The firefly loops in the air. Joyful eureka scene in the sunny square."}, {"text": "\"내일 아침, 동굴로 떠나자!\"\n네 친구는 신나서\n폴짝폴짝 뛰었어요.", "prompt": "Joyful wide shot of Reengki the quokka (wearing his pink felt hat), the young elephant, the old elephant, and the firefly celebrating together in the village square, Reengki mid-jump with arms up. Drying books flutter around them in the background. Golden afternoon light, pure excitement."}, {"text": "마을 친구들이 소식을 듣고\n하나둘 모여들었어요.\n\"첫 이야기를 꼭 찾아와 줘!\"", "prompt": "Warm wide shot of village elephants gathering around the four friends in the square, waving trunks encouragingly. A small elephant child offers a flower to Reengki the quokka (wearing his pink felt hat). Sunset colors bathe the cozy village. Supportive community atmosphere."}, {"text": "엘리는 나뭇잎 수첩과 연필을,\n링키는 맛있는 간식을 챙겼어요.\n반디는 날개를 반질반질 닦았죠.", "prompt": "Charming detail shot of expedition preparations on a wooden table: the young elephant packing her leaf notebook and twig pencil into a satchel, Reengki the quokka (wearing his pink felt hat) stuffing berries and snacks into his bag, and the firefly polishing its wings on a corner. Cozy lamplight, playful packing montage."}, {"text": "코고 할아버지는 지도를 코에\n돌돌 말아 소중히 들었어요.\n\"길은 이 늙은 코가 기억하지!\"", "prompt": "Close-up of the old elephant carefully rolling the ancient map with his trunk and holding it like a precious scroll, giving a confident wink. His round spectacles gleam. Reengki the quokka (wearing his pink felt hat) salutes him playfully. Warm evening light, humorous confident mood."}, {"text": "그날 밤, 링키는 두근두근\n설레는 마음으로 잠이 들었어요.\n창밖엔 별이 총총 빛났죠.", "prompt": "Peaceful close-up of Reengki the quokka (wearing his pink felt hat resting on a bedpost) sleeping snugly in a small round bed inside a cozy tree-room, a gentle smile on his face. Through the round window, a sky full of twinkling stars shines over the village. Tranquil, dreamy nighttime scene."}, {"text": "드디어 내일은 속삭임 동굴로!\n그곳엔 정말 첫 이야기가\n기다리고 있을까요?", "prompt": "Wide dreamy shot of the moonlit path leading from Memory Village toward a distant misty forest and mountains, where a faint cave glows mysteriously far away. The sleeping village rests in the foreground under the stars. Anticipatory, magical atmosphere promising tomorrow's adventure, no characters visible."}]}, {"ep": 8, "title": "속삭임 동굴로", "pages": [{"text": "이른 아침, 네 친구는\n안개 낀 숲길로 출발했어요.\n뽀얀 안개가 몽글몽글 피어났죠.", "prompt": "Atmospheric wide shot of Reengki the quokka (wearing his pink felt hat) riding on the young elephant's back, with the old elephant leading and the firefly glowing ahead, all walking into a misty morning forest. Soft fog curls between tall trees. Gentle adventure-departure mood with diffused light."}, {"text": "갈림길이 나타났어요.\n안개 때문에 지도가\n잘 보이지 않았죠.", "prompt": "Medium shot of the group paused at a forked forest path swallowed by thick fog, the old elephant squinting at the unrolled map through his spectacles. Reengki the quokka (wearing his pink felt hat) peers from the young elephant's back, and the firefly's glow barely pierces the mist. Mysterious, hushed atmosphere."}, {"text": "그때 할아버지가 코를 킁킁!\n\"이 냄새… 기억난다!\n어릴 적 걷던 이끼 냄새야!\"", "prompt": "Close-up of the old elephant lifting his trunk high and sniffing the air with closed eyes, a nostalgic smile spreading across his wrinkled face. Soft green moss glows on stones along the left path. Reengki the quokka (wearing his pink felt hat) and the young elephant watch him with hopeful eyes in the fog."}, {"text": "할아버지의 기억을 따라\n왼쪽 길로 성큼성큼!\n안개가 서서히 걷혔어요.", "prompt": "Wide shot of the group confidently marching down the left mossy path as the fog gradually lifts, revealing a lush green forest with sunbeams breaking through the canopy. The old elephant leads proudly, with Reengki the quokka (wearing his pink felt hat) cheering on the young elephant's back. Bright, hopeful transition."}, {"text": "콸콸 흐르는 강이 나타나자\n할아버지가 등을 내주었어요.\n\"자, 모두 꼭 잡으렴!\"", "prompt": "Dynamic medium shot of the old elephant wading across a sparkling flowing river with Reengki the quokka (wearing his pink felt hat) and the young elephant riding safely on his broad back, water splashing around his sturdy legs. The firefly rides on Reengki's hat. Sunlit water sparkles, safe adventurous energy."}, {"text": "마침내 바위산 아래에서\n덩굴에 덮인 동굴 입구를 찾았어요.\n\"여기가 속삭임 동굴이야!\"", "prompt": "Wide reveal shot of an ancient cave entrance half-hidden behind hanging vines at the base of a rocky hill, with soft mysterious light inside. The four friends stand before it in awe — Reengki the quokka (wearing his pink felt hat), the young elephant, the old elephant, and the glowing firefly. Sense of sacred discovery."}, {"text": "반디가 앞장서 불을 밝히자\n동굴 안이 은은하게 빛났어요.\n또각또각, 발소리가 울렸죠.", "prompt": "Atmospheric interior shot of the group walking cautiously into the cave, the firefly's warm glow lighting curved stone walls that shimmer faintly. Their shadows stretch long behind them. Reengki the quokka (wearing his pink felt hat) holds the young elephant's trunk. Echoing, magical cavern mood."}, {"text": "\"우와아…!\"\n동굴 벽 가득, 오래된 그림들이\n펼쳐져 있었어요!", "prompt": "Breathtaking wide shot of a large cave chamber whose walls are covered in ancient charming wall paintings — elephants planting a great tree, carrying books, building a village — glowing warmly in the firefly's light. The four friends stand tiny before the vast painted wall, heads tilted up in wonder. Majestic, magical discovery scene."}, {"text": "\"이건… 마을의 첫 이야기야!\n첫 코끼리들이 그림으로\n남겨 두었던 거야!\"", "prompt": "Close-up of the old elephant touching the ancient wall paintings gently with his trunk-tip, tears of joy glistening in his eyes as memories return. Reengki the quokka (wearing his pink felt hat) and the young elephant gaze at the paintings beside him. The firefly hovers close, illuminating the precious images. Deeply moving moment."}, {"text": "엘리는 사각사각 수첩에 옮기고\n링키는 흥얼흥얼 노래로 담았어요.\n이제 축제의 밤만 남았어요!", "prompt": "Warm medium shot inside the glowing cave: the young elephant copying the wall paintings into her leaf notebook with her twig pencil, while Reengki the quokka (wearing his pink felt hat) sings beside her with musical notes floating in the air. The old elephant smiles watching them, and the firefly lights the wall. Productive, joyful teamwork scene."}]}, {"ep": 9, "title": "기억의 밤", "pages": [{"text": "드디어 기억의 밤이 왔어요.\n광장엔 등불이 주렁주렁,\n별처럼 반짝반짝 빛났죠.", "prompt": "Magical wide shot of the village square at night, strings of glowing paper lanterns crisscrossing above, villagers' cottages warmly lit, and elephants gathering on woven mats around the wooden stage. The baobab library towers in the background under a starry sky. Festive, enchanting night atmosphere."}, {"text": "마을 코끼리들이 모두 모여\n무대를 바라보았어요.\n두근두근, 조용한 설렘이 흘렀죠.", "prompt": "Medium shot from behind the audience of elephants of all sizes sitting together, ears perked attentively toward the lantern-lit stage. Elephant children lean forward eagerly. Reengki the quokka (wearing his pink felt hat) peeks from the side of the stage. Hushed, expectant festival mood."}, {"text": "코고 할아버지가 무대에 올라\n첫 이야기를 시작했어요.\n\"아주 먼 옛날, 첫 코끼리들이…\"", "prompt": "Warm medium shot of the old elephant standing tall on the lantern-lit stage, speaking with gentle grandeur, one trunk raised in storytelling gesture. The restored leaf notebook rests open on the stand before him. The audience of elephants listens spellbound below. Golden storyteller's glow."}, {"text": "잊었던 부분에 다다르자,\n엘리가 수첩을 펼치고\n링키가 무대로 폴짝 올라왔어요!", "prompt": "Dynamic shot of Reengki the quokka (wearing his pink felt hat) leaping energetically onto the stage beside the old elephant, while the young elephant holds up her leaf notebook open to the copied cave paintings. Lantern light catches the motion. The audience's eyes widen with delight. Exciting stage moment."}, {"text": "링키는 기억의 노래를 불렀어요.\n\"랄라라— 첫 코끼리들은\n기억을 심어 나무를 키웠죠—♪\"", "prompt": "Joyful performance shot of Reengki the quokka (wearing his pink felt hat) singing and dancing at center stage under the lanterns, arms spread wide, musical notes swirling around him into the night sky. The old elephant sways along and the young elephant taps the rhythm with her trunk. Sparkling, heartwarming concert scene."}, {"text": "어느새 마을 모두가\n노래를 따라 불렀어요.\n광장이 하나의 목소리로 물들었죠.", "prompt": "Uplifting wide shot of the entire village square singing together, elephants swaying trunks side to side in unison under the glowing lanterns, with Reengki the quokka (wearing his pink felt hat) conducting joyfully from the stage. Musical notes drift up toward the stars. Unified, festive celebration."}, {"text": "이야기가 끝나자 할아버지가\n따뜻하게 말했어요.\n\"기억이 쌓이면 지식이 되고,\n지식은 힘이 된단다.\"", "prompt": "Tender close-up of the old elephant addressing the audience with a warm wise smile, trunk resting gently on the shoulder of Reengki the quokka (wearing his pink felt hat) standing proudly beside him on stage. Lantern light glows softly on their faces. The young elephant beams from below. Wise, heartfelt culminating moment."}, {"text": "코끼리들은 저마다 소중한 기억을\n하나씩 나누기 시작했어요.\n밤하늘 아래 이야기꽃이 피었죠.", "prompt": "Cozy wide shot of small circles of elephants around the square sharing stories with animated trunk gestures, elephant children listening with sparkling eyes. Reengki the quokka (wearing his pink felt hat) sits among one circle, laughing. Lanterns glow above and stars twinkle. Warm communal storytelling night."}, {"text": "\"링키, 네 덕분에 우리 마을\n이야기가 다시 살아났어.\"\n엘리가 코로 링키를 꼬옥 안았어요.", "prompt": "Heart-melting close-up of the young elephant wrapping her trunk around Reengki the quokka (wearing his pink felt hat) in a gentle hug, both with eyes closed and content smiles. Soft lantern bokeh glows in the background of the night square. Tender friendship moment."}, {"text": "축제의 밤은 깊어 갔어요.\n그리고 내일 아침, 기억의 방에서\n특별한 일이 기다리고 있었답니다.", "prompt": "Serene wide shot of the festival winding down late at night, lanterns still glowing softly as elephants head home under a sky full of stars. Reengki the quokka (wearing his pink felt hat) and the young elephant walk together toward the baobab library, whose deepest window glows with a mysterious golden light. Peaceful, promising closing mood."}]}, {"ep": 10, "title": "열한 번째 구슬", "pages": [{"text": "다음 날 아침, 코고 할아버지가\n링키를 기억의 방으로 불렀어요.\n작은 문이 스르륵 열렸죠.", "prompt": "Atmospheric shot of the old elephant opening the small carved wooden door of the memory room with his trunk, warm golden light spilling out into the corridor. Reengki the quokka (wearing his pink felt hat) stands at the threshold with the young elephant and the firefly, eyes wide with wonder. Sacred, gentle morning mood."}, {"text": "방 안 가장 높은 자리에\n구슬 E가 반짝이고 있었어요.\n아침 햇살처럼 따뜻한 빛이었죠.", "prompt": "Close-up of the glowing alphabet bead resting on a velvet cushion atop a small carved pedestal, surrounded by ancient books and scrolls in the cozy memory room. Its warm golden light reflects in the wide eyes of Reengki the quokka (wearing his pink felt hat) gazing up at it. Magical treasure moment."}, {"text": "\"링키야, 너는 배움을 두려워\n않고 기억을 소중히 여겼단다.\n너는 진짜 지혜로운 친구야.\"", "prompt": "Warm medium shot of the old elephant speaking tenderly to Reengki the quokka (wearing his pink felt hat), lowering his great head to the small quokka's eye level inside the glowing memory room. Reengki listens with his paws clasped, moved. Soft golden light wraps the scene. Solemn, loving atmosphere."}, {"text": "할아버지는 코로 구슬을 들어\n링키에게 건네주었어요.\n\"열한 번째 구슬, E란다.\"", "prompt": "Emotional close-up of the old elephant's trunk gently placing the glowing bead into the small outstretched paws of Reengki the quokka (wearing his pink felt hat). The bead's golden light illuminates both their faces. The young elephant and the firefly watch joyfully from behind. Precious gift-giving moment."}, {"text": "가방 속 구슬 열한 개가\n일제히 반짝반짝 빛났어요!\n\"고마워요! Thank you!\"", "prompt": "Radiant shot of Reengki the quokka (wearing his pink felt hat) holding his open bag as eleven alphabet beads inside glow and sparkle together, casting dancing lights around the memory room. He bows gratefully to the old elephant. The young elephant trumpets happily. Celebratory, luminous scene."}, {"text": "엘리가 나뭇잎 수첩을 내밀었어요.\n\"이건 내 선물이야. 여행의 기억을\n차곡차곡 적어 줘!\"", "prompt": "Touching close-up of the young elephant offering her handmade leaf notebook with her trunk to Reengki the quokka (wearing his pink felt hat), who receives it with both paws, eyes glistening. Morning light streams through the library's round window. Sweet farewell-gift moment."}, {"text": "\"엘리, 반디, 할아버지…\n절대 잊지 않을게.\nI'll remember you!\"", "prompt": "Heartfelt group shot of Reengki the quokka (wearing his pink felt hat) hugging the young elephant's trunk while the firefly perches on his hat and the old elephant wraps them all gently with his big trunk. Everyone's eyes are warmly closed or glistening. Golden morning light in the library entrance. Tender farewell embrace."}, {"text": "마을 어귀까지 모두가 나와\n손을 흔들어 주었어요.\n\"잘 가, 링키! 또 만나!\"", "prompt": "Wide farewell shot at the edge of Memory Village, the whole crowd of elephants waving trunks as Reengki the quokka (wearing his pink felt hat) walks down the path with his bag and the leaf notebook, turning back to wave. The great baobab library rises behind the village. Bittersweet warm morning light."}, {"text": "\"다음 마을엔 용감한 사자가\n살고 있단다. 씩씩하게 다녀오렴!\"\n할아버지가 멀리 손짓했어요.", "prompt": "Medium shot of the old elephant pointing his trunk toward distant golden savanna hills on the horizon, standing beside Reengki the quokka (wearing his pink felt hat) at a signpost on the village outskirts. The morning sun rises over the far grasslands. Hopeful, forward-looking composition."}, {"text": "링키는 씩씩하게 걸어갔어요.\n기억은 쌓이고, 꿈은 자라나죠.\n다음 이야기에서 또 만나요!", "prompt": "Inspiring wide shot of Reengki the quokka (wearing his pink felt hat) walking bravely along a sunlit path toward golden savanna hills, his bag glowing faintly with eleven beads, the leaf notebook tucked under his arm. A gentle breeze carries a few sparkling lights behind him like memories. Uplifting open-road ending scene."}]}]}, "12": {"chapter": 12, "animal": "사자", "animal_en": "lion", "letter": "N", "village": "황금 갈기 마을", "episodes": [{"ep": 1, "title": "황금빛 사바나에 도착했어요", "pages": [{"text": "코끼리 마을을 떠난 링키는\n황금빛 들판을 걸어갔어요.\n구슬 열한 개가 반짝반짝!", "prompt": "Wide shot of Reengki the quokka (wearing his pink felt hat) walking across a vast golden savanna at late afternoon. Tall amber grass sways around him and a small pouch at his side glows with eleven colorful beads. Warm golden sunlight bathes the whole scene. His expression is bright and full of adventure."}, {"text": "바람이 살랑살랑 불 때마다\n풀잎이 금빛 파도처럼 출렁였죠.\n\"우와, 여긴 온통 황금색이야!\"", "prompt": "Wide shot of golden savanna grass rippling like waves in the breeze under a warm sky. Reengki the quokka (wearing his pink felt hat) stands on a small mound with his arms spread wide, mouth open in delight. A few acacia trees dot the horizon. The light is honey-colored and dreamy."}, {"text": "저 멀리 커다란 바오밥 나무와\n둥근 지붕 집들이 보였어요.\n바로 열두 번째 마을이었죠!", "prompt": "Wide establishing shot of a cozy savanna village with round thatched-dome houses gathered beneath one enormous baobab tree. Reengki the quokka (wearing his pink felt hat) is seen from behind in the foreground, gazing at the village. Golden hour light, long soft shadows, welcoming atmosphere."}, {"text": "그때 풀숲에서 쪼르르르!\n작은 미어캣 남매가 튀어나왔어요.\n\"안녕! 우리는 티키와 타카야!\"", "prompt": "Close-up of two cheerful meerkat siblings popping up from the tall golden grass, standing upright with sparkling eyes. Reengki the quokka (wearing his pink felt hat) leans toward them, surprised and smiling. Dust motes glitter in the warm sunlight around them."}, {"text": "\"여기는 황금 갈기 마을!\n용감한 사자들이 사는 곳이야.\"\n링키의 가슴이 콩닥콩닥 뛰었어요.", "prompt": "Medium shot of the two meerkats proudly gesturing toward the village of round thatched houses, acting like tiny tour guides. Reengki the quokka (wearing his pink felt hat) presses his paws to his chest with excited anticipation. The baobab tree towers behind them in golden light."}, {"text": "마을 한가운데에는 커다란\n해돋이 바위가 우뚝 서 있었어요.\n노을빛이 바위를 물들였죠.", "prompt": "Wide shot of a majestic flat-topped rock formation rising in the center of the savanna village, glowing orange in the sunset light. Reengki the quokka (wearing his pink felt hat) and the two meerkats stand small at its base, looking up in awe. Round thatched houses circle the rock."}, {"text": "\"곧 황금 갈기 축제가 열려!\n저 바위 위에서 첫 외침을 하지.\"\n티키가 신나서 소개했어요.", "prompt": "Medium shot of one meerkat standing on tiptoe on a small stone, dramatically pointing up at the top of the great sunrise rock. Reengki the quokka (wearing his pink felt hat) and the other meerkat listen with wide curious eyes. Festival garlands of dried flowers are strung between nearby houses."}, {"text": "그때 바오밥 나무 뒤에서\n황금빛 꼬리가 살짝 보였어요.\n누군가 숨어서 보고 있었죠.", "prompt": "Medium shot focused on the huge baobab trunk, where a fluffy golden lion tail and one shy eye peek out from behind the tree. In the foreground Reengki the quokka (wearing his pink felt hat) tilts his head, noticing the movement. Soft dusk lighting, gentle and mysterious mood."}, {"text": "\"안녕? 나는 링키야!\"\n링키가 손을 흔들자 꼬리는\n슝— 하고 사라져 버렸어요.", "prompt": "Wide shot of Reengki the quokka (wearing his pink felt hat) waving warmly toward the baobab tree, while a golden blur of a young lion dashes away behind it, only the tip of his tail visible. The meerkats giggle beside Reengki. Warm evening glow over the savanna village."}, {"text": "\"방금 그 친구는 누구지?\"\n링키는 궁금해서 견딜 수 없었어요.\n내일, 다시 만날 수 있을까요?", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat) gazing thoughtfully at the empty space behind the baobab tree, one paw on his chin, eyes full of curiosity. Behind him the village houses light up with soft lantern glow as night falls over the golden savanna."}]}, {"ep": 2, "title": "부끄럼쟁이 사자 레오", "pages": [{"text": "다음 날 아침, 링키는\n바오밥 나무로 살금살금 갔어요.\n어제 그 꼬리가 또 보였거든요!", "prompt": "Morning scene of Reengki the quokka (wearing his pink felt hat) tiptoeing dramatically toward the giant baobab tree, one paw raised. A golden lion tail sticks out from behind the trunk again. Fresh morning light, dew sparkling on the savanna grass, playful mood."}, {"text": "나무 뒤에는 어린 사자가\n무릎을 꼭 안고 앉아 있었어요.\n갈기가 아침 해처럼 빛났죠.", "prompt": "Medium shot of a young lion cub sitting behind the baobab tree, hugging his knees shyly, his small golden mane glowing like the morning sun. Reengki the quokka (wearing his pink felt hat) peeks around the trunk with a gentle smile. Soft warm backlight through the branches."}, {"text": "\"안녕! 나는 쿼카 링키야.\"\n\"나, 나는… 레오야.\"\n레오의 목소리는 아주 작았어요.", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat) offering a friendly paw to the shy lion cub, who looks up with big nervous eyes and speaks in a tiny voice. The lion's ears are folded back bashfully. Gentle morning light filtering through baobab leaves."}, {"text": "그때 우렁우렁한 목소리가 들렸어요.\n\"레오야, 연습할 시간이란다!\"\n갈기가 노을빛인 촌장님이었죠.", "prompt": "Wide shot of a grand elderly lion with a magnificent sunset-orange mane walking toward the baobab tree, calling out kindly. The lion cub flinches and shrinks behind the tree while Reengki the quokka (wearing his pink felt hat) looks back and forth between them. Golden savanna village in the background."}, {"text": "\"우리 레오는 이번 축제에서\n첫 외침을 맡았단다. 자랑스럽지!\"\n노을 촌장님이 껄껄 웃었어요.", "prompt": "Medium shot of the elder lion with the sunset mane laughing warmly and proudly, one big paw gently placed on the small lion cub's shoulder. The cub looks down at his own feet anxiously. Reengki the quokka (wearing his pink felt hat) watches with curious concern. Bright savanna morning."}, {"text": "하지만 레오는 고개를 푹 숙였어요.\n꼬리가 축 늘어져 있었죠.\n조금도 기뻐 보이지 않았어요.", "prompt": "Close-up of the young lion cub with his head hanging low and his tail drooping on the ground, eyes sad and worried. In the soft-focus background the elder lion walks away and Reengki the quokka (wearing his pink felt hat) leans in with a sympathetic expression. Muted warm tones."}, {"text": "\"레오야, 무슨 걱정 있어?\"\n\"바위 위에 서면… 다들 날 봐.\n그럼 목소리가 꽁꽁 얼어붙어.\"", "prompt": "Two-shot of Reengki the quokka (wearing his pink felt hat) sitting beside the lion cub under the baobab tree, listening closely. The cub hugs his tail and imagines a tiny thought bubble of himself frozen stiff on top of the sunrise rock with many eyes watching. Gentle sympathetic mood."}, {"text": "\"사자는 용감해야 하는데…\n나는 겁쟁이인가 봐.\"\n레오의 눈에 눈물이 그렁그렁했어요.", "prompt": "Close-up of the lion cub's face with big glistening teary eyes, ears flat, whiskers trembling. Reengki the quokka (wearing his pink felt hat) gently pats the cub's paw with both of his small paws. Soft morning light, tender emotional moment under the baobab tree."}, {"text": "링키는 레오의 손을 꼭 잡았어요.\n\"나도 무대가 무서웠던 적 있어.\n우리 같이 연습해 볼래?\"", "prompt": "Warm medium shot of Reengki the quokka (wearing his pink felt hat) holding the lion cub's paw firmly with both paws, looking into his eyes with an encouraging smile. The cub's expression begins to soften with a spark of hope. Golden light breaks through the baobab branches above them."}, {"text": "레오가 살며시 고개를 끄덕였어요.\n작지만 분명한 끄덕임이었죠.\n특별 연습이 시작될 참이에요!", "prompt": "Medium shot of the lion cub giving a small but determined nod, a shy smile appearing on his face. Reengki the quokka (wearing his pink felt hat) jumps up with excitement, fist raised toward the sky. The golden savanna stretches behind them, full of promise in the morning light."}]}, {"ep": 3, "title": "삑사리 목소리의 비밀", "pages": [{"text": "링키와 레오는 아무도 없는\n풀숲 언덕으로 올라갔어요.\n비밀 연습 장소였죠!", "prompt": "Wide shot of Reengki the quokka (wearing his pink felt hat) and the young lion cub climbing a quiet grassy hill away from the village, tall golden grass parting around them. The village and baobab tree are small in the distance. Bright midday savanna light, adventurous mood."}, {"text": "\"자, 크게 한번 외쳐 봐!\"\n레오가 숨을 크게 들이쉬었어요.\n스으읍— 배가 빵빵해졌죠.", "prompt": "Medium shot of the lion cub taking an enormous breath, cheeks and belly puffed up comically round, standing on the grassy hilltop. Reengki the quokka (wearing his pink felt hat) stands beside him like a coach, paws on hips, nodding encouragingly. Clear blue sky above the golden grass."}, {"text": "\"어흥—— 삐약?\"\n어흥은커녕 병아리 소리가 났어요.\n레오의 얼굴이 빨개졌죠.", "prompt": "Funny close-up of the lion cub mid-roar with his mouth wide open, but only a tiny squeak comes out, shown as a very small musical note. His cheeks blush deep red with embarrassment. Reengki the quokka (wearing his pink felt hat) blinks in surprise, covering his mouth. Lighthearted comedic framing."}, {"text": "\"괜찮아, 괜찮아! 한 번 더!\"\n\"어흥— 삐이익!\"\n이번엔 피리 소리가 났어요.", "prompt": "Medium shot of the lion cub trying to roar again on the hilltop, his squeaky sound visualized as a thin wobbly whistle line in the air. Reengki the quokka (wearing his pink felt hat) claps supportively despite the funny sound. Golden grass sways around them, warm and encouraging mood."}, {"text": "레오는 풀밭에 털썩 주저앉았어요.\n\"봤지? 긴장하면 이렇게 돼.\n축제 날에도 이러면 어떡해…\"", "prompt": "Medium shot of the lion cub plopping down on the grass in defeat, shoulders slumped, looking at his own paws sadly. Reengki the quokka (wearing his pink felt hat) crouches next to him with a thoughtful caring expression. Soft clouds drift over the golden savanna hill."}, {"text": "링키는 곰곰이 생각했어요.\n'나도 첫 무대에서 다리가\n후들후들 떨렸었는데…'", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat) deep in thought with a paw on his chin. Above him a soft round memory bubble shows a tiny Reengki trembling on a small stage with shaky knees. Warm nostalgic tones inside the bubble, golden hill in the present scene."}, {"text": "\"레오야, 나만의 비법이 있어!\n무서울 땐 노래로 시작하는 거야.\n노래는 마음을 말랑하게 해 주거든.\"", "prompt": "Bright medium shot of Reengki the quokka (wearing his pink felt hat) springing up with an inspired expression, one finger raised, tiny musical notes sparkling around his head. The lion cub looks up at him with curious hopeful eyes from the grass. Sunny cheerful savanna hilltop."}, {"text": "링키가 먼저 노래했어요.\n\"랄랄라— 두려움아 안녕!\"\n레오도 작게 따라 불렀죠.", "prompt": "Joyful wide shot of Reengki the quokka (wearing his pink felt hat) singing and swaying on the hilltop with musical notes floating around, while the lion cub hums along quietly beside him, a shy smile forming. Golden grass dances in the breeze around the two friends."}, {"text": "그때 레오가 영어를 알려 줬어요.\n\"우리 마을 인사는 'Hello, friend!'야.\"\n\"헬로, 프렌드!\" 링키가 활짝 웃었죠.", "prompt": "Warm two-shot of the lion cub and Reengki the quokka (wearing his pink felt hat) facing each other on the grassy hill, exchanging a cheerful greeting with paws raised in a friendly wave. Both are smiling brightly. Golden afternoon light wraps the scene in warmth."}, {"text": "노래하고 인사하며 웃다 보니\n레오의 목소리가 조금 커졌어요!\n내일은 더 잘할 수 있을까요?", "prompt": "Wide sunset shot of Reengki the quokka (wearing his pink felt hat) and the lion cub laughing together on the hilltop, the cub's mouth open in a slightly bigger happy shout with medium-sized musical notes. The sky glows orange and pink over the endless golden savanna below."}]}, {"ep": 4, "title": "달아난 레오", "pages": [{"text": "며칠 뒤, 노을 촌장님이 말했어요.\n\"오늘은 바위에서 연습해 보자!\n마을 친구들도 응원할 거야.\"", "prompt": "Morning scene in the savanna village square where the elder lion with the sunset mane makes a warm announcement, gesturing toward the great sunrise rock. Villagers including meerkats gather with cheerful faces. Reengki the quokka (wearing his pink felt hat) stands beside the nervous lion cub. Bright festive light."}, {"text": "레오는 해돋이 바위에 올랐어요.\n다리가 후들후들, 꼬리가 덜덜.\n아래에서 모두가 지켜봤거든요.", "prompt": "Dramatic low-angle shot of the small lion cub standing atop the huge sunrise rock, knees visibly wobbling and tail trembling. Far below, a crowd of village animals looks up expectantly. Reengki the quokka (wearing his pink felt hat) watches from the base with clasped paws. Vast blue sky behind the rock."}, {"text": "\"스으읍— 어흥— 삐약!\"\n또 병아리 소리가 나왔어요.\n티키와 타카가 킥킥 웃었죠.", "prompt": "Medium shot of the lion cub on the rock letting out a tiny squeak instead of a roar, shown as a minuscule musical note. Below, the two meerkats cover their mouths giggling. The cub's face flushes bright red. Reengki the quokka (wearing his pink felt hat) looks up worriedly from the crowd."}, {"text": "웃음소리는 아주 작았지만\n레오의 귀에는 크게 들렸어요.\n눈앞이 핑글핑글 어지러웠죠.", "prompt": "Close-up of the lion cub's face on the rock, overwhelmed, eyes swirling with dizziness, ears drooping as exaggerated giggle sounds swirl around his head like wavy lines. The background crowd is blurred and distant. Emotional, sympathetic framing with soft warm colors."}, {"text": "\"미안해요… 나 못 하겠어요!\"\n레오는 바위에서 뛰어내려\n풀숲으로 슝— 달아났어요.", "prompt": "Dynamic wide shot of the lion cub leaping down from the sunrise rock and dashing away into the tall golden grass, only his tail visible in a blur of motion. The villagers gasp with concerned faces. Reengki the quokka (wearing his pink felt hat) reaches out a paw, calling after him."}, {"text": "\"레오야! 어디 가!\"\n링키가 서둘러 뒤쫓았어요.\n금빛 풀잎이 사사삭 흔들렸죠.", "prompt": "Action shot of Reengki the quokka (wearing his pink felt hat) running through the tall golden grass, pushing stalks aside, following the trail of swaying grass ahead. Determined worried expression. Dust and seed fluff float in the warm sunlight around him."}, {"text": "레오는 바오밥 나무 구멍 속에\n웅크리고 숨어 있었어요.\n훌쩍훌쩍 우는 소리가 들렸죠.", "prompt": "Quiet medium shot of the lion cub curled up inside a cozy hollow at the base of the giant baobab tree, hiding his face in his paws, small teardrops falling. Reengki the quokka (wearing his pink felt hat) approaches slowly and peeks into the hollow with gentle eyes. Soft shaded light."}, {"text": "\"다들 나를 보고 웃었어.\n나는 사자답지 못해…\"\n\"아니야. 도전한 것만으로 멋져!\"", "prompt": "Intimate two-shot inside the baobab hollow, the tearful lion cub looking down while Reengki the quokka (wearing his pink felt hat) sits close beside him, speaking earnestly with a paw on the cub's shoulder. Warm dappled light filters into the hollow, comforting atmosphere."}, {"text": "그때 티키와 타카가 찾아왔어요.\n\"레오야, 웃어서 정말 미안해.\n우린 네가 참 대단하다고 생각해!\"", "prompt": "Medium shot of the two meerkats standing at the entrance of the baobab hollow with apologetic faces, ears down, one holding a small yellow savanna flower as a peace offering. The lion cub peeks up at them, surprised. Reengki the quokka (wearing his pink felt hat) smiles warmly at the reconciliation."}, {"text": "레오의 눈물이 쏙 들어갔어요.\n하지만 축제는 사흘 앞으로!\n용기를 찾을 수 있을까요?", "prompt": "Hopeful medium shot of the lion cub wiping his tears with the back of his paw, a fragile smile returning, surrounded by Reengki the quokka (wearing his pink felt hat) and the two meerkats. Through the baobab branches above, the sky glows with sunset colors, hinting the festival is near."}]}, {"ep": 5, "title": "콩닥콩닥 마법의 주문", "pages": [{"text": "다음 날 아침, 링키가 외쳤어요.\n\"레오야! 마법의 주문을 만들자.\n무서움을 이기는 주문 말이야!\"", "prompt": "Bright morning shot of Reengki the quokka (wearing his pink felt hat) bursting with energy, arms spread wide in front of the lion cub near the baobab tree, tiny sparkle effects around his paws suggesting magic. The cub tilts his head with curious interest. Fresh golden morning light."}, {"text": "\"가슴이 콩닥콩닥 뛸 때는\n크게 숨을 쉬는 거야. 스으읍— 후우—\"\n둘은 나란히 숨쉬기 연습을 했죠.", "prompt": "Side-by-side medium shot of Reengki the quokka (wearing his pink felt hat) and the lion cub sitting on the grass, both taking deep breaths with eyes closed, chests puffed, gentle air swirls drawn around their noses. Peaceful golden savanna morning, calm and cozy mood."}, {"text": "\"그리고 이렇게 말하는 거야.\nI can do it! 아이 캔 두 잇!\n나는 할 수 있다는 뜻이야.\"", "prompt": "Energetic close-up of Reengki the quokka (wearing his pink felt hat) striking a confident pose with one fist raised high toward the sky, mouth open in a cheerful chant. The lion cub watches with wide inspired eyes, beginning to raise his own paw. Sunbeams radiate behind them."}, {"text": "\"아이… 캔 두 잇!\"\n레오가 조그맣게 따라 했어요.\n\"더 크게! I can do it!\"", "prompt": "Fun two-shot of the lion cub chanting shyly with a small voice while Reengki the quokka (wearing his pink felt hat) cups his paws around his mouth like a megaphone, encouraging him to be louder. Small and large speech energy lines contrast between them. Golden grass hilltop setting."}, {"text": "\"I can do it! 아이 캔 두 잇!\"\n레오의 목소리가 쩌렁 울렸어요!\n놀란 새들이 포르르 날아올랐죠.", "prompt": "Dynamic wide shot of the lion cub shouting the chant with real volume, sound waves rippling outward, as a flock of small colorful savanna birds bursts from the grass into the sky in surprise. Reengki the quokka (wearing his pink felt hat) jumps with joy, arms up. Exhilarating bright atmosphere."}, {"text": "\"우와, 방금 진짜 사자 같았어!\"\n레오의 볼이 발그레해졌어요.\n이번엔 기뻐서 빨개진 거였죠.", "prompt": "Warm close-up of the lion cub blushing with a proud happy grin, paws on his own cheeks in disbelief, his small mane fluffed up. Reengki the quokka (wearing his pink felt hat) pats his back proudly. Soft golden light, celebratory feeling."}, {"text": "둘은 매일매일 연습했어요.\n숨쉬기, 노래, 마법의 주문!\n레오의 소리가 무럭무럭 자랐죠.", "prompt": "Montage-style wide shot showing Reengki the quokka (wearing his pink felt hat) and the lion cub practicing together on the grassy hill, the cub roaring with progressively larger musical notes floating in an ascending arc across the sky. Sun positions suggest passing days. Joyful training energy."}, {"text": "티키와 타카도 응원단이 되었어요.\n\"레오! 레오! 잘한다, 레오!\"\n박수 소리가 짝짝짝 울렸죠.", "prompt": "Cheerful medium shot of the two meerkats waving big grass-leaf pom-poms like cheerleaders, jumping in the air, while the lion cub practices his roar on a small rock. Reengki the quokka (wearing his pink felt hat) conducts the cheering with a twig baton. Playful lively scene in golden light."}, {"text": "그날 밤, 레오가 속삭였어요.\n\"링키야, 고마워. Thank you!\"\n별들이 반짝반짝 웃어 주었어요.", "prompt": "Serene night scene of the lion cub and Reengki the quokka (wearing his pink felt hat) lying side by side on the hilltop grass, gazing up at a vast sky full of twinkling stars, the cub whispering gratefully. The savanna is bathed in soft blue moonlight, tender friendship mood."}, {"text": "이제 연습은 충분해 보였어요.\n하지만 다음 날 아침,\n마을에 뜻밖의 소식이 들려왔죠!", "prompt": "Early morning wide shot of the savanna village as the sun rises behind the sunrise rock, villagers gathering in a worried cluster near the elder lion's house. In the foreground Reengki the quokka (wearing his pink felt hat) and the lion cub run toward the crowd with alarmed expressions. Suspenseful warm dawn light."}]}, {"ep": 6, "title": "목소리를 잃은 촌장님", "pages": [{"text": "\"큰일이야! 노을 촌장님이\n목소리가 안 나오신대!\"\n타카가 헐레벌떡 달려왔어요.", "prompt": "Urgent medium shot of one meerkat running toward Reengki the quokka (wearing his pink felt hat) and the lion cub, arms waving frantically, dust kicking up behind. Village animals murmur anxiously in the background near a round thatched house. Morning light with a tense mood."}, {"text": "촌장님 집에 가 보니 촌장님이\n\"어흥…\" 대신 \"쉬이…\" 했어요.\n목이 꽉 잠겨 버린 거예요.", "prompt": "Interior shot of the elder lion with the sunset mane sitting on a woven mat inside his cozy thatched house, holding his throat, only a wisp of air coming out shown as a faint squiggle. The lion cub and Reengki the quokka (wearing his pink felt hat) look on with worried faces. Warm interior lantern light."}, {"text": "\"축제의 첫 외침은 물론\n마을 인사말도 촌장님 몫인데…\"\n모두가 시무룩해졌어요.", "prompt": "Group shot of villagers standing in a glum circle outside the elder's house, ears drooping, meerkats holding their tails. The great sunrise rock and hanging festival garlands are visible behind them, suddenly looking lonely. Overcast warm light, subdued colors."}, {"text": "촌장님이 레오를 바라보았어요.\n그리고 조용히 종이를 건넸죠.\n인사말이 적힌 종이였어요.", "prompt": "Emotional close-up of the elder lion's big weathered paw handing a rolled paper scroll to the small nervous lion cub, their eyes meeting meaningfully. Reengki the quokka (wearing his pink felt hat) watches from the doorway, holding his breath. Soft golden light through the doorway."}, {"text": "\"레오야, 네가 해 주겠니?\n첫 외침도, 환영 인사도.\"\n레오의 심장이 쿵— 내려앉았어요.", "prompt": "Close-up of the lion cub holding the scroll with trembling paws, eyes wide with shock, a visual heartbeat effect around his chest. The elder lion looks at him with gentle trusting eyes. Reengki the quokka (wearing his pink felt hat) steps closer supportively. Dramatic but warm lighting."}, {"text": "레오는 종이를 꼭 쥐고\n한참 동안 말이 없었어요.\n풀숲 바람만 사사삭 불었죠.", "prompt": "Wide quiet shot of the lion cub standing alone at the edge of the village, clutching the scroll to his chest, gazing at the distant sunrise rock. Wind ripples the golden grass around him. Reengki the quokka (wearing his pink felt hat) watches from a respectful distance. Contemplative golden-hour mood."}, {"text": "\"할 수 있을까… 나 혼자서?\"\n\"혼자가 아니야! 내가 옆에서\n노래로 함께해 줄게!\"", "prompt": "Heartfelt two-shot of Reengki the quokka (wearing his pink felt hat) grasping the lion cub's paws, eyes shining with determination, tiny musical notes twinkling around him. The cub's worried face begins to steady. The sunset paints the savanna behind them in brilliant orange and gold."}, {"text": "티키와 타카도 폴짝 뛰었어요.\n\"우리도 도울게! 다 같이 하자!\"\n레오의 눈에 빛이 돌아왔죠.", "prompt": "Uplifting group shot of the two meerkats leaping into the air with paws raised, joining Reengki the quokka (wearing his pink felt hat) and the lion cub in a huddle of friendship. The cub's eyes sparkle with renewed light. Warm sunset glow, hopeful energetic composition."}, {"text": "\"좋아. 스으읍— 후우—\nI can do it. 해 볼게요!\"\n레오가 촌장님께 씩씩하게 말했어요.", "prompt": "Proud medium shot of the lion cub standing tall before the elder lion, chest out, one paw over his heart, speaking bravely. The elder's eyes crinkle with a moved smile. Reengki the quokka (wearing his pink felt hat) and the meerkats beam in the background. Warm dignified lighting."}, {"text": "축제까지 남은 시간은 이틀!\n그런데 그날 밤, 풀숲에서\n\"도와줘요!\" 소리가 들려왔어요.", "prompt": "Nighttime wide shot of the savanna village under a deep blue starry sky, lanterns glowing softly, when a faint cry for help rises from the dark tall grass beyond the village edge. Reengki the quokka (wearing his pink felt hat) and the lion cub perk up their ears in alarm. Suspenseful but not scary mood."}]}, {"ep": 7, "title": "깜깜한 풀숲의 외침", "pages": [{"text": "\"저건 티키 목소리야!\"\n타카가 발을 동동 굴렀어요.\n\"별 구경 갔다가 길을 잃었나 봐!\"", "prompt": "Night scene of one meerkat pacing anxiously in the village square, pointing toward the dark sea of tall grass, while villagers gather with worried faces and small lanterns. Reengki the quokka (wearing his pink felt hat) and the lion cub listen with alert expressions. Cool blue night tones with warm lantern accents."}, {"text": "풀숲은 넓고 깜깜했어요.\n등불을 들어도 한 치 앞만 보였죠.\n\"어떻게 티키를 찾지?\"", "prompt": "Wide moody shot of the vast night savanna, tall grass swaying like dark waves under the starlight, a few tiny lantern lights bobbing at its edge. Reengki the quokka (wearing his pink felt hat) holds a small lantern that lights only a small circle around him. Mysterious but gentle night atmosphere."}, {"text": "그때 링키가 소리쳤어요.\n\"레오야! 네 목소리라면\n풀숲 끝까지 닿을 수 있어!\"", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat) turning to the lion cub with a flash of inspiration, lantern light illuminating his excited face. The cub's eyes widen as he realizes what he must do. Dark grass field behind them, dramatic warm-and-blue lighting contrast."}, {"text": "레오는 콩닥거리는 가슴에\n손을 얹고 숨을 쉬었어요.\n스으읍— 후우— \"I can do it.\"", "prompt": "Intimate medium shot of the lion cub closing his eyes with one paw over his chest, taking a deep calm breath under the starry sky, faint breath swirl visible in the cool night air. Reengki the quokka (wearing his pink felt hat) nods beside him with quiet faith. Moonlight rims the cub's small mane."}, {"text": "\"어흐으으응——!\"\n레오의 첫 진짜 외침이\n밤하늘에 우렁차게 울려 퍼졌어요!", "prompt": "Powerful wide shot of the lion cub standing on a mound, head thrown back, releasing his first true mighty roar visualized as grand golden sound waves rolling across the dark grass sea toward the horizon. Stars shimmer above. Reengki the quokka (wearing his pink felt hat) and villagers look up in awe."}, {"text": "저 멀리서 가느다란 대답이!\n\"여기예요! 여기!\"\n티키의 목소리였어요!", "prompt": "Wide night shot of the dark grass field where, far in the distance, a tiny voice rises with a small waving paw and a faint glint of meerkat eyes above the grass. In the foreground the lion cub and Reengki the quokka (wearing his pink felt hat) point excitedly toward the sound. Hopeful night mood."}, {"text": "레오가 앞장서 달렸어요.\n\"내 목소리를 따라와! 어흥!\"\n외침이 등대처럼 길을 밝혔죠.", "prompt": "Dynamic shot of the lion cub bounding bravely through the tall night grass, roaring rhythmically with golden sound-wave ripples spreading like a lighthouse beam, Reengki the quokka (wearing his pink felt hat) and lantern-carrying villagers following the path he makes. Energetic heroic composition."}, {"text": "마침내 풀숲 한가운데에서\n덜덜 떠는 티키를 찾았어요!\n\"레오 형아 목소리 듣고 힘냈어!\"", "prompt": "Touching medium shot of the small shivering meerkat being scooped up gently by the lion cub in the middle of the tall grass, lantern light forming a warm glow around the reunion. Reengki the quokka (wearing his pink felt hat) and the other meerkat rush in with relieved joyful faces."}, {"text": "마을로 돌아오자 모두가 외쳤어요.\n\"레오는 우리의 작은 영웅이야!\"\n레오는 쑥스럽게 웃었죠.", "prompt": "Celebratory night scene in the village square, villagers surrounding the lion cub with cheers and raised lanterns, the rescued meerkat riding happily on his back. The cub scratches his head with a bashful grin. Reengki the quokka (wearing his pink felt hat) applauds proudly. Warm festive lantern glow."}, {"text": "그날 밤 레오는 깨달았어요.\n'내 목소리는 누군가를 구할 수 있어.'\n용기의 씨앗이 쑥쑥 자라났어요!", "prompt": "Quiet closing shot of the lion cub lying on his back on a rooftop-like rock, gazing at the stars with a peaceful confident smile, one paw resting on his chest. A tiny glowing seedling sprout is drawn symbolically above his heart. Deep blue starry sky, serene hopeful mood."}]}, {"ep": 8, "title": "축제 전날 밤의 고백", "pages": [{"text": "드디어 축제 전날이 되었어요.\n마을은 꽃 장식으로 알록달록!\n고소한 냄새가 솔솔 풍겼죠.", "prompt": "Lively wide shot of the savanna village bustling with festival preparations, animals hanging colorful dried-flower garlands between thatched houses, baskets of fruits stacked up. Reengki the quokka (wearing his pink felt hat) helps carry a garland with the meerkats. Bright cheerful afternoon light."}, {"text": "그런데 레오가 보이지 않았어요.\n링키는 바오밥 나무로 가 봤죠.\n역시나, 레오가 웅크리고 있었어요.", "prompt": "Medium shot of Reengki the quokka (wearing his pink felt hat) finding the lion cub sitting curled up in the familiar hollow of the baobab tree, the scroll of the speech lying beside him. Evening light slants through the branches, quiet melancholy mood contrasting the festive village behind."}, {"text": "\"내일 모두가 나만 바라볼 거야.\n풀숲에서는 용감했는데\n무대는 아직도 무서워…\"", "prompt": "Close-up of the lion cub hugging his knees, looking at the distant sunrise rock silhouetted against the sunset, a small imagined crowd of staring eyes in a soft thought bubble above him. Reengki the quokka (wearing his pink felt hat) sits down quietly next to him. Tender emotional atmosphere."}, {"text": "링키는 조용히 입을 열었어요.\n\"있잖아, 내 꿈 이야기 해 줄까?\n나는 가수가 되고 싶어.\"", "prompt": "Warm two-shot under the baobab tree at dusk, Reengki the quokka (wearing his pink felt hat) speaking gently with a faraway dreamy look, one paw on his heart. The lion cub turns his head, listening closely. Fireflies begin to blink softly around them in the twilight."}, {"text": "\"로트네스트 섬 큰 무대에서\n전 세계 친구들 앞에서 노래하는 꿈!\n생각만 해도 콩닥콩닥 떨려.\"", "prompt": "Dreamlike shot of a glowing thought bubble above Reengki the quokka (wearing his pink felt hat), showing a tiny Reengki singing on a grand island stage under spotlights with many animal friends cheering. Below, the real Reengki's cheeks blush as his heart pounds. Magical twilight colors."}, {"text": "\"링키도 떨린다고? 정말?\"\n\"응! 그래도 나는 도전할 거야.\n떨리는 건 부끄러운 게 아니거든.\"", "prompt": "Close-up of the lion cub's surprised face turning to Reengki the quokka (wearing his pink felt hat), who nods with a brave honest smile, holding his own trembling paws up playfully to show them shaking. Fireflies glow warmly around the two friends under the darkening baobab."}, {"text": "\"두려워도 한 걸음 내딛는 것,\n그게 진짜 용기래.\n촌장님이 늘 하시던 말씀이야!\"", "prompt": "Gentle medium shot of the lion cub repeating wise words with dawning understanding, one paw stepping forward symbolically on the grass, eyes reflecting firefly light. Reengki the quokka (wearing his pink felt hat) watches with encouraging warmth. Deep blue evening with golden firefly sparkles."}, {"text": "레오가 벌떡 일어났어요.\n\"내일, 나 진짜로 해 볼게.\n Don't be afraid! 그치?\"", "prompt": "Uplifting shot of the lion cub springing to his feet with new resolve, fist raised toward the starry sky, his small mane catching the moonlight. Reengki the quokka (wearing his pink felt hat) jumps up beside him mirroring the pose. The festival-decorated village twinkles in the background."}, {"text": "둘은 새끼손가락을 걸었어요.\n\"내일 무대에서 함께하기, 약속!\"\n달님이 포근하게 비춰 주었죠.", "prompt": "Sweet close-up of Reengki the quokka (wearing his pink felt hat) and the lion cub linking their little fingers in a pinky promise, both smiling softly at each other. A big warm full moon glows above the baobab branches, bathing the scene in gentle silver-gold light."}, {"text": "드디어 내일은 황금 갈기 축제!\n해돋이 바위 위에서 레오는\n정말 해낼 수 있을까요?", "prompt": "Wide night shot of the sleeping savanna village fully decorated for the festival, garlands swaying gently, the great sunrise rock standing tall in the moonlight awaiting the big day. In the foreground silhouettes of Reengki the quokka (wearing his pink felt hat) and the lion cub walk home together. Quiet anticipation."}]}, {"ep": 9, "title": "해돋이 바위의 첫 외침", "pages": [{"text": "축제의 아침이 밝았어요!\n북소리가 둥둥 울리고\n마을은 손님들로 가득했죠.", "prompt": "Festive wide shot of the savanna village at sunrise, drums beating, colorful flower garlands everywhere, crowds of animal guests streaming in between the thatched houses toward the great sunrise rock. Golden morning light floods the scene with celebration energy."}, {"text": "레오는 바위 뒤에서 기다렸어요.\n심장이 콩닥콩닥콩닥!\n발바닥이 축축해졌어요.", "prompt": "Backstage-style medium shot of the lion cub waiting behind the sunrise rock, pressing a paw to his pounding chest, visualized heartbeat lines around him, the speech scroll tucked under his arm. Reengki the quokka (wearing his pink felt hat) peeks around the rock beside him. Tense but warm morning light."}, {"text": "\"레오야, 우리 주문 기억하지?\"\n\"응. 스으읍— 후우—\nI can do it!\"", "prompt": "Close-up two-shot of Reengki the quokka (wearing his pink felt hat) and the lion cub facing each other behind the rock, breathing deeply in sync, paws clasped together, foreheads nearly touching. Calm centered expressions. Soft golden light halos around them."}, {"text": "레오가 바위 위로 올라갔어요.\n수많은 눈동자가 반짝반짝.\n순간, 다리가 얼어붙었어요!", "prompt": "Dramatic low-angle wide shot of the small lion cub standing atop the great sunrise rock, facing an enormous cheerful crowd of animals below, countless sparkling eyes looking up at him. His legs stiffen and his face pales. Vast morning sky behind him, suspenseful moment."}, {"text": "그때, 낯익은 노랫소리가!\n\"랄랄라— 두려움아 안녕!\"\n바위 아래에서 링키가 노래했어요.", "prompt": "Heartwarming shot from the lion cub's viewpoint atop the rock, looking down at Reengki the quokka (wearing his pink felt hat) standing at the front of the crowd, singing up at him with arms wide and musical notes floating upward. The meerkats wave grass pom-poms beside him. Golden supportive glow."}, {"text": "레오의 입가에 미소가 번졌어요.\n스으읍— 크게 숨을 쉬고,\n마음속으로 외쳤죠. 'I can do it!'", "prompt": "Close-up of the lion cub's face transforming, a small smile spreading, eyes closing for one deep breath, wind gently lifting his little golden mane. The crowd blurs softly below. Morning sunlight breaks over the horizon directly behind him, cinematic and empowering."}, {"text": "\"어흐으으으응——!!\"\n황금빛 사바나가 쩌렁 울렸어요.\n지금까지 중 가장 멋진 외침!", "prompt": "Epic wide shot of the lion cub roaring magnificently from the top of the sunrise rock, grand golden sound waves rolling across the entire savanna, grass rippling outward, birds soaring up in joyful spirals. The crowd erupts, and Reengki the quokka (wearing his pink felt hat) cheers with tears of joy."}, {"text": "이어서 레오가 또박또박 말했어요.\n\"Welcome to our village!\n우리 마을에 오신 걸 환영해요!\"", "prompt": "Proud medium shot of the lion cub standing tall on the rock, chest out, delivering the welcome speech clearly with open arms toward the crowd, the scroll held confidently in one paw. Villagers and guests wave and cheer below. Brilliant morning light crowns his small mane like gold."}, {"text": "\"이제 두렵지 않아요.\n영어로 당당히 말해요!\"\n박수가 우레처럼 쏟아졌어요.", "prompt": "Triumphant wide shot of the entire festival crowd bursting into thunderous applause beneath the sunrise rock, flower petals tossed into the air, meerkats doing backflips. On the rock the lion cub beams with radiant confidence. Reengki the quokka (wearing his pink felt hat) claps hardest of all. Euphoric golden scene."}, {"text": "노을 촌장님이 눈물을 글썽였어요.\n그리고 무언가 반짝이는 것을\n가만히 꺼내 들었답니다.", "prompt": "Emotional medium shot of the elder lion with the sunset mane wiping a proud tear, reaching into a small woven pouch and lifting out a glowing bead that sparkles with golden light. The crowd hushes in wonder. Reengki the quokka (wearing his pink felt hat) gasps, eyes reflecting the glow. Magical anticipation."}]}, {"ep": 10, "title": "구슬 N과 새로운 길", "pages": [{"text": "축제가 끝난 저녁, 촌장님이\n링키와 레오를 불렀어요.\n해돋이 바위 위, 노을이 물들 때였죠.", "prompt": "Golden-hour wide shot of the elder lion, the lion cub, and Reengki the quokka (wearing his pink felt hat) standing together on top of the sunrise rock as the festival lights twinkle below and the savanna sky blazes orange and pink. Peaceful ceremonial atmosphere."}, {"text": "\"링키야, 너는 레오에게\n용기를 찾아 주었단다.\n진짜 친구가 되어 주었지.\"", "prompt": "Warm medium shot of the elder lion speaking gently to Reengki the quokka (wearing his pink felt hat), one great paw resting kindly on the quokka's shoulder, the lion cub standing close with a grateful smile. Sunset light wraps the three figures in gold."}, {"text": "레오가 구슬을 내밀었어요.\n알파벳 N이 새겨진 구슬이\n노을빛에 반짝반짝 빛났죠.", "prompt": "Close-up of the lion cub's paws offering a beautiful glowing bead engraved with the letter N, sparkling with warm golden-orange light against the sunset sky. Reengki the quokka (wearing his pink felt hat) reaches out with both paws, eyes shining with wonder."}, {"text": "\"링키야, 이건 용기의 구슬이야.\n두려워도 한 걸음 내딛는 마음,\n잊지 마!\"", "prompt": "Heartfelt two-shot of the lion cub placing the letter N bead into Reengki the quokka's paws (Reengki wearing his pink felt hat), both friends looking into each other's eyes with deep warmth. Soft lens glow from the bead illuminates their faces. Emotional golden sunset backdrop."}, {"text": "링키는 구슬을 주머니에 담았어요.\n하나, 둘, 셋… 열둘!\n이제 세 개만 더 모으면 돼요!", "prompt": "Cheerful close-up of Reengki the quokka (wearing his pink felt hat) opening his small pouch where twelve colorful beads now glitter together like tiny stars, his face lit from below by their combined glow. He counts them with a delighted expression. Dusk sky deepening behind him."}, {"text": "그날 밤은 송별 잔치였어요.\n모닥불 옆에서 노래하고 춤추고,\n링키와 레오는 함께 공연했죠!", "prompt": "Joyful night scene of a farewell bonfire party in the village square, Reengki the quokka (wearing his pink felt hat) dancing and singing side by side with the lion cub who roars a happy rhythm, meerkats drumming, villagers clapping in a circle. Warm firelight, sparks rising into the starry sky."}, {"text": "다음 날 아침, 떠날 시간이에요.\n\"레오야, 네 목소리 잊지 않을게.\"\n\"링키야, 네 노래도!\"", "prompt": "Tender morning shot at the edge of the village, Reengki the quokka (wearing his pink felt hat) with his travel pouch, sharing a big warm hug with the lion cub. The meerkats and elder lion stand behind with fond smiles. Soft sunrise light, bittersweet farewell mood."}, {"text": "\"다음 마을은 호랑이 마을이란다.\n줄무늬 숲을 지나면 나오지.\"\n촌장님이 길을 알려 주셨어요.", "prompt": "Wide shot of the elder lion pointing his great paw toward a distant forest of tall striped-shadow trees on the horizon beyond the golden grass. Reengki the quokka (wearing his pink felt hat) shields his eyes and gazes toward the new path with sparkling anticipation. Clear bright morning."}, {"text": "\"Good luck, Reengki! 잘 가!\"\n\"Thank you! 또 만나자!\"\n손을 흔들고 또 흔들었어요.", "prompt": "Emotional wide shot of Reengki the quokka (wearing his pink felt hat) walking away along a golden path, turning back to wave, while the lion cub, the meerkats, and the elder lion wave enthusiastically from the village entrance under the baobab tree. Warm farewell atmosphere, long morning shadows."}, {"text": "구슬 열두 개가 짤랑짤랑!\n링키는 씩씩하게 걸어갔어요.\n호랑이 마을엔 어떤 이야기가 기다릴까요?", "prompt": "Hopeful wide closing shot of Reengki the quokka (wearing his pink felt hat) marching cheerfully across the golden savanna toward the distant striped forest, his pouch of twelve beads twinkling at his side. The sun climbs high in a bright blue sky, the road ahead full of promise. Adventurous storybook ending mood."}]}]}, "13": {"chapter": 13, "animal": "호랑이", "animal_en": "tiger", "letter": "G", "village": "단풍고개 마을", "episodes": [{"ep": 1, "title": "단풍고개 마을에 도착했어요", "pages": [{"text": "링키의 가방 속에서 구슬 열두 개가\n반짝반짝 빛났어요.\n\"이제 세 개만 더 모으면 돼!\"", "prompt": "Wide shot of Reengki the quokka (wearing his pink felt hat) walking up a mountain path covered in red and yellow maple leaves. His open satchel glows softly with twelve shining alphabet marbles inside. Warm autumn morning light filters through colorful trees, and Reengki looks excited and hopeful."}, {"text": "고개를 넘자 온 산이 울긋불긋,\n단풍잎이 팔랑팔랑 춤을 췄어요.", "prompt": "Sweeping wide shot from a mountain pass showing an entire valley ablaze with autumn foliage in crimson, orange and gold. Reengki the quokka (wearing his pink felt hat) stands small at the ridge, arms spread in wonder. Maple leaves swirl and dance through the crisp blue air around him."}, {"text": "\"우와, 산이 온통 빨강 노랑이야!\"\n링키는 콩콩 뛰며 언덕을 올랐죠.", "prompt": "Medium shot of Reengki the quokka (wearing his pink felt hat) hopping joyfully up a leaf-strewn hillside trail. Leaves scatter under his little feet with each bounce. Tall maple trees arch overhead like a glowing red and yellow tunnel, sunlight dappling the path."}, {"text": "그때 낙엽 더미가 부스럭부스럭.\n커다란 그림자가 쑥 나타났어요!", "prompt": "Close-up of a big pile of fallen maple leaves rustling and stirring beside the trail, with a large gentle shadow rising behind it. Reengki the quokka (wearing his pink felt hat) freezes mid-step with wide curious eyes. The mood is playful suspense, not scary, with soft golden afternoon light."}, {"text": "그림자의 주인은 커다란 호랑이.\n눈은 순하고 목소리는 부드러웠죠.\n\"꼬마 손님, 어서 와!\"", "prompt": "Medium shot revealing a big friendly tiger with warm kind eyes and a soft smile, standing among the autumn leaves. The tiger lowers his head gently toward tiny Reengki the quokka (wearing his pink felt hat). Fluttering maple leaves frame the peaceful first meeting in golden light."}, {"text": "\"나는 바우야. 이 산길을 지키지.\"\n바우는 씩 웃으며 손을 내밀었어요.", "prompt": "Close-up of the big gentle tiger grinning warmly and extending his large striped paw toward Reengki the quokka (wearing his pink felt hat). The quokka's small paw reaches out to the huge paw in a heartwarming size contrast. Red maple branches glow softly in the background."}, {"text": "링키가 인사하자 바우가 말했어요.\n\"우리 마을 인사는 이거야. Hello!\"\n\"헬로! Hello, 바우!\"", "prompt": "Cheerful medium shot of Reengki the quokka (wearing his pink felt hat) and the big tiger waving at each other on the autumn mountain trail. Both are smiling brightly as colorful leaves drift between them. The scene feels like a friendly greeting lesson, warm and lively."}, {"text": "바우의 등에 폴짝 올라탄 링키.\n바람이 슝— 낙엽이 팔랑팔랑!", "prompt": "Dynamic wide shot of the big tiger bounding along the mountain trail with Reengki the quokka (wearing his pink felt hat) riding happily on his striped back. A trail of swirling red and gold leaves flies up behind them. Reengki's hat ribbon flutters in the wind, both faces full of joy."}, {"text": "고개 너머로 마을이 보였어요.\n빨간 지붕들이 단풍처럼 예뻤죠.", "prompt": "Wide scenic shot from a ridge looking down at a cozy mountain village nestled among blazing autumn trees. Little red-roofed cottages, stone paths, and curling chimney smoke fill the valley. The tiger and Reengki the quokka (wearing his pink felt hat) gaze down at the view from the foreground."}, {"text": "\"마침 큰 축제 준비 중이란다.\"\n그런데 바우의 얼굴에\n걱정이 살짝 스쳤어요. 왜일까요?", "prompt": "Close-up of the big tiger's face showing a gentle but slightly worried expression as he looks toward the mountain peak. Reengki the quokka (wearing his pink felt hat) tilts his head curiously beside him. Soft dusk light in orange and purple settles over the autumn village below."}]}, {"ep": 2, "title": "막혀 버린 축제 길", "pages": [{"text": "마을 어귀엔 도토리 등불이 주렁주렁.\n다람쥐 남매가 쪼르르 달려왔어요.\n\"안녕! 난 도토, 얘는 도리!\"", "prompt": "Medium shot at the village entrance where strings of acorn-shaped lanterns hang between wooden posts. Two small excited squirrel siblings dash toward Reengki the quokka (wearing his pink felt hat) and the big tiger. Autumn leaves carpet the ground and the mood is bright and welcoming."}, {"text": "오소리 아주머니네 가게에선\n달콤한 단풍꿀떡 냄새가 솔솔.", "prompt": "Cozy close-up of a kindly badger standing at a little bakery stall piled with steaming maple-honey rice cakes. Reengki the quokka (wearing his pink felt hat) sniffs the sweet air with delighted closed eyes. Warm lantern light and red maple leaves decorate the charming shopfront."}, {"text": "\"곧 단풍 등불 축제가 열려.\n산꼭대기에서 등불을 켜는 날이지!\"\n도토가 자랑스럽게 말했어요.", "prompt": "Medium shot of a small squirrel proudly pointing up toward the mountain peak while talking to Reengki the quokka (wearing his pink felt hat). Villagers in the background prepare colorful lanterns and garlands. The distant summit glows in the warm autumn afternoon light."}, {"text": "그런데 산양 할아버지가 한숨을 폭.\n\"올해는 힘들지도 몰라…\"", "prompt": "Close-up of an old mountain goat elder with round glasses sighing sadly, his long beard drooping. Reengki the quokka (wearing his pink felt hat) and the tiger listen with concerned faces. Unlit lanterns rest in a wooden cart beside them under a soft cloudy sky."}, {"text": "지난 비바람에 커다란 나무가 쿵!\n산꼭대기로 가는 길을\n폭 막아 버렸대요.", "prompt": "Wide shot of a huge fallen tree lying across the mountain festival trail, completely blocking the way. Broken branches and scattered leaves surround it. Reengki the quokka (wearing his pink felt hat), the tiger, and the squirrels look at the blocked path from a distance with worried expressions."}, {"text": "링키와 바우는 길을 보러 갔어요.\n정말 커다란 나무가 떡하니!", "prompt": "Medium shot of Reengki the quokka (wearing his pink felt hat) standing tiny in front of the massive fallen tree trunk that towers over him. The big tiger inspects the trunk with a serious but calm face. Golden late-afternoon light streaks through the autumn canopy."}, {"text": "\"돌아가는 길은 없어?\"\n\"있긴 한데, 아무도 안 가 본\n덤불투성이 비탈길뿐이야.\"", "prompt": "Wide shot of the tiger pointing his paw toward a wild overgrown slope tangled with bushes and vines beside the blocked trail. Reengki the quokka (wearing his pink felt hat) peers at the untamed hillside nervously. The unexplored slope looks bushy and rough but not frightening."}, {"text": "마을 친구들은 웅성웅성.\n\"축제를 미룰까?\" \"취소할까?\"\n아무도 정하지 못했어요.", "prompt": "Wide shot of the village square where squirrels, the badger, and the goat elder huddle in anxious discussion, gesturing in different directions. Reengki the quokka (wearing his pink felt hat) watches from the side. Paper lanterns sway overhead in the evening breeze, still unlit."}, {"text": "바우는 조용히 산을 올려다봤어요.\n커다란 발에 힘이 꾹 들어갔죠.", "prompt": "Dramatic but warm close-up of the big tiger gazing up at the mountain summit, his strong paw pressed firmly on the ground with determination. His eyes shine with quiet resolve. The peak glows in the last orange light of sunset behind drifting leaves."}, {"text": "\"링키야, 내일 나랑 갈 데가 있어.\"\n바우는 어디로 가려는 걸까요?", "prompt": "Medium shot of the tiger leaning down to whisper to Reengki the quokka (wearing his pink felt hat) under a starry autumn night sky. Reengki's eyes widen with curiosity. Cozy village lights twinkle in the background among dark red maple silhouettes."}]}, {"ep": 3, "title": "길은 걸으면 생기는 거야", "pages": [{"text": "이른 아침, 바우와 링키는\n덤불투성이 비탈길로 갔어요.", "prompt": "Wide morning shot of the big tiger and Reengki the quokka (wearing his pink felt hat) standing at the foot of a wild overgrown slope covered in bushes and autumn undergrowth. Morning mist curls between the red trees. Both look up the slope, ready to explore."}, {"text": "가시덤불이 콕콕, 돌멩이가 데굴데굴.\n링키는 엉덩방아를 쿵 찧었죠.\n\"아야야…\"", "prompt": "Close-up of Reengki the quokka (wearing his pink felt hat) sitting on the ground after slipping, rubbing his bottom with a comically pouty face. Small pebbles roll down the slope and thorny bushes stick out around him. The tiger glances back kindly from ahead."}, {"text": "\"괜찮아. 길은 원래 없는 거야.\n누군가 먼저 걸으면 생기는 거지.\"\n바우가 씩씩하게 말했어요.", "prompt": "Warm medium shot of the big tiger helping Reengki the quokka (wearing his pink felt hat) up with his large paw on the bushy slope. The tiger's expression is encouraging and confident. Sunbeams break through the maple canopy, lighting the untouched hillside ahead."}, {"text": "바우는 덤불을 성큼 헤치며\n리본을 나무에 묶었어요.\n\"여기로 길을 내면 돼!\"", "prompt": "Medium shot of the tiger striding boldly through the bushes, tying a bright ribbon around a maple tree trunk to mark the ro
